<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
  <script src="/phone-apps/ai-phone-host.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>微博</title>
<style>:root {
  --wb-orange: #ff8200;
  --wb-orange-soft: #fff3e6;
  --wb-link: #507daf;
  --wb-text: #333;
  --wb-text-2: #636363;
  --wb-text-3: #939393;
  --wb-line: #f0f0f0;
  --wb-bg: #f2f2f2;
  --wb-card: #fff;
  --wb-quote: #f7f7f7;
  --wb-red: #ff5f5f;
  --wb-v-yellow: #ffc300;
  --wb-v-blue: #2f9fff;
  --wb-v-gold: #e6b34a;
  --bar-top: var(--ai-phone-app-bar-top, 56px);
  --bar-h: var(--ai-phone-app-bar-height, 30px);
  --bar-clear: var(--ai-phone-app-bar-clear-right, 96px);
  --safe-bottom: var(--ai-phone-app-safe-bottom, 20px);
  --top-h: calc(var(--bar-top) + 44px);
  --tab-h: calc(52px + var(--safe-bottom));
}
@media (prefers-color-scheme: dark) {
  :root {
    --wb-text: #e6e6e6;
    --wb-text-2: #b4b4b4;
    --wb-text-3: #7d7d7d;
    --wb-line: #262626;
    --wb-bg: #0f0f0f;
    --wb-card: #1b1b1b;
    --wb-quote: #252525;
    --wb-orange-soft: #3a2610;
    --wb-link: #7ea6d8;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; width: 100%; height: 100%; background: var(--wb-bg); color: var(--wb-text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { border: 0; background: none; padding: 0; cursor: pointer; }
img { display: block; }
.hidden { display: none !important; }

/* ── 顶栏 & 底栏 ── */
.topbar { position: fixed; z-index: 20; left: 0; right: 0; top: 0; height: var(--top-h); background: var(--wb-card);
  border-bottom: 1px solid var(--wb-line); }
.topbar-inner { position: absolute; left: 16px; right: var(--bar-clear); top: var(--bar-top); height: 44px;
  display: flex; align-items: center; gap: 22px; transform: translateY(calc((var(--bar-h) - 44px) / 2)); }
.top-tab { font-size: 17px; color: var(--wb-text-2); position: relative; height: 44px; }
.top-tab.active { color: var(--wb-text); font-weight: 600; }
.top-tab.active::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 18px; height: 3px; margin-left: -9px;
  border-radius: 2px; background: var(--wb-orange); }
.top-title { font-size: 17px; font-weight: 600; }
.top-icon { margin-left: auto; width: 32px; height: 32px; display: grid; place-items: center; color: var(--wb-text); }
.top-icon svg { width: 22px; height: 22px; }

.tabbar { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; height: var(--tab-h); padding-bottom: var(--safe-bottom);
  background: var(--wb-card); border-top: 1px solid var(--wb-line); display: flex; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 10px; color: var(--wb-text-2); position: relative; }
.tab svg { width: 24px; height: 24px; }
.tab.active { color: var(--wb-orange); }
.tab .dot { position: absolute; top: 6px; left: calc(50% + 8px); min-width: 8px; height: 8px; border-radius: 4px; background: var(--wb-red); }
.tab-compose { flex: 1; display: grid; place-items: center; }
.tab-compose span { width: 46px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, #ffa53b, #ff7300); box-shadow: 0 3px 10px rgba(255, 130, 0, .35); }
.tab-compose svg { width: 20px; height: 20px; }

.view { position: absolute; left: 0; right: 0; top: var(--top-h); bottom: var(--tab-h); overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain; }

/* ── 下拉刷新 ── */
.ptr { height: 0; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; color: var(--wb-text-3); font-size: 12px;
  transition: height .2s; }
.ptr.pulling { transition: none; }
.ptr-inner { display: flex; align-items: center; gap: 6px; padding-bottom: 10px; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--wb-line); border-top-color: var(--wb-orange);
  animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.refresh-tip { position: sticky; top: 0; z-index: 5; margin: 0; padding: 7px 0; text-align: center; font-size: 13px; color: var(--wb-orange);
  background: var(--wb-orange-soft); }

/* ── 微博卡片 ── */
.card { background: var(--wb-card); margin-bottom: 8px; padding: 14px 16px 0; }
.card-head { display: flex; align-items: center; gap: 10px; }
.avatar { position: relative; flex: none; width: 42px; height: 42px; }
.avatar .face { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #ddd; display: grid; place-items: center;
  color: #fff; font-weight: 600; font-size: 17px; overflow: hidden; }
.avatar .v { position: absolute; right: -2px; bottom: -2px; width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--wb-card);
  display: grid; place-items: center; color: #fff; font-size: 9px; font-weight: 800; font-style: italic; }
.v.yellow { background: var(--wb-v-yellow); } .v.blue { background: var(--wb-v-blue); } .v.gold { background: var(--wb-v-gold); }
.head-main { flex: 1; min-width: 0; }
.name { font-size: 15px; font-weight: 500; color: var(--wb-text); display: inline-flex; align-items: center; gap: 4px; max-width: 100%; }
.name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.name.vip span { color: #f86300; }
.crown { width: 15px; height: 15px; flex: none; }
.meta { font-size: 12px; color: var(--wb-text-3); margin-top: 1px; }
.follow-btn { flex: none; height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12px; color: var(--wb-orange); border: 1px solid var(--wb-orange); }
.follow-btn.on { color: var(--wb-text-3); border-color: var(--wb-line); }
.more-btn { flex: none; width: 28px; height: 28px; display: grid; place-items: center; color: var(--wb-text-3); }
.more-btn svg { width: 18px; height: 18px; }
.pin-tag { display: inline-block; font-size: 11px; color: var(--wb-orange); border: 1px solid var(--wb-orange); border-radius: 3px; padding: 0 3px;
  margin-right: 6px; line-height: 15px; vertical-align: 1px; }

.text { margin: 8px 0 0; font-size: 16px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.text.clamp { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.text a, .link { color: var(--wb-link); text-decoration: none; }
.expand { color: var(--wb-link); font-size: 15px; margin-top: 2px; }
.emo { color: var(--wb-orange); }

.pics { display: grid; gap: 3px; margin-top: 10px; }
.pics.n1 { grid-template-columns: minmax(0, 66%); }
.pics.n1 .pic { aspect-ratio: 4 / 3; }
.pics.n2, .pics.n4 { grid-template-columns: repeat(2, 1fr); width: 67%; }
.pics.n3, .pics.n5, .pics.n6, .pics.n7, .pics.n8, .pics.n9 { grid-template-columns: repeat(3, 1fr); }
.pic { position: relative; aspect-ratio: 1; overflow: hidden; border-radius: 4px; background: #e9e9e9; }
.pic img { width: 100%; height: 100%; object-fit: cover; }
.pic.placeholder { display: flex; align-items: flex-end; padding: 6px; font-size: 11px; line-height: 1.35; color: rgba(255,255,255,.95);
  text-shadow: 0 1px 2px rgba(0,0,0,.25); }
.pic.placeholder span { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.pic .gen-badge { position: absolute; top: 5px; right: 5px; font-size: 10px; padding: 1px 5px; border-radius: 8px; background: rgba(0,0,0,.35); color: #fff; }

.quote { margin: 10px -16px 0; padding: 10px 16px 12px; background: var(--wb-quote); }
.quote .text { margin-top: 0; font-size: 15px; }
.quote .deleted { color: var(--wb-text-3); font-size: 14px; }
.quote .quote-stats { margin-top: 8px; font-size: 12px; color: var(--wb-text-3); }

.actions { display: flex; margin: 8px -16px 0; border-top: 1px solid var(--wb-line); }
.act { flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; gap: 5px; color: var(--wb-text-2); font-size: 13px; }
.act svg { width: 18px; height: 18px; }
.act.liked { color: var(--wb-orange); }
.act.liked svg { animation: pop .35s ease; }
@keyframes pop { 40% { transform: scale(1.35); } }

/* ── 空态 ── */
.empty { padding: 60px 30px; text-align: center; color: var(--wb-text-3); font-size: 14px; }
.empty .big { font-size: 40px; margin-bottom: 10px; }
.btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 0 22px; margin-top: 16px;
  border-radius: 19px; color: #fff; background: var(--wb-orange); font-size: 15px; }
.btn-primary[disabled] { opacity: .5; }
.btn-ghost { height: 34px; padding: 0 16px; border-radius: 17px; border: 1px solid var(--wb-line); color: var(--wb-text-2); font-size: 14px; }
.load-more { display: block; width: 100%; padding: 14px 0 20px; color: var(--wb-text-3); font-size: 13px; text-align: center; }

/* ── 子页面（栈） ── */
.page { position: fixed; z-index: 40; inset: 0; background: var(--wb-bg); display: flex; flex-direction: column;
  animation: slide-in .22s ease-out; }
.page.closing { animation: slide-out .2s ease-in forwards; }
@keyframes slide-in { from { transform: translateX(100%); } }
@keyframes slide-out { to { transform: translateX(100%); } }
.page-head { flex: none; height: var(--top-h); background: var(--wb-card); border-bottom: 1px solid var(--wb-line); position: relative; }
.page-head.clear { background: transparent; border: 0; position: absolute; left: 0; right: 0; z-index: 3; }
.page-head-inner { position: absolute; left: 8px; right: var(--bar-clear); top: var(--bar-top); height: 44px; display: flex; align-items: center;
  gap: 4px; transform: translateY(calc((var(--bar-h) - 44px) / 2)); }
.back { width: 36px; height: 36px; display: grid; place-items: center; color: var(--wb-text); border-radius: 50%; }
.page-head.clear .back { background: rgba(0,0,0,.28); color: #fff; }
.back svg { width: 22px; height: 22px; }
.page-title { font-size: 17px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.page-action { height: 30px; padding: 0 14px; border-radius: 15px; background: var(--wb-orange); color: #fff; font-size: 14px; }
.page-action[disabled] { background: #ffc48a; }
.page-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* ── 正文页 ── */
.detail-card { margin-bottom: 8px; }
.detail-card .text { font-size: 17px; }
.detail-tabs { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 22px; padding: 0 16px; height: 44px;
  background: var(--wb-card); border-bottom: 1px solid var(--wb-line); font-size: 14px; color: var(--wb-text-2); }
.detail-tabs .on { color: var(--wb-text); font-weight: 600; position: relative; }
.detail-tabs .on::after { content: ""; position: absolute; left: 50%; bottom: -12px; width: 18px; height: 3px; margin-left: -9px; border-radius: 2px;
  background: var(--wb-orange); }
.detail-tabs .right { margin-left: auto; font-size: 13px; }
.sort { color: var(--wb-text-3); font-size: 13px; }
.sort b { color: var(--wb-text); font-weight: 500; }

.cmt { display: flex; gap: 10px; padding: 12px 16px 0; background: var(--wb-card); }
.cmt .avatar { width: 34px; height: 34px; }
.cmt .avatar .face { font-size: 14px; }
.cmt-main { flex: 1; min-width: 0; padding-bottom: 12px; border-bottom: 1px solid var(--wb-line); }
.cmt-top { display: flex; align-items: flex-start; gap: 6px; }
.cmt-name { font-size: 13px; color: var(--wb-text-2); display: inline-flex; align-items: center; gap: 3px; }
.cmt-name.vip { color: #f86300; }
.tag { font-size: 10px; line-height: 14px; padding: 0 3px; border-radius: 2px; }
.tag.author { color: var(--wb-orange); background: var(--wb-orange-soft); }
.tag.liked-by-author { color: var(--wb-text-3); background: var(--wb-quote); }
.cmt-like { margin-left: auto; display: flex; align-items: center; gap: 3px; color: var(--wb-text-3); font-size: 12px; flex: none; }
.cmt-like svg { width: 15px; height: 15px; }
.cmt-like.liked { color: var(--wb-orange); }
.cmt-text { margin-top: 3px; font-size: 15px; line-height: 1.55; word-break: break-word; white-space: pre-wrap; }
.cmt-meta { margin-top: 4px; font-size: 11px; color: var(--wb-text-3); display: flex; gap: 12px; }
.cmt-meta button { color: var(--wb-text-3); font-size: 11px; }
.sub-box { margin-top: 8px; padding: 8px 10px; border-radius: 4px; background: var(--wb-quote); font-size: 14px; line-height: 1.6; }
.sub-line { word-break: break-word; }
.sub-line .who { color: var(--wb-link); }
.sub-more { color: var(--wb-link); font-size: 13px; margin-top: 2px; }
.gen-tip { padding: 18px; text-align: center; color: var(--wb-text-3); font-size: 13px; display: flex; gap: 8px; justify-content: center; align-items: center;
  background: var(--wb-card); }

.reply-bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 12px calc(8px + var(--safe-bottom)); background: var(--wb-card);
  border-top: 1px solid var(--wb-line); }
.reply-input { flex: 1; min-height: 34px; max-height: 100px; padding: 7px 12px; border-radius: 17px; border: 0; outline: 0; resize: none;
  background: var(--wb-quote); font-size: 14px; line-height: 20px; }
.reply-send { color: var(--wb-orange); font-size: 15px; font-weight: 500; }
.reply-send[disabled] { color: var(--wb-text-3); }
.reply-target { font-size: 12px; color: var(--wb-text-3); padding: 6px 16px 0; background: var(--wb-card); display: flex; gap: 6px; }

/* ── 个人主页 ── */
.profile-cover { height: 170px; background-size: cover; background-position: center; }
.profile-box { position: relative; background: var(--wb-card); padding: 0 16px 14px; }
.profile-box .avatar { width: 76px; height: 76px; margin-top: -38px; }
.profile-box .avatar .face { border: 3px solid var(--wb-card); font-size: 28px; }
.profile-box .avatar .v { width: 20px; height: 20px; font-size: 12px; right: 0; bottom: 2px; }
.profile-actions { position: absolute; right: 16px; top: 12px; display: flex; align-items: center; gap: 8px; }
.profile-name { margin-top: 8px; font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
.profile-name.vip { color: #f86300; }
.profile-verify { margin-top: 4px; font-size: 13px; color: var(--wb-text-2); display: flex; align-items: center; gap: 4px; }
.profile-bio { margin-top: 6px; font-size: 13px; color: var(--wb-text-2); }
.profile-ip { margin-top: 4px; font-size: 12px; color: var(--wb-text-3); }
.profile-stats { display: flex; gap: 22px; margin-top: 12px; font-size: 13px; color: var(--wb-text-2); }
.profile-stats b { color: var(--wb-text); font-size: 16px; margin-right: 3px; }
.profile-tabs { position: sticky; top: 0; z-index: 2; display: flex; background: var(--wb-card); border-top: 1px solid var(--wb-line);
  border-bottom: 1px solid var(--wb-line); margin-bottom: 8px; }
.profile-tabs button { flex: 1; height: 42px; font-size: 15px; color: var(--wb-text-2); position: relative; }
.profile-tabs .on { color: var(--wb-text); font-weight: 600; }
.profile-tabs .on::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 18px; height: 3px; margin-left: -9px; border-radius: 2px;
  background: var(--wb-orange); }
.album { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--wb-card); }
.album .pic { border-radius: 0; }

/* ── 发微博 ── */
.compose-body { background: var(--wb-card); padding: 14px 16px; flex: 1; overflow-y: auto; }
.compose-text { width: 100%; min-height: 140px; border: 0; outline: 0; resize: none; background: transparent; font-size: 17px; line-height: 1.6; }
.compose-pics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.compose-pics .pic { border-radius: 6px; }
.compose-pics .rm { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,.5); color: #fff;
  font-size: 13px; line-height: 20px; text-align: center; }
.compose-add { aspect-ratio: 1; border-radius: 6px; background: var(--wb-quote); display: grid; place-items: center; color: var(--wb-text-3); font-size: 30px; }
.compose-loc { display: inline-flex; align-items: center; gap: 4px; margin-top: 14px; padding: 4px 10px; border-radius: 13px; background: var(--wb-quote);
  font-size: 12px; color: var(--wb-link); }
.compose-tools { flex: none; display: flex; align-items: center; gap: 4px; padding: 8px 10px calc(8px + var(--safe-bottom)); background: var(--wb-card);
  border-top: 1px solid var(--wb-line); }
.tool { width: 40px; height: 40px; display: grid; place-items: center; color: var(--wb-text-2); border-radius: 8px; }
.tool svg { width: 23px; height: 23px; }
.visibility { margin-left: auto; height: 30px; padding: 0 10px; border-radius: 15px; background: var(--wb-quote); color: var(--wb-link); font-size: 13px;
  display: flex; align-items: center; gap: 4px; }
.count-hint { font-size: 12px; color: var(--wb-text-3); }

/* ── 表单 / 弹层 ── */
.sheet-mask { position: fixed; z-index: 80; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; background: var(--wb-card); border-radius: 14px 14px 0 0; padding-bottom: var(--safe-bottom); animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(100%); } }
.sheet-title { padding: 14px 16px 6px; font-size: 13px; color: var(--wb-text-3); text-align: center; }
.sheet-item { display: block; width: 100%; height: 52px; font-size: 16px; border-bottom: 1px solid var(--wb-line); }
.sheet-item.danger { color: var(--wb-red); }
.sheet-item.on { color: var(--wb-orange); font-weight: 600; }
.sheet-gap { height: 8px; background: var(--wb-bg); }
.form { background: var(--wb-card); }
.form-row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-bottom: 1px solid var(--wb-line); }
.form-row label { width: 64px; flex: none; font-size: 15px; }
.form-row input, .form-row textarea { flex: 1; border: 0; outline: 0; background: transparent; font-size: 15px; padding: 14px 0; }
.form-row textarea { resize: none; min-height: 80px; }
.form-note { padding: 10px 16px; font-size: 12px; color: var(--wb-text-3); }
.swatches { display: flex; gap: 10px; padding: 12px 0; flex-wrap: wrap; }
.swatch { width: 34px; height: 34px; border-radius: 8px; border: 2px solid transparent; }
.swatch.on { border-color: var(--wb-orange); }

.viewer { position: fixed; z-index: 90; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: #fff; animation: fade .15s; }
.viewer img { max-width: 100%; max-height: 72vh; object-fit: contain; }
.viewer .desc { max-width: 86%; margin: 16px auto 0; font-size: 15px; line-height: 1.6; text-align: center; color: rgba(255,255,255,.9); }
.viewer .placeholder-big { width: 80vw; aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 22px;
  font-size: 16px; line-height: 1.6; text-align: center; }
.viewer .tools { position: absolute; bottom: calc(24px + var(--safe-bottom)); display: flex; gap: 12px; }
.viewer .tools button { height: 36px; padding: 0 18px; border-radius: 18px; background: rgba(255,255,255,.18); color: #fff; font-size: 14px; }
.viewer .idx { position: absolute; top: calc(var(--bar-top) + 6px); left: 0; right: 0; text-align: center; font-size: 14px; }

.toast { position: fixed; z-index: 100; left: 50%; top: 45%; transform: translateX(-50%); max-width: 76%; padding: 10px 16px; border-radius: 8px;
  background: rgba(0,0,0,.78); color: #fff; font-size: 14px; text-align: center; animation: fade .15s; }
.banner { position: fixed; z-index: 95; left: 10px; right: 10px; top: calc(var(--bar-top) + 40px); padding: 10px 14px; border-radius: 12px;
  background: var(--wb-card); box-shadow: 0 6px 24px rgba(0,0,0,.15); display: flex; gap: 10px; align-items: center; font-size: 14px;
  animation: drop .25s ease-out; }
@keyframes drop { from { transform: translateY(-30px); opacity: 0; } }
.banner .avatar { width: 34px; height: 34px; }
.banner-text { flex: 1; min-width: 0; }
.banner-text b { font-weight: 600; }
.banner-text div { color: var(--wb-text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.list-cell { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--wb-card); border-bottom: 1px solid var(--wb-line); }
.list-cell .avatar { width: 40px; height: 40px; }
.list-cell .cell-main { flex: 1; min-width: 0; }
.list-cell .cell-sub { font-size: 12px; color: var(--wb-text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.super-cover-btn svg { width: 12px; height: 12px; }
.super-tag { white-space: nowrap; }
.super-tag svg { width: 15px; height: 15px; vertical-align: -2px; margin-right: 2px; }
.csup-rm { flex: none; margin-left: 6px; height: 28px; padding: 0 10px; font-size: 12px; }
.input-sheet-row { padding: 8px 16px 12px; }
.input-sheet-row .search-input { width: 100%; height: 40px; font-size: 15px; }
.sheet-item.ok { color: var(--wb-orange); font-weight: 600; }
.share-grid { display: flex; gap: 6px; padding: 6px 12px 4px; overflow-x: auto; }
.share-pick { flex: none; width: 68px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0; border-radius: 10px; font-size: 12px; color: var(--wb-text-2); }
.share-pick span { max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.share-pick.on { background: var(--wb-bg); color: var(--wb-orange); font-weight: 600; }
.share-pick.on .avatar { box-shadow: 0 0 0 2px var(--wb-orange); border-radius: 50%; }
.sheet-item.ok:disabled { color: var(--wb-text-3); font-weight: 400; }
.acct-switch { margin-left: 10px; font-size: 12px; padding: 2px 9px; border: 1px solid var(--wb-line); border-radius: 12px; color: var(--wb-text-2); }
.alt-tag { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 400; color: var(--wb-orange); background: rgba(255,130,0,.12); vertical-align: 2px; }
/* 设置页：每个角色一行，标签 + 参与开关，点进去是他的单独设置 */
.char-set-row { cursor: pointer; }
.set-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.set-tags i { font-style: normal; font-size: 11px; line-height: 18px; padding: 0 6px; border-radius: 4px; background: var(--wb-bg); color: var(--wb-text-3); }
.set-tags i.alt { background: rgba(255,130,0,.12); color: var(--wb-orange); }
.set-tags em.ic { font-style: normal; color: #f5a623; }
.set-chev { flex: none; margin-left: 8px; font-size: 20px; color: var(--wb-text-3); }
.cs-head { display: flex; align-items: center; gap: 12px; padding: 16px; background: var(--wb-card); }
.cs-name { font-size: 16px; font-weight: 600; color: var(--wb-text); }
.cs-row { padding: 12px 16px; background: var(--wb-card); border-top: 1px solid var(--wb-line); }
.cs-flex { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.cs-t { font-size: 15px; color: var(--wb-text); }
.cs-s { margin-top: 4px; font-size: 12px; line-height: 1.5; color: var(--wb-text-3); }
.seg { display: flex; margin-top: 8px; padding: 2px; border-radius: 8px; background: var(--wb-bg); }
.seg button { flex: 1; padding: 6px 0; border-radius: 6px; font-size: 13px; color: var(--wb-text-2); }
.seg button.on { background: var(--wb-card); color: var(--wb-orange); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.cs-btn { display: block; width: calc(100% - 32px); margin: 14px 16px 4px; padding: 11px 0; border-radius: 22px; font-size: 14px; color: #fff; background: linear-gradient(90deg, #ffa53a, #ff8200); }
/* 私信里的代发邀请卡片（像微博里的分享卡片） */
.dm-bubble.invite { width: 236px; padding: 0; overflow: hidden; white-space: normal; cursor: pointer; }
.dm-bubble.invite .iv-main { display: flex; gap: 10px; padding: 12px; }
.dm-bubble.invite .iv-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.dm-bubble.invite b { font-size: 15px; font-weight: 600; color: var(--wb-text); line-height: 1.35; }

.dm-bubble.invite i { width: 44px; height: 44px; flex: none; border-radius: 6px; display: grid; place-items: center; font-style: normal; font-size: 22px; color: #fff; background: linear-gradient(135deg, #ffa53a, #ff8200); }
.dm-bubble.invite .iv-foot { border-top: 1px solid var(--wb-line); padding: 6px 12px; font-size: 11.5px; color: #b0b0b0; }
.dm-bubble.invite.used { cursor: default; }
.dm-bubble.invite.used i { background: #ccc; }
/* 登他的号 */
.tag.dai { display: inline-block; margin: 0 4px; padding: 0 4px; border-radius: 3px; font-size: 10px; line-height: 16px; color: #2f80ed; background: #e8f2ff; vertical-align: 1px; }
.alt-tag.as-tag { background: #e8f2ff; color: #2f80ed; }
.as-banner { margin: 0; text-align: center; color: #2f80ed; background: #eef5ff; }
.dm-bubble.invite.login i { background: linear-gradient(135deg, #4fb3ff, #2f80ed); }

/* char 关注 / 粉丝列表的标签 */
.follow-tag { flex: none; font-size: 11.5px; color: var(--wb-text-3); border: 1px solid var(--wb-line); border-radius: 10px; padding: 1px 7px; }

.sticker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px 16px 14px; max-height: 50vh; overflow-y: auto; }

.sub-line .att-sticker img { width: 56px; height: 56px; }

.sub-line .att-pic img { height: 84px; }
.dm-sticker img { display: block; width: 110px; height: 110px; object-fit: contain; }

    if (n >= 1e4) return (n / 1e4).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "万";

  }

    if (isNaN(t)) return "";

    const pad = x => String(x).padStart(2, "0");
    const hm = `${pad(t.getHours())}:${pad(t.getMinutes())}`;
    if (diff < 60) return "刚刚";
    if (diff < 3600) return `${Math.floor(diff / 60)}分钟前`;
    const sameDay = t.toDateString() === now.toDateString();
    if (sameDay) return `今天 ${hm}`;

  }

  function parseRelTime(s) {
    s = String(s || "").trim(); const now = Date.now();
    let m;
    if (!s || /刚刚/.test(s)) return new Date(now - rand(10, 50) * 1000).toISOString();
    if ((m = s.match(/(\d+)\s*秒/))) return new Date(now - m[1] * 1000).toISOString();
    if ((m = s.match(/(\d+)\s*分钟/))) return new Date(now - m[1] * 60000).toISOString();
    if ((m = s.match(/(\d+)\s*(个)?小时/))) return new Date(now - m[1] * 3600000 - rand(0, 600) * 1000).toISOString();
    if ((m = s.match(/(\d+)\s*天/))) return new Date(now - m[1] * 86400000 - rand(0, 36000) * 1000).toISOString();
    if ((m = s.match(/(\d+)\s*(周|星期)/))) return new Date(now - m[1] * 7 * 86400000).toISOString();
    if ((m = s.match(/(\d+)\s*(个)?月/))) return new Date(now - m[1] * 30 * 86400000).toISOString();
    if ((m = s.match(/(\d+)\s*年/)) && !/\d{4}/.test(s)) return new Date(now - m[1] * 365 * 86400000).toISOString();
    if ((m = s.match(/昨天\s*(\d{1,2}):(\d{2})/))) { const d = new Date(now - 86400000); d.setHours(+m[1], +m[2], 0, 0); return d.toISOString(); }
    if ((m = s.match(/(今天\s*)?(\d{1,2}):(\d{2})/)) && !/\d{4}-/.test(s) && !/\d{1,2}-\d{1,2}/.test(s)) { const d = new Date(); d.setHours(+m[2], +m[3], 0, 0); if (d > now) d.setDate(d.getDate() - 1); return d.toISOString(); }
    if ((m = s.match(/(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})/))) { const d = new Date(+m[1], m[2] - 1, +m[3], rand(8, 23), rand(0, 59)); return (d > now ? new Date(now) : d).toISOString(); }
    if ((m = s.match(/(\d{1,2})[-/.月](\d{1,2})/))) { const d = new Date(new Date().getFullYear(), m[1] - 1, +m[2], rand(8, 23), rand(0, 59)); if (d > now) d.setFullYear(d.getFullYear() - 1); return d.toISOString(); }

  }

    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
    crown: '<svg class="crown" viewBox="0 0 24 24"><path fill="#ffb300" d="M3 8l4.5 3.5L12 5l4.5 6.5L21 8l-2 11H5z"/><path fill="#ff8a00" d="M5 17h14l-.4 2H5.4z"/></svg>',
    gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M10.08 4.85 L10.58 2.51 L13.42 2.51 L13.92 4.85 L15.70 5.59 L17.71 4.28 L19.72 6.29 L18.41 8.30 L19.15 10.08 L21.49 10.58 L21.49 13.42 L19.15 13.92 L18.41 15.70 L19.72 17.71 L17.71 19.72 L15.70 18.41 L13.92 19.15 L13.42 21.49 L10.58 21.49 L10.08 19.15 L8.30 18.41 L6.29 19.72 L4.28 17.71 L5.59 15.70 L4.85 13.92 L2.51 13.42 L2.51 10.58 L4.85 10.08 L5.59 8.30 L4.28 6.29 L6.29 4.28 L8.30 5.59Z"/><circle cx="12" cy="12" r="3.1"/></svg>',
    camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.3"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>',
    refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>',
  };

  // ───────────────────────── 数据层 ─────────────────────────
  const COL = { posts: "posts", accounts: "accounts", meta: "meta", dms: "dms" };
  const MAX_ROWS = 460; // db.list 一次最多拿 500 条，留余量

  const S = {
    identity: null,      // { id, name, avatarUrl }
    chars: [],           // 当前身份下的角色
    accounts: {},        // charId -> 角色微博账号
    accountRows: {},     // charId -> db row id
    meta: null,          // 当前身份的「我」
    posts: [],           // 当前身份下的全部微博
    allPostRows: 0,
    tab: "home",
    homeTab: "follow",
    feedBusy: false,
    jobs: new Set(),
    mediaCache: new Map(),
    hot: null,           // 当前身份的热搜榜 { id, at, items: [{ title, heat, tag, rel }] }
    topics: null,        // 当前身份生成过的话题页 { id, map: { 话题: { lead, host, reads, discussions, at } } }
    hotBusy: false,
    npcs: null,
    threads: [],         // 当前身份的私信对话
    alt: null,           // 小号 { id, nickname, bio, avatarRef, ..., knownBy: [charId], posted }
    acct: "main",        // 当前登录的账号：main 大号 / alt 小号
    calts: null,         // char 小号 { id, map: { charId: { nick, state, wait, appeared, strangerDm, createdAt } } }
    supers: null,        // 超话 { id, map: { 名称: {...} }, recommend: [], charSupers: { charId: { about, haunts } } }          // 生成过主页的路人 { id, map: { 昵称: { bio, gender, verified, verifiedNote, vip, ip, followers, following, at } } }
  };

  // ── 大号 / 小号：S.me 是当前账号的资料（大号就是 S.meta） ──
  const isAlt = () => S.acct === "alt" && !!S.alt;
  /** 登着某个 char 的号（他给了登录授权）：S.acct = "c:charId" */
  const asId = () => (typeof S.acct === "string" && S.acct.startsWith("c:") && S.meta && (S.meta.logins || {})[S.acct.slice(2)] ? S.acct.slice(2) : null);
  const isAs = () => !!asId();
  function asMe() { const l = S.meta.logins[asId()]; l.me = l.me || { seen: {}, favs: [], drafts: [], history: [], visits: [], fans: [] }; l.me.nickname = charNickname(asId()); return l.me; }
  Object.defineProperty(S, "me", { get: () => (isAlt() ? S.alt : isAs() ? asMe() : S.meta) });
  const acctOf = x => (x && x.acct ? x.acct : "main");
  const profOf = x => (acctOf(x) === "alt" && S.alt ? S.alt : S.meta);
  const curAcct = () => (isAlt() ? "alt" : isAs() ? S.acct : "main");
  const sameAcct = x => acctOf(x) === curAcct();
  /** 当前账号自己发的 */
  const isMe = x => x.authorType === "user" && sameAcct(x);
  const acctTag = () => (isAlt() ? { acct: "alt" } : isAs() ? { acct: S.acct } : {});
  const knowsAlt = charId => !!S.alt && (S.alt.knownBy || []).includes(charId);
  const LK = () => (isAlt() ? "likedAlt" : isAs() ? `liked_${asId()}` : "liked");
  const LKAT = () => (isAlt() ? "likedAtAlt" : isAs() ? `likedAt_${asId()}` : "likedAt");
  /** 当前账号赞过没有：登着他的号时，他本人赞过的（likedBy）也算 */
  const likedNow = p => !!p[LK()] || (isAs() && (p.likedBy || []).includes(asId()));
  /** 超话里的加入 / 经验 / 签到按账号分开 */
  const su = sp => (isAlt() ? (sp.alt || (sp.alt = {})) : sp);
  /** 小号相关的一句话：写进 prompt，告诉 AI 谁知道、谁不知道 */
  function altLine() {
    if (!isAlt()) return "";
    const known = S.chars.filter(c => knowsAlt(c.id)).map(c => c.name);
    return `【小号】用户现在登录的是自己的微博小号「${S.alt.nickname}」（不认证、粉丝很少，和大号「${S.meta.nickname}」是同一个人）。${known.length ? `知道这个小号是用户的角色：${known.join("、")}。除此之外所有人（其他角色和全部路人）` : "所有人（全部角色和路人）"}都不知道这个小号是用户，只把它当成一个普通陌生网友：不会认出来，不会提用户的真名、大号或任何只有熟人才知道的事。`;
  }

  // ── char 小号：资料存在路人主页（S.npcs.map[昵称]，带 altOf），状态存 S.calts.map[charId] ──
  // state：hidden 藏着（她不知道）/ aware 默默记住（她知道，他以为她不知道）/ open 公开（都知道）
  const calt = charId => (S.calts && S.calts.map[charId]) || null;
  const altOwner = name => { if (!S.calts || !name) return null; for (const id in S.calts.map) if (S.calts.map[id].nick === name) return id; return null; };
  const altSeen = charId => !!calt(charId) && calt(charId).state !== "hidden";
  const altOpen = charId => !!calt(charId) && calt(charId).state === "open";
  /** 路人主页资料；藏着的小号还没「生成主页」时当作没有，和普通路人一样 */
  const npcInfo = name => { const i = S.npcs && S.npcs.map[name]; return i && i.pending && !altSeen(altOwner(name)) ? null : i || null; };
  function saveCalts() { if (S.calts) dbUpsert(COL.meta, S.calts).catch(e => console.warn(e)); }
  /**
   * 这一次 char 用哪个号（代码定，不交给 AI）：
   * 她小号发的、他知道她小号 → 小号；超话里（不是她大号的帖）→ 小号；其余都是大号
   */
  function acctFor(charId, ctx = {}) {
    if (!calt(charId)) return "main";
    const up = ctx.post && ctx.post.authorType === "user" ? ctx.post : null;
    if (up) return acctOf(up) === "alt" && knowsAlt(charId) ? "alt" : "main";
    if (ctx.post && ctx.post.altOf === charId) return "alt";
    if (ctx.super || (ctx.post && ctx.post.superName)) return "alt";
    return "main";
  }
  /** 本轮用小号的 char：告诉 AI 用哪个昵称、怎么说话 */
  function caltLine(cast, ctx) {
    return cast.filter(c => c && acctFor(c.id, ctx) === "alt").map(c => {
      const a = calt(c.id);
      return `${c.name} 这次用他自己的微博小号「${a.nick}」出现（不认证、粉丝很少；${altOpen(c.id) ? "用户已经知道这个号是他" : "他没告诉过用户这是他的号，他以为用户不知道"}）：他写的内容「角色」填 ${c.name}，「作者」填「${a.nick}」，不要再用他的大号。小号就是他本人：口癖、性格、在意的事都不变，只是更随意、更真实，不用端着；${altOpen(c.id) ? "" : "不自称是谁，不提自己的真名和大号，不用只有他和用户之间才用的称呼，但说话习惯会不经意露出一点马脚；"}低调，宁可少说。`;
    }).join("\n");
  }
  /** AI 写出来的评论 / 帖子：按 acctFor 统一成一个号（小号 → npc 作者 + altOf） */
  function fixAltAuthors(list, ctx) {
    for (const x of list) {
      const owner = x.authorType === "char" ? x.charId : x.authorType === "npc" ? altOwner(x.authorName) : null;
      if (!owner || !calt(owner)) continue;
      if (acctFor(owner, { ...ctx, post: ctx.post || x }) === "alt") {
        Object.assign(x, { authorType: "npc", charId: undefined, authorName: calt(owner).nick, altOf: owner, verified: "无", vip: false });
        if (ctx.post) x.isPostAuthor = ctx.post.altOf === owner;
      } else {
        Object.assign(x, { authorType: "char", charId: owner, authorName: charNickname(owner) }); delete x.altOf;
        if (ctx.post) x.isPostAuthor = ctx.post.authorType === "char" && ctx.post.charId === owner;
      }
    }
    return list;
  }

  async function dbList(c) { try { return (await api.db.list(c, { limit: 500 })) || []; } catch (e) { console.warn(e); return []; } }
  async function dbUpsert(c, row) {
    try {
      const updated = await api.db.update(c, row.id, row);
      if (updated) return updated;
    } catch (e) { /* 不存在时 update 可能报错，走 create */ }
    const created = await api.db.create(c, row);
    // 宿主 create 会把 createdAt 改成写入那一刻：再 update 一次写回我们自己的时间（主页历史博、刷新时间都靠它）
    if (row.createdAt && created && created.createdAt !== row.createdAt) {
      try { return (await api.db.update(c, row.id, { createdAt: row.createdAt })) || created; } catch (e) { console.warn(e); }
    }
    return created;
  }

  function serializePost(p) { const { _media, _why, ...rest } = p; return rest; }
  const saveQueue = new Map();
  function savePost(p) {
    // 合并同一条微博的连续写入，避免整表反复序列化
    clearTimeout(saveQueue.get(p.id));
    saveQueue.set(p.id, setTimeout(() => {
      saveQueue.delete(p.id);
      dbUpsert(COL.posts, serializePost(p)).catch(e => console.warn("保存微博失败", e));
    }, 250));
  }
  async function deletePost(p) {
    S.posts = S.posts.filter(x => x.id !== p.id);
    forget(memEventsOfPost(p));
    try { await api.db.delete(COL.posts, p.id); } catch (e) { console.warn(e); }
    for (const img of p.images || []) if (img.ref) api.media.delete({ ref: img.ref }).catch(() => {});
  }
  function saveMeta() {
    if (S.meta) dbUpsert(COL.meta, S.meta).catch(e => console.warn(e));
    if (S.alt) dbUpsert(COL.meta, S.alt).catch(e => console.warn(e));
  }
  function saveHot() { if (S.hot) dbUpsert(COL.meta, S.hot).catch(e => console.warn(e)); }
  function saveTopics() { if (S.topics) dbUpsert(COL.meta, S.topics).catch(e => console.warn(e)); }
  function saveNpcs() { if (S.npcs) dbUpsert(COL.meta, S.npcs).catch(e => console.warn(e)); }
  const accQueue = new Map();
  function saveAccount(charId) {
    // 合并连续写入：同一时刻两次 upsert 都以为不存在，会建出两行
    clearTimeout(accQueue.get(charId));
    accQueue.set(charId, setTimeout(() => {
      accQueue.delete(charId);
      const acc = S.accounts[charId]; if (!acc) return;
      dbUpsert(COL.accounts, { ...acc, id: `acc_${charId}`, charId }).catch(e => console.warn(e));
    }, 250));
  }

  /** 总行数快满时，删最旧的、没互动过的路人微博 */
  async function pruneIfNeeded() {
    if (S.allPostRows < MAX_ROWS) return;
    const rows = await dbList(COL.posts);
    S.allPostRows = rows.length;
    if (rows.length < MAX_ROWS) return;
    const victims = rows
      .filter(r => r.authorType === "npc" && r.origin !== "profile" && !r.altOf && !r.liked && !r.likedAlt && !isFavAny(r.id) && !(r.comments || []).some(c => c.authorType === "user"))
      .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt))
      .slice(0, rows.length - MAX_ROWS + 60);
    for (const v of victims) { try { await api.db.delete(COL.posts, v.id); } catch (e) { /* ignore */ } }
    const ids = new Set(victims.map(v => v.id));
    S.posts = S.posts.filter(p => !ids.has(p.id));
    S.allPostRows -= victims.length;
  }

  async function loadAll() {
    const identity = await api.user.getProfile({}).catch(() => null);
    S.identity = identity || { id: "default", name: "我" };
    const chars = await api.characters.list().catch(() => []);
    // 只留绑定当前身份的角色（和微信的身份分区一致）
    const owners = await Promise.all(chars.map(c => api.user.getProfile({ characterId: c.id }).catch(() => null)));
    S.chars = chars.filter((c, i) => !owners[i] || !identity || owners[i].id === identity.id);

    const [postRows, accRows, metaRows, dmRows] = await Promise.all([dbList(COL.posts), dbList(COL.accounts), dbList(COL.meta), dbList(COL.dms)]);
    S.alt = metaRows.find(m => m.id === `alt_${S.identity.id}` && m.nickname) || null;
    S.allPostRows = postRows.length;
    S.posts = postRows.filter(p => p.scope === S.identity.id).map(p => ({ ...p, comments: p.comments || [] }));
    S.accounts = {};
    for (const a of accRows) if (a.charId) S.accounts[a.charId] = a;
    S.debug = (metaRows.find(m => m.id === "debug_log") || {}).entries || [];
    S.hot = metaRows.find(m => m.id === `hot_${S.identity.id}`) || { id: `hot_${S.identity.id}`, at: null, items: [] };
    S.topics = metaRows.find(m => m.id === `topics_${S.identity.id}`) || { id: `topics_${S.identity.id}`, map: {} };
    S.npcs = metaRows.find(m => m.id === `npcs_${S.identity.id}`) || { id: `npcs_${S.identity.id}`, map: {} };
    S.supers = metaRows.find(m => m.id === `supers_${S.identity.id}`) || { id: `supers_${S.identity.id}`, map: {}, recommend: [], charSupers: {} };
    S.calts = metaRows.find(m => m.id === `calts_${S.identity.id}`) || { id: `calts_${S.identity.id}`, map: {} };
    S.meta = metaRows.find(m => m.id === `meta_${S.identity.id}`) || {
      id: `meta_${S.identity.id}`,
      nickname: S.identity.name || "微博用户",
      bio: "",
      ip: "",
      cover: 0,
      followers: rand(18, 120),
      followNpc: [],
      unfollowChars: [],
      pinnedPostId: null,
    };
    for (const k of ["excludedChars", "starredChars", "avatarPool", "fans", "publicChars", "visits", "history", "favs", "drafts"]) if (!Array.isArray(S.meta[k])) S.meta[k] = [];
    if (S.alt) for (const k of ["fans", "visits", "history", "favs", "drafts", "knownBy"]) if (!Array.isArray(S.alt[k])) S.alt[k] = [];
    S.acct = S.alt && S.meta.acct === "alt" ? "alt" : String(S.meta.acct || "").startsWith("c:") && (S.meta.logins || {})[S.meta.acct.slice(2)] ? S.meta.acct : "main";
    S.threads = dmRows.filter(t => t.scope === S.identity.id && t.peer && acctOf(t) === S.acct).map(t => ({ ...t, messages: t.messages || [] }));
    // 第一次有消息页：以前的评论和赞都算已读，列表里照样能看到
    if (!S.me.seen) { const t = nowIso(); S.me.seen = { at: t, comment: t, like: t, follow: t }; saveMeta(); }
    if (!metaRows.some(m => m.id === S.meta.id)) saveMeta();
  }

  // ───────────────────────── 账号 / 头像 ─────────────────────────
  const charById = id => S.chars.find(c => c.id === id);
  const isStarred = id => (S.meta.starredChars || []).includes(id);
  const loverSolo = id => !(S.meta.soloOff || []).includes(id);
  /** 公众人物：用户在编辑资料里开、角色在微博设置里开（按身份分开存） */
  const isPublic = id => id === "user" ? !!S.meta.publicFigure : (S.meta.publicChars || []).includes(id);

  /** 参与微博的角色（设置里关掉的不发博、不来评论） */

  async function compressImage(dataUrl, max = 1280) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL("image/jpeg", 0.86));
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    });
  }

  // 支持「作者：xx」「作者: xx」「[作者]xx」「【作者】：xx」「**作者**：xx」「- 作者：xx」

  const KINDS = "微博|评论|互动|主页|热搜|话题|私信|超话|转发|简介|反应|授权|会话|关系|账号|结束";

  /** 把模型常见的格式偏差统一成 ===xx=== 块 */
  function normalizeOutput(text) {
    return String(text || "")
      .replace(/<think(?:ing)?>[\s\S]*?<\/think(?:ing)?>/gi, "")

  function cleanField(v) {
    return String(v || "").split("\n")
      .filter(l => !/^\s*=+\s*(结束)?\s*=*\s*$/.test(l) && !/^\s*[\u4e00-\u9fa5]{2,5}\s*[：:]\s*(无|没有)\s*$/.test(l))

  const INLINE_RULES = {"world":"你正在小手机的「微博」App 中生成内容。微博是公开的广场：一件事出来，大家围观、吃瓜、站队、玩梗、转发，节奏快、说话短、很冲。内容必须符合世界观和角色设定，不要出现与设定冲突的现实品牌或人物。\n\n【按角色身份决定他在微博上的样子】先根据角色设定判断他是谁，再决定账号规模和评论区生态：\n- 普通人（学生、上班族等）：粉丝几十到几千，多数不认证。评论区是同学同事朋友、熟人互损、偶尔几个路人。点赞几个到几百。\n- 爱豆、明星、网红等公众人物：有认证（个人认证是黄V，大V是金V），粉丝几十万到上千万。评论区有粉丝控评（「来了来了」「哥哥今天也好帅」「前排保护」、整齐的彩虹屁）、唯粉和CP粉、黑粉和反黑、路人吃瓜「这谁？」、营销号搬运。点赞上万甚至十万。发博要像营业：克制、有分寸，偶尔透露一点私人情绪粉丝就会疯狂解读。\n- 其他身份（博主、主播、作家、运动员、老板、医生……）：按设定推断账号规模和粉丝群体，评论区跟着变。\n- 公众人物不会无缘无故在公开平台暴露和用户的私密关系；普通人可以暗戳戳，但也要像在公开场合说话。\n- 微博是私人社交平台，不是班级群、工作群或公告栏：除非是官方/机构账号，角色不会在微博发通知、提醒、公告、工作安排、点名。身份只决定他的说话方式和生活内容，不要把职务当成发博内容。\n- 职业、专业、擅长的学科只是背景：说话像个普通人，偶尔提一句考试、作业、工作可以，*禁止堆砌专业术语、学科名词，也不要拿专业概念打比方*（学物理的不会满口「动量守恒」「熵增」，学医的不会满口病名）。\n- 角色对用户的态度以他的人设和你们最近的聊天记忆为准：在公开场合可以收着、可以暗戳戳，但性格不能变——黏人的人公开场合也是黏人的暗戳戳（撒娇、显摆、找存在感），绝不能无缘无故变凶、变冷淡、嫌弃用户。\n- 关心也要用他自己的方式：黏人的撒娇、打直球、黏糊糊，害羞的别别扭扭，嘴硬的嘴硬心软。*绝对禁止训话、命令、管教的口吻*（「老老实实……」「别嫌……」「可没人替你……」「给我……」「听到没」这类），他发的博如果看得出是在说用户，也一样不能凶。\n\n【写得像真人】\n- 正常使用标点，像真人在手机上打字：可以用空格代替逗号、用～ ！！ ？？ …… 「」，但绝不能整段没有标点。\n- 不用刻意写细节：不描写场景，不罗列物件和动作，不写成有画面感的小短文。也禁止空泛的「今天天气真好」「生活需要仪式感」「愿你被世界温柔以待」。\n- 碎片化、去精致化：吐槽、求助、晒图、踩雷、碎碎念、发疯文学、蹲后续都行；可用网络黑话、不完整句。不写小作文、不煽情、不装逼。\n- 每个人语气不同：有人满屏「啊啊啊」「笑死」「救命」，有人惜字如金只回一个字或一个表情，有人一本正经。同一批里句式不要雷同，不要每条都感叹号结尾。\n- *绝对禁止讲大道理、爹味说教、强行升华、客服式总结、广告腔、文案腔、成语堆砌、排比句*。\n- *绝对禁止「引用原文/原话 + 这句太真实了/说到心坎上了」这种格式*。\n- 禁用词和口癖：*绝对不要用「某人」「某些人」「某位」「某个人」「有些人」「有的人」这类词暗指用户或任何人*（要提就直接 @ 微博昵称，或用符合关系的称呼，或者干脆不提）；不要用记账、算账、账本、连本带利、欠债、还债、利息、讨债这类债务财务比喻（真正和钱有关的剧情除外）；不要「呵」「啧」开头的冷笑腔，除非人设就是这样。\n- *绝对禁止对用户发号施令、管东管西*：不写「不准……」「不许……」「给我……」「记得按时……」这类命令和叮嘱。关心用户要按人设本来的方式表达（黏人的就撒娇、嘴硬的就别扭），人设不是爹系就绝对不能变成家长口吻。\n- 微博表情用方括号：[doge] [允悲] [二哈] [笑cry] [吃瓜] [心] [抱抱] [泪] [裂开] [awsl] [哆啦A梦花心]，适量，不要每句都加。\n\n【路人】\n- 昵称有生活气（如「今天也要早睡」「是小王不是小汪」「吃瓜第一线」「一只柠檬精」「用户7203xxxx」），绝不能使用角色或用户的名字和微博昵称，也不能起近似的名字。\n- 不脸谱化，多种人并存：看戏的、吃瓜的、无脑跟风复读的、友好捧场的、玩梗的、蹲后续的、跑题的、抬杠的、阴阳怪气的、理中客。比例看内容：日常小事友好捧场多一些，有争议的事吵起来站队，热点事件复读和玩梗刷屏。\n- 评论区禁止一边倒夸博主。\n\n【用户本人】用户的名字和微博昵称会在本轮说明里告诉你。用户本人绝对不能出现在你生成的任何微博、评论、转发里，不能替用户说话。评论提到博主或别人时，性别按本轮说明给出的称呼（他/她/哥哥/姐妹），不确定就用「博主」「ta」。\n\n只按要求的格式输出，不要输出任何解释。","feed":"任务：生成微博首页刷新出来的一批新微博。数量和比例按本轮说明。\n- 角色发的微博出自他此刻的心情和态度，最近的经历只是素材：普通人发日常感受，公众人物营业或偶尔露出一点私人情绪。\n- 路人微博要像这个世界里真实的微博：普通网友的日常和吐槽、搞笑博主、营销号带节奏、媒体发新闻、粉丝站姐发图、热点事件讨论。\n- 有 1～2 条是转发：转发语很短（「笑死」「？？？」「转发微博」也行），可以带转发链，像「//@A：真的假的 //@B：蹲」一层层套。\n- 角色发的带图微博里，大约三分之一是本人出镜：自拍、对镜拍、合照，或者只露手、背影、侧脸这种局部。性格害羞的少一点，爱臭美、爱显摆的多一点。\n- 大约一半带 1～2 个 #话题#（像真人一样放开头或结尾，话题要具体，像微博真实热门话题）。\n\n每条微博严格用以下格式（字段名照抄，正文放最后，可多行）：\n===微博===\n角色：发博角色的本名（路人写 无）\n作者：微博昵称\n性别：男 / 女\n认证：无 / 黄V / 蓝V / 金V\n会员：是 / 否\n来源：发布设备，如 iPhone 15 Pro、HUAWEI Mate 60、微博网页版\n时间：如 刚刚 / 8分钟前 / 2小时前\n配图：图片内容描述，多张用 | 分隔；发博角色本人出镜（自拍、合照、露脸、身体局部）的那张，描述开头加【本人】；没有写 无\n转评赞：转发数 / 评论数 / 点赞数（纯数字）\n转发自：被转发的原作者昵称（不是转发写 无）\n原文：被转发的原微博内容（不是转发写 无）\n转发链：中间转发人：转发语 || 中间转发人：转发语（没有写 无）\n正文：\n微博正文\n===结束===\n\n如果某个角色刚发了跟热搜、近况有关的博，又有话想单独跟用户说（分享这个话题、问用户怎么看、用户在微信上还没回他），可以顺便私信用户：最多 1 个角色，大多数时候没有。他看得到你们的记忆，知道这是微博，语气按人设。一句一条：\n===私信===\n来自：角色本名（路人写微博昵称）\n角色：角色本名（路人写 无）\n内容：一条私信（一句一条，同一个人连发几条就写几个块）\n===结束===","comments":"任务：为指定的一条微博生成评论区。包括路人网友评论、本轮说明中列出的其他角色（符合他们和博主的关系才来评论）、以及博主本人回复部分评论（楼中楼）。\n- 评论短、口语化，像随手一打的；可以只有一句话、一个字或一个表情。\n- 落到微博里的具体细节（某句话、某张图、某个词）或真实反应：吐槽、好奇、共鸣、调侃、提问、玩梗、蹲后续、跑题。\n- 按博主身份决定评论区生态（普通人：熟人互损为主；公众人物：粉丝控评、黑粉、吃瓜路人、CP粉都会出现）。\n- 楼中楼里可以吵架、接梗、复读、站队，粉丝会反黑，路人会拱火。\n\n每条评论严格用以下格式（字段名照抄）：\n===评论===\n编号：c1、c2……依次递增\n角色：评论者是角色时写角色本名（路人写 无）\n作者：评论者微博昵称\n回复：楼中楼时写被回复评论的编号（一级评论写 无）\n赞：点赞数（纯数字）\n内容：评论内容\n===结束===","reaction":"任务：用户刚在微博发了一条微博（内容见本轮说明）。生成大家看到后的反应：\n- 本轮说明中列出的角色按和用户的关系、性格、此刻状态决定要不要点赞、评论或转发——不是每个人都必须出现，在忙或关系疏远的可以只点赞或不出现。角色评论要像在公开场合说话：可以暗戳戳、装不熟、光明正大，公众人物要顾及形象。\n- 路人数量和用户粉丝数相称：粉丝少就几个路人，粉丝多才热闹。\n- 评论短、口语化，像随手一打的；可以只有一句话、一个字或一个表情。\n- 落到微博里的具体细节（某句话、某张图、某个词）或真实反应：吐槽、好奇、共鸣、调侃、提问、玩梗、蹲后续、跑题。\n- 按博主身份决定评论区生态（普通人：熟人互损为主；公众人物：粉丝控评、黑粉、吃瓜路人、CP粉都会出现）。\n- 楼中楼里可以吵架、接梗、复读、站队，粉丝会反黑，路人会拱火。\n\n先输出评论（楼中楼里角色和路人可以互相回复）：\n===评论===\n编号：c1、c2……依次递增\n角色：角色本名（路人写 无）\n作者：微博昵称\n回复：楼中楼时写被回复评论的编号（一级评论写 无）\n赞：点赞数\n内容：评论内容\n===结束===\n\n最后输出一个互动汇总：\n===互动===\n点赞角色：点了赞的角色本名，用 、 分隔（没有写 无）\n转发：角色本名或路人昵称：转发语 || ……（没有写 无）\n路人点赞：数字\n新增粉丝：数字\n新粉丝：其中几个新粉丝的昵称，用 、 分隔（新增粉丝为 0 写 无）\n===结束===\n\n最后按本轮说明输出私信（本轮说没有就不写）：\n- 角色：评论和私信二选一，评论过的就不再私信。只有内容比较私人、公开场合不方便说、或者他有话想单独跟用户说时才私信。他看得到你们的所有记忆，知道这是微博（比如用户微信还没回他就跑来发微博，他可能私信「微信不回跑来刷微博？」），语气完全按他的人设。最多 1 个角色私信，哪个角色来按本轮说明。\n- 路人：这条博带了热搜话题或比较火时，可能有陌生人私信（「姐妹你也去了吗」）；用户是公众人物时会有粉丝私信表白、求回关，偶尔有黑粉；偶尔有求互粉、约稿、小广告。有没有路人私信、是哪种人，按本轮说明来。\n- 像真人发私信：一句一条，短，口语，可以连发几条。\n===私信===\n来自：角色本名（路人写微博昵称）\n角色：角色本名（路人写 无）\n内容：一条私信（一句一条，同一个人连发几条就写几个块）\n===结束===","reply":"任务：用户在微博上评论或回复了你（内容和上下文见本轮说明）。以你的身份在评论区回复。\n- 公开场合说话，符合你们的关系、你的身份和你此刻的心情。可以只回一条，也可以连回两条。\n- 接住用户那句话自然往下聊（调侃、反问、附和、轻怼、跑题），*绝对禁止说教、爹味、强行升华或客服式回应*。\n- 其他路人可以看热闹插嘴、站队、起哄；你是公众人物的话，粉丝也会冲进来。不适合热闹的话，只有你回 1 条也可以。\n\n如果评论区里还有没说完、或者公开场合不方便说的话，你可以再私信用户（大多数时候不用，评论区说清楚了就不私信）。你也可以给用户刚才那条评论点赞。\n\n每条回复严格用以下格式（字段名照抄）：\n===评论===\n编号：r1、r2……依次递增\n角色：角色本名（路人写 无）\n作者：微博昵称\n回复：被回复的评论编号（按本轮说明给出的编号）\n赞：点赞数\n内容：回复内容\n===结束===\n\n要私信用户时（一句一条，可以连发）：\n===私信===\n来自：角色本名（路人写微博昵称）\n角色：角色本名（路人写 无）\n内容：一条私信（一句一条，同一个人连发几条就写几个块）\n===结束===\n\n给用户刚才那条评论点了赞的话，最后输出：\n===互动===\n点赞角色：你的本名（没点写 无）\n路人点赞：看热闹的路人给用户这条评论点的赞数（纯数字）\n===结束===","profile":"任务：为你自己建立微博主页资料，并写出你过去发过的几条微博（数量见本轮说明，时间从近到远排列，分布在过去几天到几年里，每条日期都不同）。\n- 主页资料按你的身份来：普通人粉丝少、多半没认证、简介随意；公众人物有认证和认证说明、粉丝多、简介官方一点。\n- 历史微博体现你的生活轨迹和性格：普通人发日常碎碎念，公众人物有营业、宣传、偶尔的私人情绪；可以有一两条转发，约一半带 #话题#；带图的里面要有几张本人出镜（自拍、对镜拍、合照或局部）。\n- 昵称要像真实微博昵称，不一定用本名。\n\n先输出主页资料：\n===主页===\n昵称：微博昵称\n简介：个人简介\n认证：无 / 黄V / 蓝V / 金V\n认证说明：如 知名摄影师（无认证写 无）\n会员：是 / 否\nIP属地：省份或地区\n粉丝：粉丝数（纯数字）\n关注：关注数（纯数字）\n===结束===\n\n再输出历史微博，每条：\n===微博===\n角色：你的本名\n作者：你的微博昵称\n认证：同上\n会员：是 / 否\n来源：发布设备\n时间：具体日期，如 2025-03-14（必须写日期，不要写「xx分钟前」「xx小时前」）\n配图：图片描述，多张用 | 分隔；你本人出镜（自拍、合照、露脸、身体局部）的那张，描述开头加【本人】；没有写 无\n转评赞：转发数 / 评论数 / 点赞数\n转发自：无\n原文：无\n转发链：无\n正文：\n微博正文\n===结束===","hot":"任务：生成此刻的微博热搜榜（条数见本轮说明），按热度从高到低排。\n热搜从这几处来，混在一起：\n- 现实的时间：今天的日期、星期、节日和季节（国庆、中秋、开学、期末、双十一、跨年、下雪、降温……），这些天大家在聊的事一定会上榜。\n- 世界书里的世界：这个世界的娱乐圈、社会新闻、学校、城市、行业动态，符合世界观。\n- 角色和用户的剧情：只有真正会上热搜的事才上——公众人物开演唱会、发新歌、被拍到、上综艺、拿奖（如「xx演唱会」「xx机场」「xx新歌」），或者剧情里发生了全网都会讨论的大事。*聊天里聊过的话题、朋友圈里的日常吐槽、私下的小事不会变成热搜*，除非它本来就是社会上大家都在聊的事。公众人物每人最多 3 条，不是公众人物的最多 1 条，大部分热搜和你们无关，世界不是围着用户转的。\n- 真实的新鲜事：如果你能联网搜索，混进 3～5 条今天现实里真的在热议的事；和世界观冲突的不要。不能联网就编符合这个世界的。\n\n【谁会上热搜】\n- 谁是公众人物以本轮说明为准（不是你自己判断）。公众人物会上热搜：行程、作品、造型、机场图、综艺片段、直播名场面、粉丝应援、被路透，*每个公众人物最多 3 条*。用户是公众人物时也一样，只写事件本身，不替用户说话。\n- 不是公众人物的角色和用户*不上热搜*，除非剧情里真的发生了全网都会讨论的重大事件（比如考了全省状元、做了什么事突然走红），这种整个榜单最多 1 条。学生、上班族这种普通人角色，他们的恋情、八卦、校园小事*不会上全国热搜*（全国网友不认识他们）。\n- 秘密不会无缘无故曝光：没公开的恋情、私下聊天的内容不会上热搜，除非剧情里已经被拍到或公开了。\n\n【写得像真热搜】\n- 词条短，一般 4～16 个字，口语化，像真的热搜：「xx 回应了」「xx 好像瘦了」「原来 xx 是这样做的」「打工人的国庆第一天」「xx 状态」「xx 名场面」「一张图看懂 xx」。不要带 # 号。\n- 题材混杂：娱乐、社会、民生、搞笑、情感、体育、科技、节日、天气。和角色、用户有关的按上面的条数限制。\n- 标签：「爆」最多 1 个，「沸」2～3 个，「热」4～6 个，「新」3～5 个（刚上榜的），其余不带标签。\n- 热度是纯数字：第一名几百万到上千万，往后越来越低，末尾几万到几十万。\n\n每条热搜严格用以下格式（字段名照抄）：\n===热搜===\n热搜词：词条（不带 # 号）\n热度：纯数字\n标签：爆 / 沸 / 热 / 新 / 无\n相关：和这条有关的角色本名，用户本人写 用户，都无关写 无\n===结束===","topic":"任务：用户点开了一个微博话题（话题和背景见本轮说明），生成这个话题页的内容。\n- 导语：话题主持人（媒体、官方账号或话题相关的大V）写的一两句说明，客观交代这件事是什么，像真的话题导语。\n- 热门微博：媒体发新闻、营销号带节奏、大V点评、当事人或相关账号的回应、粉丝站子发图。\n- 实时微博：普通网友刚发的：吃瓜、吐槽、玩梗、站队、蹲后续、跑题、晒自己的经历。\n- 每条微博正文里都要带上这个 #话题#（放开头或结尾），转评赞按热度来。\n- 话题页是看大家怎么讨论这件事的，不是看角色发博：*最多 1 个角色出现*，从本轮说明列出的角色里挑和这个话题最贴近的那一个（话题就是关于他的、或者他真的会关心这件事），都不贴近就一个都不出现。公众人物可以发回应或营业；普通人角色只是像普通网友一样随口发一条，要符合他的人设和语气。\n- 用户本人绝对不能出现。\n\n先输出话题信息（本轮说明要求时才输出）：\n===话题===\n导语：话题导语\n主持人：主持人微博昵称\n阅读：阅读量（纯数字）\n讨论：讨论量（纯数字）\n===结束===\n\n再输出微博，每条：\n===微博===\n分区：热门 / 实时\n角色：发博角色的本名（路人写 无）\n作者：微博昵称\n性别：男 / 女\n认证：无 / 黄V / 蓝V / 金V\n会员：是 / 否\n来源：发布设备\n时间：如 刚刚 / 8分钟前 / 2小时前\n配图：图片内容描述，多张用 | 分隔；发博角色本人出镜的那张，描述开头加【本人】；没有写 无\n转评赞：转发数 / 评论数 / 点赞数（纯数字）\n转发自：无\n原文：无\n转发链：无\n正文：\n微博正文\n===结束===","search":"任务：用户在微博搜索框里搜了一个关键词（见本轮说明），生成搜出来的微博。\n- 搜索结果就是这个世界里和关键词相关的微博：普通网友的经历和吐槽、媒体报道、营销号、博主测评、粉丝发图、讨论和争议，按关键词的性质来定比例。\n- 关键词和某个角色有关时，可以搜到他本人发过的微博，也可以搜到别人讨论他的微博，都要符合他的身份和人设。\n- 每条微博里都要出现关键词或明显相关的内容；时间可以分散，从刚刚到几个月前都行。\n- 用户本人绝对不能出现。\n\n每条微博严格用以下格式（字段名照抄）：\n===微博===\n角色：发博角色的本名（路人写 无）\n作者：微博昵称\n性别：男 / 女\n认证：无 / 黄V / 蓝V / 金V\n会员：是 / 否\n来源：发布设备\n时间：如 刚刚 / 3小时前 / 昨天 21:30 / 2025-08-14\n配图：图片内容描述，多张用 | 分隔；发博角色本人出镜的那张，描述开头加【本人】；没有写 无\n转评赞：转发数 / 评论数 / 点赞数（纯数字）\n转发自：无\n原文：无\n转发链：无\n正文：\n微博正文\n===结束===","npc":"任务：用户点开了一个微博路人的主页，为这个路人建立主页资料，并写出他过去发过的几条微博（数量见本轮说明，时间从近到远，分布在过去几天到几年里，每条日期都不同）。\n- 本轮说明里有他在微博上发过的博和评论，主页要和这些对得上：说话风格、立场、兴趣、生活状态一致。之前爱抬杠的人主页也带刺，追星的人主页全是他家哥哥，搞笑博主主页就是段子。\n- 按身份定账号：普通网友粉丝几十到几千，多半没认证，简介随意有个性（一句歌词、一个梗、星座/MBTI、「今天也不想上班」）；营销号、媒体、博主、站子、大V有认证和认证说明，粉丝多，简介像那么回事。\n- 历史微博要像一个活人的生活：上班上学、吃了什么、追的剧和爱豆、养的猫、跟室友吵架、深夜emo、转发抽奖。大部分和角色、用户无关，他有自己的人生。\n- 他不是角色，也不是用户，不能用角色或用户的名字，也不能替用户说话。\n\n先输出主页资料：\n===主页===\n昵称：照抄本轮说明给的昵称\n性别：男 / 女\n简介：个人简介\n认证：无 / 黄V / 蓝V / 金V\n认证说明：如 美食博主（无认证写 无）\n会员：是 / 否\nIP属地：省份或地区\n粉丝：粉丝数（纯数字）\n关注：关注数（纯数字）\n===结束===\n\n再输出历史微博，每条：\n===微博===\n角色：无\n作者：照抄他的昵称\n认证：同上\n会员：是 / 否\n来源：发布设备\n时间：具体日期，如 2025-03-14（必须写日期）\n配图：图片描述，多张用 | 分隔；没有写 无\n转评赞：转发数 / 评论数 / 点赞数\n转发自：被转发的原作者昵称（不是转发写 无）\n原文：被转发的原微博内容（不是转发写 无）\n转发链：无\n正文：\n微博正文\n===结束===","dm":"任务：你在微博私信里和用户聊天（聊天记录和用户刚发的话见本轮说明）。\n- 这是微博私信，不是微信：你知道你们在微博上，你看得到你们所有的记忆，微信上聊过的事、用户最近在微博上发了什么、用户是不是还没回你微信，你都知道，自然地提（比如「微信不回跑来刷微博？」）。\n- 语气、称呼、性格完全按你的人设和你们现在的关系，不能 OOC，不能训话、说教。\n- 像真人发私信：一句一条，短，口语，可以连发 1～4 条，可以用微博表情 [doge] [心]；不写旁白、动作、心理描写。\n- 接住用户那句话往下聊，不要客服式总结。\n\n每条私信严格用以下格式（一句一个块）：\n===私信===\n来自：角色本名（路人写微博昵称）\n角色：角色本名（路人写 无）\n内容：一条私信（一句一条，同一个人连发几条就写几个块）\n===结束===","super":"任务：生成微博「超话」（超级话题社区）的内容，具体要什么见本轮说明。\n超话是同好聚集的圈子：追星的、动漫游戏的、学校的、兴趣爱好的、CP 的。里面的人说话比外面更「圈内」：圈内黑话、梗、称呼、默契。\n\n【超话的样子】\n- 兴趣超话（动漫、游戏、运动、学校等）：安利、求助、吐槽、晒图、整活、讨论剧情或比赛。\n- 个人超话（公众人物才有）：粉丝打卡、应援、站姐出图、行程分享、控评安排、彩虹屁。\n- CP 超话：产粮（同人小段子、手绘图描述）、嗑糖（逐帧分析两人的互动、「他看她的眼神」）、考古、「今天也是真的」。CP 超话嗑的是*两个人*：至少一半的帖子和笔墨写用户——用户的可爱和闪光点、用户怎么对他、两个人之间的互动和化学反应；*禁止*写成角色的个人吹捧帖（只夸他多帅、多专一、多宠女朋友，用户只是顺带一提的背景板）。只能写成粉丝或同学在嗑，绝不能替用户说话，也不能编造用户本人的私密细节。\n- 帖子要有圈子特有的细节和活人感，碎片化、口语化，不要写成新闻稿，不要讲大道理。\n\n【角色出现在超话】\n- 只有本轮说明里标了「也逛这个超话」的角色才会在超话里发帖或评论，而且要符合他的人设和语气，不能 OOC。\n- 不是公众人物的角色没有个人超话。\n\n输出超话信息时，每个超话：\n===超话===\n名称：超话名（不带「超话」两个字）\n简介：一两句超话简介\n分类：兴趣 / 个人 / CP / 学校\n主持人：主持人微博昵称\n帖子数：纯数字\n粉丝数：纯数字\n相关：和这个超话有关的角色本名，用户写 用户，无关写 无\n===结束===\n\n输出帖子时，每条：\n===微博===\n角色：发帖角色的本名（路人写 无）\n作者：微博昵称\n性别：男 / 女\n认证：无 / 黄V / 蓝V / 金V\n会员：是 / 否\n来源：发布设备\n时间：如 刚刚 / 8分钟前 / 2小时前 / 昨天 21:30\n配图：图片描述，多张用 | 分隔；发帖角色本人出镜的那张开头加【本人】；没有写 无\n转评赞：转发数 / 评论数 / 点赞数（纯数字）\n转发自：无\n原文：无\n转发链：无\n正文：\n帖子正文\n===结束===","charalt":"任务：你（角色本人）有一个偷偷注册的微博小号。本轮说明会告诉你要写什么：小号的主页资料，和 / 或小号以前发过的微博。\n【小号是什么】\n- 大号是公开的你，所有人都看得到；小号是你不方便、不好意思用大号做的事：真实的情绪和碎碎念、吐槽、心里话、偷偷关注和点赞喜欢的人、逛超话嗑东西。\n- 小号就是你本人：口癖、性格、在意的事、生活状态都和人设一致，绝不能 OOC；只是更随意、更真实，不用端着。\n- 不认证、粉丝很少（几个到几十个），昵称像普通网友随手起的（如「不想起床的猫」「今天也在摸鱼」），绝不能用自己的真名、大号昵称或和它们相近的名字，简介随意。\n- 小号上不自称是谁、不提真名和大号、不@用户、不用只有你和用户之间才用的称呼；但说话习惯、作息、在意的事会不经意露出一点马脚，细心的人能认出来。\n- 你心里的事（包括和用户有关的）可以写，但要含糊、像自言自语，不点名。大部分内容是你自己的生活。\n\n主页资料：\n===主页===\n昵称：小号昵称\n性别：男 / 女\n简介：一句随意的简介\n认证：无\n会员：是 / 否\nIP属地：省份或地区\n粉丝：粉丝数（纯数字，很少）\n关注：关注数（纯数字）\n===结束===\n\n小号的微博，每条：\n===微博===\n角色：你的本名\n作者：小号昵称\n认证：无\n会员：是 / 否\n来源：发布设备\n时间：具体日期，如 2025-03-14（必须写日期）\n配图：图片描述，多张用 | 分隔；你本人出镜的那张开头加【本人】；没有写 无\n转评赞：转发数 / 评论数 / 点赞数（都很少）\n转发自：被转发的原作者昵称（不是转发写 无）\n原文：被转发的原微博内容（不是转发写 无）\n转发链：无\n正文：\n微博正文\n===结束==="};
  async function generate(payload, label, opts = {}) {
    const job = uid("job"); S.jobs.add(job);
    const scene = (payload.appTags || [])[1];
    // 随请求带上整套规则：原版宿主只把预设条目挂进默认预设，用户自己的预设里没有
    const inline = typeof INLINE_RULES === "object" && [scene === "charalt" ? "" : INLINE_RULES.world, INLINE_RULES[scene]].filter(Boolean).join("\n\n");
    if (inline) payload = { ...payload, instruction: `【微博规则】\n${inline}\n\n${payload.instruction}` };
    const who = `用户的名字是「${S.identity.name || "用户"}」，微博昵称是「${S.meta.nickname}」。事情多大情绪就多大，不放大、不戏剧化。提到用户时禁止无缘无故贬低、嘲讽、阴阳、吐槽她。${scene === "hot" ? "" : `\n${nameLine()}`}` + (scene === "hot" ? "" : `\n${publicLine(false)}`) + (loveLine() ? `\n${loveLine()}` : "") + (scene === "hot" || !isAlt() ? "" : `\n${altLine()}`);
    const wx = scene === "hot" ? "" : await weatherLine(payload.characterIds || (payload.characterId ? [payload.characterId] : []));
    if (scene === "dm") payload = { ...payload, instruction: [
      who, payload.instruction, wx,
      dmExtra(),
      "【输出要求】只输出 ===私信=== 块，一句话一个块，字段名照抄「私信聊天」规则里的格式（引用、图片两行按上面说的可选加）；不要写旁白、动作或心理描写，不要加任何解释，不能替用户说话。*绝对不能编造用户*：她做过什么、说过什么，只能来自聊天记录和记忆里真实发生过的，不能把她没做过的事、糗事蠢事安到她头上。",
    ].join("\n\n") };
    else if (FORMAT_HINT[scene]) payload = { ...payload, instruction: [
      who, payload.instruction, PIC_SCENES.has(scene) ? `${PIC_LINE}\n${TIME_LINE}` : "", wx, CHAR_POST_SCENES.has(scene) ? CHAR_POST_LINE : "",
      ["feed", "profile", "super", "topic", "search", "comments", "reaction", "reply"].includes(scene) ? loverPostLine() : "",
      scene === "comments" ? OTHERS_CMT_LINE : "",
      `【输出要求】这不是聊天回复：不要用聊天格式，不要写旁白、动作或心理描写，不要加任何解释，除了本轮说明要求的「口吻」「发博原因」，不要自创字段名或用【】标题，只输出 ${opts.hint || FORMAT_HINT[scene]} 格式的内容，字段名和分隔线照抄「微博」规则里的格式。${scene === "hot" ? "用户是公众人物、或剧情里真的发生了大事时，热搜词条可以和用户有关，但只写事件，不替用户说话。" : "用户本人不能出现在你生成的内容里。"}提到现实里真有的剧、电影、歌、书、游戏、明星可以，但内容要和现实一致（题材、剧情、人物关系、谁唱的谁演的）：拿不准的细节就别说，只说名字和自己的感受，不要瞎编。不要用「某人」「某些人」「有些人」暗指谁；*绝对不能编造用户*：用户做过什么、说过什么、是什么样的人，只能来自聊天记录和记忆里真实发生过的，不能编她没做过的事、没说过的话，也不能为了和她扯上关系把糗事、蠢事安到她头上，把她写成呆、笨、蠢的形象；不要对用户发号施令或叮嘱（「不准……」「记得……」），人设不是爹系就不能有家长口吻。`,
    ].filter(Boolean).join("\n\n") };
    try {
      const r = await api.ai.generate(payload);
      const text = (r && r.text) || "";
      const plan = opts.secret ? "" : ((payload.instruction || "").match(/(每条的)?发博参考（[^\n]*）：[^\n]*(\n- [^\n]*)*/) || [""])[0];
      logAi({ label, ok: true, text: opts.secret ? "（小号内容保密：掉马后在设置里查看小号）" : text, ...(plan ? { plan: plan.replace(/^(每条的)?发博参考（[^）]*）：\n?/, "") } : {}) });
      return text;
    } catch (e) {
      console.error(label, e);
      logAi({ label, ok: false, error: String((e && e.message) || e) });
      toast(`${label}失败：${(e && e.message) || e}`.slice(0, 80));
      return null;
    } finally { S.jobs.delete(job); }
  }
  /** 解析不出内容时，让用户能看到 AI 原始返回，方便排查 */

  /** 调试记录里藏住还没掉马的小号：小号写的块里「角色」改成 无 */
  function maskSecrets(text) {
    const hidden = Object.entries((S.calts && S.calts.map) || {}).filter(([, a]) => a.state === "hidden");
    if (!hidden.length || !text) return text;
    return String(text).split(/(?====)/).map(seg => {
      for (const [id, a] of hidden) if (seg.includes(a.nick)) {
        const ch = charById(id);
        if (ch) seg = seg.replace(new RegExp(`((?:角色|来自)\\s*[：:]\\s*)${ch.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}`, "g"), (m0, k) => k.startsWith("来自") ? `${k}${a.nick}` : `${k}无`);
      }
      return seg;
    }).join("");
  }
  function openRaw() {

  /** 清空当前身份的全部微博内容：微博、评论、角色主页、我的主页 */

    if (ok !== "yes") return;

    toast("正在清空…");
    for (const p of S.posts.slice()) await deletePost(p);
    for (const c of S.chars) {
      const acc = S.accounts[c.id]; if (!acc) continue;
      // 上传的主页背景算设置，留着
      if (acc.coverRef) { S.accounts[c.id] = { charId: c.id, coverRef: acc.coverRef }; saveAccount(c.id); continue; }

    S.meta = { id: S.meta.id, nickname: S.identity.name || "微博用户", bio: "", ip: "", cover: 0, followers: rand(18, 120), followNpc: [], unfollowChars: [], pinnedPostId: null,
      excludedChars: S.meta.excludedChars || [], starredChars: S.meta.starredChars || [], avatarPool: S.meta.avatarPool || [], placeholderRef: S.meta.placeholderRef || null,
      publicFigure: !!S.meta.publicFigure, publicChars: S.meta.publicChars || [], fans: [], seen: { at: nowIso(), comment: nowIso(), like: nowIso(), follow: nowIso() } };
    if (S.alt) { const t = nowIso(); Object.assign(S.alt, { followers: rand(0, 12), fans: [], seen: { at: t, comment: t, like: t, follow: t }, favs: [], drafts: [], history: [], visits: [], pinnedPostId: null, posted: false }); }
    S.meta.acct = S.acct;
    saveMeta();
    S.hot = { id: S.hot.id, at: null, items: [] }; saveHot();
    S.topics = { id: S.topics.id, map: {}, recent: [] }; saveTopics();
    S.npcs = { id: S.npcs.id, map: {} }; saveNpcs();
    S.supers = { id: S.supers.id, map: {}, recommend: [], charSupers: {} }; saveSupers();
    forget(Object.keys(S.calts.map).map(charId => ({ charId, eventId: `weibo_charalt_${charId}` })));
    S.calts = { id: S.calts.id, map: {} }; saveCalts();

    S.threads = [];

  /** 写记忆并登记到相关的微博/评论上，删除时能一起删掉 */
  function remember(charId, summary, eventId, createdAt, ...owners) {
    if (!charId || !api.memory || !api.memory.addTimeline) return;
    for (const o of owners) {
      if (!o) continue;
      o.memEvents = (o.memEvents || []).filter(e => !(e.charId === charId && e.eventId === eventId));
      o.memEvents.push({ charId, eventId });
    }
    api.memory.addTimeline({ characterId: charId, appLabel: "微博", detail: "weibo", summary, appEventId: eventId, ...(createdAt ? { createdAt } : {}) })
      .catch(e => console.warn("写入记忆失败", e));
  }
  function forget(events) {
    if (!api.memory || !api.memory.deleteTimeline) return;
    for (const e of events || []) api.memory.deleteTimeline({ characterId: e.charId, appEventId: e.eventId }).catch(() => {});
  }
  /** 一条微博相关的全部记忆：登记过的 + 旧数据按规则推出来的 */
  function memEventsOfPost(p) {
    const list = [...(p.memEvents || [])];
    for (const c of p.comments || []) list.push(...(c.memEvents || []));
    if (p.authorType === "char") list.push({ charId: p.charId, eventId: `weibo_own_${p.id}` }, { charId: p.charId, eventId: `weibo_like_${p.id}` }, { charId: p.charId, eventId: `weibo_like_alt_${p.id}` });
    if (p.authorType === "user") {
      const chars = new Set([...(p.comments || []).filter(c => c.charId).map(c => c.charId), ...(p.likedBy || []), ...(p.reposts || []).filter(r => r.charId).map(r => r.charId)]);
      for (const ch of chars) list.push({ charId: ch, eventId: `weibo_post_${p.id}_${ch}` });
    }
    return list;
  }

  /** 角色自己发的微博也记进他的记忆，回微信聊天时接得上 */
  /** AI 在某条他的博前写了「置顶：是」：换成这条置顶（新的顶掉旧的） */
  const PIN_LINE = "角色发的博如果是他特别在意、想一直挂在主页最上面的（很少见，绝大多数博都不是），可以在那条「正文：」前加一行「置顶：是」。";
  function applyPins(posts) {
    for (const p of posts) if (p._pin) { delete p._pin; if (p.authorType === "char" && p.charId) { ensureAccount(p.charId, { pinnedId: p.id }); savePost(p); } }
  }
  function rememberOwnPost(p) {
    if (p.authorType !== "char") return;
    const pics = p.images && p.images.length ? `（配图：${p.images.map(i => i.desc || "图片").join("、").slice(0, 60)}）` : "";
    const what = p.repost ? `转发了 @${p.repost.author} 的微博「${p.repost.text.slice(0, 40)}」，转发语：「${p.text.slice(0, 60)}」` : `发了一条微博：「${p.text.slice(0, 120)}」${pics}`;
    remember(p.charId, `${charById(p.charId)?.name || "我"}在微博${what}`, `weibo_own_${p.id}`, p.createdAt, p);
  }

  /** 首页刷新 */
  async function refreshFeed() {
    if (S.feedBusy) return;
    ghostTick();
    if (!activeChars().length) { toast("没有参与微博的角色：先去微信加个好友，或在设置里打开角色"); return; }
    S.feedBusy = true; renderHome();
    const followTab = S.homeTab === "follow";
    const followed = activeChars().filter(c => isFollowingChar(c.id));

    // 恋人（恋情开关是地下恋/已公开）单独调用一次写他的博：像私信一样只有他，人设和聊天记录最完整
    const lovers = isAlt() || isAs() ? [] : fullCast.filter(c => loveOf(c.id).state !== "none" && loverSolo(c.id));

    const charCount = Math.max(0, (followTab ? Math.min(fullCast.length + 1, rand(2, 4)) : 1) - lovers.length);
    const npcCount = followTab ? rand(2, 3) : rand(5, 7);
    const followNpc = (S.meta.followNpc || []).filter(n => !altOwner(n)).slice(0, 6);
    const asks = isAlt() ? [] : (S.meta.followAsk || []).filter(n => isFollowingNpc(n) && !isFanNpc(n)).slice(0, 4);

    const dmLine = c => dmPick === c ? `如果你有话想单独跟用户说，可以顺便私信用户（1～3 条，一句一个块）。${charDmRecent(c)}` : "这次不私信用户，不要输出 ===私信===。";
    const instruction = [
      `当前时间：${nowText()}`,

      `角色微博昵称（已注册的必须沿用）：\n${charsForPrompt(cast) || "无（本轮不写角色的微博）"}`,

      `角色是否发博、发什么，看他此刻有没有想分享的情绪；同一个角色本轮最多 2 条。`,
      cast.length ? `${PLAN_HEAD}：\n${cast.map(c => `- ${c.name}：${postPlan(c.id)}`).join("\n")}\n同一个人写第 2 条时自由发挥，和第 1 条不一样。` : "",
      PIN_LINE,
      "角色发的是个人微博：自己的心情、吐槽、碎碎念、想分享的东西。*绝对不发通知、提醒、注意事项、班级事务*（不写「各位同学」「同学们」「请大家」「记得带好…」），就算他是班长、班干部、老师也一样——这些在班级群里说，不在微博说。",
      `${S.meta.nickname ? `用户的微博昵称是「${S.meta.nickname}」：角色发的博只有内容真和用户有关时才 @ 这个昵称，日常博不硬加 @。` : ""}`,
      recent ? `首页最近已有的微博（不要重复类似内容）：\n${recent}` : "",
      dmPick && !lovers.includes(dmPick) ? `这次 ${dmPick.name} 如果发了博、又有话想单独跟用户说，可以顺便私信用户（1～3 条，一句一个块）；其他人都不私信。${charDmRecent(dmPick)}` : "这次没有人私信用户，不要输出 ===私信===。",
      reservedLine(),
    ].filter(Boolean).join("\n\n");
    const loverInstr = c => [
      `当前时间：${nowText()}`,
      `${PLAN_HEAD}：${postPlan(c.id)}`,
      `这次只写你自己（${c.name}）此刻想发的 1 条微博，不写别人和路人的。${(S.accounts[c.id] || {}).nickname ? `你的微博昵称是「${S.accounts[c.id].nickname}」，必须沿用。` : "你还没有微博账号，自取一个昵称。"}`,
      (m => m.length ? `你最近发过的微博（不要重复类似内容）：\n${m.map(p => `- ${p.text.slice(0, 40)}`).join("\n")}` : "")(S.posts.filter(p => p.charId === c.id && p.origin !== "profile" && !(p.ghost && p.ghost.mode === "secret" && !p.ghost.found)).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 5)),
      recent ? `首页最近别人发的微博（不要和它们撞同一类事）：\n${recent}` : "",

    ].filter(Boolean).join("\n\n");
    // 大调用和恋人的单独调用同时发
    // char 小号偶尔也发一条：没发现的只在推荐里混进来，发现了的关注页也有（另外单独调用）
    const altPick = rollAltPoster(followTab);
    const [text, altPost, ...loverTexts] = await Promise.all([
      generate({ characterIds: (cast.length ? cast : fullCast).map(c => c.id), appTags: ["nox_weibo", "feed"], instruction }, "刷新"),
      altPick ? genAltNew(altPick, Date.now() - rand(1, 25) * 60e3, altSeen(altPick) ? "刷新·小号" : "刷新·路人").catch(e => { console.error(e); return null; }) : null,
      ...lovers.map(c => generate({ characterId: c.id, appTags: ["nox_weibo", "feed"], instruction: loverInstr(c) }, `刷新·${c.name}`)),
    ]);
    S.feedBusy = false; saveMeta();
    if (text == null && loverTexts.every(t => t == null)) { renderHome(!!altPost); return; }
    // 在「关注」页刷出来的路人微博也留在关注页（像关注页里混进来的推荐）
    const toPosts = (t, as) => fixAltAuthors(parseBlocks(t || "", "微博").filter(b => !isUserName(b["作者"])).map(b => postFromBlock(as ? { ...b, 角色: as.name } : b, { origin: "feed", followFeed: followTab || undefined })), {})
      .filter(p => (p.text || p.images.length || p.repost) && !isCharNotice(p));
    const posts = [
      ...toPosts(text).filter(p => !lovers.some(c => c.id === p.charId)),
      ...lovers.flatMap((c, i) => toPosts(loverTexts[i], c).filter(p => p.charId === c.id).slice(0, 1)),
    ];
    // 回关：AI 给了答案才算定了，没写 ===互动=== 就留到下次
    const fb = asks.length ? parseBlocks(text || "", "互动")[0] : null;
    if (fb && "回关" in fb) {
      const back = none(fb["回关"]) ? [] : fb["回关"].split(/[、,，\s]+/).map(x => x.replace(/^@/, "").trim());
      for (const n of asks) if (back.includes(n)) addFanNpc(n);
      S.meta.followAsk = (S.meta.followAsk || []).filter(n => !asks.includes(n)); saveMeta();
    }
    if (!posts.length) { renderHome(!!altPost); if (!altPost) parseFailed("刷新"); return; }
    const newest = Math.max(0, ...feedPosts().map(p => new Date(p.createdAt).getTime()).filter(t => t <= Date.now()));
    for (const p of posts) if (new Date(p.createdAt).getTime() <= newest) p.createdAt = new Date(newest + Math.random() * Math.max(1000, Date.now() - newest)).toISOString();
    thinPics(posts); for (const p of posts) { S.posts.push(p); savePost(p); S.allPostRows++; rememberOwnPost(p); }
    applyPins(posts);
    const dmText = dmPick && lovers.includes(dmPick) ? loverTexts[lovers.indexOf(dmPick)] : text;
    const feedDms = dmPick ? parseBlocks(dmText || "", "私信").filter(b => (charByName(b["角色"]) || charByName(b["来自"], true)) === dmPick) : [];
    if (feedDms.length) deliverDms(feedDms, { acct: curAcct(), delay: rand(5000, 12000) });
    const charPosts = posts.filter(p => p.authorType === "char");
    noteParsed(`${posts.length} 条微博（角色 ${charPosts.length} 条${charPosts.length ? "：" + charPosts.map(p => charById(p.charId)?.name).join("、") : ""}；路人 ${posts.length - charPosts.length} 条）`);
    const visibleHere = posts.filter(p => followTab ? inFollowFeed(p) : true).length + (altPost ? 1 : 0);
    if (!visibleHere && followTab) { S.homeTab = "recommend"; toast("刷出来的都是路人微博，在「推荐」里"); }
    S.lastRefreshCount = visibleHere || posts.length;
    pruneIfNeeded();
    renderHome(true);

  // ───────────── 你不在的时候：打开微博时补上空档里发生的事（发博、发了又删、改简介、点赞、来看主页） ─────────────
  const AWAY_HOURS = [2, 4, 8];
  const awayOn = () => S.meta.awayOn !== false;
  const awayHours = () => (AWAY_HOURS.includes(S.meta.awayHours) ? S.meta.awayHours : 4);
  /** 在 [from, to] 里挑个时间；night 时尽量落在 22 点到凌晨 3 点 */
  function timeIn(from, to, night) {
    for (let i = 0; i < (night ? 12 : 1); i++) {
      const t = from + Math.random() * (to - from); const h = new Date(t).getHours();
      if (!night || h >= 22 || h < 3) return t;
    }
    return from + Math.random() * (to - from);
  }
  const addNews = item => { S.meta.news = [{ id: uid("n"), got: nowIso(), ...item }, ...(S.meta.news || [])].slice(0, 200); };
  const visitorKey = w => (w.type === "char" ? `c:${w.charId}` : `n:${w.name}`);
  function addVisitor(who, t) {
    const at = new Date(t).toISOString(); const list = S.meta.visitors || [];
    const old = list.find(v => visitorKey(v.who) === visitorKey(who));
    S.meta.visitors = old ? list.map(v => v === old ? { ...v, count: (v.count || 1) + 1, at: at > v.at ? at : v.at } : v) : [{ who, at, count: 1 }, ...list].slice(0, 100);
    addNews({ kind: "visit", who, at });
  }
  /** 不花 API 的部分：偷偷赞她的旧博、来看她的主页、顺手赞首页上别人的博 */
  function awaySilent(chars, from, to) {
    const mine = S.posts.filter(p => p.authorType === "user" && acctOf(p) !== "alt" && p.visibility !== "self");
    for (const c of chars) {
      const love = loveOf(c.id).state; const close = love !== "none";
      if (Math.random() < (close ? 0.4 : 0.12)) {
        const old = mine.filter(p => !(p.likedBy || []).includes(c.id) && Date.now() - new Date(p.createdAt) > 3 * 86400e3);
        const p = old[Math.floor(Math.random() * old.length)];
        if (p) {
          p.likedBy = [c.id, ...(p.likedBy || [])]; p.counts.likes++; p.likeAt = new Date(timeIn(from, to, close)).toISOString(); p.likeGot = nowIso(); savePost(p);
          remember(c.id, `我在微博上翻到${S.identity.name || S.meta.nickname} ${fmtTime(p.createdAt)} 发的旧微博，偷偷点了个赞：「${(p.text || "（图片）").slice(0, 40)}」`, `weibo_oldlike_${p.id}`, null, p);
        }
      }
      if (Math.random() < (love === "open" ? 0.6 : close ? 0.5 : isStarred(c.id) ? 0.3 : 0.12)) addVisitor({ type: "char", charId: c.id }, timeIn(from, to, close));
      if (Math.random() < 0.3) {
        const pool = S.posts.filter(p => p.origin === "feed" && p.authorType !== "user" && p.charId !== c.id && !(p.likedBy || []).includes(c.id)
          && !(p.images || []).some(i => i.withFace) && Date.now() - new Date(p.createdAt) < 3 * 86400e3);
        const p = pool[Math.floor(Math.random() * pool.length)];
        if (p) { p.likedBy = [...(p.likedBy || []), c.id]; p.counts.likes++; savePost(p); }
      }
    }
    for (const f of shuffle(S.meta.fans || []).slice(0, 2)) if (Math.random() < 0.3) addVisitor({ type: "npc", name: f.name }, timeIn(from, to));
  }
  function awayInstr(plans, from, npcs = []) {
    const gapH = Math.round((Date.now() - from) / 3600e3);

  function takeReposts(post, text) {

      .filter(r => r.name && !isUserName(r.name) && !charByName(r.name, true) && !charByName(r.name) && !altOwner(r.name)).slice(0, 10);

    const instruction = [`当前时间：${nowText()}`, `博主：${authorOf(post).name}${altBloggerNote(post)}`, `微博正文：\n${post.text}`,
      post.repost ? `这是一条转发，原微博 @${post.repost.author}：${post.repost.text}` : "", "这次只写转发列表，不写评论。", REPOST_FMT(n).replace("评论写完后，再写", "写"), reservedLine()].filter(Boolean).join("\n\n");
    const text = await generate({ characterIds: pickCast(activeChars(), 1).map(c => c.id), appTags: ["nox_weibo", "comments"], instruction }, "加载转发");
    post._genReposts = false;
    if (text != null) { const k = takeReposts(post, text); if (k) { noteParsed(`${k} 条转发`); savePost(post); } else parseFailed("加载转发"); }
    rerenderDetail(post);
  }

  async function ensureComments(post) {
    if (post.commentsGenerated || post.authorType === "user" || post._genComments) return;
    if (!activeChars().length) return;
    post._genComments = true; rerenderDetail(post);
    const owner = post.charId || post.altOf;
    const others = post.superName ? superChars(post.superName).filter(c => c.id !== owner).slice(0, 3) : pickCast(activeChars().filter(c => c.id !== owner), 3);
    const cast = owner ? [charById(owner), ...others].filter(Boolean) : others.length ? others : activeChars().slice(0, 1);
    const author = authorOf(post);
    // 用他的号刚发的博评论数是 0：按他平时的热闹程度来，不然只要 3 条
    const want = post.ghost && !post.counts.comments ? (isPublic(post.charId) ? rand(8, 14) : rand(5, 9)) : Math.min(Math.max(post.counts.comments, 3), rand(9, 14));
    const rpN = repostWant(post);
    const picPlan = cmtPicPlan(want);
    const instruction = [
      `当前时间：${nowText()}`,
      `博主：${author.name}${altBloggerNote(post)}`,
      post.superName ? `这是「${post.superName}」超话里的帖子：评论的都是超话里的同好，用圈内的口吻和梗；没列出来的角色看不到，不会来评论。` : "",
      `微博发布于：${fmtTime(post.createdAt)}`,
      genderLine(post),
      `微博正文：\n${post.text}`,
      post.images.length ? `配图：${post.images.map(i => i.desc || "图片").join(" | ")}` : "",
      post.repost ? `这是一条转发，原微博 @${post.repost.author}：${post.repost.text}` : "",
      `可能来评论的其他角色（符合关系才来，不来就不写）：\n${charsForPrompt(others) || "无"}`,
      `用户的微博昵称：${S.meta.nickname}（用户本人不要出现在评论里）`,
      ghostLine(post),
      `生成约 ${want} 条评论，其中楼中楼回复 2~5 条${owner && !(post.ghost && (post.ghost.mode === "login" || (post.ghost.mode === "secret" && !post.ghost.found))) ? "，博主本人至少回复 1 条" : ""}。`,
      rpN ? REPOST_FMT(rpN) : "",
      caltLine(cast, { post }),
      picPlan.line,
      reservedLine(),
    ].filter(Boolean).join("\n\n");
    const text = await generate(withVision({ characterIds: cast.map(c => c.id), appTags: ["nox_weibo", "comments"], instruction }, await postVision(post)), "加载评论");
    post._genComments = false;
    if (text != null) {
      let list = enforceCmtPics(dropCharAtUser(fixAltAuthors(commentsFromBlocks(parseComments(text), post, {}), { post }), post), picPlan);
      if (post.ghost && (post.ghost.mode === "login" || (post.ghost.mode === "secret" && !post.ghost.found))) list = list.filter(c => !(c.authorType === "char" && c.charId === post.charId)); // 他还不知道，不会来评论
      const rk = rpN ? takeReposts(post, text) : 0;
      if (list.length) noteParsed(`${list.length} 条评论${rk ? `，${rk} 条转发` : ""}`); else parseFailed("加载评论");
      post.comments = [...list, ...post.comments];
      post.commentsGenerated = true;
      post.counts.comments = Math.max(post.counts.comments, post.comments.length);
      savePost(post);
    }
    rerenderDetail(post);
  }

  function topicLine(post) {
    const ts = topicsIn(post.text); if (!ts.length) return "";
    const hot = ts.filter(hotItem);
    return `这条微博带了话题 ${ts.map(t => `#${t}#`).join(" ")}${hot.length ? `，其中 ${hot.map(t => `#${t}#`).join(" ")} 正在热搜上：逛话题的路人也会刷到，评论里会有从话题点进来的陌生人` : ""}。`;
  }
  /** char 小号用小号点一个赞（只记名字，通知里和路人混在一起） */
  function likeAsAlt(p, nick) {
    if ((p.npcLikers || []).includes(nick)) return false;
    p.npcLikers = [...(p.npcLikers || []), nick]; p.counts.likes++; p.likeAt = nowIso(); savePost(p);
    return true;
  }
  /**
   * 她大号发博后，char 的小号偷偷行动（代码直接加，不靠 AI）：
   * 第一次出场在生成后第 1～3 次发博，而且要这批新粉丝里至少有 2 个路人才混进去；之后偶尔点赞
   */
  function altLurk(post, fanCount) {
    if (post.visibility && post.visibility !== "public") return;
    let changed = false;
    for (const c of activeChars()) {
      const a = calt(c.id); if (!a) continue;
      if (!a.appeared) {
        a.wait = (a.wait == null ? 1 : a.wait) - 1; changed = true;
        if (a.wait > 0) continue;
        // 有这批新粉丝就插在他们中间（时间也夹在中间），没有就自己悄悄关注
        const fans = S.meta.fans || (S.meta.fans = []);
        if (fanCount >= 2 && fans.length >= 2) {
          const i = rand(1, Math.min(fanCount, fans.length) - 1);
          fans.splice(i, 0, { name: a.nick, at: new Date(new Date(fans[i - 1].at).getTime() - 500).toISOString() });
        } else fans.unshift({ name: a.nick, at: new Date(Date.now() + rand(20, 90) * 1000).toISOString() });
        S.meta.followers = (S.meta.followers || 0) + 1;
        likeAsAlt(post, a.nick);
        const older = shuffle(S.posts.filter(p => p.authorType === "user" && acctOf(p) === "main" && p.id !== post.id && p.visibility !== "self" && p.visibility !== "friends")).slice(0, rand(1, 3));
        for (const p of older) likeAsAlt(p, a.nick);
        a.appeared = true; a.appearedAt = nowIso();
      } else if (Math.random() < 0.35) likeAsAlt(post, a.nick);
    }
    if (changed) saveCalts();
  }

  /** char 能不能主动私信：上一条是他发的、用户还没回，12 小时内不再来 */
  function charDmOk(ch) {
    const t = S.threads.find(x => x.peer.type === "char" && x.peer.charId === ch.id && (x.acct || "main") === curAcct());
    const last = t && t.messages[t.messages.length - 1];
    return !(last && last.from === "peer" && Date.now() - new Date(last.at || t.updatedAt).getTime() < 12 * 3600e3);
  }
  /** 他最近私信过的话：让 AI 别重复 */
  function charDmRecent(ch) {
    const t = S.threads.find(x => x.peer.type === "char" && x.peer.charId === ch.id && (x.acct || "main") === curAcct());
    const mine = t ? t.messages.filter(m => m.from === "peer").slice(-6).map(m => m.text) : [];
    return mine.length ? `${ch.name} 最近在微博私信里说过：「${mine.join(" / ").slice(0, 160)}」，这次换新的话题和说法，不要重复。` : "";
  }
  /** 掷骰子挑一个来私信的 char：15%，有特别关注的 25% 并优先挑他们 */
  function rollCharDm(pool, rate) {
    pool = pool.filter(charDmOk);
    const starred = pool.filter(c => isStarred(c.id));
    if (!pool.length || Math.random() >= (rate != null ? rate : starred.length ? 0.25 : 0.15)) return null;
    return shuffle(starred.length ? starred : pool)[0];
  }

  /** 发博后谁来私信：陌生人大号 30%（带热搜或公众人物 50%）、小号 20%；角色 15%，有特别关注的 25%，超话帖 10% */
  function planPostDms(post, { alt, sup, cast }) {
    if (post.visibility === "friends") return { line: "这次没有人私信用户，不要输出 ===私信===。" };
    const hot = topicsIn(post.text).some(hotItem);
    const stranger = Math.random() < (alt ? 0.2 : hot || S.meta.publicFigure ? 0.5 : 0.3);
    const kinds = [
      [sup ? "同一个超话的同好来搭话、找用户聊这个话题" : "看了这条博来搭话的同好（「姐妹你也去了吗」「求链接」「同款！」这种）", 4],
      ["之前在用户微博评论区杠过、吵过的路人：继续吵或者来道歉（没有吵过的人就换成来搭话的同好）", alt ? 0 : 1],
      ["求互粉、求回关的", 1], ["约稿、代购、小广告、刷粉这类营销号", 1],
      ["粉丝：表白、求回关、问近况", !alt && S.meta.publicFigure ? 3 : 0], ["黑粉：阴阳怪气", !alt && S.meta.publicFigure ? 0.5 : 0],
    ].filter(k => k[1] > 0);
    let r = Math.random() * kinds.reduce((a, k) => a + k[1], 0); const kind = kinds.find(k => (r -= k[1]) < 0) || kinds[0];
    const pick = rollCharDm(cast.filter(c => !alt || knowsAlt(c.id)), sup ? 0.1 : null);
    const lines = [
      stranger ? `这次要有 1 个陌生路人私信用户：${kind[0]}。1～3 条，一句一个块，短、口语，像真人。` : "",
      pick ? `这次 ${pick.name} 想私信用户（他不在评论区评论这条，改成私信，内容比较私人、公开说不方便，语气按人设）。1～4 条，一句一个块。${charDmRecent(pick)}` : "",
      !stranger && !pick ? "这次没有人私信用户，不要输出 ===私信===。" : !pick ? "角色这次都不私信。" : !stranger ? "路人这次都不私信。" : "",
    ];
    return { stranger, charId: pick && pick.id, line: lines.filter(Boolean).join("") };
  }

  /** char 转发了用户的博：给他生成一条真正的转发微博（主页、首页都看得到），转发列表里记下 postId 防重复 */
  function charRepostPost(src, r) {
    if (!r.charId || r.postId || !charById(r.charId) || src.visibility === "friends" || src.visibility === "self") return null;
    const a = authorOf(src); const acc = S.accounts[r.charId] || {};
    const base = src.repost && !src.repost.deleted ? src.repost : null;
    const post = {
      id: uid("wb"), scope: S.identity.id, authorType: "char", charId: r.charId, authorName: charNickname(r.charId),
      verified: acc.verified || "无", vip: !!acc.vip, source: "", createdAt: r.createdAt || nowIso(), text: (r.text || "").trim() || "转发微博", images: [],
      repost: base ? { ...base, chain: [{ name: a.name, text: src.text }, ...(base.chain || [])].slice(0, 6), viaPostId: src.id }
        : { author: a.name, text: src.text, images: src.images, postId: src.id, chain: [] },
      counts: { reposts: 0, comments: rand(0, 3), likes: rand(0, 20) }, liked: false, comments: [], commentsGenerated: false, origin: "repost",
    };
    r.postId = post.id;
    S.posts.push(post); savePost(post); S.allPostRows++;
    return post;
  }
  /** 旧数据：以前转发过但没生成转发微博的，打开他主页时补上 */
  function backfillCharReposts(charId) {
    for (const p of S.posts.filter(x => x.authorType === "user" && (x.reposts || []).some(r => r.charId === charId && !r.postId))) {
      let made = false;
      for (const r of p.reposts) if (r.charId === charId && charRepostPost(p, r)) made = true;
      if (made) savePost(p);
    }
  }

  /** 用户发博后：角色和路人的反应 */
  async function reactToUserPost(post) {
    if (post.visibility === "self" || !activeChars().length || post._genComments || post.reacted) return;
    post.reacted = true; post._genComments = true; savePost(post); rerenderDetail(post);
    // 超话帖：只有也逛这个超话的角色会来，特别关注的人偶尔撞见，其他人看不到
    const sup = post.superName;

    const altKnown = alt ? activeChars().filter(c => knowsAlt(c.id)) : [];

      || (post.text || "").includes(c.name) || (post.text || "").includes(charNickname(c.id))))).filter(() => Math.random() < 0.3).slice(0, 2) : [];
    const lurkers = sup && !alt ? superChars(sup) : [];
    const peekers = sup && !alt ? activeChars().filter(c => isStarred(c.id) && !lurkers.includes(c)) : [];
    const cast = alt ? [...altKnown.slice(0, 4), ...altStrangers] : sup ? [...lurkers, ...peekers].slice(0, 6) : pickCast(activeChars(), 6);

    const altPostLine = alt ? [
