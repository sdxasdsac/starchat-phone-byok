<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#EFE8D8"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <rect x="6" y="6" width="88" height="88" rx="18" fill="none" stroke="#7A8B78" stroke-width="2.5" stroke-dasharray="4 3"/>
  <!-- Cute cat with detective hat -->
  <ellipse cx="50" cy="58" rx="26" ry="24" fill="#FFFFFF" stroke="#333333" stroke-width="2.5"/>
  <!-- ears -->
  <polygon points="30,42 22,22 40,34" fill="#FFFFFF" stroke="#333333" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="70,42 78,22 60,34" fill="#FFFFFF" stroke="#333333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- inner ears -->
  <polygon points="30,38 25,26 37,34" fill="#FAD2D2"/>
  <polygon points="70,38 75,26 63,34" fill="#FAD2D2"/>
  <!-- hat -->
  <ellipse cx="50" cy="35" rx="16" ry="5" fill="#3B4856"/>
  <path d="M 40 35 Q 50 18 60 35 Z" fill="#3B4856"/>
  <!-- eyes -->
  <circle cx="42" cy="55" r="2.5" fill="#333333"/>
  <circle cx="58" cy="55" r="2.5" fill="#333333"/>
  <!-- blush -->
  <ellipse cx="36" cy="61" rx="4" ry="2" fill="#FCA5A5" opacity="0.7"/>
  <ellipse cx="64" cy="61" rx="4" ry="2" fill="#FCA5A5" opacity="0.7"/>
  <!-- mouth -->
  <path d="M 47 60 Q 50 63 53 60" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round"/>
  <!-- magnifying glass -->
  <circle cx="70" cy="68" r="8" fill="#D6EFFF" stroke="#4A6572" stroke-width="2.5"/>
  <line x1="76" y1="74" x2="84" y2="82" stroke="#8D6E63" stroke-width="4" stroke-linecap="round"/>
  <text x="50" y="90" font-size="10" font-weight="900" fill="#6B7F62" text-anchor="middle" font-family="-apple-system, sans-serif">谁是卧底</text>
</svg>