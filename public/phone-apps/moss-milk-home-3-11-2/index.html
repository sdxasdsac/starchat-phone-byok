 async function dine(host,tableId,who=[host],selection='all',invitation=false){let o=find(tableId,F.isTable,'餐桌'),ids=targets(who,host);F.ensure(s());if(!o.dishes.some(d=>!d.reserved&&(selection==='all'||d.id===selection)))throw new Error('餐桌上没有可食用的菜');for(let id of ids)free(id);let sim=E.snapshot(s()),plans=[];for(let id of ids){let plan=E.interaction(sim,o,id,'吃饭');if(plan.error)throw new Error('需要为'+name(id)+'留一把可到达的空餐椅：'+plan.error);let last=plan.route.at(-1)||sim.actors[id];Object.assign(sim.actors[id],last,{seatId:plan.seatId});plans.push({id,plan})}

 function floatMemoryMarkup(a){if(!HomeFloatMemory.native(a.characterId))return '<p class="muted">自建NPC只使用小窝日记，不读取别人的小手机记忆。</p>';let cfg=state.actors[a.id].life||{},data=bridge.floatMemory.cache.get(a.characterId),max=data?.max??200,n=Math.min(max,cfg.floatMemoryLimit??100);return `<div class="float-memory"><label>小手机近期记忆 · <output data-float-count="${a.id}">${n}</output> / ${max} 条</label><input type="range" min="0" max="${max}" value="${n}" data-life-actor="${a.id}" data-life-key="floatMemoryLimit" aria-label="${esc(a.name)}的小手机近期记忆条数"><p class="muted">默认100，0表示小窝不主动载入。近期记忆最多可读200项，区别于小窝日记。使用小手机默认接口时，宿主预设仍可能额外注入上下文。</p><button data-float-memory-refresh="${a.id}">读取可用记忆范围</button>${data?.error?`<p class="warn">${esc(data.error)}</p>`:data?`<p class="muted">已检测到 ${max} 项近期记忆</p>`:''}${[['floatCoreEnabled','额外载入小手机核心记忆'],['floatLongEnabled','额外载入小手机长期记忆'],['floatChatEnabled','额外载入原始聊天（可能与近期记忆重复）']].map(([k,label])=>`<label class="switch">${label}<input type="checkbox" data-life-actor="${a.id}" data-life-key="${k}" ${cfg[k]?'checked':''}></label>`).join('')}</div>`}
 function usageMarkup(){let d=bridge.meter.data,fmt=n=>Math.round(n||0).toLocaleString('zh-CN');return `<section class="life-section"><h3>Token与请求统计</h3><p data-token-totals>请求 ${fmt(d.requests)} 次 · 输入 ${fmt(d.input)} · 输出 ${fmt(d.output)} · 缓存命中 ${fmt(d.cached)}</p><p class="muted">合并请求只计一次；每位角色按人数分摊 token。接口返回usage时使用实际值，否则为估算（含 ${fmt(d.estimated)} 次估算）。小手机宿主可能额外注入预设，估算不等同账单。</p><div class="usage-list">${Object.values(d.roles).map(r=>`<div class="usage-row"><strong>${esc(r.name)}</strong><span>${fmt(r.rounds)} 轮 · 输入 ${fmt(r.input)} / 输出 ${fmt(r.output)}</span><small>合并 ${fmt(r.shared)} 轮 · 缓存 ${fmt(r.cached)} · 估算 ${fmt(r.estimated)} 轮</small></div>`).join('')||'<p class="muted">新版尚无请求，旧版本没有保存的token无法追溯。</p>'}</div><details><summary>最近请求用量</summary>${d.recent.slice(0,15).map(r=>`<p class="muted">${new Date(r.time).toLocaleTimeString()} · ${esc(r.roles.join('、'))} · 输入 ${fmt(r.input)} / 输出 ${fmt(r.output)} ${r.actual?'实际':'估算'}${r.failed?' · 失败请求':''}</p>`).join('')}</details><p id="voice-status" class="muted">${esc(voice.status||'语音默认开启，使用小手机各角色绑定；只读括号外台词，错误不会朗读。')}</p></section>`}
 function channelSettingsMarkup(){return E.roster(state).map(a=>{let c=E.lifeSettings(state,a.id);return `<div class="channel-card"><h4>${esc(a.name)}</h4>${floatMemoryMarkup(a)}<label class="switch">本地自动生活<input type="checkbox" data-life-actor="${a.id}" data-life-key="localEnabled" ${c.localEnabled?'checked':''}></label><label class="switch">定时API请求<input type="checkbox" data-life-actor="${a.id}" data-life-key="apiEnabled" ${c.apiEnabled?'checked':''}></label><label>气泡消失后间隔 · 5–3600 秒</label><input type="number" data-life-actor="${a.id}" data-life-key="interval" min="5" max="3600" value="${c.interval}"><div class="row"><label>偏好入睡小时<input type="number" data-life-actor="${a.id}" data-life-key="sleepHour" min="0" max="23" value="${c.sleepHour}"></label><label>偏好起床小时<input type="number" data-life-actor="${a.id}" data-life-key="wakeHour" min="0" max="23" value="${c.wakeHour}"></label></div><p class="channel-status" data-channel-status="${a.id}" role="status"></p><button data-request-actor="${a.id}" class="wide">只让 ${esc(a.name)} 想一轮</button></div>`}).join('')||'<p class="muted">邀请角色后，可在这里逐人设置。</p>'}
 function settingsMarkup(){let a=state.actors.char,failed=state.queue.filter(e=>e.status==='failed').length;return `<div class="life-intro"><span>共筑小窝 · 3.11.2</span><h2>同住与生活</h2><p id="connection-status">${esc(connectionStatus)}</p></div>`+mapsMarkup()+guestMarkup()+usageMarkup()+`<section class="life-section"><h3>控制人物</h3><div class="row actor-options">${actorButtons()}</div><label>我的名字</label><div class="row"><input id="my-name" maxlength="24" value="${esc(name('user'))}"><button data-do="rename">保存</button></div></section><section class="life-section"><h3>地图视角</h3><div class="row"><button data-map="plus">放大</button><button data-map="minus">缩小</button><button data-map="fit">全景</button><button data-map="grid">格子</button></div><button data-do="rooms" class="wide">房间与区域命名</button></section>`+environmentMarkup()+`<section class="life-section"><h3>邀请角色</h3><p class="muted">同一事件的空闲角色合并请求；各人的定时请求独立运行，思考及回复期间不重复触发。</p><div class="row"><select id="binding"><option value="">暂不邀请角色</option>${bridge.characters.map(c=>`<option value="${esc(c.id)}" ${c.id===state.binding?'selected':''}>${esc(c.name)}</option>`).join('')}${state.binding&&!bridge.characters.some(c=>c.id===state.binding)?`<option value="${esc(state.binding)}" selected>${esc(name('char'))}</option>`:''}</select><button data-do="bind">确认入住</button></div></section><section class="life-section"><h3>角色配置</h3><label class="switch">本地自由生活<input id="autonomy" type="checkbox" ${state.settings.autonomy?'checked':''}></label><p class="muted">此开关只控制本地作息，不影响各人的定时 API。定时从本轮最后气泡消失后开始计时，思考及回复期间忽略新事件；手动使用家具会让同房间目击者回应，走路不触发。角色是否行动由 API 自行选择。</p>${channelSettingsMarkup()}<label>上下文记忆 · <output id="memory-count">${state.settings.memoryLimit??100}</output> 条</label><input id="memory-limit" type="range" min="0" max="800" step="1" value="${state.settings.memoryLimit??100}" aria-label="上下文记忆条数"><p class="muted">每次调用从该角色已知的日记中载入最近 0–800 条，默认100。动作与聊天都含时间、地点、家具和目击者；过往记忆随角色一起去做客。</p><label>场景认知 · 每次调用优先应用</label><select id="roleplay-mode"><option value="real" ${state.settings.roleplayMode!=='game'?'selected':''}>真实生活 · 我真的住在这里</option><option value="game" ${state.settings.roleplayMode==='game'?'selected':''}>手机游戏 · 我在玩共筑小窝</option></select><label>补充场景提示词</label><textarea id="roleplay-notes" maxlength="4000" placeholder="补充角色对当前生活场景的理解">${esc(state.settings.roleplayNotes||'')}</textarea><label>查看 / 设置人物状态</label><select id="state-actor">${E.actorEntries(state).map(([id,p])=>`<option value="${id}">${esc(p.name)}</option>`).join('')}</select><label>心情</label><input id="actor-mood" maxlength="80" value="${esc(state.actors.user.mood||'平静')}"><label>身体状态</label><input id="actor-body" maxlength="160" value="${esc(state.actors.user.bodyState||'舒适')}"><label>当前关系 / 剧情节点</label><textarea id="actor-relations" maxlength="1200" placeholder="只填写已经成立的关系与剧情事实">${esc(state.actors.user.relationships||'')}</textarea><button data-do="actor-state-save" class="wide">保存状态与关系</button></section><section class="life-section"><h3>存档与请求记录</h3><div id="plan-card">${planMarkup()}</div><p class="muted">${failed} 条失败 · 只在前台自由行动</p><div class="action-list"><button data-do="retry">重试对话</button><button data-do="retry-save">重试保存</button><button data-do="export">导出存档</button><button data-do="import">导入存档</button></div><details><summary>本次 API 请求与返回</summary>${bridge.logs.map(l=>`<details><summary>${esc(l.status)} · ${l.groupCount||1} 人 · ${esc(l.participants?.map(p=>p.name).join('、')||'')} · ${l.characters} 字符</summary><p class="muted">本轮原话：${esc(l.userText||l.request?.currentEvent||'')}<br>人设：${esc((l.participants||[]).map(p=>p.name+' '+p.personaCharacters+'字').join('；'))}<br>实际返回：${esc(l.coverage?.received?.map(p=>p.name).join('、')||'等待返回')}${l.coverage?.missing?.length?'<br>API漏回：'+esc(l.coverage.missing.map(p=>p.name).join('、')):''}</p><pre class="debug">${esc(JSON.stringify(l,null,2))}</pre></details>`).join('')||'<p>尚无请求</p>'}</details></section>`}
 function journalMarkup(){let people=new Map([['user',name('user')]]);for(let a of E.residents(state,true))people.set(a.entityId,a.name);for(let j of state.journal)if(j.actorIdentity)people.set(j.actorIdentity,j.actorName||j.actorIdentity);if(!ui.journalActor)ui.journalActor=people.keys().next().value;let isChat=j=>j.kind==='chat'||j.role==='assistant'||!j.kind&&j.role==='user'&&/说|聊天/.test(j.text),items=state.journal.filter(j=>ui.journalFilter==='all'||ui.journalFilter==='chat'&&isChat(j)||ui.journalFilter==='system'&&!isChat(j)||ui.journalFilter==='actor'&&(j.actorIdentity===ui.journalActor||j.observerIdentity===ui.journalActor||!j.actorIdentity&&j.actor===ui.journalActor));return heading('OUR EVERYDAY STORY','小家的日记')+`<div class="segmented diary-tabs">${[['all','全部'],['system','系统'],['chat','聊天'],['actor','角色']].map(([k,n])=>`<button data-journal-filter="${k}" class="${ui.journalFilter===k?'active':''}">${n}</button>`).join('')}</div>${ui.journalFilter==='actor'?`<select id="journal-actor" aria-label="查看某个角色的动作与聊天">${[...people].map(([id,n])=>`<option value="${esc(id)}" ${ui.journalActor===id?'selected':''}>${esc(n)}</option>`).join('')}</select>`:''}<p class="muted">${items.length} 条记录 · API记忆上限 ${state.settings.memoryLimit??100} 条（同住 → 角色配置可调整）</p><div class="journal-actions"><button data-diary-clear="current" class="danger">清空本分类记录与本地记忆</button>${state.queue.some(e=>e.status==='failed')?'<button class="wide" data-do="retry">重试失败的对话</button>':''}</div>${[...items].reverse().slice(0,ui.journalLimit).map(j=>`<article class="journal-entry ${j.role==='error'?'error':''}"><small>${new Date(j.createdAt).toLocaleString()} · ${isChat(j)?'聊天':'系统'} · ${esc(j.mapName||'本地图')}${j.room?' / 房间'+j.room:''}</small><p>${esc(j.text)}</p>${j.observers?.length?`<small>在场知情：${esc(j.observers.map(o=>o.name).join('、'))}${j.activity?' · 当时在'+esc(j.activity):''}</small>`:''}</article>`).join('')||'<p class="empty">这里还没有记录。</p>'}${items.length>ui.journalLimit?'<button data-do="journal-more" class="wide">加载更早的记录</button>':''}`}
 function foldPanel(panel){for(let section of [...panel.querySelectorAll('section.life-section')]){if(section.classList.contains('deletion-card')||section.classList.contains('npc-editor'))continue;let heading=section.querySelector(':scope > h3,:scope > label');if(!heading)continue;let title=heading.textContent.trim();if(title.startsWith('世界 ·'))title='世界 · '+state.name;if(title.startsWith('地图场景'))title='地图 · '+(state.sceneMeta?.name||'初始地图');if(title.startsWith('当前地图'))title='角色 · '+E.roster(state).length+' 位在场';let details=document.createElement('details'),summary=document.createElement('summary');details.className='fold-card'+(section.classList.contains('chat-card')?' chat-card':'')+(section.classList.contains('memory-cards')?' memory-cards':'');details.dataset.fold=title.split(' · ')[0];summary.textContent=title;heading.remove();let body=document.createElement('div');body.className='fold-content';while(section.firstChild)body.appendChild(section.firstChild);details.append(summary,body);details.open=ui.folds[details.dataset.fold]??section.classList.contains('chat-card');section.replaceWith(details)} }

 function soloMarkup(){return `<div class="life-intro"><span>MY LITTLE HOME</span><h2>一个人，也自在。</h2><p>${esc(state.name)} · ${esc(state.sceneMeta?.name||'初始地图')}</p></div><section class="life-section"><p>独居也可以布置、使用家具、看电视、沐浴和保存小家。</p><div class="life-actions"><button data-tab="build">布置小家</button><button data-do="night">${E.phase(state)==='night'?'☀ 切换白天':'☾ 切换夜晚'}</button><button data-do="undo">↶ 撤销布置</button><button data-do="worlds">世界与地图</button></div></section>`}
 function deletionMarkup(){let d=ui.deleteTarget;return d?`<section class="life-section deletion-card"><h3>删除${d.kind==='map'?'地图':'世界'}「${esc(d.name)}」？</h3><p>${d.kind==='map'?'此地图装修和设定会被删除，居民回家；住所一并被删时迁到保留的地图。':'该世界的地图与本地角色存档会被删除，来自其它世界的访客会先回家。'}此操作不可撤销。</p><div class="row"><button data-do="delete-cancel">取消</button><button data-do="delete-confirm" class="danger">确认删除</button></div></section>`:''}
 function mapsMarkup(){let wid=state.worldId||'home',mid=state.mapId||'main',worlds={...(state.worlds||{}),[wid]:{name:state.name}},maps=E.sceneHomes(state),meta=state.sceneMeta||{name:'初始地图',premise:'',ownerIds:['user']},people=E.residents(state);return deletionMarkup()+`<section class="life-section"><span class="eyebrow">WORLDS & PLACES</span><h3>世界 · 独立存档</h3><div class="row"><select id="world-switch" aria-label="选择世界">${Object.entries(worlds).map(([id,w])=>`<option value="${esc(id)}" ${id===wid?'selected':''}>${esc(w.name)}</option>`).join('')}</select><button data-do="world-switch">进入世界</button></div><div class="row"><input id="world-name" value="${esc(state.name)}" maxlength="30" aria-label="世界名称"><button data-do="world-rename">改名</button><button data-delete-world="${esc(wid)}" class="danger">删除世界</button></div><div class="row"><input id="new-world-name" maxlength="30" placeholder="新世界名称"><button data-do="world-create">新建世界</button></div><p class="muted">不同世界是独立存档，可以各自拥有同一位 角色。同一世界内，你和每位角色只有一个位置。</p></section><section class="life-section"><h3>地图场景 · ${Object.keys(maps).length} 张</h3><div class="row"><select id="map-switch" aria-label="选择地图">${Object.entries(maps).map(([id,m])=>`<option value="${esc(id)}" ${id===mid?'selected':''}>${esc(m.home.sceneMeta?.name||'初始地图')} · ${E.roster(m.home).length} 人</option>`).join('')}</select><button data-do="map-switch">进入地图</button><button data-delete-map="${esc(mid)}" class="danger">删除</button></div><div class="row"><input id="new-map-name" maxlength="40" placeholder="例如：TA 的家、咖啡馆"><button data-do="map-create" class="primary">新增地图</button></div><label>当前地图名称</label><input id="scene-name" maxlength="40" value="${esc(meta.name)}"><label>是谁的家 / 场所归属</label><div class="owner-list"><label><input type="checkbox" data-map-owner="user" ${(meta.ownerIds||[]).includes('user')?'checked':''}>${esc(name('user'))}</label>${E.residents(state,true).filter(a=>a.homeWorldId===wid).map(a=>`<label><input type="checkbox" data-map-owner="${esc(a.entityId)}" ${(meta.ownerIds||[]).includes(a.entityId)?'checked':''}>${esc(a.name)}</label>`).join('')}</div><label>地图详细设定 · 每次 API 调用的场景前提</label><textarea id="scene-premise" maxlength="6000" placeholder="例如：这是林的家，靠海的旧公寓。用户只是来做客；林熟悉这里的一切。">${esc(meta.premise)}</textarea><button data-do="map-settings" class="primary wide">保存地图归属与设定</button><p class="muted">勾选为某人的家会把此地图设为 TA 的住所；不会复制角色。通过下面的居民列表邀请、回家或串门。</p><details><summary>定位地图视野</summary><div class="row"><input id="map-x" type="number" value="${state.actors.user.x}" aria-label="定位X"><input id="map-y" type="number" value="${state.actors.user.y}" aria-label="定位Y"><button data-do="map-jump">定位</button></div></details></section>`}
 function guestMarkup(){let wid=state.worldId||'home',mid=state.mapId||'main',cast=E.roster(state),people=E.residents(state),elsewhere=people.filter(a=>a.mapId!==mid),outsiders=E.residents(state,true).filter(a=>a.worldId!==wid),maps=E.sceneHomes(state);let inviteRow=a=>`<div class="resident-card"><strong>${esc(a.name)}</strong><small>${esc(a.worldName)} / ${esc(a.mapName)}</small><div class="row"><button data-invite-entity="${esc(a.entityId)}" data-from-world="${esc(a.worldId)}" data-from-map="${esc(a.mapId)}">邀请来做客</button><button data-visit-world="${esc(a.worldId)}" data-visit-map="${esc(a.mapId)}">去串门</button></div></div>`;return npcEditorMarkup()+`<section class="life-section"><span class="eyebrow">NEIGHBORS & VISITORS</span><h3>当前地图 · ${cast.length} 位角色</h3><p class="muted">角色各自使用独立的请求节奏与本地作息；地图归属、详细设定和做客身份每次随请求发送。空地图和独居都能正常生活。</p>${cast.map(a=>{let r=people.find(p=>p.id===a.id&&p.mapId===mid),home=r&&(r.homeWorldId!==wid||r.homeMapId!==mid);return `<div class="resident-card"><div class="guest-row"><strong>${esc(a.name)}${home?' · 做客中':''}</strong><button data-actor="${a.id}">控制</button><button data-guest-dress="${a.id}">捏人</button>${a.characterId.startsWith('manual:')||a.characterId==='custom'?`<button data-npc-edit="${a.id}">修改NPC</button>`:''}${home?`<button data-send-home="${esc(r.entityId)}">送 TA 回家</button>`:''}<button data-remove-guest="${a.id}" class="danger">${r?.homeWorldId!==wid?'送回来源':'移除居民'}</button></div>${r?.homeWorldId===wid?`<div class="row"><select data-resident-home="${esc(r.entityId)}" aria-label="${esc(a.name)}的住所">${Object.entries(maps).map(([id,m])=>`<option value="${esc(id)}" ${id===r.homeMapId?'selected':''}>${esc(m.home.sceneMeta?.name||'初始地图')}</option>`).join('')}</select><button data-set-home="${esc(r.entityId)}">设为住所</button></div>`:''}</div>`}).join('')||'<p class="muted">这里暂时只有你，可以独居，或去其它地图串门。</p>'}${elsewhere.length?'<h3>同世界其它地图的居民</h3>'+elsewhere.map(inviteRow).join(''):''}${outsiders.length?`<details><summary>邀请其它世界的居民做客</summ  async function talk(id,target,preferSofa=true){if(!E.actorPresent(state,target)||target===id)throw new Error('请选择另一位在场人物');let partnerLane=target==='user'?null:laneFor(target);if(motions[id]||motions[target]||partnerLane?.acting||partnerLane?.renovating)throw new Error(name(target)+'正在行动，等一下再交谈');let plan=E.conversation(reservationView(),id,target,preferSofa);if(plan.error)throw new Error(plan.error);let epoch=channelEpoch;if(partnerLane)partnerLane.acting=true;for(let p of plan.plans){let end=p.route.at(-1)||state.actors[p.actor];claims.set(p.actor,{...end,seatId:p.seatId,objectId:plan.sofa})}try{for(let p of plan.plans){if(epoch!==channelEpoch)return;await walk(p.actor,p.route,p.seatId)}for(let [who,other]of [[id,target],[target,id]]){let a=state.actors[who];a.activity='与'+name(other)+'交谈';a.activityObjectId=plan.sofa;a.talkPartner=other;a.talkUntil=Date.now()+90000;a.activitySince=new Date().toISOString();a.dir=E.faceDirection(a,state.actors[other]);if(who!=='user'){let l=laneFor(who);l.holdUntil=Date.now()+45000;l.nextLocal=l.holdUntil}}journal(name(id)+'和'+name(target)+(plan.sofa?'相邻坐在'+E.defs[state.objects.find(o=>o.id===plan.sofa).type].name+'上，':'站在一起，')+'面对面交谈。','event',{actor:id,action:'talk',furniture:plan.sofa});observationStep();save()}finally{for(let p of plan.plans)claims.delete(p.actor);if(partnerLane){partnerLane.acting=false;if(E.lifeSettings(state,target).apiEnabled)partnerLane.nextAPI=Date.now()+4000+Math.random()*5000}}return plan}

 async function executeAI(action,{notify=true,plan=null}={}){if(!action||typeof action.kind!=='string')throw new Error('动作格式无效');let who=action.actor||'char';if(state.actors[who]?.downed)throw new Error('人物已倒地，请先复活');if(!E.actorPresent(state,who))throw new Error('执行角色已离开这个世界');let id=action.id;if(plan&&typeof id==='string'&&Object.hasOwn(plan.refs,id))id=plan.refs[id];let o=state.objects.find(q=>q.id===id),text='',result={};
  const guard=()=>!plan||(plan.status==='running'&&plan.characterId===state.binding);
  async function workNear(target,kind){let work=E.workRoute(state,target,kind,who,action.workArea);if(work.error){let e=new Error(work.error);e.unreachable=true;throw e}await walk(who,work.route);return guard()}
  if(F.actionKinds.includes(action.kind)){await foodPlay.act(action,who);text=name(who)+'完成或开始了餐厨 / 背包操作';}
  else if(action.kind==='changeOutfit'){await changeOutfit(who,o,action.outfit);text=name(who)+'更换了衣服。';}
  else if(action.kind==='approach'){let a=E.approach(state,who);if(a.error)throw new Error(a.error);await walk(who,a.route);text=name(who)+'走到'+name('user')+'面前。';}
  else if(action.kind==='talk'){await talk(who,action.target||action.partner,action.preferSofa!==false);text=name(who)+'和'+name(action.target||action.partner)+'面对面交谈。';}
  else if(action.kind==='walk'){await walkTo(who,action.x,action.y,false);text=`${name(who)}走到（${action.x},${action.y}）。`;}
  else if(action.kind==='interact'){await interact(who,o,action.verb,false);text=`${name(who)}在${E.defs[o.type].name}旁${action.verb}。`;}
  else if(['place','move','delete','rotate'].includes(action.kind)){
   if(motions[who])throw new Error('这个角色还在走路');if(action.kind!=='place'&&!o)throw new Error('目标家具已不存在，修改或取消这份计划后再试');
   let type=action.kind==='place'?action.type:o.type;if(!E.defs[type])throw new Error('没有这种设施');let target=action.kind==='place'||action.kind==='move'?{...(o||{}),type,x:action.x,y:action.y,rot:Number.isInteger(action.rot)?action.rot:o?.rot||0}:action.kind==='rotate'?{...o,rot:(o.rot+1)%4}:o;
   if(!E.cells(target).every(c=>E.inside(c.x,c.y)))throw new Error('施工位置超出地图');
   let same=action.kind==='place'&&(E.defs[type].cat==='地板'?state.tiles[E.key(action.x,action.y)]===type:state.objects.some(q=>q.type===type&&q.x===action.x&&q.y===action.y&&q.rot===target.rot));
   if(!same){let risk=E.placementRisk(state,target,action.kind==='place'?undefined:id,action.kind);if(risk){let e=new Error(risk);e.unreachable=true;throw e}}
   if(same){text=`（${E.defs[type].name}已经在这格，保留原样）`;return{text}}
   ui.carry={actor:who,type,rot:target.rot||0};if(action.reason)bubble(who,String(action.reason).slice(0,150));if(!await workNear(target,action.kind)){ui.carry=null;return{paused:true}}await new Promise(r=>setTimeout(r,550));if(!guard()){ui.carry=null;return{paused:true}}ui.carry=null;let latestRisk=E.placementRisk(state,target,action.kind==='place'?undefined:id,action.kind);if(latestRisk){let e=new Error(latestRisk);e.unreachable=true;throw e}ui.placementPulse={x:target.x,y:target.y,at:performance.now()};checkpoint();
   if(action.kind==='delete'){E.removeObjects(state,[id]);result.furniture={id,type,name:E.defs[type].name,x:o.x,y:o.y,rotation:o.rot};text=`${name(who)}收起了${E.defs[type].name}。`;}
   else{let x=action.kind==='rotate'?o.x:action.x,y=action.kind==='rotate'?o.y:action.y,rot=target.rot;let r=E.place(state,type,x,y,rot,action.kind==='place'?undefined:id);if(r.error){history.pop();throw new Error(r.error)}result.id=r.object?.id;result.furniture={id:result.id,type,name:E.defs[type].name,x,y,rotation:rot};if(typeof action.ref==='string'&&/^[a-zA-Z0-9_-]{1,40}$/.test(action.ref))result.ref=action.ref;text=`${name(who)}${action.kind==='move'?'搬动':action.kind==='rotate'?'转动':'建造 / 铺设'}了${E.defs[type].name}（${x},${y}）。`;}
   state.actors[who].activity='布置小家';bubble(who,action.reason?String(action.reason).slice(0,150):'（'+text+'）');
  }else throw new Error('未知动作：'+action.kind);
  save();if(notify)event(text,who,action.kind==='interact'?'interaction':['walk','approach'].includes(action.kind)?'movement':'build',{action:action.kind,furniture:result.furniture||null});return{...result,text};
 }
