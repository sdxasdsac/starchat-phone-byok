<style>
:root{--blue:#315777;--blue2:#92a9bf;--line:#e5e9ed;--muted:#7c8792;--bg:#fff;--text:#17202a;--soft:#f4f6f8;--danger:#b84a4a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans KR",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
#app{height:100dvh;display:flex;flex-direction:column;background:#fff;overflow:hidden}.top{flex:none;padding-top:var(--ai-phone-app-bar-top,48px);background:var(--blue);color:#fff}.bar{height:50px;display:flex;align-items:center;gap:6px;padding:0 var(--ai-phone-app-bar-clear-right,88px) 0 10px}.bar button{border:0;background:transparent;color:inherit;width:35px;height:36px;display:grid;place-items:center;border-radius:10px}.mark{width:30px;height:30px;border-radius:7px;background:#fff;color:var(--blue);display:grid;place-items:center;font-weight:900;font-size:18px}.title{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spacer{flex:1}.langBtn{width:auto!important;padding:0 8px!important;font-weight:800}.searchBand{background:var(--blue2);padding:8px 13px 11px}.searchBox{display:flex;align-items:center;gap:6px;background:#fff;border-radius:9px;min-height:38px;padding-left:11px;color:#77838e}.searchBox input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#263747}.searchBox button{height:36px;border:0;border-left:1px solid #e6eaf0;background:#fff;color:var(--blue);font-weight:750;padding:0 12px;border-radius:0 9px 9px 0}.searchBox button:disabled{opacity:.55}
.main{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;background:#fff;padding-bottom:var(--ai-phone-app-safe-bottom,16px)}.categories{display:flex;gap:18px;overflow:auto;white-space:nowrap;padding:12px 16px 8px;border-bottom:1px solid var(--line);scrollbar-width:none}.categories button{border:0;background:transparent;padding:4px 0 7px;color:#626b73}.categories button.active{color:var(--blue);font-weight:800;border-bottom:2px solid var(--blue)}.postRow{width:100%;display:block;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;padding:15px 17px}.postTitle{display:block;color:#111;font-size:15px;font-weight:690;line-height:1.45}.postMeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:7px;color:#8d9196;font-size:11px}.cat{color:var(--blue);font-weight:750}.empty{padding:70px 24px;text-align:center;color:#8b949c}.hint{margin:0;padding:13px 17px;color:#677889;line-height:1.6;font-size:12px}.settingsList{padding-top:8px}.rowBtn,.modeRow,.checkRow{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:0 18px;border:0;border-bottom:1px solid #edf0f2;background:#fff;text-align:left;color:#202c37}.rowBtn .chev,.modeRow .selected{margin-left:auto;color:#8c99a4}.checkRow input{accent-color:var(--blue)}.sectionTitle{padding:14px 18px 7px;color:#8a949d;font-size:11px;font-weight:750;text-transform:uppercase}.field{display:grid;gap:6px;padding:10px 18px;border-bottom:1px solid #edf0f2;color:#566674;font-size:12px}.field input,.field textarea,.field select{width:100%;border:1px solid #d7e0e8;border-radius:9px;padding:10px;background:#fff;color:#17202a;outline-color:var(--blue)}.field textarea{min-height:90px;resize:vertical}.inlineActions{display:flex;gap:8px;padding:12px 18px}.primary,.secondary,.danger{min-height:40px;border-radius:9px;padding:0 14px;font-weight:720}.primary{border:0;background:var(--blue);color:#fff}.secondary{border:1px solid #cdd7df;background:#fff;color:var(--blue)}.danger{border:1px solid #e2b8b8;background:#fff;color:var(--danger)}.primary:disabled,.secondary:disabled{opacity:.5}.status{padding:10px 18px;color:#6f7e8b;font-size:12px;line-height:1.55}.status.ok{color:#347052}.status.bad{color:#a64b4b}
.detailHead{padding:16px 17px 12px;border-bottom:1px solid #e3e3e3}.detailTitle{font-size:17px;font-weight:780;line-height:1.45}.detailMeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;color:#8a8e93;font-size:11px;align-items:center}.detailActions{margin-left:auto;display:flex;gap:4px}.detailActions button{border:0;background:transparent;padding:2px 5px;color:#7f8b95}.body{padding:17px;border-bottom:1px solid #ddd;font-size:15px;line-height:1.72}.original,.translated{white-space:pre-wrap;overflow-wrap:anywhere}.foldBtn{display:block;width:100%;margin-top:7px;padding:7px 9px;border:0;border-radius:7px;background:#f1f3f5;color:#344251;text-align:left;white-space:pre-wrap}.repost{width:fit-content;max-width:100%;margin-top:4px;padding:4px 7px;background:#050505;color:#fff;font-weight:650;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.commentsHead{display:flex;align-items:center;padding:11px 17px;border-bottom:1px solid #dedede;color:#243e59;font-weight:800}.commentsHead button{margin-left:auto;border:0;border-radius:9px;background:#eef3f7;color:var(--blue);padding:7px 10px;font-size:12px;font-weight:750}.commentsHead button:disabled{opacity:.5}.comment{padding:12px 17px;border-bottom:1px solid #e7e7e7}.commentHead{font-weight:750}.commentTime{margin-left:7px;color:#a0a3a7;font-weight:500;font-size:11px}.opBadge{display:inline-block;margin-left:6px;padding:1px 5px;border:1px solid #7892a9;border-radius:5px;color:var(--blue);font-size:10px;font-weight:850;vertical-align:1px}.deleteComment{float:right;border:0;background:transparent;color:#9a9fa5;padding:0 3px}.commentBody{margin-top:6px;line-height:1.62}.composer{display:flex;align-items:center;gap:9px;flex:none;padding:9px 13px calc(9px + var(--ai-phone-app-safe-bottom,0px));border-top:1px solid #e7ebee;background:#fff}.composer input{flex:1;min-width:0;height:38px;padding:0 12px;border:1px solid #dde3e8;border-radius:20px;outline-color:var(--blue);background:#f8f9fb}.composer button{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:50%;background:var(--blue);color:#fff}.composer button:disabled{opacity:.45}.editor{padding:17px;display:grid;gap:13px}.editor label{display:grid;gap:6px;color:#52616e;font-size:12px}.editor input,.editor textarea,.editor select{width:100%;border:1px solid #d7e0e8;border-radius:9px;padding:10px;color:#17202a;background:#fff}.editor textarea{min-height:110px;resize:vertical}.inlineImage{margin-top:13px}.inlineImage img{display:block;max-width:100%;max-height:420px;object-fit:contain;border-radius:5px}.textCard{display:flex;flex-direction:column;justify-content:center;min-height:150px;width:min(100%,290px);padding:22px 19px;border:1px solid #d9dce0;background:#f6f5f2;color:#222;font-size:16px;font-weight:700;line-height:1.65;white-space:pre-wrap}.overlay{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:#0008}.dialog{width:100%;max-width:360px;max-height:82%;overflow:auto;background:#fff;border-radius:15px;padding:16px;box-shadow:0 20px 50px #0004}.dialogHead{display:flex;align-items:center;justify-content:space-between;font-weight:800;margin-bottom:12px}.dialogHead button{border:0;background:transparent;font-size:20px}.recipient button{width:100%;min-height:48px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left}.imageList{display:grid;gap:8px;margin-bottom:10px}.imageItem{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid #e1e6ea;border-radius:9px}.imageItem span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.smallBtn{border:0;border-radius:7px;background:#f0f3f6;color:var(--blue);padding:6px 8px}.modalField{display:grid;gap:6px;margin-top:12px;color:#596977;font-size:12px}.modalField input,.modalField textarea{border:1px solid #d7e0e8;border-radius:9px;padding:10px;resize:vertical}.modalField textarea{min-height:70px}.fileRow{display:flex;gap:8px;margin-top:10px}.fileRow button{flex:1}.toastFallback{position:fixed;left:50%;bottom:calc(18px + var(--ai-phone-app-safe-bottom,0px));transform:translateX(-50%);z-index:100;background:#20252a;color:#fff;border-radius:999px;padding:9px 13px;font-size:12px;max-width:82%;text-align:center;box-shadow:0 8px 24px #0003}
@keyframes theqooRefreshSpin{to{transform:rotate(360deg)}}
.refreshSpin{display:inline-block;animation:theqooRefreshSpin .9s linear infinite}
.loadMoreComments{display:block;width:calc(100% - 34px);margin:16px 17px 22px;padding:12px;border:1px solid #d8e2ea;border-radius:9px;background:#f5f8fa;color:var(--blue);font-weight:750}.loadMoreComments:disabled{opacity:.55}
</style>

<body>
<div id="app"></div>
<script>
(function(){
'use strict';
const A=window.AiPhone;
const CATS=['전체','HOT','뉴스','정보','생활','잡담','유머','뷰티','영화·방송','아이돌'];
const CAT_ZH={'전체':'全部','HOT':'HOT','뉴스':'新闻','정보':'资讯','생활':'生活','잡담':'闲谈','유머':'幽默','뷰티':'美妆','영화·방송':'影视','아이돌':'偶像'};
const MODES=['original','folded','repost'];
const MODE_ZH={original:'全是韩文',chinese:'中文',folded:'折叠翻译',repost:'搬运风翻译'};
const MODE_KO={original:'한국어만',chinese:'중국어',folded:'접기 번역',repost:'번역본 스타일'};
const allowedTranslationHosts=new Set(['api.openai.com','api.deepseek.com','openrouter.ai','api.siliconflow.cn','api.moonshot.cn','ark.cn-beijing.volces.com','api.minimax.chat','api.x.ai','api.groq.com','api.together.xyz','api.fireworks.ai']);
let prefs={id:'prefs-main',uiLanguage:'ko',translationEnabled:true,translationMode:'repost',worldBookIds:[],includeCalendar:false,translator:{enabled:false,baseUrl:'https://api.openai.com/v1',apiKey:'',model:'gpt-4.1-mini',proxy:true}};
let posts=[],threads={},worldBooks=[],characters=[];
let page='home',previousPage='home',selectedId=null,category='전체',keyword='',busy=false,busyKind='',commentBusy=false,moreCommentsBusy=false,publishing=false,shareOpen=false,imageOpen=false,editor={category:'잡담',title:'',body:''},commentText='',openTranslations={};
const root=document.getElementById('app');
async function keepGeneratingInBackground(active){try{if(typeof A.app.setBackgroundActivity==='function')await A.app.setBackgroundActivity(active);}catch(e){/* Older 小手机 hosts do not support background activity. */}}
const uid=(p='tq')=>p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,9);
const zh=()=>prefs.uiLanguage==='zh'; const t=(ko,cn)=>zh()?cn:ko;
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function toast(msg){try{A.ui.toast(msg);}catch(e){const el=document.createElement('div');el.className='toastFallback';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2200);}}
async function getPrefs(){const rows=await A.db.list('prefs',{limit:10});const found=rows.find(x=>x.id==='prefs-main')||rows[0];if(found){prefs={...prefs,...found,translator:{...prefs.translator,...(found.translator||{})}};prefs.translationEnabled=found.translationEnabled!==false;if(prefs.translationMode==='chinese')prefs.translationMode='repost';}else await A.db.create('prefs',prefs);}
async function savePrefs(){const rows=await A.db.list('prefs',{limit:10});const found=rows.find(x=>x.id==='prefs-main')||rows[0];if(found)await A.db.update('prefs',found.id,prefs);else await A.db.create('prefs',prefs);}
async function loadData(){
  await getPrefs();
  try{const wb=await A.world.list({includeEntries:true});worldBooks=Array.isArray(wb?.books)?wb.books:[];}catch(e){worldBooks=[];}
  try{characters=await A.characters.list();if(!Array.isArray(characters))characters=[];}catch(e){characters=[];}
  const ps=await A.db.list('posts',{limit:200});posts=ps.sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));
  const ts=await A.db.list('threads',{limit:200});threads={};for(const x of ts)threads[x.postId]={...x,comments:Array.isArray(x.comments)?x.comments:[]};
  if(!posts.length)await seedDemo();
}
async function seedDemo(){const now=Date.now();const demo=[
 {id:'demo_1',category:'생활',titleOriginal:'퇴근하고 편의점 들렀는데 신상 과자 생각보다 괜찮음',titleTranslated:'下班后顺路去了便利店，新出的零食比想象中好吃',bodyOriginal:'패키지만 보고 샀는데 너무 달지도 않고 커피랑 먹기 딱 좋더라. 재구매할 듯.',bodyTranslated:'本来只是看包装买的，结果没有特别甜，配咖啡刚刚好，感觉会回购。',createdAt:now-18*60000,views:4312,favorite:false,authoredByUser:false,images:[]},
 {id:'demo_2',category:'잡담',titleOriginal:'요즘 다들 잠 몇 시간 자?',titleTranslated:'大家最近都睡几个小时？',bodyOriginal:'나는 평일엔 여섯 시간도 못 자는 날이 많아서 주말에 몰아서 자는데 이게 맞나 싶음 ㅋㅋ',bodyTranslated:'我工作日经常连六小时都睡不到，所以周末会补觉，但总觉得这样是不是不太对哈哈。',createdAt:now-49*60000,views:8910,favorite:false,authoredByUser:false,images:[]}
 ];
 for(const p of demo){await A.db.create('posts',p);await A.db.create('threads',{id:'thread_'+p.id,postId:p.id,comments:[]});}
 posts=demo;threads={demo_1:{id:'thread_demo_1',postId:'demo_1',comments:[]},demo_2:{id:'thread_demo_2',postId:'demo_2',comments:[]}};
}
function commentsOf(postId){return threads[postId]?.comments||[];}
function selected(){return posts.find(p=>p.id===selectedId)||null;}
async function updatePost(id,patch){const p=posts.find(x=>x.id===id);if(!p)return;Object.assign(p,patch);await A.db.update('posts',id,patch);}
async function ensureThread(postId){if(threads[postId])return threads[postId];const row={id:'thread_'+postId,postId,comments:[]};const saved=await A.db.create('threads',row);threads[postId]=saved;return saved;}
async function saveThread(postId){const th=await ensureThread(postId);const comments=(th.comments||[]).slice(-300);th.comments=comments;await A.db.update('threads',th.id,{comments});}
function textView(key,original,translated){const o=esc(original),z=esc(translated||original);if(!prefs.translationEnabled)return `<div class="translated">${z}</div>`;const mode=prefs.translationMode;if(mode==='folded'){const open=openTranslations[key]!==false;return `<div class="original">${o}</div><button class="foldBtn" data-action="toggle-translation" data-key="${esc(key)}">${open?z:t('중국어 번역 보기','查看中文翻译')}</button>`;}if(mode==='repost')return `<div class="original">${o}</div><div class="repost">${z}</div>`;return `<div class="original">${o}</div>`;}
function top(titleText,homeSearch){return `<header class="top"><div class="bar"><button data-action="back" aria-label="back">‹</button>${page==='home'?'<div class="mark">T</div>':''}<div class="title">${esc(titleText)}</div><div class="spacer"></div><button class="langBtn" data-action="toggle-lang">${zh()?'한':'中'}</button>${page==='home'?`<button data-action="feed-refresh" aria-label="${esc(t('새로고침','刷新'))}" ${busy?'disabled':''}><span class="${busyKind==='refresh'?'refreshSpin':''}">↻</span></button><button data-action="new-post" aria-label="new post">✎</button><button data-action="open-settings" aria-label="settings">⚙</button>`:''}</div>${homeSearch?`<div class="searchBand"><div class="searchBox"><span>⌕</span><input id="searchInput" value="${esc(keyword)}" placeholder="${esc(t('검색어를 입력하세요','输入关键词后搜索'))}"><button data-action="search-posts" ${busy?'disabled':''}>${busyKind==='search'?t('검색 중…','搜索中…'):t('검색','搜索')}</button></div></div>`:''}</header>`;}
function render(){const p=selected();let html='';
 if(page==='home'){html=top('theqoo',true)+`<main class="main"><nav class="categories">${CATS.map(c=>`<button class="${category===c?'active':''}" data-action="cat" data-value="${c}">${zh()?CAT_ZH[c]:c}</button>`).join('')}</nav>${renderPostList(dedupePosts(posts).filter(x=>category==='전체'||x.category===category))}</main>`;}
 else if(page==='detail'&&p){const cs=commentsOf(p.id),pending=cs.some(c=>c.authoredByUser&&c.pendingReply);html=top(zh()?(CAT_ZH[p.category]||p.category):p.category,false)+`<main class="main" id="detailScroll"><section class="detailHead"><div class="detailTitle">${textView('title_'+p.id,p.titleOriginal,p.titleTranslated)}</div><div class="detailMeta"><span>${t('무명의 더쿠','匿名用户')}</span><span>·</span><span>${new Date(p.createdAt).toLocaleString(zh()?'zh-CN':'ko-KR')}</span><span>·</span><span>${t('조회','浏览')} ${Number(p.views||0).toLocaleString()}</span><span class="detailActions"><button data-action="images">▧</button><button data-action="edit-post">✎</button><button data-action="delete-post">⌫</button><button data-action="share">↗</button><button data-action="favorite">${p.favorite?'★':'☆'}</button></span></div></section><section class="body">${textView('body_'+p.id,p.bodyOriginal,p.bodyTranslated)}${renderImages(p)}</section><div class="commentsHead"><span>${t('댓글','评论')} ${cs.length}</span></div>${cs.map((c,i)=>renderComment(p,c,i)).join('')||`<div class="empty">${t('아직 댓글이 없습니다.','还没有评论。')}</div>`}${cs.length?`<button class="loadMoreComments" data-action="load-more-comments" ${moreCommentsBusy||busy||pending?'disabled':''}>${moreCommentsBusy?t('댓글 불러오는 중…','加载评论中…'):pending?t('다음 새로고침 후 이용 가능','下次刷新后可查看更多评论'):t('댓글 더 보기','查看更多评论')}</button>`:''}</main><form class="composer" id="commentForm"><input id="commentInput" value="${esc(commentText)}" placeholder="${esc(prefs.translationEnabled?t('댓글을 입력하세요…','写下评论…中文或韩文都可以'):t('중국어로 댓글을 입력하세요…','写下评论…关闭翻译时请直接输入中文'))}"><button type="submit" ${commentBusy||moreCommentsBusy?'disabled':''}>↑</button></form>`;}
 else if(page==='settings'){html=top(t('설정','设置'),false)+`<main class="main"><div class="settingsList"><button class="rowBtn" data-action="my">☆ ${t('마이','我的')}<span class="chev">›</span></button><button class="rowBtn" data-action="world">▣ ${t('세계관','世界书')}<span class="chev">›</span></button><button class="rowBtn" data-action="translation">文 ${t('번역 설정','翻译设置')}<span class="chev">›</span></button><button class="rowBtn" data-action="sources">◫ ${t('연동 설정','内容关联')}<span class="chev">›</span></button></div></main>`;}
 else if(page==='my'){html=top(t('마이','我的'),false)+`<main class="main"><div class="settingsList"><button class="rowBtn" data-action="favorites">★ ${t('스크랩','我的收藏')}<span class="chev">›</span></button><button class="rowBtn" data-action="published">✎ ${t('내 글','我的发布')}<span class="chev">›</span></button></div></main>`;}
 else if(page==='favorites'){html=top(t('스크랩','我的收藏'),false)+`<main class="main">${renderPostList(posts.filter(x=>x.favorite))}</main>`;}
 else if(page==='published'){html=top(t('내 글','我的发布'),false)+`<main class="main">${renderPostList(posts.filter(x=>x.authoredByUser))}</main>`;}
 else if(page==='world'){html=top(t('세계관','世界书'),false)+`<main class="main"><p class="hint">${t('선택한 세계관만 이 포럼의 글 생성에 사용됩니다.','只使用这里勾选的世界书生成论坛内容，不默认继承其他世界书。')}</p>${worldBooks.length?worldBooks.map(b=>`<label class="checkRow"><input type="checkbox" data-action="world-toggle" data-id="${esc(b.id)}" ${prefs.worldBookIds.includes(b.id)?'checked':''}><span>${esc(b.name||'未命名世界书')}</span></label>`).join(''):`<div class="empty">${t('등록된 세계관이 없습니다.','尚无世界书。')}</div>`}</main>`;}

async function worldContext(){if(!prefs.worldBookIds.length)return'';const chosen=worldBooks.filter(b=>prefs.worldBookIds.includes(b.id));let out=[];for(const b of chosen){let lines=(b.entries||[]).filter(x=>!x.disable&&!x.disabled).map(x=>String(x.content||'').trim()).filter(Boolean);out.push((b.name||'世界书')+'：'+lines.join('；'));}return out.join('\n').slice(0,9000);}
async function calendarContext(){if(!prefs.includeCalendar)return'';const now=Date.now(),min=new Date(now-7*86400000).toISOString().slice(0,10),max=new Date(now+35*86400000).toISOString().slice(0,10),lines=[];const owners=[{ownerType:'user',ownerId:'self',name:'用户'},...characters.slice(0,30).map(c=>({ownerType:'character',ownerId:c.id,name:c.name||'角色'}))];for(const o of owners){try{const r=await A.calendar.read({ownerType:o.ownerType,ownerId:o.ownerId,includeAll:true});const plans=Array.isArray(r?.plans)?r.plans:(r?.plan?[r.plan]:[]);for(const pl of plans){for(const it of (pl.items||[])){if(it.date>=min&&it.date<=max)lines.push(`日历(${o.name}) ${it.date}${it.startTime?' '+it.startTime:''}: ${String(it.title||'').slice(0,100)}${it.location?' @ '+String(it.location).slice(0,50):''}`);}}}catch(e){}}return lines.slice(0,24).join('；');}
function jsonFromText(raw){const s=String(raw||''),a=s.indexOf('{'),b=s.lastIndexOf('}');if(a<0||b<=a)throw new Error('AI 没有返回有效 JSON');return JSON.parse(s.slice(a,b+1));}
async function aiChat(system,user){const r=await A.ai.chat({messages:[{role:'system',content:system},{role:'user',content:user}],timeoutMs:120000});return r?.text||r?.content||r?.message||'';}
function topicText(v){return String(v||'').normalize('NFKC').toLowerCase().replace(/[\p{P}\p{S}\s]/gu,'');}
function topicSimilarity(a,b){a=topicText(a);b=topicText(b);if(!a||!b)return 0;if(a===b)return 1;const grams=v=>v.length<2?[v]:Array.from({length:v.length-1},(_,i)=>v.slice(i,i+2));const x=grams(a),y=grams(b),set=new Map();for(const v of x)set.set(v,(set.get(v)||0)+1);let hits=0;for(const v of y){const n=set.get(v)||0;if(n){hits++;set.set(v,n-1);}}return 2*hits/(x.length+y.length);}
function sameTopic(a,b){if(a.authoredByUser||b.authoredByUser)return false;return topicSimilarity(a.topicKey,b.topicKey)>=.72||topicSimilarity(a.titleTranslated,b.titleTranslated)>=.7||topicSimilarity(a.titleOriginal,b.titleOriginal)>=.76;}
function dedupePosts(list){const ordered=[...list].sort((a,b)=>Number(!!b.favorite)-Number(!!a.favorite)||Number(b.createdAt||0)-Number(a.createdAt||0)),kept=[];for(const p of ordered)if(p.authoredByUser||!kept.some(x=>sameTopic(p,x)))kept.push(p);return kept.sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));}

    const comments=Array.isArray(r.comments)?r.comments.slice(0,10).map(x=>{const text=translationEnabled?String(x?.original||'').trim():String(x?.text||x?.translated||x?.original||'').trim();return {id:uid('c'),original:text.slice(0,240),translated:translationEnabled?String(x?.translated||text).slice(0,280):text.slice(0,280),createdAt:now,authoredByUser:false,authoredByOP:cat!=='뉴스'&&cat!=='정보'&&x?.isOP===true};}).filter(x=>x.original):[];
    if(comments.length!==10)continue;
    const p={id:uid('post'),category:cat,topicKey:String(r.topicKey||r.titleTranslated||title).slice(0,140),titleOriginal:translationEnabled?title.slice(0,180):title.slice(0,220),titleTranslated:translationEnabled?String(r.titleTranslated||title).slice(0,220):title.slice(0,220),bodyOriginal:translationEnabled?body.slice(0,1200):body.slice(0,1400),bodyTranslated:translationEnabled?String(r.bodyTranslated||body).slice(0,1400):body.slice(0,1400),createdAt:now-accepted.length*300000,views:plan.hot?Math.max(12000,Number(r.views)||12000):Math.max(20,Number(r.views)||Math.floor(800+Math.random()*8000)),favorite:false,authoredByUser:false,images:Array.isArray(r.imageTexts)&&cat!=='아이돌'?r.imageTexts.slice(0,1).map(x=>{const text=typeof x==='string'?x:(x?.text||x?.translated||x?.original||'');return {id:uid('img'),kind:'text',originalText:String(text).slice(0,600),translatedText:String(text).slice(0,600)}}).filter(x=>x.originalText):[]};
    if([...accepted,...existing].some(x=>sameTopic(p,x)))continue;
    accepted.push({...p,comments});remaining--;
   }
  }
  if(plan.hot&&remaining)throw new Error('HOT 话题不足，请重试刷新');
 }
 if(accepted.length<2)throw new Error('生成帖子不足，请重试');
 for(const {comments,...p} of accepted){await A.db.create('posts',p);const th={id:'thread_'+p.id,postId:p.id,comments};await A.db.create('threads',th);threads[p.id]=th;}
 posts=[...accepted.map(({comments,...p})=>p),...posts].slice(0,120);category='전체';return accepted.length;
}
async function searchPosts(){
 if(busy)return;const term=keyword.trim();if(!term){toast(t('검색어를 입력하세요.','请输入关键词后再搜索。'));return;}
 busy=true;busyKind='search';render();try{await keepGeneratingInBackground(true);const n=await generatePostBatch(term);toast(`${t('검색 결과','已生成搜索结果')} ${n}`);}catch(e){toast(e.message||'搜索生成失败');}finally{busy=false;busyKind='';render();await keepGeneratingInBackground(false);}
}
async function loadMoreComments(){
 const p=selected();if(!p||busy||moreCommentsBusy||commentBusy)return;
 const th=await ensureThread(p.id);if(th.comments.some(c=>c.authoredByUser&&c.pendingReply)){toast(t('다음 새로고침 후 이용 가능합니다.','下次刷新后可查看更多评论。'));return;}
 busy=true;busyKind='comments';moreCommentsBusy=true;render();
 try{
  await keepGeneratingInBackground(true);
  const translationEnabled=prefs.translationEnabled!==false,world=await worldContext();
  const recent=th.comments.slice(-35).map(c=>({text:translationEnabled?c.original:(c.translated||c.original),isOP:!!c.authoredByOP,user:!!c.authoredByUser}));
  const schema=translationEnabled?'{"comments":[{"original":"韩文","translated":"中文","isOP":false}]}':'{"comments":[{"text":"中文","isOP":false}]}';
  const prompt=`韩国匿名论坛 theqoo 的帖子继续展开评论。只参考勾选的世界书：${world||'无'}。分类：${p.category}。作者是用户：${p.authoredByUser?'是':'否'}。新闻与资讯的 AI 评论不能冒充楼主；用户发的帖子也不能由 AI 冒充楼主。其他帖子可以偶尔有楼主参与。匿名网友可以自然吐槽、补充、争论，不要机械重复已经出现的评论。新增恰好 10 条不同的评论，不替用户发言，也不要回应尚在等待下次刷新的用户评论。${translationEnabled?'每条同时给出自然韩文 original 和准确中文 translated。':'只输出中文 text，保留韩网翻译腔。'}只输出 JSON：${schema}。`;
  const raw=await aiChat(prompt,JSON.stringify({title:translationEnabled?p.titleOriginal:(p.titleTranslated||p.titleOriginal),body:translationEnabled?p.bodyOriginal:(p.bodyTranslated||p.bodyOriginal),recentComments:recent})),data=jsonFromText(raw);
  const arr=Array.isArray(data.comments)?data.comments.slice(0,10):[];
  const old=new Set(th.comments.map(c=>topicText(c.translated||c.original))),seen=new Set(),made=[];
  for(const x of arr){const original=translationEnabled?String(x?.original||'').trim():String(x?.text||x?.translated||x?.original||'').trim(),translated=translationEnabled?String(x?.translated||original).trim():original,key=topicText(translated);if(!original||!key||old.has(key)||seen.has(key))continue;seen.add(key);made.push({id:uid('c'),original:original.slice(0,240),translated:translated.slice(0,280),createdAt:Date.now(),authoredByUser:false,authoredByOP:!p.authoredByUser&&p.category!=='뉴스'&&p.category!=='정보'&&x?.isOP===true});}
  if(made.length!==10)throw new Error('评论不足 10 条，请重试');
  th.comments.push(...made);await saveThread(p.id);toast(t('댓글 10개를 더 불러왔습니다.','已加载 10 条评论'));
 }catch(e){toast(e.message||'加载评论失败');}finally{moreCommentsBusy=false;busy=false;busyKind='';render();await keepGeneratingInBackground(false);}
}
async function processPendingReplies(){
 let total=0,handled=0;const world=await worldContext(),translationEnabled=prefs.translationEnabled!==false;
 for(const p of posts){
  const th=threads[p.id];if(!th||!Array.isArray(th.comments))continue;
  const pending=th.comments.filter(c=>c.authoredByUser===true&&c.pendingReply===true);if(!pending.length)continue;
  const pendingIds=new Set(pending.map(c=>c.id)),count=5+Math.floor(Math.random()*4);
  const recent=th.comments.slice(-24).map(c=>({id:c.id,text:translationEnabled?c.original:(c.translated||c.original),user:c.authoredByUser===true,isOP:!!((p.authoredByUser&&c.authoredByUser)||c.authoredByOP===true),pending:pendingIds.has(c.id)}));
  const languageRule=translationEnabled?'每条新增评论输出自然韩语 original 和准确中文 translated。':'每条新增评论只输出中文 text，不要输出韩文；中文保留韩网翻译腔和论坛语感。';
  const schema=translationEnabled?'{"comments":[{"original":"韩文","translated":"中文","isOP":false}]}':'{"comments":[{"text":"中文","isOP":false}]}';
  const system=`你在模拟韩国匿名论坛 theqoo。用户之前在这篇帖子里留下了匿名评论，但论坛不是即时聊天；只有本次首页刷新时，其他网友才陆续看到并继续讨论。只允许参考用户勾选的世界书：${world||'无'}。本次恰好新增 ${count} 条评论，不能替用户发言。帖子作者是否为用户：${p.authoredByUser?'是':'否'}。帖子分类：${p.category}。recentComments 中 user=true 是用户本人发过的匿名评论；pending=true 是这次刷新前尚未被网友回应的用户评论；isOP=true 表示该条确实来自本帖原楼主。只有帖子作者也是用户时，用户本人发出的评论才属于楼主发言。
评论区不要求一片和谐，可以自然出现吐槽、反驳、争论、阴阳怪气、风凉话、互相抬杠、小规模吵架，也可以有人认真补充，不要机械制造冲突。具体圈内梗和人物关系仍以世界书为准。
如果分类是 뉴스 或 정보：正文来源虽然偏正经，但评论仍可自由发挥；AI 新增评论绝不能冒充原楼主，isOP 必须全部 false。
如果是其他分类且帖子作者不是用户：AI 可以让原楼主偶尔回来匿名补充或回复，并用 isOP=true 标记；생활 类可以相对积极，其他分类自然决定，也可以没有。帖子作者是用户时，AI 绝不能替用户生成楼主回复。
新增评论可以回应 pending 评论，也可以自然延伸帖子原有讨论；不要让所有评论都机械地直接回复同一句。${languageRule} 只输出 JSON：${schema}。`;
  try{
   const raw=await aiChat(system,JSON.stringify({title:translationEnabled?p.titleOriginal:(p.titleTranslated||p.titleOriginal),body:translationEnabled?p.bodyOriginal:(p.bodyTranslated||p.bodyOriginal),recentComments:recent})),data=jsonFromText(raw),arr=Array.isArray(data.comments)?data.comments.slice(0,count):[];
   const made=[];
   for(const x of arr){const text=translationEnabled?String(x?.original||'').trim():String(x?.text||x?.translated||x?.original||'').trim();if(!text)continue;made.push({id:uid('c'),original:text.slice(0,240),translated:translationEnabled?String(x?.translated||text).slice(0,280):text.slice(0,280),createdAt:Date.now(),authoredByUser:false,authoredByOP:(!p.authoredByUser&&p.category!=='뉴스'&&p.category!=='정보'&&x?.isOP===true)});}
   if(made.length<5)continue;
   th.comments.push(...made);total+=made.length;th.comments.forEach(c=>{if(pendingIds.has(c.id))c.pendingReply=false;});await saveThread(p.id);handled++;
  }catch(e){}
 }
 return {total,handled};
}
async function feedRefresh(){
 if(busy)return;busy=true;busyKind='refresh';render();let created=0,replies={total:0,handled:0},errors=[];
 try{await keepGeneratingInBackground(true);try{created=await generatePostBatch('');}catch(e){errors.push(e.message||'随机帖子生成失败');}try{replies=await processPendingReplies();}catch(e){errors.push(e.message||'评论处理失败');}
  if(errors.length&&created===0&&replies.total===0)toast(errors[0]);else toast(`${t('새 글','新帖子')} ${created} · ${t('새 댓글','新增回复')} ${replies.total}`);
 }finally{busy=false;busyKind='';render();await keepGeneratingInBackground(false);}
}
async function translateTexts(map){const entries=Object.entries(map).filter(([,v])=>String(v||'').trim());if(!entries.length)throw new Error('没有需要翻译的文字');if(prefs.translationEnabled===false)return Object.fromEntries(entries.map(([k,v])=>[k,{ko:String(v),zh:String(v)}]));const tr=prefs.translator||{};if(tr.enabled&&tr.baseUrl&&tr.apiKey&&tr.model){try{return await translateCustom(entries,tr);}catch(e){toast(t('독립 번역 API 실패, 채팅 API로 전환했습니다.','独立翻译 API 失败，已回退聊天 API'));}}return translateChat(entries);}
async function translateCustom(entries,tr){const base=String(tr.baseUrl).trim();let u=new URL(base);if(!allowedTranslationHosts.has(u.hostname))throw new Error('此域名不在发布包网络白名单');let endpoint=base;if(!/\/chat\/completions\/?$/.test(endpoint)){endpoint=endpoint.replace(/\/$/,'');if(!/\/v1$/.test(endpoint))endpoint+='/v1';endpoint+='/chat/completions';}const system='你是中韩双向翻译器。输入可能是中文、韩文或中韩混合。必须保留语气、网络用语、表情和换行。对每个字段输出 ko 与 zh；ko 是自然韩语，zh 是自然中文。不要解释。只输出 JSON：{"result":{"字段":{"ko":"...","zh":"..."}}}。';const user=JSON.stringify(Object.fromEntries(entries));const res=await A.network.fetch({url:endpoint,method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tr.apiKey},body:{model:tr.model,messages:[{role:'system',content:system},{role:'user',content:user}],temperature:0.2},proxy:tr.proxy!==false,timeoutMs:90000});if(!res?.ok)throw new Error(res?.text||'独立 API 请求失败');const data=res.json||JSON.parse(res.text||'{}');const content=data?.choices?.[0]?.message?.content||data?.output_text||'';const parsed=jsonFromText(content);if(!parsed.result)throw new Error('翻译格式无效');return parsed.result;}
async function translateChat(entries){const system='你是中韩双向翻译器。输入可能是中文、韩文或中韩混合。必须保留语气、网络用语、表情和换行。对每个字段输出 ko 与 zh；ko 是自然韩语，zh 是自然中文。不要解释，只输出 JSON：{"result":{"字段":{"ko":"...","zh":"..."}}}。';const raw=await aiChat(system,JSON.stringify(Object.fromEntries(entries)));const parsed=jsonFromText(raw);if(!parsed.result)throw new Error('翻译失败');return parsed.result;}
async function saveTranslationSettings(){const prev=prefs.translator||{};prefs.translator={enabled:!!document.getElementById('trEnabled')?.checked,baseUrl:document.getElementById('trBase')?.value.trim()||prev.baseUrl||'',apiKey:document.getElementById('trKey')?.value.trim()||prev.apiKey||'',model:document.getElementById('trModel')?.value.trim()||prev.model||'',proxy:document.getElementById('trProxy')?!!document.getElementById('trProxy').checked:(prev.proxy!==false)};await savePrefs();toast(t('저장했습니다.','已保存'));render();}
async function testTranslation(){if(prefs.translationEnabled===false){toast(t('번역 모드가 꺼져 있습니다.','翻译模式已关闭。'));return;}try{await saveTranslationSettings();const r=await translateTexts({test:'今天天气不错，吃完饭去散步吧'});toast((r.test?.ko||'测试成功').slice(0,80));}catch(e){toast(e.message||'测试失败');}}
async function savePost(){if(publishing)return;const cat=document.getElementById('edCat')?.value||editor.category,title=document.getElementById('edTitle')?.value.trim()||'',body=document.getElementById('edBody')?.value.trim()||'';editor={category:cat,title,body};if(!title||!body){toast(t('제목과 본문을 입력하세요.','请填写标题和正文。'));return;}publishing=true;render();try{let titleOriginal=title,titleTranslated=title,bodyOriginal=body,bodyTranslated=body;if(prefs.translationEnabled!==false){const r=await translateTexts({title,body});titleOriginal=r.title.ko;titleTranslated=r.title.zh;bodyOriginal=r.body.ko;bodyTranslated=r.body.zh;}const p=selected();if(p){await updatePost(p.id,{category:cat,titleOriginal,titleTranslated,bodyOriginal,bodyTranslated});page='detail';}else{const row={id:uid('post'),category:cat,titleOriginal,titleTranslated,bodyOriginal,bodyTranslated,createdAt:Date.now(),views:0,favorite:false,authoredByUser:true,images:[]};await A.db.create('posts',row);await A.db.create('threads',{id:'thread_'+row.id,postId:row.id,comments:[]});posts=[row,...posts];threads[row.id]={id:'thread_'+row.id,postId:row.id,comments:[]};selectedId=row.id;previousPage='home';page='detail';}toast(t('저장했습니다.','已保存'));}catch(e){toast(e.message||'保存失败');}finally{publishing=false;render();}}
async function sendComment(e){e.preventDefault();if(commentBusy||moreCommentsBusy)return;const p=selected(),input=(document.getElementById('commentInput')?.value||commentText).trim();commentText=input;if(!p||!input)return;commentBusy=true;render();try{let original=input,translated=input;if(prefs.translationEnabled!==false){const r=await translateTexts({comment:input});original=r.comment.ko;translated=r.comment.zh;}const th=await ensureThread(p.id);th.comments.push({id:uid('c'),original,translated,createdAt:Date.now(),authoredByUser:true,pendingReply:true});commentText='';await saveThread(p.id);render();setTimeout(()=>{const d=document.getElementById('detailScroll');if(d)d.scrollTop=d.scrollHeight;},20);}catch(e2){toast(e2.message||'评论失败');}finally{commentBusy=false;render();}}
async function deleteComment(id){const p=selected();if(!p)return;const th=await ensureThread(p.id);th.comments=th.comments.filter(c=>c.id!==id);await saveThread(p.id);render();}
async function deletePost(){const p=selected();if(!p||!confirm(t('이 게시글을 삭제할까요?','确定删除这篇帖子吗？')))return;for(const im of (p.images||[])){if(im.mediaRef)try{await A.media.delete({ref:im.mediaRef});}catch(e){}}await A.db.delete('posts',p.id);if(threads[p.id])await A.db.delete('threads',threads[p.id].id);posts=posts.filter(x=>x.id!==p.id);delete threads[p.id];selectedId=null;page=previousPage||'home';render();}
async function shareTo(characterId){const p=selected();if(!p)return;const cs=commentsOf(p.id).slice(-5);const bilingual=prefs.translationEnabled!==false?`韩文标题：${p.titleOriginal}\n中文标题：${p.titleTranslated}\n韩文正文：${p.bodyOriginal}\n中文正文：${p.bodyTranslated}`:`标题：${p.titleTranslated||p.titleOriginal}\n正文：${p.bodyTranslated||p.bodyOriginal}`;const history=`[theqoo 匿名论坛帖子分享]\n板块：${CAT_ZH[p.category]||p.category}\n${bilingual}\n文字图（中文）：${(p.images||[]).filter(x=>x.kind==='text').map(x=>x.originalText||x.translatedText||'').filter(Boolean).join('；')}\n评论摘录：${cs.map((c,i)=>`\n${i+1}. ${prefs.translationEnabled!==false?`${c.original} / ${c.translated}`:(c.translated||c.original)}${((p.authoredByUser&&c.authoredByUser)||c.authoredByOP)?'（楼主发言）':''}`).join('')||'暂无'}\n（这是用户从匿名论坛分享给你看的帖子。不要假设自己知道未展示的评论或发帖者身份。）`;const cardTitle=prefs.translationEnabled!==false?p.titleOriginal:(p.titleTranslated||p.titleOriginal),cardBody=prefs.translationEnabled!==false?p.bodyOriginal:(p.bodyTranslated||p.bodyOriginal);try{await A.chat.sendCard({characterId,role:'user',title:cardTitle,body:cardBody.slice(0,180),summary:p.titleTranslated||p.titleOriginal,historyText:history,historyRole:'user',sceneId:p.id,sceneTag:'theqoo-post',appTags:['theqoo','share'],card:{appLabel:'theqoo',title:cardTitle,subtitle:zh()?CAT_ZH[p.category]:p.category,body:cardBody.slice(0,180),status:t('공유 게시글','论坛分享'),accentColor:'#315777',actions:[{label:t('원문 보기','查看原帖')}]}});shareOpen=false;toast(t('Chat에 공유했습니다.','已分享到 Chat'));render();}catch(e){toast(e.message||'分享失败');}}
async function pickImage(){const p=selected();if(!p)return;try{const picked=await A.media.pick({accept:'image/*'});if(!picked?.file?.dataUrl)return;const stored=await A.media.put({dataUrl:picked.file.dataUrl});const images=[...(p.images||[]),{id:uid('img'),kind:'generated',mediaRef:stored.ref,prompt:'本地图片'}];await updatePost(p.id,{images});toast(t('사진을 추가했습니다.','已添加图片'));render();}catch(e){toast(e.message||'添加图片失败');}}
async function generateImage(){const p=selected();if(!p)return;const prompt=(document.getElementById('imagePrompt')?.value||'').trim();try{const r=await A.ai.generateImage({prompt:`韩国匿名论坛 theqoo 帖子配图。图片生成提示词与画面中出现的所有可见文字都必须使用简体中文，禁止出现韩文/韩语文字。排版清楚，不使用真人肖像。${prompt?`中文画面描述：${prompt}`:'以简约论坛信息卡片或氛围配图呈现，不包含具体人物姓名或帖子标题。'}`,timeoutMs:120000});if(!r?.dataUrl)throw new Error('生图没有返回图片');const stored=await A.media.put({dataUrl:r.dataUrl});const images=[...(p.images||[]),{id:uid('img'),kind:'generated',mediaRef:stored.ref,prompt:prompt||'中文图片描述'}];await updatePost(p.id,{images});toast(t('이미지를 추가했습니다.','已生成并添加图片'));render();}catch(e){toast(e.message||'生图失败');}}
async function addTextImage(){const p=selected();if(!p)return;const input=(document.getElementById('textImageDraft')?.value||'').trim();if(!input)return;try{const images=[...(p.images||[]),{id:uid('img'),kind:'text',originalText:input,translatedText:input}];await updatePost(p.id,{images});toast(t('문자 이미지를 추가했습니다.','已添加文字图'));render();}catch(e){toast(e.message||'添加文字图失败');}}
async function removeImage(id){const p=selected();if(!p)return;const im=(p.images||[]).find(x=>x.id===id);if(im?.mediaRef)try{await A.media.delete({ref:im.mediaRef});}catch(e){}await updatePost(p.id,{images:(p.images||[]).filter(x=>x.id!==id)});render();}
async function launch(){try{await loadData();const ctx=await A.app.getLaunchContext();if(ctx?.sceneId&&posts.some(p=>p.id===ctx.sceneId)){selectedId=ctx.sceneId;previousPage='home';page='detail';}render();}catch(e){root.innerHTML=`<div class="empty">${esc(e.message||'theqoo 启动失败')}</div>`;}}
launch();
})();
