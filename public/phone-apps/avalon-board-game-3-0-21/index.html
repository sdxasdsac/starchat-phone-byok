<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <script src="/phone-apps/ai-phone-host.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>阿瓦隆</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');
:root{--bg:#0e0e1a;--bg2:#151528;--bg3:#1c1c3a;--accent:#8C96ED;--accent2:#2C35BD;--gold:#E0E06E;--good:#8C96ED;--evil:#bd2c4e;--text:#d8d8e8;--text2:#7a7a9e;--card:rgba(140,150,237,0.07);--border:rgba(140,150,237,0.12);--radius:10px;}
html,body{width:100%;min-height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Cinzel',-apple-system,sans-serif;}*{box-sizing:border-box;}
button,input,select,textarea{font-family:inherit;}button{min-height:44px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;padding:0 20px;font-weight:600;transition:all .2s;background:var(--card);color:var(--text);font-size:13px;}button:active{transform:scale(0.97);}
.btn-primary{background:var(--accent2);color:#fff;border-color:var(--accent2);}.btn-primary:disabled{opacity:0.35;}.btn-good{background:rgba(140,150,237,0.15);color:var(--accent);border-color:var(--accent);}.btn-evil{background:rgba(189,44,78,0.15);color:var(--evil);border-color:var(--evil);}.btn-gold{background:rgba(224,224,110,0.15);color:var(--gold);border-color:var(--gold);}.btn-sm{min-height:36px;padding:0 12px;font-size:12px;}
.topbar{position:fixed;z-index:100;top:var(--ai-phone-app-bar-top,56px);left:16px;right:var(--ai-phone-app-bar-clear-right,96px);min-height:var(--ai-phone-app-bar-height,30px);display:flex;align-items:center;gap:8px;}.topbar h1{font-size:16px;margin:0;font-weight:700;letter-spacing:2px;color:var(--gold);}.topbar .subtitle{font-size:11px;color:var(--text2);font-family:-apple-system,sans-serif;}
.app{min-height:100dvh;padding:016px var(--ai-phone-app-safe-bottom,24px);padding-top:var(--ai-phone-app-safe-top,88px);}.screen{display:none;}.screen.active{display:block;}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:16px 0;opacity:0.3;}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin:10px 0;}.panel-title{font-size:13px;font-weight:700;color:var(--gold);margin:0 0 8px;letter-spacing:1px;}
.count-sel{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;}.count-sel button{flex:1;min-width:40px;}.count-sel button.selected{background:var(--accent2);color:#fff;border-color:var(--accent2);}
.role-list{display:flex;flex-wrap:wrap;gap:5px;}.role-tag{padding:3px 10px;border-radius:14px;font-size:11px;font-weight:600;font-family:-apple-system,sans-serif;}.role-tag.good{background:rgba(140,150,237,0.12);color:var(--accent);border:1px solid rgba(140,150,237,0.2);}.role-tag.evil{background:rgba(189,44,78,0.12);color:var(--evil);border:1px solid rgba(189,44,78,0.2);}
.char-item{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:6px 0;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);transition:all .2s;}.char-item.selected{border-color:var(--accent);}.char-item.user-slot{border-color:var(--gold);}
.char-avatar{width:36px;height:36px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;overflow:hidden;color:var(--text2);border:1px solid var(--border);}.char-avatar img{width:100%;height:100%;object-fit:cover;}.char-info{flex:1;min-width:0;}.char-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:-apple-system,sans-serif;}.char-desc{font-size:11px;color:var(--text2);font-family:-apple-system,sans-serif;}
.round-info{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px;margin:0 0 10px;}.mission-dots{display:flex;gap:5px;}.mission-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid var(--border);color:var(--text2);cursor:pointer;}.mission-dot.success{background:rgba(140,150,237,0.2);color:var(--accent);border-color:var(--accent);}.mission-dot.fail{background:rgba(189,44,78,0.2);color:var(--evil);border-color:var(--evil);}.mission-dot.current{border-color:var(--gold);color:var(--gold);animation:pulse 1.5s infinite;}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.reject-count{display:flex;gap:4px;align-items:center;justify-content:center;margin:4px 0;}.reject-pip{width:16px;height:16px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--text2);}.reject-pip.used{background:var(--evil);border-color:var(--evil);color:#fff;}
.seats-ring{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0;}.seat{width:calc(50% - 3px);background:var(--card);border-radius:var(--radius);padding:8px 10px;display:flex;align-items:center;gap:7px;border:1px solid var(--border);transition:all .2s;position:relative;}.seat.captain{border-color:var(--gold);}.seat.captain::after{content:'Crown';position:absolute;top:-7px;right:6px;font-size:8px;color:var(--gold);background:var(--bg);padding:0 4px;letter-spacing:1px;text-transform:uppercase;}.seat.on-team{border-color:var(--accent);background:rgba(140,150,237,0.06);}.seat.selectable{cursor:pointer;}
.seat-avatar{width:30px;height:30px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;overflow:hidden;border:1px solid var(--border);color:var(--text2);}.seat-avatar img{width:100%;height:100%;object-fit:cover;}.seat-info{flex:1;min-width:0;}.seat-name{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:-apple-system,sans-serif;}.seat-vote{font-size:11px;font-weight:700;}.seat-vote.approve{color:var(--accent);}.seat-vote.reject{color:var(--evil);}
.game-log{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin:10px 0;max-height:260px;overflow-y:auto;-webkit-overflow-scrolling:touch;}.log-entry{margin:5px 0;padding:6px 8px;border-radius:6px;font-size:12px;line-height:1.5;font-family:-apple-system,sans-serif;}.log-entry.system{background:rgba(224,224,110,0.06);color:var(--gold);text-align:center;font-size:11px;}.log-entry.speech{background:rgba(140,150,237,0.04);}.log-entry .speaker{font-weight:700;color:var(--accent);}.log-entry.user-speech{background:rgba(224,224,110,0.05);}
.action-area{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin:10px 0;}.action-title{font-size:13px;font-weight:700;margin:0 0 8px;color:var(--gold);letter-spacing:1px;}.action-desc{font-size:11px;color:var(--text2);margin:0 0 10px;font-family:-apple-system,sans-serif;}.action-buttons{display:flex;gap:6px;flex-wrap:wrap;}.action-buttons button{flex:1;}
textarea{width:100%;min-height:70px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px;color:var(--text);resize:vertical;font-size:13px;font-family:-apple-system,sans-serif;}textarea::placeholder{color:var(--text2);}
.identity-card{background:linear-gradient(135deg,var(--bg2),var(--bg3));border-radius:var(--radius);padding:16px;margin:10px 0;text-align:center;border:1px solid var(--border);}.identity-card.good-card{border-color:var(--accent);}.identity-card.evil-card{border-color:var(--evil);}.identity-role{font-size:20px;font-weight:700;margin:6px 0 4px;letter-spacing:2px;}.identity-camp{font-size:12px;padding:3px 12px;border-radius:10px;display:inline-block;}.identity-info{font-size:11px;color:var(--text2);margin:8px 0 0;line-height:1.6;font-family:-apple-system,sans-serif;}
.result-screen{text-align:center;padding:24px 0;}.result-title{font-size:22px;font-weight:700;margin:0 0 10px;letter-spacing:2px;}.result-subtitle{font-size:13px;color:var(--text2);margin:0 0 16px;font-family:-apple-system,sans-serif;}.reveal-list{text-align:left;margin:12px 0;}.reveal-item{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--card);border:1px solid var(--border);border-radius:6px;margin:5px 0;}.reveal-item .seat-num{font-weight:700;color:var(--gold);width:20px;font-size:12px;}
.loading-bar{position:fixed;bottom:var(--ai-phone-app-safe-bottom,24px);left:16px;right:16px;z-index:200;display:none;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);}.loading-bar.show{display:flex;}.spinner-sm{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;}@keyframes spin{to{transform:rotate(360deg)}}.loading-text{font-size:11px;color:var(--text2);font-family:-apple-system,sans-serif;}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:rgba(140,150,237,0.2);border-radius:2px;}
select{background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;width:100%;font-size:13px;}
.section-title{font-size:12px;font-weight:700;margin:14px 0 6px;color:var(--text2);letter-spacing:1px;}.setting-group{margin:12px 0;}.setting-label{font-size:11px;color:var(--text2);margin:0 0 4px;font-family:-apple-system,sans-serif;}.setting-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;color:var(--text);font-size:12px;font-family:-apple-system,sans-serif;}
.role-prompt-tab{display:inline-block;padding:4px 10px;font-size:11px;cursor:pointer;border:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;background:var(--card);color:var(--text2);margin-right:2px;border-bottom:none;}.role-prompt-tab.active{background:var(--bg3);color:var(--gold);border-color:var(--gold);}
.nav-tabs{display:flex;gap:0;margin:00 12px;border-bottom:1px solid var(--border);}.nav-tab{flex:1;text-align:center;padding:8px 0;font-size:12px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;letter-spacing:1px;}.nav-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
</style>
</head>
<body>
<div class="topbar"><div><h1>AVALON</h1><div class="subtitle" id="topSubtitle">The Resistance</div></div></div>
<div class="app">
  <div class="screen active" id="setupScreen">
    <div class="nav-tabs"><div class="nav-tab active" id="tabGame" onclick="switchTab('game')">GAME</div><div class="nav-tab" id="tabSettings" onclick="switchTab('settings')">SETTINGS</div></div>
    <div id="gameTab">
      <div class="section-title">选择人数</div><div class="count-sel" id="countSelector"></div>
      <div class="panel" id="roleConfig"></div>
      <div class="section-title">任务配置</div><div id="missionConfig" style="font-size:12px;color:var(--text2);margin:4px 0 10px;font-family:-apple-system,sans-serif;"></div>
      <div class="section-title">选择参与角色</div><div id="charSelectArea"><div style="text-align:center;color:var(--text2);padding:16px;font-size:12px;">加载中...</div></div>
      <button class="btn-primary" style="width:100%;margin-top:12px;" id="startGameBtn" disabled>开始游戏</button>
    </div>
    <div id="settingsTab" style="display:none;">
      <div class="section-title">通用规则提示词</div>
      <div class="panel"><div style="font-size:11px;color:var(--text2);margin-bottom:6px;font-family:-apple-system,sans-serif;">所有角色共享的阿瓦隆游戏规则提示词，会附加在每次AI 调用的末尾。</div><textarea id="gameRulesTextarea" style="min-height:100px;font-size:11px;" oninput="gameRulesPrompt=this.value;saveAllPrompts();"></textarea><button class="btn-sm" style="width:100%;margin-top:6px;" onclick="resetGameRules()">恢复默认</button></div>
      <div class="divider"></div>
      <div class="section-title">身份专属提示词</div>
      <div class="panel"><div style="font-size:11px;color:var(--text2);margin-bottom:6px;font-family:-apple-system,sans-serif;">自定义每个身份的行为策略提示词，会附加在通用规则之后。</div><div id="rolePromptTabs" style="display:flex;flex-wrap:wrap;gap:2px;margin-bottom:0;"></div><div id="rolePromptEditor" style="background:var(--bg3);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:10px;"></div><button class="btn-sm" style="width:100%;margin-top:6px;" onclick="resetCurrentPrompt()">恢复当前身份默认</button></div>
    </div>
  </div>
  <div class="screen" id="nightScreen"><div class="identity-card" id="identityCard"></div><div class="game-log" id="nightLog"></div><button class="btn-gold" style="width:100%;margin-top:10px;" id="nightDoneBtn">天亮了，开始游戏</button></div>
  <div class="screen" id="gameScreen"><div class="round-info" id="roundInfo"></div><div id="identityReminder" style="margin:0 0 8px;cursor:pointer;"></div><div class="seats-ring" id="seatsRing"></div><div class="action-area" id="actionArea"></div><div class="game-log" id="gameLog"></div></div>
  <div class="screen" id="resultScreen"><div class="result-screen" id="resultContent"></div><button class="btn-primary" style="width:100%;" id="replayBtn">再来一局</button></div>
</div>
<div class="loading-bar" id="loadingOverlay"><div class="spinner-sm"></div><div class="loading-text" id="loadingText">思考中...</div></div>
<script>
const AiPhone=window.AiPhone;
const CONFIGS={5:{good:['梅林','派西维尔','忠臣'],evil:['莫甘娜','刺客'],missions:[2,3,2,3,3]},6:{good:['梅林','派西维尔','忠臣','忠臣'],evil:['莫甘娜','刺客'],missions:[2,3,4,3,4]},7:{good:['梅林','派西维尔','忠臣','忠臣'],evil:['莫甘娜','刺客','爪牙'],missions:[2,3,4,4,4]},8:{good:['梅林','派西维尔','忠臣','忠臣','忠臣'],evil:['莫甘娜','刺客','爪牙'],missions:[3,4,4,5,5]},9:{good:['梅林','派西维尔','忠臣','忠臣','忠臣'],evil:['莫甘娜','刺客','奥伯伦','莫德雷德'],missions:[3,4,4,5,5]},10:{good:['梅林','派西维尔','忠臣','忠臣','忠臣','忠臣'],evil:['莫甘娜','刺客','奥伯伦','莫德雷德'],missions:[3,4,4,5,5]}};
const ROLE_INFO={'梅林':{camp:'good',icon:'M',desc:'能看到除莫德雷德外的所有坏人'},'派西维尔':{camp:'good',icon:'P',desc:'能看到梅林和莫甘娜（无法分辨）'},'忠臣':{camp:'good',icon:'L',desc:'没有特殊信息，凭推理判断'},'莫甘娜':{camp:'evil',icon:'G',desc:'能看到其他坏人（除奥伯伦），会被派西维尔看到'},'刺客':{camp:'evil',icon:'A',desc:'能看到其他坏人（除奥伯伦），可以刺杀梅林'},'莫德雷德':{camp:'evil',icon:'D',desc:'能看到其他坏人（除奥伯伦），不会被梅林看到'},'奥伯伦':{camp:'evil',icon:'O',desc:'与坏人互不相认，会被梅林看到'},'爪牙':{camp:'evil',icon:'F',desc:'能看到其他坏人（除奥伯伦）'}};
const DEFAULT_ROLE_PROMPTS={'梅林':'你是梅林。你能看到除莫德雷德以外的坏人，但绝不能暴露身份。用逻辑包装判断，适当给错误信息掩护自己。可以先点好人，不急着踩坏人。可以跳派西维尔身份，给出一些信息。因为你实际上知道哪些是坏人，但是不能暴露的太明显，要假装自己不知道谁是坏人，可以假装相信某个坏人是好人，哪怕你知道他是坏人，让坏人以为你没有视野。绝对不要说自己是梅林。可以说自己是派西或者忠臣，或者干脆不要提自己的身份。记住，坏人是谁和他们是否暴露不是最重要的！最重要的是隐藏梅林身份！','派西维尔':'你是派西维尔。你看到两个人举起拇指（梅林和莫甘娜），但无法分辨谁是谁。你的任务是搞清谁是梅林并保护他。可以跳派西维尔身份带队，也可以不跳，每次带上自己减少容错。搞清谁是梅林不意味着你要说出谁是梅林。由于你知道梅林和莫甘娜这两个人（虽然分不清），但是如果你说出来，坏人那边一定知道谁是莫甘娜（他们能彼此看到），所以会用排除法知道谁是梅林而刺杀他。所以尽量不要说出你知道的信息！！！不要说出你真实知道的梅林和莫甘娜！！！给好人带队即可。如何分辨梅林和莫甘娜？通常来说梅林知道哪些是坏人，很不幸的是莫甘娜也知道哪些是队友，但是有一点，梅林一般来说不会带莫甘娜上车！（不排除梅林隐藏身份不想让坏人看出来的可能性）记住，坏人是谁和他们是否暴露不是最重要的！最重要的是隐藏梅林身份！','忠臣':'你是忠臣。你没有特殊信息，只能通过发言和投票推理他人身份。给模棱两可的判断，积极寻找好人抱团，坚定拥护你信任的人。你可以选择跳派西维尔，也可以主动积极推理点出坏人，想办法让坏人误以为你是梅林从而给真梅林挡刀。可以跳派西或者忠臣。记住，坏人是谁和他们是否暴露不是最重要的！最重要的是隐藏梅林身份！','莫甘娜':'你是莫甘娜。你必须死命装好人，输出模糊信息，试图套出梅林的身份。可以通过跟队友互怼来迷惑好人阵营。因为你在派西眼里有可能是梅林（派西知道哪两个人是梅林和莫甘娜但不知道具体谁是谁），所以要尽可能表现地像梅林，可以适当点出队友坏人身份来迷惑派西。你可以选择跳派西、忠臣等，或者干脆不说身份。前几轮如果上车了可以选择不要投反对票，因为可以做高你的身份。上车后可以投反对票炸车来增加某个好人的嫌疑。（比如，1和你上车了没炸，后面发车选了1、2和你，你反对票炸车，这样2就会很有嫌疑）当然也可以选择炸车，因为任务失败三轮就胜利。','莫德雷德':'你是莫德雷德。你不会被梅林看到，这是你最大的优势。大胆装好人，发言积极阳光，关键时候使坏踩别人。可以跳派西维尔、忠臣。前几轮如果上车了可以选择不要投反对票，因为可以做高你的身份。上车后可以投反对票炸车来增加某个好人的嫌疑。（比如，1和你上车了没炸，后面发车选了1、2和你，你反对票炸车，这样2就会很有嫌疑）当然也可以选择炸车，因为任务失败三轮就胜利。','刺客':'你是刺客。你最重要的任务是找出梅林。多观察派西维尔关注的人，主动拉队友上车牺牲自己做实队友好人身份。前几轮如果上车了可以选择不要投反对票，因为可以做高你的身份。上车后可以投反对票炸车来增加某个好人的嫌疑。（比如，1和你上车了没炸，后面发车选了1、2和你，你反对票炸车，这样2就会很有嫌疑）当然也可以选择炸车，因为任务失败三轮就胜利。可以跳派西维尔或者忠臣。','奥伯伦':'你是奥伯伦。你和其他坏人互不相认。尽量跳派西维尔让队友锁定你，上车必投失败票。','爪牙':'你是爪牙。配合团队隐藏身份，必要时上车隐忍投成功票，关键轮再搞破坏。前几轮如果上车了可以选择不要投反对票，因为可以做高你的身份。上车后可以投反对票炸车来增加某个好人的嫌疑。（比如，1和你上车了没炸，后面发车选了1、2和你，你反对票炸车，这样2就会很有嫌疑）当然也可以选择炸车，因为任务失败三轮就胜利。'};
const DEFAULT_GAME_RULES='你正在参与一场阿瓦隆桌游。这是一个身份推理游戏，你必须完全沉浸在游戏中。\n\n【核心规则】\n- 好人阵营目标：完成三次任务成功，同时保护梅林不被刺杀。\n- 坏人阵营目标：让三次任务失败，或在好人完成任务后刺杀梅林。\n- 每轮流程：队长指定发言顺序→依次发言→队长选人组队→全体投票→通过则出征执行任务。\n- 投票：超过半数赞成则通过，否则流车换队长。连续否决3次则强制发车。\n- 任务：好人只能投成功票；坏人可选成功或失败。有一张失败票任务就失败。\n- 好人三次成功后进入刺杀环节，刺客选择刺杀目标，命中梅林则坏人反胜。\n\n【发言要求】\n- 用中文发言，语气自然，像真人玩桌游。不要模仿别人说的话！不要说一些套话！\n- 发言控制在30-80字，简洁有力。\n- 你可以跳身份（声称自己是某个身份）、踩人（指出怀疑对象）、保人（为信任的人说话）。\n\n一些规则：坏人=狼。一般而言梅西不会跳真实身份。某个角色跳身份的不一定等于ta一定是那个身份，有可能是坏人为了混淆视听而跳身份，也有可能是好人为了掩护梅林或者迷惑坏人而跳身份。\n正常来说没人会跳梅林。\n\n【严格警告 - 禁止场外信息】\n你现在是在玩阿瓦隆桌游。你必须完全基于游戏内的信息（发言、投票、任务结果）来做判断和决策。绝对禁止利用任何游戏外的信息、角色之间现实中的关系、或其他场外知识。每个玩家在游戏中的身份是随机分配的，与他们本身的性格和人设无关。不要因为和某个角色关系好坏就没有理由地信任或者质疑对方，一切信息要来源于游戏内。请尊重游戏规则，认真扮演你被分配的阿瓦隆身份。';
const ROLE_DESCRIPTIONS={'梅林':'技能：夜间能看到除莫德雷德以外的所有坏人身份。\n行为倾向：会用逻辑包装判断，不会直接点名坏人，可能给出模糊甚至错误的信息掩护自己。通常先保好人，不急着踩坏人。可能跳派西维尔身份。','派西维尔':'技能：夜间能看到两个举起拇指的人（梅林和莫甘娜），但无法分辨谁是谁。\n行为倾向：会积极寻找线索判断谁是真梅林。可能跳派西维尔身份带队，每次带上自己减少容错。会暗中配合梅林。','忠臣':'技能：无特殊能力，完全依靠推理和观察判断局势。\n行为倾向：通过发言和投票行为分析他人身份，可能给模棱两可的判断。积极寻找好人抱团，有时可能装梅林来保护真梅林。','莫甘娜':'技能：夜间能看到其他坏人同伴（除奥伯伦）。会被派西维尔看到并与梅林混淆。\n行为倾向：死命装梅林或好人，输出模糊信息，试图让派西维尔认错梅林。可能通过和坏人队友互怼打反逻辑迷惑好人。','刺客':'技能：夜间能看到其他坏人同伴（除奥伯伦）。好人三次任务成功后可选择刺杀一人，命中梅林则坏人反胜。\n行为倾向：全程重点观察谁最可能是梅林。可能主动拉队友上车、牺牲自己来做实队友好人身份。','莫德雷德':'技能：夜间能看到其他坏人同伴（除奥伯伦）。不会被梅林看到，是坏人阵营最大的暗牌。\n行为倾向：大胆装好人，发言积极阳光，因为梅林看不到他所以可以肆无忌惮表忠心。关键时候突然使坏。可能跳派西维尔身份。','奥伯伦':'技能：夜间无法看到其他坏人，其他坏人也无法看到他。但会被梅林看到。\n行为倾向：可能跳派西维尔让队友通过排除法锁定自己。上车基本必投失败票。因为不知道队友是谁，行动相对独立。','爪牙':'技能：夜间能看到其他坏人同伴（除奥伯伦）。\n行为倾向：配合团队隐藏身份，前期可能隐忍投成功票，关键轮再搞破坏。投失败票的优先级低于奥伯伦和刺客。'};
let G=null,allChars=[],userProfile=null,selectedCount=5,selectedCharIds=[];
let rolePrompts=Object.assign({},DEFAULT_ROLE_PROMPTS);let gameRulesPrompt=DEFAULT_GAME_RULES;let currentPromptRole='梅林';
function shuffle(a){var b=a.slice(0);for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
function showScreen(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});document.getElementById(id).classList.add('active');}
function showLoading(t){document.getElementById('loadingText').textContent=t||'思考中...';document.getElementById('loadingOverlay').classList.add('show');}
function hideLoading(){document.getElementById('loadingOverlay').classList.remove('show');}
function addLog(c,t,type,sp){type=type||'system';sp=sp||'';var el=document.getElementById(c);var d=document.createElement('div');d.className='log-entry '+type;if(type==='speech'||type==='user-speech'){d.innerHTML=(sp?'<span class="speaker">'+sp+'：</span>':'')+t;}else{d.textContent=t;}el.appendChild(d);el.scrollTop=el.scrollHeight;}
function delay(ms){return new Promise(function(r){setTimeout(r,ms);});}
function switchTab(tab){document.getElementById('tabGame').classList.toggle('active',tab==='game');document.getElementById('tabSettings').classList.toggle('active',tab==='settings');document.getElementById('gameTab').style.display=tab==='game'?'block':'none';document.getElementById('settingsTab').style.display=tab==='settings'?'block':'none';if(tab==='settings'){renderRolePromptEditor();document.getElementById('gameRulesTextarea').value=gameRulesPrompt;}}
async function loadSettings(){try{var list=await AiPhone.db.list('settings',{limit:10});var pr=list.find(function(r){return r.type==='prompts';});var ru=list.find(function(r){return r.type==='rules';});if(pr)rolePrompts=Object.assign({},DEFAULT_ROLE_PROMPTS,pr.data);if(ru)gameRulesPrompt=ru.data||DEFAULT_GAME_RULES;}catch(e){console.error(e);}}
async function saveAllPrompts(){try{var list=await AiPhone.db.list('settings',{limit:10});var pEx=list.find(function(r){return r.type==='prompts';});if(pEx)await AiPhone.db.update('settings',pEx.id,{type:'prompts',data:rolePrompts});else await AiPhone.db.create('settings',{type:'prompts',data:rolePrompts});var rEx=list.find(function(r){return r.type==='rules';});if(rEx)await AiPhone.db.update('settings',rEx.id,{type:'rules',data:gameRulesPrompt});else await AiPhone.db.create('settings',{type:'rules',data:gameRulesPrompt});}catch(e){console.error(e);}}
function renderRolePromptEditor(){var tabs=document.getElementById('rolePromptTabs');var editor=document.getElementById('rolePromptEditor');var roles=Object.keys(DEFAULT_ROLE_PROMPTS);tabs.innerHTML=roles.map(function(r){return '<div class="role-prompt-tab'+(r===currentPromptRole?' active':'')+'" onclick="selectPromptRole(\''+r+'\')">' +r+'</div>';}).join('');var ta=document.createElement('textarea');ta.style.cssText='width:100%;min-height:80px;font-size:11px;';ta.value=rolePrompts[currentPromptRole]||DEFAULT_ROLE_PROMPTS[currentPromptRole];ta.oninput=function(){rolePrompts[currentPromptRole]=ta.value;saveAllPrompts();};editor.innerHTML='';editor.appendChild(ta);}
function selectPromptRole(r){currentPromptRole=r;renderRolePromptEditor();}
function resetCurrentPrompt(){rolePrompts[currentPromptRole]=DEFAULT_ROLE_PROMPTS[currentPromptRole];renderRolePromptEditor();saveAllPrompts();AiPhone.ui.toast('已恢复默认');}
function resetGameRules(){gameRulesPrompt=DEFAULT_GAME_RULES;document.getElementById('gameRulesTextarea').value=gameRulesPrompt;saveAllPrompts();AiPhone.ui.toast('已恢复默认');}

function getNightInfo(seat,all){var r=seat.role;if(r==='梅林'){var v=all.filter(function(s){return s!==seat&&ROLE_INFO[s.role].camp==='evil'&&s.role!=='莫德雷德';});return v.length>0?'你看到以下人竖起了大拇指（他们是坏人）：'+v.map(function(s){return s.seatNum+'号'+s.name;}).join('、'):'你没有看到任何人竖起大拇指。';}if(r==='派西维尔'){var v=all.filter(function(s){return s!==seat&&(s.role==='梅林'||s.role==='莫甘娜');});return'你看到以下人竖起了大拇指（其中一个是梅林，一个是莫甘娜，你无法分辨）：'+v.map(function(s){return s.seatNum+'号'+s.name;}).join('、');}if(r==='奥伯伦')return'你是奥伯伦，你与其他坏人互不相认。你不知道谁是你的队友。';if(ROLE_INFO[r].camp==='evil'){var v=all.filter(function(s){return s!==seat&&ROLE_INFO[s.role].camp==='evil'&&s.role!=='奥伯伦';});return v.length>0?'你看到以下坏人同伴：'+v.map(function(s){return s.seatNum+'号'+s.name+'('+s.role+')';}).join('、'):'你没有看到其他坏人同伴。';}return'你是忠臣，夜间没有获得任何信息。凭借你的智慧和判断力来辨别敌友。';}
// ===== ROLE GUIDE =====
function buildRoleGuide(){var cfg=CONFIGS[G.seats.length];var allRoles=cfg.good.concat(cfg.evil);var unique=[];var counts={};allRoles.forEach(function(r){if(!counts[r]){counts[r]=0;unique.push(r);}counts[r]++;});var txt='\n【本局身份配置（仅供了解局势，不要混淆你自己的真实身份！）】\n本局共'+G.seats.length+'人，身份分配如下：\n好人阵营（'+cfg.good.length+'人）：'+cfg.good.join('、')+'\n坏人阵营（'+cfg.evil.length+'人）：'+cfg.evil.join('、')+'\n\n以下是本局存在的各身份的技能和可能的行为倾向（注意：这只是告诉你本局有哪些身份以及他们可能会怎么做，你自己的真实身份以上方标注的为准，不要混淆！）：\n\n';unique.forEach(function(r){var d=ROLE_DESCRIPTIONS[r];if(d){var campLabel=ROLE_INFO[r].camp==='good'?'好人':'坏人';var countLabel=counts[r]>1?' x'+counts[r]:'';txt+=r+countLabel+' ('+campLabel+'):\n'+d+'\n\n';}});return txt;}
// ===== AI GENERATION =====
function buildPrompt(seat,extra){var ctx='【阿瓦隆桌游- 当前局势】\n人数：'+G.seats.length+'人局\n你是'+seat.seatNum+'号座位的"'+seat.name+'"\n你的阿瓦隆身份：'+seat.role+'（'+(ROLE_INFO[seat.role].camp==='good'?'好人阵营':'坏人阵营')+'）\n身份能力：'+ROLE_INFO[seat.role].desc+'\n';if(seat.nightInfo)ctx+='\n【夜间信息】'+seat.nightInfo+'\n';ctx+='\n【座位表】\n';G.seats.forEach(function(st){ctx+=st.seatNum+'号：'+st.name+(st===seat?'（你自己）':'')+(st.isUser?'（真人玩家）':'（AI玩家）')+(st.seatNum===G.captainSeat?'【当前队长】':'')+'\n';});ctx+='\n【任务历史】\n';if(G.missionResults.length===0)ctx+='暂无任务记录。\n';else G.missionResults.forEach(function(r,i){ctx+='第'+(i+1)+'轮：'+(r.success?'成功':'失败')+'（'+(r.missionDetail||r.failCount+'张失败票')+'）队伍：'+r.team.join('、')+(r.voteDetail?' | 发车投票：'+r.voteDetail:'')+'\n';});ctx+='当前比分：好人'+G.missionResults.filter(function(r){return r.success;}).length+'胜 vs 坏人'+G.missionResults.filter(function(r){return!r.success;}).length+'胜\n';ctx+='\n当前第'+(G.currentMission+1)+'轮任务，需要'+CONFIGS[G.seats.length].missions[G.currentMission]+'人出征。\n';ctx+='本轮已被否决'+G.rejectCount+'次（达到3次将强制发车）。\n';if(G.allRoundLogs&&G.allRoundLogs.length>0){ctx+='\n【历史轮次记录】\n';G.allRoundLogs.forEach(function(l){ctx+=l+'\n';});}if(G.roundLog&&G.roundLog.length>0){ctx+='\n【本轮讨论记录】\n';G.roundLog.forEach(function(l){ctx+=l+'\n';});}if(G.currentTeam&&G.currentTeam.length>0)ctx+='\n【当前队伍】'+G.currentTeam.map(function(n){return n+'号'+G.seats[n-1].name;}).join('、')+'\n';ctx+='\n'+extra+'\n';ctx+='\n═══════════════════════════════════\n【以下是你必须遵守的游戏规则和行为指导，请严格执行】\n\n';ctx+=gameRulesPrompt+'\n\n';ctx+=buildRoleGuide();var rp=rolePrompts[seat.role]||DEFAULT_ROLE_PROMPTS[seat.role]||'';if(rp)ctx+='【你的身份行为指导 - '+seat.role+'】\n'+rp+'\n';ctx+='\n【最终警告】严禁模仿或照抄其他人的发言！你必须用自己的方式表达，符合你的人设和身份。如果发现和其他人说的话相似，必须换一种完全不同的表达方式。不要再说"我是好人""底牌好人""我是纯好人"之类的套话！！要言之有物，给出具体的分析和判断！\n';return ctx;}
async function aiGenerate(seat,appTags,taskInstruction){var fullPrompt=buildPrompt(seat,taskInstruction);try{var r=await AiPhone.ai.generate({characterId:seat.charId,appTags:appTags,instruction:fullPrompt});return r.text||'';}catch(e){console.error('AI生成错误:',e);return '';}}
function parseTag(text,tag){var m=text.match(new RegExp('\\['+tag+'[:：]([^\\]]+)\\]'));return m?m[1].trim():null;}

function roundPause(ms){return new Promise(function(resolve){var t=Math.ceil((ms||15000)/1000);var a=document.getElementById('actionArea');var iv;var resolved=false;function render(){a.innerHTML='<div class="action-title">轮间休息</div><div class="action-desc">下一轮将在 '+t+' 秒后开始</div>';var btn=document.createElement('button');btn.className='btn-primary';btn.style.width='100%';btn.textContent='跳过';btn.onclick=done;a.appendChild(btn);}function done(){if(resolved)return;resolved=true;clearInterval(iv);a.innerHTML='';resolve();}render();iv=setInterval(function(){t--;if(t<=0){done();}else{render();}},1000);});}

async function aiSpeak(seat){showLoading(seat.name+' 正在发言...');await delay(400+Math.random()*800);var speakInstr='现在轮到你发言。请表明你的立场，说出你想要谁上车、不想要谁上车。';var roll=Math.random();if(G.currentMission===0){if(roll<0.333){speakInstr+='\n\n【本轮风格：激进】这一轮发言请激进一点。首先想好你想要跳什么身份，然后确认一下要给出什么信息，不要给出你的真实信息！！！主动进行逻辑分析，大胆表达判断，明确上车策略。';}else if(roll<0.666){speakInstr+='\n\n【本轮风格：保守】这一轮发言请保守一点，含糊表水，不要透露真实身份，模糊表示对于上车策略的建议。多观察少下结论。';}}else{if(roll<0.2){speakInstr+='\n\n【本轮风格：激进】这一轮发言请激进一点。可以选择跳身份、对跳、质疑别人。首先想好你想要跳什么身份，确认要给出什么信息，不要给出你的真实信息！！！大胆表达判断。';}else if(roll<0.4){speakInstr+='\n\n【本轮风格：踩人/保人】这一轮请根据之前几轮的发言、投票和任务结果，选择踩某个你怀疑的人（指出理由），或者保某个你信任的人（说明为什么信任）。要有具体依据。';}else if(roll<0.6){speakInstr+='\n\n【本轮风格：找矛盾】这一轮请综合之前几轮的发言记录，看看有没有矛盾的地方或者特殊的表现，指出来。比如某人说了要反对但实际投了赞成，或者某人的发言前后不一致。';}else if(roll<0.8){speakInstr+='\n\n【本轮风格：点评投票】这一轮请点评上一轮的投票和任务情况。比如哪些人投了赞成哪些人投了反对，为什么？上车后任务结果如何？有什么值得注意的信息？';}}var t=await aiGenerate(seat,['avalon','discuss'],speakInstr);hideLoading();var sp=parseTag(t,'发言')||t.replace(/\[.*?\]/g,'').trim();if(!sp)sp='我先观察一下局势。';addLog('gameLog',sp,'speech',seat.seatNum+'号 '+seat.name);G.roundLog.push(seat.seatNum+'号'+seat.name+'发言：'+sp);await delay(5000);}
//===== TEAM SELECT =====
async function startTeamSelectPhase(){G.phase='select_team';var cap=G.seats[G.captainSeat-1],ms=CONFIGS[G.seats.length].missions[G.currentMission];G.currentTeam=[];addLog('gameLog','──队长选人 ──','system');addLog('gameLog',cap.seatNum+'号 '+cap.name+' 正在选择'+ms+'人出征','system');if(cap.isUser)await userSelectTeam(ms);else await aiSelectTeam(cap,ms);addLog('gameLog','队伍：'+G.currentTeam.map(function(n){return n+'号'+G.seats[n-1].name;}).join('、'),'system');renderSeats();if(G.rejectCount>=2)addLog('gameLog','强制轮警告- 再被否决将强制发车','system');await startVotePhase();}
async function userSelectTeam(ms){return new Promise(function(resolve){G.currentTeam=[];renderSeats(true,ms);var a=document.getElementById('actionArea');a.innerHTML='';var t1=document.createElement('div');t1.className='action-title';t1.textContent='组建队伍';var d1=document.createElement('div');d1.className='action-desc';d1.textContent='点击座位选择'+ms+'人出征';var btn=document.createElement('button');btn.className='btn-primary';btn.style.width='100%';btn.id='confirmTeamBtn';btn.disabled=true;btn.textContent='确认队伍';btn.onclick=function(){if(G.currentTeam.length!==ms)return;renderSeats();resolve();};a.appendChild(t1);a.appendChild(d1);a.appendChild(btn);});}
async function aiSelectTeam(cap,ms){document.getElementById('actionArea').innerHTML='';showLoading(cap.name+' 正在组建队伍...');await delay(400+Math.random()*600);var t=await aiGenerate(cap,['avalon','select_team'],'你是队长，请选择'+ms+'人组成任务队伍。可用座位号：'+G.seats.map(function(s){return s.seatNum+'号'+s.name;}).join('、')+'\n\n请务必参考上面的讨论记录！根据大家的发言、之前的投票和任务结果来决定带谁上车。如果你在讨论中表达过要带某些人，请保持一致，除非有充分理由改变。不要随机选人！');hideLoading();var p=parseTag(t,'选人');if(p){var nums=p.split(/[,，、\s]+/).map(function(s){return parseInt(s.trim());}).filter(function(n){return n>=1&&n<=G.seats.length;});var unique=[];nums.forEach(function(n){if(unique.indexOf(n)<0)unique.push(n);});if(unique.length===ms){G.currentTeam=unique;return;}}G.currentTeam=[cap.seatNum];var others=shuffle(G.seats.filter(function(s){return s.seatNum!==cap.seatNum;}).map(function(s){return s.seatNum;}));while(G.currentTeam.length<ms)G.currentTeam.push(others.shift());}
// ===== VOTE =====
async function startVotePhase(){G.phase='vote';G.seats.forEach(function(s){s.vote=null;});addLog('gameLog','── 投票表决 ──','system');if(G.rejectCount>=2){addLog('gameLog','已达3次否决，强制发车！','system');G.seats.forEach(function(s){s.vote=true;});renderSeats();await delay(600);await startMissionPhase();return;}for(var i=0;i<G.seats.length;i++){if(G.seats[i].isUser)await userVote();else await aiVote(G.seats[i]);}renderSeats();await delay(400);var app=G.seats.filter(function(s){return s.vote===true;}).length;var rej=G.seats.filter(function(s){return s.vote===false;}).length;var ayeN=G.seats.filter(function(s){return s.vote===true;}).map(function(s){return s.seatNum+'号'+s.name;}).join('、');var nayN=G.seats.filter(function(s){return s.vote===false;}).map(function(s){return s.seatNum+'号'+s.name;}).join('、');addLog('gameLog','投票结果：赞成'+app+'票，反对'+rej+'票','system');addLog('gameLog','赞成：'+(ayeN||'无'),'system');addLog('gameLog','反对：'+(nayN||'无'),'system');G.roundLog.push('投票结果：赞成'+app+'票（'+ayeN+'），反对'+rej+'票（'+nayN+'）');if(app>rej){addLog('gameLog','投票通过，队伍出征！','system');G.roundLog.push('投票通过，队伍出征');G.rejectCount=0;G._lastVoteDetail='赞成：'+ayeN+'；反对：'+nayN;await delay(500);await startMissionPhase();}else{G.rejectCount++;addLog('gameLog','投票未通过，已否决'+G.rejectCount+'次','system');G.roundLog.push('投票未通过，已否决'+G.rejectCount+'次');G.allRoundLogs=G.allRoundLogs.concat(G.roundLog);advanceCaptain();await roundPause(15000);startRound();}}
async function userVote(){return new Promise(function(resolve){var a=document.getElementById('actionArea');a.innerHTML='';var t1=document.createElement('div');t1.className='action-title';t1.textContent='投票';var d1=document.createElement('div');d1.className='action-desc';d1.innerHTML='队伍：'+G.currentTeam.map(function(n){return n+'号'+G.seats[n-1].name;}).join('、')+'<br>是否同意这个队伍出征？';var btns=document.createElement('div');btns.className='action-buttons';var b1=document.createElement('button');b1.className='btn-good';b1.textContent='赞成';b1.onclick=function(){var us=G.seats.find(function(s){return s.isUser;});us.vote=true;addLog('gameLog',us.seatNum+'号 '+us.name+' 已投票','system');a.innerHTML='<div class="action-desc">等待其他玩家投票</div>';resolve();};var b2=document.createElement('button');b2.className='btn-evil';b2.textContent='反对';b2.onclick=function(){var us=G.seats.find(function(s){return s.isUser;});us.vote=false;addLog('gameLog',us.seatNum+'号 '+us.name+' 已投票','system');a.innerHTML='<div class="action-desc">等待其他玩家投票...</div>';resolve();};btns.appendChild(b1);btns.appendChild(b2);a.appendChild(t1);a.appendChild(d1);a.appendChild(btns);});}
async function aiVote(seat){showLoading(seat.name+' 正在投票...');await delay(200+Math.random()*400);var t=await aiGenerate(seat,['avalon','vote_team'],'当前队伍：'+G.currentTeam.map(function(n){return n+'号'+G.seats[n-1].name;}).join('、')+'\n本轮已否决'+G.rejectCount+'次。\n\n请务必参考上面的讨论记录和你之前的发言！如果你在讨论中表达过对某人的态度（信任或怀疑），投票要和你的发言保持一致，除非有新的信息改变了你的判断。根据队伍中是否有你怀疑的人来决定赞成或反对。');hideLoading();var p=parseTag(t,'投票');seat.vote=p?p.indexOf('赞成')>=0:Math.random()>0.4;}
function advanceCaptain(){G.captainSeat=(G.captainSeat%G.seats.length)+1;}
// ===== MISSION (fixed: no loading shown, all players have random delay) =====
async function startMissionPhase(){G.phase='mission';addLog('gameLog','── 执行任务 ──','system');addLog('gameLog','出征队员：'+G.currentTeam.map(function(n){return n+'号'+G.seats[n-1].name;}).join('、'),'system');var team=G.currentTeam.map(function(n){return G.seats[n-1];});addLog('gameLog','任务执行中...','system');var missionPromises=team.map(function(s){if(s.isUser)return userMission(s);else return aiMission(s);});await Promise.all(missionPromises);var failCount=team.filter(function(s){return s.missionVote===false;}).length;var successCount=team.filter(function(s){return s.missionVote===true;}).length;var success=failCount===0;var mDetail=successCount+'张成功票，'+failCount+'张失败票';G.missionResults.push({success:success,failCount:failCount,teamSize:team.length,team:G.currentTeam.map(function(n){return n+'号'+G.seats[n-1].name;}),missionDetail:mDetail,voteDetail:G._lastVoteDetail||''});addLog('gameLog',success?'任务成功（'+mDetail+'）':'任务失败！（'+mDetail+'）','system');G.roundLog.push('任务'+(success?'成功':'失败')+'（'+mDetail+'）');renderRoundInfo();updateTopSubtitle();await roundPause(15000);var gw=G.missionResults.filter(function(r){return r.success;}).length;var ew=G.missionResults.filter(function(r){return!r.success;}).length;if(ew>=3){endGame('evil','坏人阵营三次任务失败，获得胜利！');return;}if(gw>=3){await startAssassinPhase();return;}G.currentMission++;advanceCaptain();G.rejectCount=0;G.allRoundLogs=G.allRoundLogs.concat(G.roundLog);startRound();}
async function userMission(seat){if(ROLE_INFO[seat.role].camp==='good'){seat.missionVote=true;return;}return new Promise(function(resolve){var a=document.getElementById('actionArea');a.innerHTML='';var t1=document.createElement('div');t1.className='action-title';t1.textContent='执行任务';var d1=document.createElement('div');d1.className='action-desc';d1.textContent='你是'+seat.role+'（坏人），可以选择成功或破坏。';var btns=document.createElement('div');btns.className='action-buttons';var b1=document.createElement('button');b1.className='btn-good';b1.textContent='成功（隐藏身份）';b1.onclick=function(){seat.missionVote=true;a.innerHTML='<div class="action-desc">等待任务结算...</div>';resolve();};var b2=document.createElement('button');b2.className='btn-evil';b2.textContent='失败（搞破坏）';b2.onclick=function(){seat.missionVote=false;a.innerHTML='<div class="action-desc">等待任务结算...</div>';resolve();};btns.appendChild(b1);btns.appendChild(b2);a.appendChild(t1);a.appendChild(d1);a.appendChild(btns);});}
async function aiMission(seat){await delay(7000+Math.random()*8000);if(ROLE_INFO[seat.role].camp==='good'){seat.missionVote=true;return;}var tmInfo=G.currentTeam.filter(function(n){return n!==seat.seatNum;}).map(function(n){var s=G.seats[n-1];if(seat.role!=='奥伯伦'&&ROLE_INFO[s.role].camp==='evil'&&s.role!=='奥伯伦')return n+'号'+s.name+'（你的坏人队友'+s.role+'）';return n+'号'+s.name;}).join('、');var gw=G.missionResults.filter(function(r){return r.success;}).length;var ew=G.missionResults.filter(function(r){return!r.success;}).length;var t=await aiGenerate(seat,['avalon','mission'],'你在任务队伍中。同车队员：'+tmInfo+'\n当前比分：好人'+gw+'胜 vs 坏人'+ew+'胜\n这是第'+(G.currentMission+1)+'轮任务。\n\n请务必参考上面的讨论记录、投票情况和你的身份策略来决定！考虑当前比分、是否有队友在车上、是否需要隐藏身份等因素。');var p=parseTag(t,'任务');if(p){seat.missionVote=p.indexOf('成功')>=0;}else{if(seat.role==='奥伯伦')seat.missionVote=false;else{var hasAlly=G.currentTeam.some(function(n){var s=G.seats[n-1];return s!==seat&&ROLE_INFO[s.role].camp==='evil'&&s.role!=='奥伯伦';});seat.missionVote=hasAlly;}}}
// ===== ASSASSIN =====
async function startAssassinPhase(){G.phase='assassin';addLog('gameLog','═══ 刺杀环节 ═══','system');addLog('gameLog','好人完成了三次任务，但坏人还有最后的机会...','system');var assassin=G.seats.find(function(s){return s.role==='刺客';});if(!assassin){endGame('good','好人阵营三次任务成功，且没有刺客，好人获胜！');return;}addLog('gameLog','──坏人阵营讨论 ──','system');G.roundLog.push('── 坏人阵营刺杀前讨论 ──');await evilDiscussion();addLog('gameLog','刺客'+assassin.seatNum+'号 '+assassin.name+' 正在选择刺杀目标...','system');var target;if(assassin.isUser)target=await userAssassinate();else target=await aiAssassinate(assassin);var tgt=G.seats[target-1];addLog('gameLog','刺客选择刺杀 '+target+'号 '+tgt.name+'！','system');await delay(800);if(tgt.role==='梅林'){addLog('gameLog',tgt.name+' 就是梅林！刺杀成功！','system');await delay(400);endGame('evil','刺客成功刺杀了梅林（'+target+'号 '+tgt.name+'），坏人反败为胜！');}else{addLog('gameLog',tgt.name+' 不是梅林（实际身份：'+tgt.role+'），刺杀失败！','system');await delay(400);endGame('good','刺客刺杀失败！'+tgt.name+'不是梅林，好人阵营获得最终胜利！');}}
async function userAssassinate(){return new Promise(function(resolve){var a=document.getElementById('actionArea');a.innerHTML='';var t1=document.createElement('div');t1.className='action-title';t1.textContent='刺客出手';var d1=document.createElement('div');d1.className='action-desc';d1.textContent='选择你认为是梅林的人：';var btns=document.createElement('div');btns.className='action-buttons';btns.style.flexDirection='column';G.seats.filter(function(s){return!s.isUser;}).forEach(function(s){var btn=document.createElement('button');btn.className='btn-sm';btn.textContent=s.seatNum+'号 '+s.name;btn.onclick=function(){resolve(s.seatNum);};btns.appendChild(btn);});a.appendChild(t1);a.appendChild(d1);a.appendChild(btns);});}
async function aiAssassinate(asn){showLoading(asn.name+' 正在寻找梅林...');await delay(600+Math.random()*1000);var allLogs=G.allRoundLogs.concat(G.roundLog);var logsText=allLogs.length>0?allLogs.join('\n')+'\n':'';var mSum=G.missionResults.map(function(r,i){return '第'+(i+1)+'轮：'+(r.success?'成功':'失败')+'('+r.failCount+'张失败票) 队伍：'+r.team.join('、');}).join('\n');var goodList=G.seats.filter(function(s){return ROLE_INFO[s.role].camp==='good';}).map(function(s){return s.seatNum+'号'+s.name;}).join('、');var t=await aiGenerate(asn,['avalon','assassin'],logsText+'\n任务历史：\n'+mSum+'\n\n好人座位：'+goodList+'\n请选择刺杀目标。');hideLoading();var p=parseTag(t,'刺杀');if(p){var n=parseInt(p);if(n>=1&&n<=G.seats.length&&ROLE_INFO[G.seats[n-1].role].camp==='good')return n;}var gs=G.seats.filter(function(s){return ROLE_INFO[s.role].camp==='good'&&!s.isUser;});return gs.length>0?gs[Math.floor(Math.random()*gs.length)].seatNum:G.seats.filter(function(s){return ROLE_INFO[s.role].camp==='good';})[0].seatNum;}
// ===== END GAME =====
function endGame(winner,message){G.phase='end';showScreen('resultScreen');var isGW=winner==='good';var us=G.seats.find(function(s){return s.isUser;});var uc=ROLE_INFO[us.role].camp;var uw=uc===winner;var h='<div class="result-title" style="color:'+(isGW?'#8C96ED':'#bd2c4e')+'">'+(isGW?'好人胜利':'坏人胜利')+'</div><div class="result-subtitle">'+message+'</div><div style="font-size:16px;margin:10px 0;color:'+(uw?'#E0E06E':'#7a7a9e')+'">'+(uw?'恭喜你，你赢了！':'很遗憾，你输了')+'</div><div style="font-size:12px;color:#7a7a9e;margin:6px 0;font-family:-apple-system,sans-serif;">你的身份：'+us.role+'（'+(uc==='good'?'好人':'坏人')+'）</div><div class="section-title">身份揭晓</div><div class="reveal-list">';G.seats.forEach(function(s){var ri=ROLE_INFO[s.role];h+='<div class="reveal-item"><div class="seat-num">'+s.seatNum+'</div><div class="seat-avatar">'+(s.avatar?'<img src="'+s.avatar+'">':(s.isUser?'你':'AI'))+'</div><div style="flex:1;"><div style="font-weight:600;font-size:12px;font-family:-apple-system,sans-serif;">'+s.name+(s.isUser?' (你)':'')+'</div><div style="font-size:11px;"><span class="role-tag '+(ri.camp==='good'?'good':'evil')+'">'+s.role+'</span></div></div></div>';});h+='</div><div class="section-title">任务回顾</div><div style="font-size:12px;color:#7a7a9e;font-family:-apple-system,sans-serif;">';G.missionResults.forEach(function(r,i){h+='<div style="margin:3px 0;">'+(r.success?'[成功]':'[失败]')+' 第'+(i+1)+'轮（'+r.failCount+'张失败票）- '+r.team.join('、')+'</div>';});h+='</div>';document.getElementById('resultContent').innerHTML=h;document.getElementById('replayBtn').onclick=function(){G=null;selectedCharIds=[];showScreen('setupScreen');switchTab('game');renderCharSelect();};}
// ===== INIT =====
async function main(){await initSetup();document.getElementById('startGameBtn').onclick=function(){startGame();};}
main().catch(console.error);
</script>
