<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
  <script src="/phone-apps/ai-phone-host.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FB7299">
<title>噼里啪啦</title>
<style>
:root{
  --top-safe: 46px;
  --pink:#FB7299; --pink-d:#F25D87; --pink-t:#FFF1F5;
  --blue:#00AEEC; --bg:#F1F2F3; --card:#fff; --t1:#18191C; --t2:#61666D; --t3:#9499A0;
  --line:#E3E5E7; --dark:#0E0F14;
  --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--t1);font:14px/1.5 -apple-system,BlinkMacSystemFont,"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;border:0;outline:none;background:none}
img{display:block;max-width:100%}
svg{display:block}
.app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}

/* ───── 顶栏 ───── */
.hd{padding-top:var(--top-safe);background:#fff;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 0;position:relative;z-index:8}
.hd-row{display:flex;align-items:center;gap:8px;height:46px}
.hd-search{flex:1;height:38px;border-radius:19px;background:#F1F2F3;display:flex;align-items:center;gap:7px;padding:0 12px;color:#9499A0;font-size:13px;min-width:0;border:0;text-align:left;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.hd-search span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hd-btn{width:42px;height:42px;display:grid;place-items:center;color:#18191C;flex:0 0 42px;background:transparent;border:0;border-radius:50%;touch-action:manipulation}
.hd-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#eee;flex:0 0 34px;border:1px solid rgba(0,0,0,.04)}
.hd-avatar-btn{width:42px;height:42px;display:grid;place-items:center;background:transparent;border:0;padding:0}

/* 首页频道 tabs */
.chan{display:flex;gap:20px;overflow-x:auto;padding:4px 0 9px;scrollbar-width:none;position:relative}
.chan::-webkit-scrollbar{display:none}
.chan button{flex:0 0 auto;font-size:15px;color:#61666D;position:relative;padding-bottom:4px;white-space:nowrap}
.chan button.on{color:#18191C;font-weight:700;font-size:16px}
.chan button.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-5px;width:16px;height:3px;border-radius:2px;background:var(--pink)}

.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pad{padding:0 12px}

/* ───── 单列大卡片（B 站首页信息流） ───── */
.feed{padding:0 12px}
.fcard{padding:10px 0 12px;border-bottom:1px solid #F1F2F3}
.fcover{position:relative;width:100%;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#E7E9EB}
.fcover img{width:100%;height:100%;object-fit:cover}
.fcover .du{position:absolute;right:6px;bottom:6px;color:#fff;font-size:11px;line-height:15px;padding:0 4px;border-radius:3px;background:rgba(0,0,0,.5)}
.fcover .pl{position:absolute;left:6px;bottom:6px;display:flex;align-items:center;gap:4px;color:#fff;font-size:11px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.fcover .tagx{position:absolute;left:6px;top:6px;color:#fff;font-size:10px;line-height:16px;padding:0 5px;border-radius:3px;background:rgba(251,114,153,.95)}
.ftitle{font-size:15px;line-height:1.45;font-weight:500;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#18191C}
.fmeta{display:flex;align-items:center;gap:5px;margin-top:7px;color:#9499A0;font-size:11.5px;min-width:0}
.fmeta .up{width:16px;height:16px;border-radius:50%;object-fit:cover;background:#eee;flex:0 0 auto}
.fmeta .nm{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:44%}
.fmeta .dot{width:2px;height:2px;border-radius:50%;background:#C6C9CE;flex:0 0 auto}
.fmeta .mo{margin-left:auto;flex:0 0 auto;color:#9499A0;padding:2px}

/* 双列（番剧 / 相关推荐 / 分区） */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px 8px;padding:10px 0}
.feed2{padding-top:6px}
.acard .c{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#E7E9EB}
.acard .c img{width:100%;height:100%;object-fit:cover}
.acard .c .du{position:absolute;right:5px;bottom:5px;color:#fff;font-size:10.5px;padding:0 4px;border-radius:3px;background:rgba(0,0,0,.5)}
.acard .t{font-size:13px;line-height:1.4;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acard .m{color:#9499A0;font-size:11px;margin-top:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* 区块标题 */
.sec{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px}
.sec h3{font-size:16px;font-weight:700}
.sec .more{color:#9499A0;font-size:12px;display:flex;align-items:center;gap:2px}

/* ───── 直播间卡片 ───── */
.lcard{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #F1F2F3}
.lcard .c{position:relative;width:134px;flex:0 0 134px;aspect-ratio:16/10;border-radius:6px;overflow:hidden;background:#E7E9EB}
.lcard .c img{width:100%;height:100%;object-fit:cover}
.lcard .c .lv{position:absolute;left:5px;top:5px;display:flex;align-items:center;gap:3px;color:#fff;font-size:10px;line-height:15px;padding:0 5px;border-radius:3px;background:linear-gradient(90deg,#FB7299,#FF9DB5)}
.lcard .c .lv i{width:4px;height:4px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
.lcard .c .wn{position:absolute;right:5px;bottom:5px;color:#fff;font-size:10px;padding:0 4px;border-radius:3px;background:rgba(0,0,0,.45)}
.lcard .b{flex:1;min-width:0;display:flex;flex-direction:column}
.lcard .b .t{font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lcard .b .a{color:#9499A0;font-size:11.5px;margin-top:4px}
.lcard .b .u{margin-top:auto;display:flex;align-items:center;gap:5px;color:#61666D;font-size:11.5px}
.lcard .b .u img{width:16px;height:16px;border-radius:50%;object-fit:cover;background:#eee}

/* ───── 播放页 ───── */
.vwrap{background:#F1F2F3;min-height:100%}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.stage .bg{width:100%;height:100%;object-fit:cover}
.dmk-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.dmk{position:absolute;white-space:nowrap;font-size:13.5px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);animation:dmk linear forwards}
.dmk.me{color:#FFC0D3;font-weight:700;border:1px solid rgba(255,192,211,.8);border-radius:3px;padding:0 3px}
@keyframes dmk{from{transform:translateX(0)}to{transform:translateX(var(--d))}}
.stage-bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;padding:7px 10px;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent);color:#fff;font-size:11.5px}
.stage-bar .sp{flex:1;display:flex;align-items:center;gap:6px;height:26px;border-radius:13px;background:rgba(255,255,255,.16);padding:0 10px;color:rgba(255,255,255,.85)}
.stage-bar input{flex:1;color:#fff;font-size:12px}
.stage-bar input::placeholder{color:rgba(255,255,255,.6)}
.stage-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--top-safe) * .6) 12px 10px;z-index:6}
.stage-top .b{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.4);display:grid;place-items:center;color:#fff;flex:0 0 40px;-webkit-tap-highlight-color:transparent}
.stage-top .b svg{width:20px;height:20px}
.pbar-wrap{z-index:5}

.vbody{background:#fff;padding:12px 12px 0}
.vtitle{font-size:16.5px;font-weight:600;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vstat{color:#9499A0;font-size:11.5px;margin-top:8px;display:flex;align-items:center;gap:10px}
.vstat b{font-weight:400;color:#61666D}

.trio{display:flex;padding:16px 0 12px;border-bottom:1px solid #F1F2F3}
.trio button{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:#61666D;font-size:11.5px}
.trio button i{display:grid;place-items:center;width:34px;height:34px}
.trio button.on{color:var(--pink)}

.upcard{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #F1F2F3}
.upcard .av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#eee;flex:0 0 auto}
.upcard .nm{flex:1;min-width:0}
.upcard .nm b{display:flex;align-items:center;gap:4px;font-size:13.5px;font-weight:500}
.upcard .nm span{color:#9499A0;font-size:11px}
.btn-follow{padding:6px 16px;border-radius:16px;background:var(--pink);color:#fff;font-size:12.5px;font-weight:500;flex:0 0 auto}
.btn-follow.on{background:#F1F2F3;color:#9499A0}

.vimgbox{position:relative;margin:10px 0 2px;border-radius:8px;overflow:hidden;background:#F4F5F7}
.vimgbox img{width:100%;display:block}
.vimgbox .cap{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.45);color:#fff;font-size:10.5px;padding:2px 7px;border-radius:9px}
.imgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 2px}
.imgrid .ig{position:relative;border-radius:8px;overflow:hidden;background:#F4F5F7}
.imgrid .ig img,.imgrid .ig video{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
.imgrid .ig .tag{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.45);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px}
.vdesc{font-size:13px;line-height:1.65;color:#18191C;padding:12px 0;border-bottom:1px solid #F1F2F3;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:2px 9px;border-radius:11px;background:#F6F7F8;color:#61666D;font-size:11.5px}
.vacts{display:flex;gap:8px;padding:12px 0}
.vacts button{flex:1;height:36px;border-radius:8px;background:#F6F7F8;color:#18191C;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:5px}
.vacts button.p{background:var(--pink);color:#fff}

.cmthd{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px;border-top:8px solid #F7F8F9;margin-top:4px}
.cmthd h3{font-size:15px;font-weight:600}
.cmthd .s{color:#9499A0;font-size:12px}
.cmt{display:flex;gap:9px;padding:10px 0}
.cmt .av{width:30px;height:30px;border-radius:50%;background:#E7E9EB;color:#9499A0;display:grid;place-items:center;font-size:12px;flex:0 0 auto;overflow:hidden}
.cmt .av img{width:100%;height:100%;object-fit:cover}
.cmt .bd{flex:1;min-width:0}
.cmt .bd .nm{color:#9499A0;font-size:11.5px}
.cmt .bd .tx{font-size:13.5px;line-height:1.6;margin-top:3px;color:#18191C;word-break:break-word}
.cmt .bd .ft{display:flex;align-items:center;gap:14px;color:#9499A0;font-size:11px;margin-top:6px}
.cmt .bd .ft span{display:flex;align-items:center;gap:3px}

/* ───── 直播间 ───── */
.live{position:relative;height:100%;background:#000;display:flex;flex-direction:column;overflow:hidden}
.live .scene{position:absolute;inset:0}
.live .scene img{width:100%;height:100%;object-fit:cover;opacity:.92}
.live .scene .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.05) 30%,rgba(0,0,0,.6))}
.live-top{position:relative;z-index:3;display:flex;align-items:center;gap:8px;padding:calc(8px + var(--top-safe) * .6) 10px 4px;color:#fff}
.live-top .host{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.28);border-radius:18px;padding:3px 10px 3px 3px;max-width:52%}
.live-top .host img{width:26px;height:26px;border-radius:50%;object-fit:cover;background:#333}
.live-top .host .h{font-size:12px;line-height:1.15;overflow:hidden}
.live-top .host .h b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px}
.live-top .host .h span{font-size:9.5px;opacity:.75}
.live-top .fw{padding:4px 10px;border-radius:12px;background:var(--pink);font-size:11.5px;font-weight:600}
.live-top .fw.on{background:rgba(255,255,255,.22)}
.live-top .right{margin-left:auto;display:flex;align-items:center;gap:6px}
.live-top .lbk{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,.34);color:#fff;border-radius:14px;padding:5px 10px;font-size:11.5px;flex:0 0 auto}
.live-top .lbk svg{width:13px;height:13px}
.live-top .hot{background:rgba(0,0,0,.3);border-radius:12px;padding:3px 9px;font-size:11px}
.live-top .cls{width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.3);display:grid;place-items:center}
.live-mid{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 10px 6px}
.live-msgs{max-height:38vh;overflow-y:auto;scrollbar-width:none;padding-right:52px;mask-image:linear-gradient(180deg,transparent,#000 22%)}
.live-msgs::-webkit-scrollbar{display:none}
.lmsg{margin-bottom:7px;font-size:12.5px;line-height:1.45;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.lmsg .u{color:#9BD4FF;margin-right:4px}
.lmsg.sys{color:#FFD1DE}
.lmsg.me .u{color:#FFB3C7}
.lmsg.gift{color:#FFD98A}
.live-bar{position:relative;z-index:3;display:flex;align-items:center;gap:8px;padding:8px 10px calc(8px + var(--sb));background:linear-gradient(0deg,rgba(0,0,0,.6),rgba(0,0,0,.15))}
.live-bar .ipt{flex:1;height:34px;border-radius:17px;background:rgba(255,255,255,.16);color:#fff;padding:0 14px;font-size:12.5px}
.live-bar .ipt::placeholder{color:rgba(255,255,255,.65)}
.live-bar .send{padding:7px 13px;border-radius:17px;background:var(--pink);color:#fff;font-size:12.5px;font-weight:600}
.live-bar .ib{width:32px;height:32px;display:grid;place-items:center;color:#fff}
/* 直播间：右侧动作列 / 点赞飘心 / 在线观众 / 快捷弹幕 / 礼物横幅 */
.live-acts{position:absolute;right:9px;bottom:112px;z-index:5;display:flex;flex-direction:column;gap:9px;align-items:center}
.live-acts button{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.32);color:#fff;display:grid;place-items:flex-end;justify-items:center;padding-bottom:6px;backdrop-filter:blur(4px);position:relative}
.live-acts button .n{font-size:8.5px;line-height:1.1;opacity:.9;max-width:38px;overflow:hidden;white-space:nowrap}
.live-acts button.on{background:var(--pink)}
.live-acts button.busy{opacity:.55}
#liveHearts{position:absolute;right:16px;bottom:170px;z-index:4;pointer-events:none;width:70px;height:210px;overflow:hidden}
.heart{position:absolute;right:0;bottom:0;font-size:17px;color:#FF6699;opacity:0;animation:hfloat 1.7s ease-out forwards}
@keyframes hfloat{0%{transform:translate(0,0) scale(.5);opacity:0}18%{opacity:.95}100%{transform:translate(-26px,-190px) scale(1.15);opacity:0}}
.qtags{position:relative;z-index:3;display:flex;gap:7px;padding:0 10px 7px;overflow-x:auto;scrollbar-width:none}
.qtags::-webkit-scrollbar{display:none}
.qtags button{flex:0 0 auto;padding:5px 11px;border-radius:14px;background:rgba(255,255,255,.16);color:#fff;font-size:11.5px}
.viewers{position:relative;z-index:3;display:flex;align-items:center;gap:5px;padding:0 10px 7px;color:#fff;font-size:11px;opacity:.92}
.viewers img{width:19px;height:19px;border-radius:50%;object-fit:cover;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.2)}
.viewers .pill{background:rgba(0,0,0,.3);border-radius:10px;padding:2px 8px;font-size:10.5px}
.gift-banner{position:absolute;left:0;right:0;top:calc(52px + env(safe-area-inset-top,0px));z-index:6;display:flex;justify-content:center;pointer-events:none;opacity:0;transform:translateY(-8px);transition:.28s}
.gift-banner.on{opacity:1;transform:none}
.gift-banner .gb{display:flex;align-items:center;gap:9px;background:linear-gradient(90deg,rgba(255,102,153,.95),rgba(255,153,102,.95));padding:8px 16px;border-radius:22px;color:#fff;font-size:12.5px;font-weight:600;box-shadow:0 8px 22px rgba(255,102,153,.4)}
.gift-banner .gb .e{font-size:20px}
.gift-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gift-grid button{background:#F4F5F7;border-radius:10px;padding:10px 2px;font-size:11px;color:#18191C;line-height:1.25}
.gift-grid button .e{font-size:22px;display:block;margin-bottom:3px}
.gift-grid button .p{color:#FF6699;font-size:10px;margin-top:3px}
.board{margin-top:10px}
.board .row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;border-bottom:1px solid #F1F2F3}
.board .row:last-child{border-bottom:0}
.board .row b{width:16px;color:#FF6699}
.board .row .amt{margin-left:auto;color:#9499A0;font-size:11.5px}

/* ───── 动态 ───── */
.dyn{background:#fff;margin-bottom:8px;padding:12px}
.dyn-hd{display:flex;align-items:center;gap:9px}
.dyn-hd img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#eee}
.dyn-hd .nm{flex:1;min-width:0}
.dyn-hd .nm b{font-size:13.5px;font-weight:500;display:block}
.dyn-hd .nm span{font-size:11px;color:#9499A0}
.dyn-hd .fw{padding:4px 12px;border-radius:13px;border:1px solid var(--pink);color:var(--pink);font-size:11.5px}
.dyn-hd .fw.on{border-color:#E3E5E7;color:#9499A0}
.dyn-tx{font-size:13.5px;line-height:1.65;margin:9px 0 0;color:#18191C;word-break:break-word}
.dyn-media{margin-top:9px;border-radius:6px;overflow:hidden;aspect-ratio:16/9;background:#E7E9EB}
.dyn-media img{width:100%;height:100%;object-fit:cover}
.dyn-ft{display:flex;align-items:center;gap:26px;color:#9499A0;font-size:11.5px;margin-top:10px}
.dyn-ft span{display:flex;align-items:center;gap:4px}
.dyn-link{display:flex;gap:9px;margin-top:9px;padding:8px;border-radius:6px;background:#F6F7F8}
.dyn-link img{width:78px;height:46px;border-radius:4px;object-fit:cover;background:#E7E9EB}
.dyn-link .t{flex:1;font-size:12.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ───── 我的 ───── */
.me-top{background:#fff;padding:0 0 14px}
.me-banner{height:96px;background:linear-gradient(120deg,#FFD6E2,#FFE9F0 55%,#E8F4FF)}
.me-id{display:flex;align-items:flex-end;gap:12px;padding:0 14px;margin-top:-30px}
.me-id img{width:66px;height:66px;border-radius:50%;border:3px solid #fff;object-fit:cover;background:#eee}
.me-id .n{flex:1;padding-bottom:2px}
.me-id .n b{font-size:17px;font-weight:600;display:block}
.me-id .n span{font-size:11.5px;color:#9499A0}
.me-id .edit{padding:5px 12px;border-radius:14px;border:1px solid #E3E5E7;font-size:12px;color:#61666D;margin-bottom:4px}
.me-nums{display:flex;gap:26px;padding:12px 14px 0}
.me-nums div b{font-size:15px;font-weight:600}
.me-nums div span{font-size:11.5px;color:#9499A0;margin-left:3px}
.me-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 0;background:#fff;margin-top:10px;padding:14px 6px;border-radius:8px}
.me-grid button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:#61666D}
.me-grid button .ic{width:34px;height:34px;border-radius:50%;background:#FFF1F5;display:grid;place-items:center;color:var(--pink)}
.mlist{background:#fff;border-radius:8px;margin-top:10px;overflow:hidden}

/* —— 视频字幕 + 语音连播 —— */
var SUB_DUR = 9000;
function subsOf(v) {
  if (v && Array.isArray(v.subs) && v.subs.length) return v.subs;
  var src = String((v && (v.summary || v.title)) || '').split(/[。！？!?；;\n]/).filter(function (x) { return String(x).trim().length > 1; });
  var out = src.slice(0, 6).map(function (t) { return String(t).trim(); });
  if (!out.length) out = [String((v && v.title) || '一段安静的日常')];
  return out;
}
function stopSubPlay() {
  if (S._subTimer) { clearTimeout(S._subTimer); S._subTimer = null; }
  try { if (_audio) { _audio.pause(); _audio = null; } } catch (e) { }
  S.subPlaying = false;
  var bar = $('#subBar'); if (bar) bar.classList.add('hide');
  var btn = $('[data-act^="subplay:"]'); if (btn) btn.textContent = '▶ 语音连播';
}
function playSubs(v) {
  stopSubPlay();
  var lines = subsOf(v), i = 0;
  S.subPlaying = true;
  var bar = $('#subBar'); if (bar) bar.classList.remove('hide');
  var btn = $('[data-act^="subplay:"]'); if (btn) btn.textContent = '⏸ 停止';
  function step() {
    if (!S.subPlaying || i >= lines.length) { stopSubPlay(); return; }
    var txt = lines[i++];
    var bar2 = $('#subBar'); if (bar2) bar2.innerHTML = '<span>' + esc(txt) + '</span>';
    var wait = SUB_DUR;
    try {
      var h = window.AiPhone || window.AiPhoneApp;
      if (h && h.voice && h.voice.tts && S.settings.voiceOn !== false) {
        h.voice.tts({ text: String(txt).slice(0, 120) }).then(function (r) {
          if (!r || !r.dataUrl || !S.subPlaying) return;
          try { if (_audio) _audio.pause(); } catch (e) { }
          _audio = new Audio(r.dataUrl);
          _audio.play().catch(function () { });
        }).catch(function () { });
      }
    } catch (e) { }
    S._subTimer = setTimeout(step, wait);
  }
  step();
}
function actVPlay(id) {
  var v = S.videos.filter(function (x) { return x.id === id; })[0];
  if (!v) return;
  if (S.subPlaying) { stopSubPlay(); return; }
  playSubs(v);
}
function actVTts(id) {
  var v = S.videos.filter(function (x) { return x.id === id; })[0];
  if (!v) return;
  speak(subsOf(v).join('。'));
}

/* 兜底手势：从左边缘往右滑 = 返回（有些 WebView 吞 click，手势不依赖 click） */
(function () {
  var sx = 0, sy = 0, st = 0;
  document.addEventListener('touchstart', function (e) {
    if (!e.touches || e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var dx = t.clientX - sx, dy = Math.abs(t.clientY - sy);
    if (Date.now() - st > 800) return;
    if (sx < 48 && dx > 70 && dy < 60) { try { backRoute(); } catch (err) {} }
  }, { passive: true });
})();

window.__tap = window.__tap || { pd: 0, cl: 0, te: 0, last: '' };
document.addEventListener('pointerdown', function (e) {
  window.__tap.pd++;
  var t = e.target || {};
  window.__tap.hit = (t.tagName || '') + (t.className ? '.' + String(t.className).split(' ')[0] : '') + (t.getAttribute && t.getAttribute('data-act') ? '[' + t.getAttribute('data-act') + ']' : '');
  window.__tap.xy = Math.round(e.clientX) + ',' + Math.round(e.clientY);
  var el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if (el) window.__tap.last = el.getAttribute('data-act') || '';
}, true);
document.addEventListener('touchend', function (e) { window.__tap.te++; }, true);

function actCloneVoice(cid) {
  var c = (S.creators || []).filter(function (x) { return x.id === cid; })[0];

  if (!key) { toast('先去 设置 → 视频生成 填 MiniMax Key'); return; }
  var inp = $('#edCloneFile');
  if (!inp) return;
  inp.value = '';
  inp.onchange = function () {
    var f = inp.files && inp.files[0];
    if (!f) return;
    if (f.size > 20 * 1024 * 1024) { toast('音频太大（限 20MB）'); return; }
    var vid = 'float_' + String(cid).replace(/[^a-zA-Z0-9]/g, '').slice(0, 8) + '_' + (Date.now() % 100000);
    var fd = new FormData();

    fd.append('voice_id', vid);
    fd.append('text', '这是克隆音色的试听，今天也谢谢你来看我。');
    fd.append('model', 'speech-2.6-hd');
    busy(true, '正在克隆音色…');
    fetch('https://api.minimaxi.com/v1/voice_clone', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + key },
      body: fd
    }).then(function (r) { return r.json(); }).then(function (j) {
      busy(false);
      var code = j && j.base_resp ? j.base_resp.status_code : -1;
      if (code !== 0) { toast('克隆失败：' + ((j && j.base_resp && j.base_resp.status_msg) || '检查 Key/额度')); return; }
      c.voiceId = vid;
      dbUpdate('creators', cid, { voiceId: vid }).catch(function () { });
      sfx('ok'); toast('克隆完成，已设为 TA 的音色');
      closeSheet(); render();
    }).catch(function (e) { busy(false); toast('克隆失败：' + (e.message || e)); });
  };
  inp.click();
}

function readFileAsDataUrl(file, maxMB) {
  return new Promise(function (res, rej) {
    if (!file) return rej(new Error('没有选择文件'));
    if (file.size > maxMB * 1024 * 1024) return rej(new Error('文件太大（上限 ' + maxMB + 'MB）'));
    var fr = new FileReader();
    fr.onload = function () { res(String(fr.result || '')); };
    fr.onerror = function () { rej(new Error('读取文件失败')); };
    fr.readAsDataURL(file);
  });
}
