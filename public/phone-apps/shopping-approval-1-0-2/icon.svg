<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <rect width="256" height="256" rx="56" fill="#FFFFFF"/>
  <!-- ticket body -->
  <rect x="48" y="56" width="160" height="144" rx="12" stroke="#262626" stroke-width="7" fill="none"/>
  <!-- notches left -->
  <circle cx="48" cy="128" r="14" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/>
  <path d="M48 114 A14 14 0 0 1 48 142" stroke="#262626" stroke-width="7" fill="none"/>
  <!-- notches right -->
  <circle cx="208" cy="128" r="14" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/>
  <path d="M208 142 A14 14 0 0 1 208 114" stroke="#262626" stroke-width="7" fill="none"/>
  <!-- dashed line -->
  <line x1="80" y1="128" x2="176" y2="128" stroke="#262626" stroke-width="4" stroke-dasharray="8 6" stroke-linecap="round"/>
  <!-- top lines (title area) -->
  <line x1="80" y1="84" x2="160" y2="84" stroke="#262626" stroke-width="6" stroke-linecap="round"/>
  <line x1="80" y1="100" x2="130" y2="100" stroke="#262626" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <!-- bottom check -->
  <path d="M108 156 L120 168 L148 140" stroke="#262626" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>