<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
  <script src="/phone-apps/ai-phone-host.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>攻略系统</title>
<style>
  :root{
    --bg:#0d0a13;
    --card:rgba(255,255,255,.055);
    --card2:rgba(255,255,255,.085);
    --line:rgba(255,255,255,.10);
    --txt:#f3eef9;
    --dim:#a79cbb;
    --pink:#ff7ab8;
    --violet:#a78bfa;
    --gold:#ffcb6b;
    --green:#5fd6a5;
    --red:#ff8080;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;min-height:100%}
  body{
    background:
      radial-gradient(120% 55% at 8% -8%, rgba(255,122,184,.20), transparent 62%),
      radial-gradient(110% 50% at 100% 0%, rgba(167,139,250,.20), transparent 60%),
      linear-gradient(180deg,#0d0a13 0%,#100b19 45%,#0a0810 100%);
    background-attachment:fixed;
    color:var(--txt);
    font:15px/1.66 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    min-height:100dvh;
  }
  .app{
    max-width:640px;
    margin:0 auto;
    padding:0 16px var(--ai-phone-app-safe-bottom, 28px);
    padding-top:calc(var(--ai-phone-app-bar-top, 56px) + 46px + 8px);
  }
  /* ---------- 顶栏（方案 A：与宿主胶囊同排） ---------- */
  .topbar{
    position:fixed;
    top:var(--ai-phone-app-bar-top, 56px);
    left:16px;
    right:var(--ai-phone-app-bar-clear-right, 96px);
    min-height:var(--ai-phone-app-bar-height, 30px);
    display:flex;align-items:center;z-index:30;
  }
  .brand{
    display:inline-flex;align-items:center;gap:9px;
    padding:5px 13px 5px 6px;border-radius:999px;
    background:rgba(18,13,26,.74);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);
  }
  .logo{
    width:24px;height:24px;border-radius:50%;flex:none;
    display:grid;place-items:center;font-size:12px;color:#22092f;font-weight:700;
    background:linear-gradient(140deg,#ffb3d9,#c3a9ff 70%);
  }
  .brand-txt{font-size:14.5px;font-weight:600;letter-spacing:.04em}
  /* ---------- 通用卡片 ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:14px;
    margin-top:12px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  /* ---------- 角色卡 ---------- */
  .char-head{display:flex;align-items:center;gap:12px}
  .avatar{
    width:46px;height:46px;border-radius:15px;flex:none;
    display:grid;place-items:center;font-size:18px;font-weight:700;color:#1c0d26;
    background:linear-gradient(140deg,#ffb3d9,#c3a9ff 72%);
    box-shadow:0 6px 18px rgba(255,122,184,.22);
  }
  .char-main{min-width:0;flex:1}
  .char-name{font-size:17px;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .char-line{font-size:12.5px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .charcard{padding:11px 12px;margin-top:6px}
  .charcard .avatar{width:38px;height:38px;border-radius:12px;font-size:15px}
  .charcard .char-name{font-size:15.5px}
  .charcard .char-line{font-size:12px}
  /* 单行设置行（面具等） */
  .rowcard{padding:0;overflow:hidden;margin-top:8px}
  .rowbtn{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:none;border:0;padding:11px 14px;min-height:auto;text-align:left;font-size:14px;
  }
  .rowbtn em{
    font-style:normal;font-size:12px;color:var(--dim);margin-left:7px;
    display:inline-block;max-width:50vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;
  }
  .rowbtn .chev{color:var(--dim);font-size:17px;flex:none}
  .opt .ocheck{
    width:18px;height:18px;flex:none;border-radius:6px;border:1px solid rgba(255,255,255,.3);
    display:grid;place-items:center;font-size:11px;color:#1c0d26;
  }
  .opt.on .ocheck{background:linear-gradient(140deg,#ffb3d9,#c3a9ff);border-color:transparent}
  .sheet-foot{display:flex;gap:8px;margin-top:13px}
  .sheet-foot .primary{flex:1}
  .pitem{
    width:100%;display:block;text-align:left;background:rgba(255,255,255,.05);
    border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-top:8px;min-height:auto;
  }
  .pitem.on{border-color:rgba(255,122,184,.6);background:rgba(255,122,184,.12)}
  .pitem b{font-size:13.5px;display:block}
  .pitem small{display:block;font-size:11.5px;color:var(--dim);line-height:1.55;margin-top:3px}
  /* ---------- 按钮 ---------- */
  button{font:inherit;color:inherit;cursor:pointer}
  .ghost{
    background:rgba(255,255,255,.08);border:1px solid var(--line);
    border-radius:11px;padding:7px 12px;font-size:13px;min-height:auto;flex:none;
  }
  .ghost.tiny{padding:4px 10px;font-size:12px;border-radius:9px;color:var(--dim)}
  .primary{
    background:linear-gradient(135deg,#ff8fc3,#a78bfa);color:#1d0a24;font-weight:600;
    border:0;border-radius:12px;padding:11px 18px;font-size:14px;
    box-shadow:0 8px 22px rgba(255,122,184,.24);
  }
  .primary.small{padding:8px 14px;font-size:13px;border-radius:10px}
  /* ---------- 模式选择 ---------- */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .mode{
    text-align:left;padding:13px 12px 14px;border-radius:16px;
    border:1px solid var(--line);
    display:flex;flex-direction:column;gap:2px;min-height:auto;
    transition:border-color .18s, box-shadow .18s, transform .18s;
  }
  .m-task{background:linear-gradient(158deg, rgba(255,122,184,.17), rgba(255,122,184,.04) 70%)}
  .m-suggest{background:linear-gradient(158deg, rgba(167,139,250,.17), rgba(167,139,250,.04) 70%)}
  .mode b{font-size:15px;font-weight:600}
  .mode small{font-size:11.5px;line-height:1.5;color:var(--dim)}
  .m-ic{font-size:15px;line-height:1;color:var(--pink);margin-bottom:2px}
  .m-suggest .m-ic{color:var(--violet)}
  .mode.on{border-color:rgba(255,122,184,.62);box-shadow:0 0 0 1px rgba(255,122,184,.3), 0 10px 26px rgba(255,122,184,.15)}
  .m-suggest.on{border-color:rgba(167,139,250,.68);box-shadow:0 0 0 1px rgba(167,139,250,.32), 0 10px 26px rgba(167,139,250,.15)}
  .mode:active{transform:scale(.985)}
  .note{font-size:11.5px;line-height:1.6;color:#8f85a3;margin:9px 2px 0}
  /* ---------- 补充线索 ---------- */
  .brief{padding:0;overflow:hidden}
  .brief-head{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:none;border:0;padding:13px 14px;min-height:auto;text-align:left;font-size:14px;
  }
  .brief-head em{font-style:normal;font-size:11.5px;color:#8f85a3;margin-left:7px}
  .arrow{color:var(--dim);font-size:16px;transition:transform .2s}
  .brief.open .arrow{transform:rotate(45deg)}
  .brief-body{padding:0 14px 14px;border-top:1px solid var(--line)}
  textarea{
    width:100%;margin-top:12px;padding:11px 12px;border-radius:12px;resize:vertical;
    background:rgba(0,0,0,.26);border:1px solid var(--line);color:var(--txt);
    font:inherit;font-size:13.5px;line-height:1.6;min-height:104px;outline:none;
  }
  textarea:focus{border-color:rgba(255,122,184,.5)}
  .brief-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
  .brief-foot span{font-size:11.5px;color:#8f85a3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* ---------- 输出区 ---------- */
  #output{margin-top:2px}
  .snap{
    margin-top:14px;padding:15px 15px 14px;border-radius:18px;
    background:linear-gradient(150deg, rgba(255,122,184,.16), rgba(167,139,250,.10));
    border:1px solid rgba(255,255,255,.13);
  }
  .stage{
    font-size:11px;letter-spacing:.14em;color:var(--gold);font-weight:600;
    text-transform:uppercase;
  }
  .read{font-size:15.5px;line-height:1.65;margin-top:5px}
  .basis{margin-top:10px;padding-top:9px;border-top:1px dashed rgba(255,255,255,.16);font-size:12px;color:#b7adc9;line-height:1.6}
  .basis i{font-style:normal;color:var(--violet)}
  .basis ul{margin:4px 0 0;padding-left:16px}
  .basis li{margin-top:2px}
  .tcard,.scard{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px;margin-top:10px;
  }
  .tcard.done{opacity:.58}
  .tcard-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .idx{
    font-size:11px;font-weight:700;letter-spacing:.06em;color:#1c0d26;
    background:linear-gradient(140deg,#ffb3d9,#c3a9ff);border-radius:7px;padding:2px 7px;
  }
  .pill{
    font-size:11px;padding:2px 8px;border-radius:999px;
    background:rgba(255,255,255,.09);border:1px solid var(--line);color:#d8d0e8;
  }
  .pill.ok{background:rgba(95,214,165,.16);border-color:rgba(95,214,165,.4);color:var(--green)}
  .pill.tgt{background:rgba(255,203,107,.15);border-color:rgba(255,203,107,.4);color:var(--gold)}
  .star{font-size:11.5px;color:var(--gold);letter-spacing:1px}
  .tiny-txt{margin-left:auto}
  .tcard h4,.scard h4{margin:8px 0 0;font-size:16px;line-height:1.45;font-weight:600}
  .why{margin:7px 0 0;font-size:13.5px;line-height:1.68;color:#d9d1e8}
  .how{margin:9px 0 0;padding-left:19px;font-size:13.5px;line-height:1.72;color:#ded7ec}
  .how li{margin-top:4px}
  .kv{margin-top:8px;font-size:12.5px;color:#c9c0da;line-height:1.6}
  .kv span{
    display:inline-block;min-width:40px;margin-right:7px;font-size:11px;
    color:var(--violet);letter-spacing:.05em;
  }
  .risk{
    margin-top:9px;padding:8px 10px;border-radius:10px;font-size:12.5px;line-height:1.6;
    background:rgba(255,128,128,.10);border-left:2px solid rgba(255,128,128,.6);color:#ffc9c9;
  }
  .opener{
    margin-top:10px;padding:10px 11px;border-radius:12px;
    background:rgba(0,0,0,.24);border:1px dashed rgba(255,255,255,.18);
  }
  .opener span{font-size:10.5px;color:#8f85a3;letter-spacing:.06em}
  .opener p{margin:5px 0 0;font-size:13.5px;line-height:1.66;color:#f0eaf8}
  .row-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
  .mini{
    background:rgba(255,255,255,.09);border:1px solid var(--line);border-radius:10px;
    padding:7px 13px;font-size:12.5px;min-height:auto;color:#e6dff5;
  }
  .mini.primary-mini{
    background:linear-gradient(135deg,rgba(255,143,195,.9),rgba(167,139,250,.9));
    color:#1d0a24;font-weight:600;border:0;
  }
  .tabs{display:flex;gap:6px;margin-top:12px;padding:4px;border-radius:13px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
  .tab{
    flex:1;text-align:center;padding:9px 6px;border-radius:10px;border:0;background:none;
    font-size:13px;color:var(--dim);min-height:auto;
  }
  .tab.on{background:rgba(255,255,255,.13);color:var(--txt);font-weight:600}
  .outfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
  .foot-note{font-size:11.5px;color:#8f85a3}
  /* ---------- 状态卡 ---------- */
  .loading{
    margin-top:14px;padding:18px 16px;border-radius:16px;
    background:var(--card);border:1px solid var(--line);
    display:flex;flex-direction:column;gap:11px;
  }
  .spinner{
    width:22px;height:22px;border-radius:50%;
    border:2px solid rgba(255,255,255,.16);border-top-color:var(--pink);
    animation:spin .85s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .load-txt{font-size:14px;color:#eae3f6}
  .load-sub{font-size:11.5px;color:#8f85a3;line-height:1.6}
  .errcard{
    margin-top:14px;padding:16px;border-radius:16px;
    background:rgba(255,128,128,.09);border:1px solid rgba(255,128,128,.32);
  }
  .errcard b{font-size:14.5px;color:#ffb3b3}
  .errcard p{margin:7px 0 0;font-size:13px;line-height:1.66;color:#f0dada;word-break:break-word}
  .errcard .hint{color:#bfa9b6;font-size:12px}
  .errcard .primary{margin-top:12px}
  .tipcard{
    margin-top:14px;padding:15px;border-radius:16px;
    background:var(--card);border:1px dashed rgba(255,255,255,.16);
    font-size:13px;line-height:1.7;color:#c6bdd7;
  }
  .tipcard b{color:var(--txt)}
  .rawcard{
    margin-top:14px;padding:14px;border-radius:16px;
    background:rgba(255,203,107,.07);border:1px solid rgba(255,203,107,.26);
  }
  .rawcard b{font-size:13.5px;color:var(--gold)}
  .rawcard pre{
    margin:9px 0 0;white-space:pre-wrap;word-break:break-word;
    font:13px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#ded6ea;
    max-height:340px;overflow:auto;
  }
  /* ---------- 历史 ---------- */
  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
  .sec-head b{font-size:14px}
  .hist-list{margin-top:6px}
  .hitem{
    width:100%;display:flex;align-items:center;gap:10px;text-align:left;
    background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:13px;
    padding:10px 11px;margin-top:8px;min-height:auto;
  }
  .hitem:active{background:rgba(255,255,255,.08)}
  .hicon{
    width:26px;height:26px;flex:none;border-radius:9px;display:grid;place-items:center;
    font-size:12px;color:#1c0d26;background:linear-gradient(140deg,#ffb3d9,#c3a9ff);
  }
  .hmain{flex:1;min-width:0;display:flex;flex-direction:column}
  .hmain b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hmain small{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .htime{font-size:11px;color:#7d748f;flex:none}
  .empty-txt{margin:8px 0 0;font-size:12.5px;color:#8f85a3;line-height:1.6}
  .foot{font-size:11px;line-height:1.6;color:#6f6782;text-align:center;margin:18px 0 4px}
  /* ---------- 角色选择浮层 ---------- */
  .sheet{
    position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;
    background:rgba(6,4,10,.62);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  }
  .sheet-panel{
    width:100%;max-height:72dvh;overflow:auto;
    background:#161022;border-top:1px solid var(--line);
    border-radius:22px 22px 0 0;padding:16px 16px calc(var(--ai-phone-app-safe-bottom, 24px) + 6px);
    animation:up .22s ease-out;
  }
  @keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
  .sheet-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .sheet-title b{font-size:15px}
  .opt{
    width:100%;display:flex;align-items:center;gap:10px;text-align:left;
    background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:13px;
    padding:10px 12px;margin-top:8px;min-height:auto;
  }
  .opt.on{border-color:rgba(255,122,184,.6);background:rgba(255,122,184,.12)}
  .opt .oavatar{
    width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;
    font-size:13px;font-weight:700;color:#1c0d26;background:linear-gradient(140deg,#ffb3d9,#c3a9ff);
  }
  .opt .oname{font-size:14px;font-weight:500}
  .opt .osub{font-size:11.5px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toast{
    position:fixed;left:50%;bottom:calc(var(--ai-phone-app-safe-bottom, 24px) + 18px);
    transform:translateX(-50%);z-index:120;
    max-width:82vw;padding:10px 15px;border-radius:12px;font-size:13px;line-height:1.5;
    background:rgba(28,20,40,.94);border:1px solid var(--line);color:var(--txt);
    box-shadow:0 12px 32px rgba(0,0,0,.42);text-align:center;
  }
</style>
</head>
<body>
<main class="app" id="app">
  <header class="topbar">
    <div class="brand"><span class="logo">◎</span><span class="brand-txt">攻略系统</span></div>
  </header>

  <section class="card charcard" id="charCard">
    <div class="char-head">
      <div class="avatar" id="charAvatar">—</div>
      <div class="char-main">
        <div class="char-name" id="charName">载入中…</div>
        <div class="char-line" id="charLine">正在读取角色</div>
      </div>
      <button class="ghost" id="btnSwitch">选择</button>
    </div>
  </section>

  <section class="card rowcard">
    <button class="rowbtn" id="btnPersona">
      <span>面具<em id="personaName">跟随默认</em></span>
      <span class="chev">›</span>
    </button>
  </section>

  <div class="modes">
    <button class="mode m-task" data-mode="task">
      <span class="m-ic">◎</span>
      <b>推进任务</b>
      <small>你该做什么，把关系往前推</small>
    </button>
    <button class="mode m-suggest" data-mode="suggest">
      <span class="m-ic">✧</span>
      <b>下一步建议</b>
      <small>你接下来能做什么 · 线上／线下</small>
    </button>
  </div>
  <p class="note">每次推演自动载入角色人设、用户人设、当前关系数据，以及核心记忆 / 长期记忆 / 近期事件流（含漫卷、线下剧情与聊天）。</p>

  <section class="card brief" id="briefCard">
    <button class="brief-head" id="btnBrief">
      <span>补充剧情线索<em>可选</em></span>
      <span class="arrow" id="briefArrow">＋</span>
    </button>
    <div class="brief-body" id="briefBody" hidden>
      <textarea id="briefText" rows="5" placeholder="粘贴漫卷剧情、线下发生的事、你正在打算的安排……这部分会作为可信度最高的依据参与推演。"></textarea>
      <div class="brief-foot">
        <span id="briefHint">未填写 · 只用应用内记忆</span>
        <button class="primary small" id="btnSaveBrief">保存</button>
      </div>
    </div>
  </section>

  <div id="output"></div>

  <section class="card">
    <div class="sec-head"><b>历史记录</b><button class="ghost tiny" id="btnClearHist">清空</button></div>
    <div id="historyList" class="hist-list"><p class="empty-txt">还没有记录。</p></div>
  </section>

  <p class="foot">推演内容由你配置的模型 API 生成，仅供参考。全部数据只保存在本机。</p>
</main>

<script>
(function () {
  'use strict';

  var api = window.AiPhone || window.AiPhoneApp;
  if (!api) {
    document.body.innerHTML = '<div style="padding:60px 22px;color:#ff9b9b;font:14px/1.7 sans-serif">未检测到小手机宿主环境，请在手机里打开本应用。</div>';
    return;
  }

  var state = {
    launch: null,
    chars: [],
    charIds: [],
    charId: null,
    char: {},
    charInfo: {},
    personas: [],
    personaId: '',
    personaText: '',
    user: {},
    brief: '',
    runs: [],
    current: null,
    mode: null,
    busy: false
  };

  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function clip(s, n) {
    s = String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
    return s.length > n ? s.slice(0, n) + '…' : s;
  }
  function asArray(v) {
    if (!v) return [];
    if (Array.isArray(v)) return v;
    var keys = ['items', 'list', 'records', 'rows', 'data', 'entries', 'results', 'values', 'stateValues', 'relations', 'tasks', 'online', 'offline', 'characters', 'personas'];

  function safe(fn, fb) {

  /* ---------- 字段名友好化 ---------- */
  var LABEL_MAP = {
    relation: '关系', relationship: '关系', affection: '好感', favor: '好感', favorability: '好感',
    trust: '信任', intimacy: '亲密', closeness: '亲密度', love: '爱意', score: '好感度',
    level: '阶段', stage: '阶段', stage_name: '阶段', progress: '进展', mood: '心情',
    status: '状态', tension: '张力', type: '类型', name: '名称', value: '数值',
    dependency: '依赖', jealousy: '占有欲', respect: '尊重', understanding: '默契'
  };
  function labelOf(l) {
    var k = String(l == null ? '' : l).trim();
    var nk = k.toLowerCase().replace(/[\s_\-]/g, '');
    if (LABEL_MAP[k]) return LABEL_MAP[k];
    if (LABEL_MAP[nk]) return LABEL_MAP[nk];
    return k;
  }
  function fmtVal(v) {
    if (v === true) return '是';
    if (v === false) return '否';
    if (v == null) return '';
    if (typeof v === 'number') return String(Math.round(v * 100) / 100);
    return clip(String(v), 60);
  }

  /* 把未知结构的关系 / 状态数据拍平成 label-value 对 */
  function pairsFrom(v, depth, out) {
    depth = depth || 0;
    out = out || [];
    if (!v || depth > 2 || out.length > 24) return out;
    if (Array.isArray(v)) {
      v.forEach(function (it) {
        if (it && typeof it === 'object') {
          var label = it.name != null ? it.name : (it.label != null ? it.label : (it.key != null ? it.key : it.title));
          var val = it.value != null ? it.value : (it.text != null ? it.text : (it.content != null ? it.content : it.level));
          if (label != null && (typeof val !== 'object' || val === null)) {
            out.push({ label: String(label), value: fmtVal(val) });
          } else {
            pairsFrom(it, depth + 1, out);
          }
        }
      });
      return out;
    }
    if (typeof v === 'object') {
      Object.keys(v).forEach(function (k) {
        var val = v[k];
        if (val == null || k === 'id' || k === 'characterId' || k === 'updatedAt' || k === 'createdAt') return;
        if (typeof val === 'object') pairsFrom(val, depth + 1, out);
        else out.push({ label: labelOf(k), value: fmtVal(val) });
      });
    }
    return out;
  }

  /* 从记忆结构里抽出可用文本 */
  function collectTexts(v, out, depth) {
    out = out || [];
    depth = depth || 0;
    if (!v || depth > 3 || out.length > 80) return out;
    if (typeof v === 'string') {
      if (v.trim()) out.push(v.trim());
      return out;
    }
    if (Array.isArray(v)) {
      v.forEach(function (x) { collectTexts(x, out, depth + 1); });
      return out;
    }
    if (typeof v === 'object') {
      var t = v.content != null ? v.content : (v.summary != null ? v.summary : (v.text != null ? v.text : (v.detail != null ? v.detail : null)));
      if (typeof t === 'string' && t.trim()) out.push(t.trim());
      else {
        Object.keys(v).forEach(function (k) {
          if (k === 'id' || k === 'createdAt' || k === 'updatedAt') return;
          collectTexts(v[k], out, depth + 1);
        });
      }
    }
    return out;
  }
  function uniqTexts(arr) {
    var seen = {};
    var out = [];
    (arr || []).forEach(function (t) {
      var s = String(t || '').replace(/\s+/g, ' ').trim();
      if (!s || s.length < 2) return;
      var key = s.slice(0, 40);
      if (seen[key]) return;
      seen[key] = 1;
      out.push(s);
    });
    return out;
  }

  function fmtTime(iso, short) {
    var d = iso ? new Date(iso) : new Date();
    if (isNaN(d.getTime())) return '';
    var p = function (n) { return String(n).padStart(2, '0'); };
    var md = (d.getMonth() + 1) + '/' + d.getDate();
    var hm = p(d.getHours()) + ':' + p(d.getMinutes());
    return short ? md + ' ' + hm : (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hm;
  }

  function nameOf(c) {

  /* ---------- 数据层 ---------- */
  var metaCache = null;

  function dbList(col, opts) {
    return safe(function () { return api.db.list(col, Object.assign({ limit: 200 }, opts || {})); }, []).then(asArray);
  }
  async function readMeta() {
    if (metaCache) return metaCache;

    metaCache = {};

    return metaCache;

  async function setMeta(key, value) {
    var m = await readMeta();

    var found = null;
    for (var i = 0; i < rows.length; i++) { if (rows[i].key === key) { found = rows[i]; break; } }
    if (found) await safe(function () { return api.db.update('meta', found.id, { value: value }); });
    else await safe(function () { return api.db.create('meta', { key: key, value: value }); });

  /* ---------- 角色载入 ---------- */
  async function init() {

    }

    var meta = await readMeta();

      for (var i = 0; i < state.chars.length; i++) if (state.chars[i].id === id) return true;
      return false;
    };
    var picks = [];
    if (state.launch && state.launch.characterId && exist(state.launch.characterId)) {
      picks = [state.launch.characterId];
    } else {
      var savedList = asArray(meta['selectedCharacterIds']);
      picks = savedList.filter(exist);
      if (!picks.length) {
        var savedOne = meta['selectedCharacterId'];
        picks = (savedOne && exist(savedOne)) ? [savedOne] : [state.chars[0].id];
      }
    }

  async function selectCharacters(ids) {
    ids = (ids || []).filter(Boolean);
    if (!ids.length) return;
    state.charIds = ids.slice();
    state.charId = ids[0];
    state.charInfo = {};
    state.current = null;

    $$('.mode').forEach(function (b) { b.classList.remove('on'); });

    await setMeta('selectedCharacterIds', state.charIds.slice());

    for (var i = 0; i < ids.length; i++) {
      var id = ids[i];

      }
      var rel = await safe(function () { return api.characters.readRelations({ characterId: id }); }, null);
      var stv = await safe(function () { return api.characters.readState({ characterId: id }); }, null);
      state.charInfo[id] = {

  async function loadPersonas(ids) {
    var list = [];
    var collect = function (raw, source) {
      asArray(raw).forEach(function (p) {
        var text = personaTextOf(p);
        if (!text) return;
        if (list.some(function (x) { return x.text === text; })) return;
        var nm = personaNameOf(p, '面具 ' + (list.length + 1));
        list.push({
          id: (p && p.id) ? String(p.id) : ('p' + list.length),
          name: nm,
          text: text,
          source: source
        });
      });
    };

    // 1) 优先读账号里的面具列表
    var fnNames = ['listPersonas', 'getPersonas', 'readPersonas', 'listUserPersonas', 'listMasks'];
    for (var i = 0; i < fnNames.length && !list.length; i++) {
      var fn = api.user && api.user[fnNames[i]];
      if (typeof fn !== 'function') continue;
      var raw = await safe(function () { return fn.call(api.user, {}); }, null);
      collect(raw, 'list');
      if (!list.length) {
        var raw2 = await safe(function () { return fn.call(api.user, { characterId: ids[0] }); }, null);
        collect(raw2, 'list');
      }
    }

    // 2) 退一步：读当前角色绑定的面具
    if (!list.length) {
      for (var k = 0; k < ids.length; k++) {
        var pid = ids[k];
        var one = await safe(function () { return api.user.getPersona({ characterId: pid }); }, null);
        var text = personaTextOf(one);
        if (!text) continue;
        if (list.some(function (x) { return x.text === text; })) continue;
        var cname = nameOf(state.charInfo[pid] && state.charInfo[pid].char);
        list.push({
          id: 'char:' + pid,
          name: personaNameOf(one, cname + ' 绑定的面具'),
          text: text,
          source: 'char'
        });
      }
    }

    state.personas = list;
    var meta = await readMeta();
    var key = ids.join('+');
    var saved = meta['persona:' + key] || '';
    if (saved === 'custom') {
      var ct = meta['personaText:' + key] || '';
      state.personaId = ct ? 'custom' : '';
      state.personaText = ct || '';
      return;
    }
    var hit = null;
    for (var m = 0; m < list.length; m++) if (list[m].id === saved) { hit = list[m]; break; }
    if (hit) {
      state.personaId = hit.id;
      state.personaText = hit.text;
    } else if (saved === '' && meta['personaPinned:' + key]) {
      state.personaId = 'char:' + ids[0];
      state.personaText = (list[0] && list[0].text) || '';
    } else {
      state.personaId = '';
      state.personaText = '';
    }
  }

        + tf2
        + '"title":"你能促成的事（14字内）","idea":"你可以怎么安排、怎么推进这件事（60字内）","where":"场景或地点","might":"可能的走向","timing":"时机"}]}');
      L.push('online 和 offline 各 3 条。opener 必须是 ' + un + ' 说出口的话，用第一人称（"我……"），绝不能写成 ' + cn + ' 的台词或心理；这也是唯一会以 ' + un + ' 身份发进聊天的一句，写错方向就全错了。亲密程度要匹配当前关系阶段（不要油腻、不要越界）。');
      if (multi) L.push('每条建议的 target 标明针对谁，opener 就是 ' + un + ' 要发给这个人的话；尽量让不同角色都分到建议。');
    }
    return L.join('\n');
  }

  function extractJSON(text) {
    if (!text) return null;
    var t = String(text).trim();
    t = t.replace(/^```(?:json|JSON)?\s*/, '').replace(/\s*```$/, '').trim();
    var tryParse = function (s) { try { return JSON.parse(s); } catch (e) { return null; } };
    var v = tryParse(t);
    if (v && typeof v === 'object') return v;
    var i = t.indexOf('{'), j = t.lastIndexOf('}');
    if (i >= 0 && j > i) {
      v = tryParse(t.slice(i, j + 1));
      if (v && typeof v === 'object') return v;
    }
    var a = t.indexOf('['), b = t.lastIndexOf(']');
    if (a >= 0 && b > a) {
      v = tryParse(t.slice(a, b + 1));
      if (Array.isArray(v) && v.length) {
        if (v[0] && (v[0].how || v[0].why)) return { tasks: v };
        return { online: v };
      }
    }
    return null;
  }

  /* ---------- 生成 ---------- */
  var loadingTimer = null;

  function stopLoading() {
    if (loadingTimer) { clearInterval(loadingTimer); loadingTimer = null; }
  }

  function renderLoading(mode) {
    stopLoading();
    var steps = mode === 'task'
      ? ['读取关系数据与用户人设…', '翻阅核心记忆与长期记忆…', '回放最近发生的事…', '推演可推进的路径…', '拟定攻略任务…']
      : ['读取关系数据与用户人设…', '回放最近发生的事…', '顺着剧情推演走向…', '分拣线上 / 线下可能…', '整理成可执行的建议…'];
    var i = 0;
    $('#output').innerHTML =
      '<div class="loading"><div class="spinner"></div>' +
      '<div class="load-txt">' + esc(steps[0]) + '</div>' +
      '<div class="load-sub">基于角色人设、用户人设与全部记忆推演中，通常需要 10~30 秒。</div></div>';
    loadingTimer = setInterval(function () {
      i = (i + 1) % steps.length;
      var el = $('.load-txt');
      if (el) el.textContent = steps[i];
    }, 3400);
  }

  function renderError(e) {
    stopLoading();
    var msg = (e && (e.message || e.msg)) || '未知错误';
    $('#output').innerHTML =
      '<div class="errcard"><b>推演失败</b><p>' + esc(clip(String(msg), 400)) + '</p>' +
      '<p class="hint">常见原因：设置 → API 设置里的 Base URL / API Key / 模型名不正确，账户余额不足，或模型上下文长度不够（本次需要读入大量记忆，建议换长上下文模型）。</p>' +
      '<button class="primary" data-act="regen">重试</button></div>';
  }

  function renderRaw(raw, mode) {
    stopLoading();
    $('#output').innerHTML =
      '<div class="rawcard"><b>模型没有按 JSON 格式输出</b>' +
      '<p class="hint" style="margin:7px 0 0;font-size:12px;color:#bfae8a">内容已原样显示，可以直接参考；重试一次通常能拿到结构化结果。</p>' +
      '<pre>' + esc(clip(raw, 4000)) + '</pre>' +
      '<button class="primary" style="margin-top:12px" data-act="regen">重新生成</button></div>';
  }

  function renderIntro(kind) {
    stopLoading();
    if (kind === 'nochar') {
      $('#output').innerHTML =
        '<div class="tipcard"><b>还没有可分析的角色</b><br>先在聊天里创建或导入一个角色卡，再回到这里，就能基于 TA 的人设与记忆做推演。</div>';
      return;
    }
    $('#output').innerHTML =
      '<div class="tipcard"><b>选一个模式开始</b><br>' +
      '「推进任务」→ 你现在就能做、能真正推动关系的行动清单。<br>' +
      '「下一步建议」→ 你接下来能主动做什么，让哪些事有机会发生，分线上与线下。<br>' +
      '<span style="color:#8f85a3;font-size:12px">所有内容都是写给你的：做法的执行者是你，角色那边只给反应预判。</span><br>' +
      '<span style="color:#8f85a3;font-size:12px">已选' + (isMulti() ? (' ' + state.charIds.length + ' 个角色') : ('「' + nameOf(state.char) + '」')) +
      (state.personaId ? ('，面具 ' + (state.personaId === 'custom' ? '自定义' : '已指定')) : '，面具跟随默认') +
      '。推演会先读入每个人的关系与状态数据、核心/长期记忆、近期事件流（含漫卷与线下剧情）。</span></div>';
  }

  async function run(mode) {
    if (state.busy) return;
    if (!state.charId) { toast('请先选择一个角色'); return; }
    state.busy = true;
    state.mode = mode;
    $$('.mode').forEach(function (b) { b.classList.toggle('on', b.dataset.mode === mode); });
    renderLoading(mode);
    $('#output').scrollIntoView({ behavior: 'smooth', block: 'start' });
    try {
      var ctx = await gatherContext();
      var instruction = buildInstruction(mode, ctx);
      var payload = {
        appTags: mode === 'task' ? ['guide', 'task'] : ['guide', 'suggest'],
        instruction: instruction
      };
      if (isMulti()) payload.characterIds = state.charIds.slice();
      else payload.characterId = state.charIds[0];
      var res = await api.ai.generate(payload);
      var raw = (res && (res.text || res.content)) || '';
      var data = extractJSON(raw);
      if (data) {
        var now = new Date().toISOString();
        var rec = await safe(function () {
          return api.db.create('runs', {
            characterId: state.charId,
            charIds: state.charIds.slice(),
            charName: charName(),
            mode: mode,
            data: data,
            raw: clip(raw, 4000),
            checked: [],
            createdAt: now
          });
        }, null);
        state.current = {
          id: rec && rec.id ? rec.id : null,
          mode: mode,
          data: data,
          raw: raw,
          checked: [],
          charIds: state.charIds.slice(),
          createdAt: now
        };
        stopLoading();
        renderResult();
        loadHistory();
      } else {
        renderRaw(raw, mode);
      }
    } catch (e) {
      renderError(e);
    } finally {
      state.busy = false;
    }
  }

  /* ---------- 结果渲染 ---------- */
  function basisHTML(basis) {
    var arr = asArray(basis);
    if (!arr.length) return '';
    return '<div class="basis"><i>依据</i><ul>' +
      arr.slice(0, 6).map(function (b) { return '<li>' + esc(clip(typeof b === 'string' ? b : JSON.stringify(b), 90)) + '</li>'; }).join('') +
      '</ul></div>';
  }

  function taskCardHTML(t, i) {
    var done = (state.current.checked || []).indexOf(i) >= 0;
    var diff = parseInt(t.difficulty, 10);
    if (!(diff >= 1)) diff = 1;
    if (diff > 3) diff = 3;
    var stars = '★★★'.slice(0, diff) + '☆☆☆'.slice(0, 3 - diff);
    var how = asArray(t.how).slice(0, 5);
    var html = '<div class="tcard' + (done ? ' done' : '') + '">';
    html += '<div class="tcard-top">';
    html += '<span class="idx">' + (i + 1 < 10 ? '0' : '') + (i + 1) + '</span>';
    if (isMulti() && t.target) html += '<span class="pill tgt">' + esc(clip(t.target, 12)) + '</span>';
    html += '<span class="pill">' + esc(t.tag || '任务') + '</span>';
    html += '<span class="star">' + stars + '</span>';
    if (done) html += '<span class="pill ok">已完成</span>';
    html += '</div>';
    html += '<h4>' + esc(t.title || '未命名任务') + '</h4>';
    if (t.why) html += '<p class="why">' + esc(t.why) + '</p>';
    if (how.length) {
      html += '<ol class="how">' + how.map(function (h) {
        return '<li>' + esc(typeof h === 'string' ? h : JSON.stringify(h)) + '</li>';
      }).join('') + '</ol>';
    }
    if (t.timing) html += '<div class="kv"><span>时机</span>' + esc(t.timing) + '</div>';
    if (t.signal) html += '<div class="kv"><span>信号</span>' + esc(t.signal) + '</div>';
    if (t.risk) html += '<div class="risk">⚠ ' + esc(t.risk) + '</div>';
    html += '<div class="row-actions"><button class="mini" data-act="check" data-i="' + i + '">' + (done ? '撤销完成' : '标记完成') + '</button></div>';
    html += '</div>';
    return html;
  }

  function suggestCardHTML(it, i, kind) {
    var html = '<div class="scard">';
    html += '<div class="tcard-top">';
    html += '<span class="idx">' + (kind === 'online' ? '◌' : '⌖') + '</span>';
    if (isMulti() && it.target) html += '<span class="pill tgt">' + esc(clip(it.target, 12)) + '</span>';
    html += '<span class="pill">' + (kind === 'online' ? '线上' : '线下') + '</span>';
    if (it.timing) html += '<span class="pill tiny-txt">' + esc(it.timing) + '</span>';
    html += '</div>';
    html += '<h4>' + esc(it.title || ('可能 ' + (i + 1))) + '</h4>';
    if (it.idea) html += '<p class="why">' + esc(it.idea) + '</p>';
    if (it.where) html += '<div class="kv"><span>场景</span>' + esc(it.where) + '</div>';
    if (it.opener) html += '<div class="opener"><span>你要发给 TA 的第一句</span><p>' + esc(it.opener) + '</p></div>';
    if (it.might) html += '<div class="kv"><span>走向</span>' + esc(it.might) + '</div>';
    if (it.opener) {
      html += '<div class="row-actions"><button class="mini primary-mini" data-act="send" data-kind="' + kind + '" data-i="' + i + '">发到聊天试试</button></div>';
    }
    html += '</div>';
    return html;
  }

  function renderResult() {
    var c = state.current;
    if (!c) { renderIntro(); return; }
    var d = c.data || {};
    var html = '';
    html += '<div class="snap">';
    html += '<div class="stage">' + esc(d.stage || (c.mode === 'task' ? '推进任务' : '下一步建议')) + '</div>';
    if (d.read) html += '<div class="read">' + esc(d.read) + '</div>';
    html += basisHTML(d.basis);
    html += '</div>';

    if (c.mode === 'task') {
      var tasks = asArray(d.tasks);
      if (!tasks.length) {
        html += '<div class="tipcard">这次没有解析出任务条目，换一次生成或补充一点剧情线索试试。</div>';
      } else {
        tasks.forEach(function (t, i) {
          if (t && typeof t === 'object') html += taskCardHTML(t, i);
        });
      }
    } else {
      var online = asArray(d.online);
      var offline = asArray(d.offline);
      html += '<div class="tabs">';
      html += '<button class="tab on" data-tab="online">线上 · ' + online.length + '</button>';
      html += '<button class="tab" data-tab="offline">线下 · ' + offline.length + '</button>';
      html += '</div>';
      html += '<div data-tabbody="online">' + online.map(function (it, i) {
        return it && typeof it === 'object' ? suggestCardHTML(it, i, 'online') : '';
      }).join('') + '</div>';
      html += '<div data-tabbody="offline" hidden>' + offline.map(function (it, i) {
        return it && typeof it === 'object' ? suggestCardHTML(it, i, 'offline') : '';
      }).join('') + '</div>';
      if (!online.length && !offline.length) {
        html += '<div class="tipcard">这次没有解析出建议条目，换一次生成或补充一点剧情线索试试。</div>';
      }
    }

    html += '<div class="outfoot"><button class="ghost" data-act="regen">重新生成</button>' +
      '<span class="foot-note">' + esc(fmtTime(c.createdAt)) + ' · ' + esc(charName()) + '</span></div>';
    $('#output').innerHTML = html;
  }

  /* ---------- 完成标记 ---------- */
  async function toggleCheck(i) {
    var c = state.current;
    if (!c) return;
    c.checked = c.checked || [];
    var pos = c.checked.indexOf(i);
    if (pos >= 0) {
      c.checked.splice(pos, 1);
      toast('已撤销完成标记');
    } else {
      c.checked.push(i);
      toast('已完成，干得漂亮');
    }
    if (c.id) {
      await safe(function () { return api.db.update('runs', c.id, { checked: c.checked }); });
    }
    renderResult();
    loadHistory();
  }

  /* ---------- 发到聊天 ---------- */
  function nameForId(id) {
    var info = state.charInfo[id];
    if (info) return nameOf(info.char);
    for (var i = 0; i < state.chars.length; i++) if (state.chars[i].id === id) return nameOf(state.chars[i]);
    return 'TA';
  }
  function resolveTargetChar(it) {
    var ids = (state.current && state.current.charIds && state.current.charIds.length)
      ? state.current.charIds : state.charIds;
    if (!ids.length) return state.charId;
    if (!it || !it.target || ids.length < 2) return ids[0];
    var t = String(it.target).trim();
    for (var i = 0; i < ids.length; i++) {
      var nm = nameForId(ids[i]);
      if (nm === t || nm.indexOf(t) >= 0 || t.indexOf(nm) >= 0) return ids[i];
    }
    return ids[0];
  }

  async function sendToChat(kind, i) {
    var c = state.current;
    if (!c || !c.data) return;
    var arr = kind === 'online' ? asArray(c.data.online) : asArray(c.data.offline);
    var it = arr[i];
    if (!it || !it.opener) { toast('这条建议没有可发送的话术'); return; }
    var targetId = resolveTargetChar(it);
    var targetName = nameForId(targetId);
    var ok = await safe(function () {
      return api.ui.confirm({ title: '发给「' + targetName + '」？', message: it.opener });
    }, true);
    if (ok === false) return;
    try {
      await api.chat.writeHistory({ characterId: targetId, role: 'user', content: it.opener });
      await api.chat.requestReply({ characterId: targetId });
      toast('已发给 ' + targetName + '，等 TA 回应');
    } catch (e) {
      toast('发送失败：' + ((e && e.message) || '未知错误'));
    }
  }

  /* ---------- 历史记录 ---------- */
  async function loadHistory() {
    var rows = await dbList('runs');
    state.runs = rows.filter(function (r) {
      return r && (!state.charId || r.characterId === state.charId);
    }).sort(function (a, b) {
      return String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
    }).slice(0, 24);
    renderHistory();
  }

  function renderHistory() {
    var box = $('#historyList');
    if (!box) return;
    if (!state.runs.length) {
      box.innerHTML = '<p class="empty-txt">还没有记录。选一个模式开始第一次推演。</p>';
      return;
    }
    box.innerHTML = state.runs.map(function (r, i) {
      var d = r.data || {};
      var title = d.stage || (r.mode === 'task' ? '推进任务' : '下一步建议');
      return '<button class="hitem" data-run="' + i + '">' +
        '<span class="hicon">' + (r.mode === 'task' ? '◎' : '✧') + '</span>' +
        '<span class="hmain"><b>' + esc(clip(title, 20)) + '</b><small>' + esc(clip(d.read || (r.mode === 'task' ? '任务清单' : '线上 / 线下建议'), 40)) + '</small></span>' +
        '<span class="htime">' + esc(fmtTime(r.createdAt, true)) + '</span>' +
        '</button>';
    }).join('');
  }

  async function openRun(i) {
    var r = state.runs[i];
    if (!r) return;
    if (!r.data) { toast('这条记录没有可展示的内容'); return; }
    state.current = {
      id: r.id,
      mode: r.mode,
      data: r.data,
      raw: r.raw || '',
      checked: Array.isArray(r.checked) ? r.checked.slice() : [],
      charIds: Array.isArray(r.charIds) && r.charIds.length ? r.charIds.slice() : state.charIds.slice(),
      createdAt: r.createdAt
    };
    $$('.mode').forEach(function (b) { b.classList.toggle('on', b.dataset.mode === r.mode); });
    renderResult();
    $('#output').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  async function clearHistory() {
    if (!state.runs.length) { toast('还没有历史记录'); return; }
    var ok = await safe(function () {
      return api.ui.confirm({ title: '清空历史记录？', message: '将删除当前角色的 ' + state.runs.length + ' 条推演记录，不可恢复。' });
    }, true);
    if (ok === false) return;
    var rows = state.runs.slice();
    for (var i = 0; i < rows.length; i++) {
      await safe(function () { return api.db.delete('runs', rows[i].id); });
    }
    state.runs = [];
    renderHistory();
    toast('已清空');
  }

  /* ---------- 角色切换 ---------- */
  function openCharSheet() {
    var old = $('.sheet');
    if (old) old.remove();
    if (!state.chars.length) { toast('还没有角色，先去创建或导入一个'); return; }
    var picked = state.charIds.slice();
    var wrap = document.createElement('div');
    wrap.className = 'sheet';
    wrap.innerHTML = '<div class="sheet-panel">' +
      '<div class="sheet-title"><b>选择角色<em id="sheetCount" style="font-style:normal;font-size:12px;color:#8f85a3;margin-left:8px"></em></b>' +
      '<button class="ghost tiny" data-close="1">取消</button></div>' +
      '<p class="empty-txt" style="margin:2px 0 4px">可以多选，同时推演你和这几个人的关系。</p>' +
      '<div id="sheetOpts"></div>' +
      '<div class="sheet-foot"><button class="primary" id="sheetOk">确定</button></div>' +
      '</div>';
    document.body.appendChild(wrap);

    function renderList() {
      var opts = state.chars.map(function (c) {
        var nm = nameOf(c);
        var on = picked.indexOf(c.id) >= 0;
        return '<button class="opt' + (on ? ' on' : '') + '" data-cid="' + esc(c.id) + '">' +
          '<span class="oavatar">' + esc(initialOf(nm)) + '</span>' +
          '<span style="min-width:0;flex:1"><span class="oname">' + esc(nm) + '</span>' +
          '<div class="osub">' + esc(clip(c.description || c.persona || c.tagline || '', 40)) + '</div></span>' +
          '<span class="ocheck">' + (on ? '✓' : '') + '</span>' +
          '</button>';
      }).join('');
      var box = $('#sheetOpts');
      if (box) box.innerHTML = opts;
      var cnt = $('#sheetCount');
      if (cnt) cnt.textContent = picked.length ? ('已选 ' + picked.length + ' 人') : '至少选 1 人';
      var ok = $('#sheetOk');
      if (ok) ok.disabled = !picked.length;
    }
    renderList();

    wrap.addEventListener('click', async function (e) {

      var op = t.closest('.opt');
      if (op && op.dataset.cid) {
        var cid = op.dataset.cid;

      }
      if (t.closest('#sheetOk')) {
        if (!picked.length) { toast('至少选一个角色'); return; }
        wrap.remove();
        await selectCharacters(picked.slice());
      }
    });

  /* ---------- 面具选择 ---------- */

      (state.personas.length
        ? ('已读取到 ' + state.personas.length + ' 个面具，选中后会作为"你"的身份参与推演。')

      }).join('') +

    document.body.appendChild(wrap);

    wrap.addEventListener('click', async function (e) {

      if (t.closest('#personaCustomOk')) {
        var ta = $('#personaCustom');
        var v = ta ? ta.value.trim() : '';
        if (!v) { toast('先写点面具内容'); return; }

        state.personaId = 'custom';
        state.personaText = v;
        await setMeta('persona:' + pkey, 'custom');
        await setMeta('personaText:' + pkey, v);
        renderPersonaRow();
        wrap.remove();
        toast('已改用自定义面具');
        return;
      }
      var item = t.closest('.pitem');
      if (!item) return;
      var sel = items[parseInt(item.dataset.pi, 10)];
      if (!sel) return;
      if (sel.id === 'custom') {
        var box = $('#personaCustom');
        if (box) { box.focus(); box.scrollIntoView({ block: 'center' }); }
        return;
      }
      var key2 = state.charIds.join('+');
      state.personaId = sel.id;
      state.personaText = sel.text || '';
      await setMeta('persona:' + key2, sel.id);
      await setMeta('personaText:' + key2, '');
      renderPersonaRow();
      wrap.remove();
      toast(sel.id ? ('面具：' + sel.name) : '已改为跟随默认');
    });
  }

  /* ---------- 交互绑定 ---------- */
  function bind() {
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (!t || !t.closest) return;

      var modeBtn = t.closest('.mode');
      if (modeBtn && modeBtn.dataset.mode) {
        run(modeBtn.dataset.mode);
        return;
      }

      var runBtn = t.closest('[data-run]');
      if (runBtn) { openRun(parseInt(runBtn.dataset.run, 10)); return; }

      var tabBtn = t.closest('[data-tab]');
      if (tabBtn) {
        var key = tabBtn.dataset.tab;
        $$('.tab').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === key); });
        $$('[data-tabbody]').forEach(function (b) { b.hidden = b.dataset.tabbody !== key; });
        return;
      }

      var act = t.closest('[data-act]');
      if (act) {
        var a = act.dataset.act;
        if (a === 'regen') {
          run((state.current && state.current.mode) || state.mode || 'task');
        } else if (a === 'check') {
          toggleCheck(parseInt(act.dataset.i, 10));
        } else if (a === 'send') {
          sendToChat(act.dataset.kind, parseInt(act.dataset.i, 10));
        }
        return;
      }
    });

    var sw = $('#btnSwitch');
    if (sw) sw.addEventListener('click', openCharSheet);
    var pb = $('#btnPersona');
    if (pb) pb.addEventListener('click', openPersonaSheet);

    $('#btnBrief').addEventListener('click', function () {
      var body = $('#briefBody');
      var card = $('#briefCard');
      var open = body.hidden;
      body.hidden = !open;
      card.classList.toggle('open', open);
      if (open) setTimeout(function () { $('#briefText').focus(); }, 120);
    });

    $('#btnSaveBrief').addEventListener('click', async function () {
      var v = $('#briefText').value.trim();
      state.brief = v;
      await setMeta('brief:' + state.charIds.join('+'), v);
      renderBrief();
      toast(v ? '线索已保存，下次推演会用上' : '已清空线索');
    });

    $('#briefText').addEventListener('blur', async function () {
      var v = $('#briefText').value.trim();
      if (v === state.brief) return;
      state.brief = v;
      await setMeta('brief:' + state.charIds.join('+'), v);
      renderBrief();
    });

    $('#btnClearHist').addEventListener('click', clearHistory);
  }

  /* ---------- 启动 ---------- */
  bind();
  init().catch(function (e) {
    console.warn('[guide] init failed', e);
    $('#charLine').textContent = '载入失败：' + ((e && e.message) || '未知错误');
    renderIntro();
  });
})();
</script>
</body>
</html>
