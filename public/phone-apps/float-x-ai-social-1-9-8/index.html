async function generateCommentBatch(p){var a=actor(p.authorId),id=a.kind==="character"?a.id:"npc",o=await callJson("comments",id,commentsPrompt(p),function(x){checkComments(x.comments);function validate(c){if(!c.metrics||["replies","reposts","likes","views"].some(function(k){return typeof c.metrics[k]!=="number"||c.metrics[k]<0}))throw Error("评论互动数据缺失");if(c.author&&(c.author.id==="me"||c.author.handle===s.user.handle))throw Error("禁止冒充用户");(c.replies||[]).forEach(validate)}x.comments.forEach(validate)});var eligible=eligibleCommenters();return o.comments.map(function(c){return normalizeGeneratedComment(c,eligible)})}

generatePack=async function(a,topic){var accounts=candidateAccounts(a),id=a.kind==="character"?a.id:"npc",cfg=creator(a.id);var relations="";if(a.kind==="character"&&api.characters.readRelations)relations=JSON.stringify(await api.characters.readRelations({characterId:a.id}));var prompt="已有关系（只提及确实认识的人）："+relations+"。仅以 "+a.name+" "+a.handle+" 的身份生成一条X帖子。主题："+topic+"。本人的社交人设："+(cfg.persona||a.persona||a.bio||"")+"。常发内容："+cfg.topics+"。根据人设判断日常使用哪种语言，不强制中文。"+"\n可提及账号："+JSON.stringify(accounts.map(function(x){return {id:x.id,name:x.name,handle:x.handle}}))+"。"+(a.kind==="npc"?"NPC默认不认识用户，禁止@用户。可以@表中NPC好友，不能把user当熟人。":"只用账号表中的真实handle提及认识的人，不能另造用户账号。")+"\n可附虚构视频链接。"+(cfg.nsfw?"本角色NSFW开关开启，此帖必须包含虚构视频条目，主题须与人设一致，内容非露骨。":"视频条目可为null。")+"仅输出JSON："+JSON.stringify({text:"帖子正文",tags:["话题"],metrics:{replies:20,reposts:5,likes:50,views:800,bookmarks:4},video:{title:"视频标题",summary:"约50字的内容简介",keywords:["关键词"]}});var o=await callJson("post",id,prompt,function(x){if(!x||typeof x.text!=="string"||!x.text.trim())throw Error("帖子正文缺失");if(cfg.nsfw&&(!x.video||!x.video.summary))throw Error("缺少虚构视频条目")});if(a.kind==="npc"&&o.text.includes(s.user.handle))throw Error("NPC不应无故提及用户");return o};
addPost=async function(a,topic){if(!allowedActor(a,"post"))return null;var o=await generatePack(a,topic),p={id:uid(),authorId:a.id,text:o.text.slice(0,3000),translation:String(o.translation||""),language:String(o.language||""),tags:Array.isArray(o.tags)?o.tags.map(String).slice(0,8):[],metrics:cleanMetrics(o.metrics),comments:[],createdAt:new Date().toISOString(),imageStatus:"off"};if(o.video){p.video={title:String(o.video.title||"视频"),summary:String(o.video.summary||"").slice(0,300),keywords:Array.isArray(o.video.keywords)?o.video.keywords.map(String).slice(0,8):[],url:"https://x-video.example/watch/"+p.id,segments:[],version:0};await generateVideo(p,false)}p.imagePlan=await makeScene(a,p.text+videoContext(p));p.imagePrompt=scenePrompt(p.imagePlan);p.comments=await generateCommentBatch(p);p.metrics.replies=Math.max(p.metrics.replies,20);s.posts.unshift(p);s.backgroundPosts[p.id]=true;s.lastAutoAttempt[a.id]={at:Date.now(),ok:true};save();render();await syncBadge();if(s.settings.autoImage){p.imageStatus="pending";imageQueue.push(p.id);if(s.background)await runImages();else runImages()}return p};
runImages=async function(){if(imageBusy||!api||!s.settings.autoImage)return;imageBusy=true;try{while(imageQueue.length&&s.settings.autoImage){var p=findPost(imageQueue.shift());if(!p||p.imageStatus!=="pending")continue;try{var a=actor(p.authorId);if(!p.imagePlan)p.imagePlan=await makeScene(a,p.text+videoContext(p));var ref=p.imagePlan.referenceCharacterId,r=await requestXAI('generateImage',{diagnosticPostId:p.id,prompt:scenePrompt(p.imagePlan),characterId:ref||undefined,useReferenceImage:!!ref,timeoutMs:120000});if(!r.dataUrl)throw Error("生图接口没有返回图片");if(ref&&!r.usedReferenceImage){p.imageStatus="failed";p.imageError="未读取到角色参考图，请在小手机中配置该角色的生图参考图后重试";continue}p.imageRef=(await api.media.put({dataUrl:r.dataUrl})).ref;p.imageUrl=r.dataUrl;p.imageStatus="done";p.imageError=""}catch(e){p.imageStatus="failed";p.imageError=e.message}save();render()}}finally{imageBusy=false}};

function generationError(e){var t=String(e&&e.message||e||'未知错误');if(/empty.response|empty response/i.test(t))return '模型接口返回空内容（HTTP 500 / empty_response），请稍后重试；若持续出现，请检查 小手机的模型与接口服务。';return t.slice(0,450)}
var generationStages={post:'帖子正文',scene:'图片场景',comments:'评论',video:'视频内容',profile:'角色资料','npc-profile':'NPC资料',dm:'私信'};
originalCallJson=async function(kind,id,prompt,validator){var last,repair='';for(var i=0;i<3;i++){try{var instruction=prompt+repair,r;if(id&&id!=='npc'&&id!=='me')r=await requestXAI('generate',{characterId:id,appTags:['floatx',kind],instruction:instruction});else r=await requestXAI('chat',{messages:[{role:'system',content:'仅输出本次指定结构的完整JSON对象，不附Markdown。'},{role:'user',content:instruction}],timeoutMs:90000,maxTokens:6000});var text=r&&(r.text||r.content||r.output);if(typeof text!=='string'||!text.trim())throw Error('empty_response');var o=parseJson(text);if(kind==='scene')Object.assign(o,normalizeScene(o));validator(o);return o}catch(e){last=e;var transient=/empty.response|empty response|500|502|503|504|429|timeout|超时/i.test(String(e.message));if(i<2){if(transient)await new Promise(function(resolve){setTimeout(resolve,1000*(i+1))});else repair='\n上次输出未通过校验：'+String(e.message).slice(0,180)+'。请修正缺失字段、类型和数量，重新输出完整JSON，不加解释。'}}}throw Error((generationStages[kind]||kind)+'生成失败：'+generationError(last))};
function normalizeScene(raw){var x=raw.imagePlan||raw.scenePlan||raw.imageDescription||raw;var description=x.description||x.imagePrompt||x.prompt;var people=x.people||x.characters;if(!Array.isArray(people))people=[];var flag=x.hasPeople;if(flag==='false'||flag==='no'||flag===0)flag=false;if(flag==='true'||flag==='yes'||flag===1)flag=true;if(flag==null&&Array.isArray(x.people)&&x.people.length>0)flag=true;return Object.assign({},x,{description:typeof description==='string'?description:'',hasPeople:flag,people:people.map(function(p){return Object.assign({},p,{gender:p.gender||p.sex,action:p.action||p.pose,appearance:p.appearance||p.clothing})})})}
addPost=async function(a,topic){if(!allowedActor(a,'post'))throw Error('此角色已关闭发帖，请先在创作者工作室开启');var o=await generatePack(a,topic),p={id:uid(),authorId:a.id,text:o.text.slice(0,3000),translation:String(o.translation||''),language:String(o.language||''),tags:Array.isArray(o.tags)?o.tags.map(String).slice(0,8):[],metrics:cleanMetrics(o.metrics),comments:[],createdAt:new Date().toISOString(),imageStatus:'off',stageErrors:{}};if(o.video)p.video={title:String(o.video.title||'视频'),summary:String(o.video.summary||'').slice(0,300),keywords:Array.isArray(o.video.keywords)?o.video.keywords.map(String).slice(0,8):[],url:'https://x-video.example/watch/'+p.id,segments:[],version:0};s.posts.unshift(p);s.backgroundPosts[p.id]=true;s.lastAutoAttempt[a.id]={at:Date.now(),ok:true};await saveNow();render();if(p.video)try{await generateVideo(p,false)}catch(e){p.stageErrors.video=generationError(e)}if(!p.video||p.video.segments.length)try{p.comments=await generateCommentBatch(p)}catch(e){p.stageErrors.comments=generationError(e)}else p.stageErrors.comments='视频全文尚未生成，补全视频后再生成评论';save();render();await syncBadge();if(s.settings.autoImage){p.imageStatus='pending';imageQueue.push(p.id);if(s.background)await runImages();else runImages()}return p};
var post141base=postHtml;
postHtml=function(p){var html=post141base(p);if(p.stageErrors&&(p.stageErrors.video||p.stageErrors.comments))html=html.replace('<div class="actions">','<div class="stage-recovery"><span>'+esc(p.stageErrors.video||p.stageErrors.comments)+'</span><button class="link" data-act="retry-content" data-id="'+p.id+'">补全内容</button></div><div class="actions">');return html};
async function retryContent(id){var p=findPost(id);if(!p||p.repairing||!api)return;p.repairing=true;try{if(p.video&&!p.video.segments.length){await generateVideo(p,false);delete p.stageErrors.video}if(!p.comments.length||p.stageErrors.comments){p.comments=await generateCommentBatch(p);delete p.stageErrors.comments}save();toast('内容已补全')}catch(e){toast(generationError(e))}finally{p.repairing=false;render()}}
var profile141base=renderProfile;
renderProfile=function(){var a=actor(s.activeProfile),html=profile141base();if(a.id==='me')return html;html=html.replace(/<button class="pill profile-edit"[^>]*>编辑资料<\/button>/,'');var prompt=!String(a.bio||'').trim();html=html.replace(/<div class="profile-generate">[\s\S]*?<\/div>/,prompt?'<div class="profile-generate"><button class="pill" data-act="generate-profile" data-id="'+a.id+'">'+(s.profileGenerating===a.id?'正在生成资料…':'首次生成签名与主页')+'</button></div>':'');html=html.replace('<div class="profile-actions">','<div class="profile-tools"><button class="iconbtn" data-act="profile-post" data-id="'+a.id+'" aria-label="为此账号生成一条帖子" title="生成一条帖子">'+ic('repost',19)+'</button><button class="iconbtn" data-act="profile-options" data-id="'+a.id+'" aria-label="主页更多操作">⋯</button></div><div class="profile-actions">');return html};
var modal141base=renderModal;

async function profilePost(id){if(busy||autoBusy)return toast('正在生成，请稍候');if(!api)return toast('请在小手机中配置模型');setBusy('正在为 '+actor(id).name+' 生成帖子…');s.error='';try{await addPost(actor(id),creator(id).topics||'此角色最新的日常与兴趣');s.profileTab='posts';toast('已生成一条帖子')}catch(e){s.error=generationError(e);toast(s.error)}finally{setBusy('')}}
