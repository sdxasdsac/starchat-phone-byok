/* ── 联机大厅 ── */
function newLobby(){
  return { boardId: settings.boardId, custom: settings.customRoles,
           users: [], ready: {}, chars: {}, names: {}, inGame: false };
}
function lobbySnapshot(){
  return { boardId: lobby.boardId, custom: lobby.custom, users: lobby.users,
           ready: lobby.ready, chars: lobby.chars, inGame: lobby.inGame };
}
function broadcastLobby(){
  if (isHost()) net.send({ w: 1, t: "lobby", data: lobbySnapshot() });
}
/* 房间玩家列表给的是小手机账号名。各人在这个 APP 里另设的昵称要自己上报,
   房主收齐后用它建席位,别人的人偶和角色看到的才是狼人杀昵称。 */
function lobbyName(p){
  return (lobby && lobby.names && lobby.names[p.userId]) || p.name;
}
function hostLobbyInit(){
  lobby = newLobby();
  lobby.names = lobby.names || {};
  if (settings.nickname) lobby.names[myUid()] = settings.nickname;
  lobby.users = net.players().map(function (p) { return { uid: p.userId, name: lobbyName(p) }; });
  lobby.ready[myUid()] = true; /* 房主视为常备 */
  renderLobby();
  broadcastLobby();
}
function hostPlayersChanged(players){
  if (!lobby) return;
  var prevUids = lobby.users.map(function (u) { return u.uid; });
  var curUids = players.map(function (p) { return p.userId; });
  lobby.users = players.map(function (p) { return { uid: p.userId, name: lobbyName(p) }; });
  prevUids.forEach(function (u) {
    if (curUids.indexOf(u) < 0) {
      delete lobby.ready[u];
      delete lobby.chars[u];
      if (engine && !engine.dead) engine.dropOwner(u);
    }
  });
  curUids.forEach(function (u) {
    if (prevUids.indexOf(u) < 0 && lobby.inGame) {
      if (engine && !engine.dead && engine.hasDroppedOwner(u)) {
        /* 原局玩家重连:先把整局事件回放给 TA(重建牌桌),放完把席位还给 TA */
        replayGameTo(u, function(){ if (engine && !engine.dead) engine.reclaimOwner(u); });
      } else {
        net.send({ w: 1, t: "busy", uids: [u] });
      }
    }
  });
  if (!lobby.inGame) renderLobby();
  broadcastLobby();
}
function renderLobby(){
  if (!lobby) return;
  $("roomCodeText").textContent = net && net.code ? net.code : "····";
  var canEdit = isHost() && !lobby.inGame;
  var st = { boardId: lobby.boardId, custom: lobby.custom };
  renderBoardChoices($("lobbyBoards"), st, canEdit, function(){
    lobby.boardId = st.boardId;
    settings.boardId = st.boardId;
    saveSettings();
    renderLobby();
    broadcastLobby();
  });
  var talkPanel = $("lobbyTalkPanel");
  talkPanel.classList.toggle("hidden", !canEdit);
  talkPanel.querySelector(".val").textContent = settings.talkSec + "s";
  var roles = currentRoles(lobby);
  var occupied = lobby.users.length + Object.keys(lobby.chars).length;
  $("lobbySeatCount").textContent = "在座 " + occupied + " / " + boardSize(roles) + " 席";
  var roster = $("lobbyRoster");
  roster.innerHTML = "";
  lobby.users.forEach(function (u) {
    var row = el("div", "roster-item");
    var av = avEl({ kind: "human", ownerUid: u.uid, name: u.name });
    row.appendChild(av);
    var bd = el("div", "grow col");
    var nameRow = el("div", "row gap-2");
    nameRow.appendChild(el("span", "truncate", u.name || "旅人"));
    if (u.uid === net.hostUid) nameRow.appendChild(el("span", "chip chip-gold", "房主"));
    bd.appendChild(nameRow);
    var c = lobby.chars[u.uid];
    if (c) bd.appendChild(el("span", "t-xs dim", "携「" + c.name + "」上桌"));
    row.appendChild(bd);
    var dotWrap = el("span", "chip " + (lobby.ready[u.uid] ? "chip-gold" : ""));
    dotWrap.appendChild(el("span", "dot " + (lobby.ready[u.uid] ? "dot-ready" : "dot-idle")));
    dotWrap.appendChild(document.createTextNode(lobby.ready[u.uid] ? "已备战" : "候场"));
    row.appendChild(dotWrap);
    if (isHost() && u.uid !== myUid()) {
      var kick = el("button", "icon-btn", "✕");
      kick.title = "移出房间";
      kick.style.cssText = "width:30px;height:30px;font-size:12px";
      kick.addEventListener("click", function(){
        var doKick = net && net.relay ? net.kick(u.uid) : api.room.kick(u.uid);
        doKick.catch(function (e) { toast(e.message, "err"); });
      });
      row.appendChild(kick);
    }
    roster.appendChild(row);
  });
  /* 我携带的角色 */
  loadCharacters().then(function (list) {
    var box = $("lobbyMyChar");
    box.innerHTML = "";
    if (!list.length) {
      box.appendChild(el("div", "empty", "小手机里还没有角色"));
      return;
    }
    var mine = lobby.chars[myUid()];
    var grid2 = el("div", "char-grid");
    list.slice(0, 24).forEach(function (c) {
      var chosen = mine && mine.characterId === c.id;
      var ch = el("button", "ccard");
      ch.setAttribute("aria-checked", chosen ? "true" : "false");
      var ring2 = el("div", "ring");
      var av2 = charAvatarUrl(c.id);
      if (av2) { var im2 = el("img"); im2.src = av2; im2.alt = ""; ring2.appendChild(im2); }
      else ring2.appendChild(el("span", null, String(c.name || "?").trim().slice(0, 1)));
      ch.appendChild(ring2);
      ch.appendChild(el("span", "pick", "✓"));
      ch.appendChild(el("span", "cn", c.name));
      ch.addEventListener("click", function(){
        var next = chosen ? null : { characterId: c.id, name: c.name };
        if (isHost()) {
          if (next) lobby.chars[myUid()] = next; else delete lobby.chars[myUid()];
          renderLobby(); broadcastLobby();
        } else {
          net.send({ w: 1, t: "setChar", char: next });
        }
      });
      grid2.appendChild(ch);
    });
    box.appendChild(grid2);
  });
  /* 按钮态 */
  var meReady = !!lobby.ready[myUid()];
  var btnReady = $("btnReady"), btnStart = $("btnStart");
  if (isHost()) {
    btnReady.classList.add("hidden");
    btnStart.classList.remove("hidden");
    var allReady = lobby.users.every(function (u) { return u.uid === myUid() || lobby.ready[u.uid]; });
    var enough = lobby.users.length + Object.keys(lobby.chars).length <= boardSize(roles);
    btnStart.disabled = !allReady || !enough || lobby.inGame;
    btnStart.textContent = !enough ? "人数超出板子" : allReady ? "天 黑 请 闭 眼" : "等待众人备战…";
  } else {
    btnStart.classList.add("hidden");
    btnReady.classList.remove("hidden");
    btnReady.textContent = meReady ? "✓ 已备战 · 点击取消" : "备 战";
    btnReady.classList.toggle("btn-primary", !meReady);
  }
}
function hostStartGame(){
  var roles = currentRoles(lobby);
  /* 板子合法性校验(与单机开局一致):否则自拟 0 狼 / 不足 4 人能开出退化局 */
  if (boardSize(roles) < 4) return toast("板子至少需要 4 人", "err");
  if (!roles.wolf) return toast("总得有狼,夜里才有故事", "err");
  var charEntries = Object.keys(lobby.chars).map(function (uidKey) {
    return Object.assign({ ownerUid: uidKey }, lobby.chars[uidKey]);
  });
  var seats = makeSeats(lobby.users.map(function (u) { return { uid: u.uid, name: u.name }; }), charEntries, roles, myUid());
  if (!seats) return toast("人数超出板子容量", "err");
  startEngineWith({ roles: roles, talkSec: settings.talkSec, sideKill: settings.sideKill,
    hostUid: myUid(), boardName: (BOARDS.find(function (b) { return b.id === lobby.boardId; }) || {}).name || "自拟板子",
    seats: seats });
}
function hostBackToLobby(){
  if (engine) { engine.destroy(); engine = null; }
  clearEngineEmit();   /* 清掉最后一批残留事件,免得晚于大厅快照到达、把夜幕/锣声盖到大厅上 */
  Voice.hush();
  lobby.inGame = false;
  lobby.ready = {};
  lobby.ready[myUid()] = true;
  showView("v-lobby");
  renderLobby();
  broadcastLobby();
}

/* ── 消息路由 ── */
function attachNet(n){
  net = n;
  n.onMessage(function (fromUid, m) {
    if (!m || m.w !== 1) return;
    switch (m.t) {
      case "act":
        if (isHost() && engine) engine.act(fromUid, m);
        return;
      case "aud":
        /* 语音切片不经引擎,点对点尽力播;自己发的不用再听一遍 */
        if (fromUid !== myUid()) onAudioChunk(m);
        return;
      case "evs":
        if (!net.hostUid && !isHost()) net.hostUid = fromUid;
        if (fromUid !== net.hostUid) return;
        (m.list || []).forEach(function (item) {
          if (item.to && item.to.indexOf(myUid()) < 0) return;
          applyEvt(item);
        });
        return;
      case "lobby":
        if (!net.hostUid && !isHost()) net.hostUid = fromUid;
        if (fromUid !== net.hostUid || isHost()) return;
        var wasInGame = lobby && lobby.inGame;
        var firstSnapshot = !lobby;
        lobby = m.data;
        /* 第一次收到大厅快照 = 刚进房,把自己的狼人杀昵称报给房主 */
        if (firstSnapshot && settings.nickname) {
          net.send({ w: 1, t: "setName", v: settings.nickname });
        }
        if (!lobby.inGame && (curView === "v-lobby" || wasInGame || G.ended)) {
          showView("v-lobby");
          renderLobby();
        } else if (!lobby.inGame) {
          showView("v-lobby");
          renderLobby();
        }
        return;
      case "setName":
        if (isHost() && lobby) {
          lobby.names = lobby.names || {};
          var nn = String(m.v || "").slice(0, 16).trim();
          if (nn) lobby.names[fromUid] = nn; else delete lobby.names[fromUid];
          lobby.users = net.players().map(function (p) { return { uid: p.userId, name: lobbyName(p) }; });
          renderLobby(); broadcastLobby();
        }
        return;
      case "setReady":
        if (isHost() && lobby && !lobby.inGame) {
          lobby.ready[fromUid] = !!m.v;
          renderLobby(); broadcastLobby();
        }
        return;
      case "setChar":
        if (isHost() && lobby && !lobby.inGame) {
          if (m.char && m.char.characterId) lobby.chars[fromUid] = { characterId: String(m.char.characterId), name: String(m.char.name || "角色").slice(0, 20) };
          else delete lobby.chars[fromUid];
          renderLobby(); broadcastLobby();
        }
        return;
      case "hello":
        /* 客人进房打招呼:房主补发一次大厅快照(幂等),兜住「快照早于对方 join 落定」的竞态 */
        if (isHost() && lobby) broadcastLobby();
        return;
      case "busy":
        /* 只认房主发出的 busy,否则任何人都能把别人踢回首页 */
        if (fromUid === net.hostUid && (m.uids || []).indexOf(myUid()) >= 0 && !isHost()) {
          toast("这间房的牌局正酣,下局再来", "err");
          quitRoom(true);
        }
        return;
    }
  });
}

/* ── 进出房间 ── */
function createRoom(){
  if (relayEnabled()) {
    $("btnCreate").disabled = true;
    RelayNet({ code: relayCode(), uid: relayUid(), name: settings.nickname || "房主",
               isHost: true, joinedAt: Date.now() },
      function (n) { $("btnCreate").disabled = false; attachNet(n); hostLobbyInit(); showView("v-lobby"); },
      function (e) { $("btnCreate").disabled = false; toast(e.message || "创建失败", "err"); });
    return;
  }
  if (!HOSTED || !api.room) return toast("预览模式无法联机,请在小手机内使用", "err");
  $("btnCreate").disabled = true;
  api.room.create({ title: "月夜狼杀", maxPlayers: 12 }).then(function (info) {
    // 本机没有真人联机后端时，房间席位由小手机角色来坐 → 直接进「和角色玩」
    if (info && info.local) {
      toast("已切换为和角色一起玩");
      showView("v-solo");
      return;
    }
    attachNet(RoomNet(info));
    hostLobbyInit();
    showView("v-lobby");
  }).catch(function (e) { toast(e.message || "创建失败", "err"); })
    .then(function(){ $("btnCreate").disabled = false; });
}
function joinRoom(){
  var code = $("joinCode").value.trim().toUpperCase();
  if (code.length !== 4) return toast("邀请码是 4 位", "err");
  if (relayEnabled()) {
    $("btnJoin").disabled = true;
    RelayNet({ code: code, uid: relayUid(), name: settings.nickname || "旅人",
               isHost: false, joinedAt: Date.now() },
      function (n) {
        $("btnJoin").disabled = false;
        attachNet(n);
        lobby = null;
        showView("v-lobby");
        $("roomCodeText").textContent = n.code;
        net.send({ w: 1, t: "hello" });
      },
      function (e) { $("btnJoin").disabled = false; toast(e.message || "加入失败", "err"); });
    return;
  }
  if (!HOSTED || !api.room) return toast("预览模式无法联机,请在小手机内使用", "err");
  $("btnJoin").disabled = true;
  api.room.join({ code: code }).then(function (info) {
    // 本地房间没有别的真机：邀请码无意义，直接转去和角色开局
    if (info && info.local) {
      toast("没有真人房间，先和角色开一局吧");
      showView("v-solo");
      return;
    }
    attachNet(RoomNet(info));
    lobby = null; /* 等房主广播 */
    showView("v-lobby");
    $("roomCodeText").textContent = info.code;
    /* 主动打招呼:房主的首个大厅快照可能在我 join 落定之前就广播过(那时 net 还没就绪、被丢弃),
       靠这条 hello 让房主补发一次快照,避免卡在空大厅。多发无害,房主幂等回快照。 */
    net.send({ w: 1, t: "hello" });
  }).catch(function (e) { toast(e.message || "加入失败", "err"); })
    .then(function(){ $("btnJoin").disabled = false; });
}
function quitRoom(silent){
  if (engine) { engine.destroy(); engine = null; }
  clearEngineEmit();
  Voice.hush();
  if (net && !net.local) net.close();
  net = null; lobby = null;
  resetG();
  showView("v-home");
  if (!silent) toast("已离开房间");
}
function teardownGame(){
  if (engine) { engine.destroy(); engine = null; }
  clearEngineEmit();
  Voice.hush();
  net = null;
  resetG();
}

/* ── 房间全局事件 ── */
if (HOSTED && api.room) {
  api.on("room.message", function (msg) {
    if (net && !net.local && !net.relay && msg && msg.from) net.deliver(msg.from.userId, msg.payload);
  });
  api.on("room.players", function (d) {
    if (!net || net.local || net.relay) return;
    net.playersList = d.players || [];
    if (isHost()) hostPlayersChanged(net.playersList);
  });
  api.on("room.closed", function (d) {
    if (!net || net.local || net.relay) return;
    roomClosedLocal(d.reason);
  });
}

/* 房间被动结束(平台事件或驿站信号共用) */
function roomClosedLocal(reason){
  if (!net || net.local) return;
  var reasons = { host_closed: "房主收摊,房间已散", host_left: "房主离线,房间已散", kicked: "你被请出了房间" };
  toast(reasons[reason] || "房间已结束", "err");
  if (engine) { engine.destroy(); engine = null; }
  clearEngineEmit();
  Voice.hush();
  net = null; lobby = null;
  resetG();
  showView("v-home");
}

        quitRoom(true);
        toast("房间已解散");
      });
      foot.appendChild(dis);
    } else {
      var yes = el("button", "btn btn-danger", net && net.local ? "结束牌局" : "离开房间");
      yes.addEventListener("click", function(){
        close();
        if (net && net.local) { teardownGame(); showView("v-home"); }
        else quitRoom();
      });
      foot.appendChild(yes);
    }
    var no = el("button", "btn btn-ghost", "再 想 想");
    no.addEventListener("click", close);
    foot.appendChild(no);
    modal.appendChild(foot);
  });
});

/* 启动 */
loadSettings().then(function(){
  if (HOSTED) Voice.refresh();
  loadPersona([]);
  loadDisplayFont();
  return loadArt();
}).then(function(){
  document.querySelectorAll("[data-art]").forEach(function (img) {
    var u = artUrl(img.dataset.art);
    if (u) img.src = u;
  });
  /* 把纸/笔刷素材注入 CSS 变量,供全局组件当底 */
  [["--brush1","brush1"],["--brush2","brush2"],["--brush3","brush3"],
   ["--brushRed","brush-red"],["--paper","paper-modal"],["--sheetpaper","paper-sheet"],
   ["--orbNight","orb-night"],["--orbDay","orb-day"],["--orbDusk","orb-dusk"]]
    .forEach(function (pair) {
      var u = artUrl(pair[1]);
      if (u) document.documentElement.style.setProperty(pair[0], 'url("' + u + '")');
    });
  refreshProfile();
  curSceneArt = null;
  setSceneArt(document.body.dataset.scene || "void");
  if (!HOSTED) toast("预览模式:联机与 AI 生成不可用,人偶用兜底台词");
});

/* ── 个人资料:昵称/头像/段位 ── */
function refreshProfile(){
  var nameEl = $("pfName");
  if (!nameEl) return;
  nameEl.textContent = settings.nickname || "夜行人";
  $("pfRank").textContent = "暂无段位";
  var av = artUrl(settings.avatarId || "av-hood");
  if (av) $("pfAvatar").src = av;
}
function openEditProfile(){
  openModal(function (modal, close) {
    var head = el("div", "modal-head");
    head.appendChild(el("h3", "serif", "昵 称 与 头 像"));
    modal.appendChild(head);
    var body = el("div", "modal-body");
    var pick = el("div", "av-pick");
    var chosen = settings.avatarId || "av-hood";
    ["av-hood", "av-moon", "av-dual"].forEach(function (id) {
      var b = el("button");
      b.setAttribute("aria-checked", chosen === id ? "true" : "false");
      var im = el("img");
      im.src = artUrl(id) || "";
      b.appendChild(im);
      b.addEventListener("click", function(){
        chosen = id;
        pick.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-checked", "false"); });
        b.setAttribute("aria-checked", "true");
      });
      pick.appendChild(b);
    });
    body.appendChild(pick);
    var fld = el("div", "field");
    fld.style.marginTop = "14px";
    fld.appendChild(el("label", null, "昵称(12 字内)"));
    var inp = el("input");
    inp.type = "text";
    inp.maxLength = 12;
    inp.value = settings.nickname || "";
    inp.placeholder = "夜行人";
    fld.appendChild(inp);
    body.appendChild(fld);
    modal.appendChild(body);
    var foot = el("div", "modal-foot");
    var ok = el("button", "btn btn-primary", "留 名");
    ok.addEventListener("click", function(){
      settings.nickname = inp.value.trim();
      settings.avatarId = chosen;
      saveSettings();
      /* 已经在房里就补报一次,别人那边的名字跟着变 */
      if (net && !net.local) net.send({ w: 1, t: "setName", v: settings.nickname });
      refreshProfile();
      close();
      toast("已记下你的名号", "ok");
    });
    foot.appendChild(ok);
    var no = el("button", "btn btn-ghost", "作 罢");
    no.addEventListener("click", close);
    foot.appendChild(no);
    modal.appendChild(foot);
  });
}
</script>
