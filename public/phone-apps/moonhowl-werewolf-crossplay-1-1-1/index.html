<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
  <script src="/phone-apps/ai-phone-host.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>月夜狼杀</title>
<style>
/* ═══════════════════════════════════════════════════════════
   月夜狼杀 · 深色文游设计系统
   ═══════════════════════════════════════════════════════════ */
:root{
  --ink-900:#07070a; --ink-850:#0b0b0f; --ink-800:#101017; --ink-750:#15151d;
  --ink-700:#1b1b25; --ink-600:#24242f; --ink-500:#2f2f3c;
  --sur-1:rgba(255,248,234,.035); --sur-2:rgba(255,248,234,.055);
  --sur-3:rgba(255,248,234,.082); --sunk:rgba(0,0,0,.28);
  --ln-0:rgba(228,221,205,.07); --ln-1:rgba(228,221,205,.12); --ln-2:rgba(228,221,205,.22);
  --gold-1:#f4efe4; --gold-2:#e4ddcd; --gold-3:#cdc5b4; --gold-4:#a49b8b;
  --gold-5:#7c7466; --gold-6:#544e44; --gold-glow:rgba(179,74,61,.34);
  --blood-3:#e0897a; --blood-4:#b34a3d; --blood-5:#8a2f24; --blood-6:#5e1d15;
  --blood-glow:rgba(217,93,76,.38);
  --moon-3:#a8c4ea; --moon-4:#6d92c8; --moon-5:#47679b; --moon-glow:rgba(109,146,200,.36);
  --jade-3:#8fd6b4; --jade-4:#4fb083; --violet-3:#c3a6e8; --violet-4:#9573c9;
  --tx-hi:#ece6d8; --tx-mid:#a9a294; --tx-low:#8d8577; --tx-faint:#5f594e;
  --tx-ongold:#1a1408; --dead:#4a4a56;
  --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px;
  --f-disp:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",Georgia,serif;
  --f-body:"MoonSerif","Songti SC","STSong","Noto Serif SC","SimSun",Georgia,serif;
  --f-mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sh-sm:0 1px 2px rgba(0,0,0,.4); --sh-md:0 4px 16px -4px rgba(0,0,0,.55);
  --sh-lg:0 18px 48px -12px rgba(0,0,0,.72); --sh-xl:0 32px 80px -20px rgba(0,0,0,.85);
  --in-top:inset 0 1px 0 rgba(255,245,225,.07);
  --eo:cubic-bezier(.16,1,.3,1); --eio:cubic-bezier(.65,0,.35,1); --esp:cubic-bezier(.34,1.4,.64,1);
  --dfast:140ms; --dbase:240ms; --dslow:420ms; --dscene:900ms;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
body[data-scene="night"]{--sc-a:#050506;--sc-b:#101014;--sc-acc:#8d8577;--sc-glow:rgba(179,74,61,.2);}
body[data-scene="day"]{--sc-a:#080807;--sc-b:#16161a;--sc-acc:#a49b8b;--sc-glow:rgba(179,74,61,.16);}
body[data-scene="dusk"]{--sc-a:#0a0607;--sc-b:#1a1012;--sc-acc:#b34a3d;--sc-glow:rgba(179,74,61,.3);}
body[data-scene="void"]{--sc-a:#07070a;--sc-b:#121018;--sc-acc:var(--gold-4);--sc-glow:var(--gold-glow);}

*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;margin:0;padding:0;}
body{
  font-family:var(--f-body); font-size:14px; line-height:1.6; color:var(--tx-hi);
  background:var(--ink-900); overflow:hidden; overscroll-behavior:none;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  user-select:none; touch-action:manipulation;
}
#atmos{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 80% at 50% -10%,var(--sc-b) 0%,transparent 62%),
    radial-gradient(90% 60% at 50% 110%,color-mix(in srgb,var(--sc-acc) 12%,transparent) 0%,transparent 70%),
    linear-gradient(180deg,var(--sc-a) 0%,var(--ink-900) 100%);
  transition:background var(--dscene) var(--eio);}
#atmos::after{content:"";position:absolute;inset:0;opacity:.14;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.5'/></svg>");}
#atmos::before{content:"";position:absolute;left:50%;top:32%;width:74vmin;height:74vmin;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,var(--sc-glow) 0%,transparent 68%);
  opacity:.5;filter:blur(24px);animation:ember 16s var(--eio) infinite;
  transition:background var(--dscene) var(--eio);}
@keyframes ember{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.42}50%{transform:translate(-48%,-53%) scale(1.09);opacity:.6}}
/* 月亮/太阳指示 */
#orb{position:fixed;top:calc(var(--safe-t) + 18px);right:20px;width:34px;height:34px;z-index:1;
  border-radius:50%;pointer-events:none;transition:all var(--dscene) var(--eio);}
body[data-scene="night"] #orb{background:radial-gradient(circle at 35% 35%,#e8eefb,#9db4d8 58%,#5a749e);box-shadow:0 0 26px var(--moon-glow),0 0 60px rgba(109,146,200,.2);}
body[data-scene="day"] #orb{background:radial-gradient(circle at 35% 35%,#fdf2d0,#e2b76a 58%,#a87b32);box-shadow:0 0 26px var(--gold-glow),0 0 60px rgba(212,166,86,.22);}
body[data-scene="dusk"] #orb{background:radial-gradient(circle at 35% 35%,#f6c9b8,#cf7258 58%,#8a3a28);box-shadow:0 0 26px var(--blood-glow);}
body[data-scene="void"] #orb{opacity:0;}

#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;}
h1,h2,h3,h4{margin:0;font-family:var(--f-disp);font-weight:600;letter-spacing:.02em;line-height:1.28;}
p{margin:0;}
.serif{font-family:var(--f-disp);}
.mono{font-family:var(--f-mono);}
.label{font-family:var(--f-disp);font-size:11.5px;letter-spacing:.28em;color:var(--tx-faint);font-weight:400;}
.muted{color:var(--tx-mid);} .dim{color:var(--tx-low);} .center{text-align:center;}
.t-xs{font-size:11px;} .t-sm{font-size:12.5px;}
.rule-ornate{display:flex;align-items:center;gap:12px;color:var(--champ-4);font-size:11px;letter-spacing:.3em;margin:14px 0;}
.rule-ornate::before,.rule-ornate::after{content:"";flex:1;height:1px;}
.rule-ornate::before{background:linear-gradient(90deg,transparent,var(--ln-1));}
.rule-ornate::after{background:linear-gradient(270deg,transparent,var(--ln-1));}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--ink-500) transparent;}
.scroll::-webkit-scrollbar{width:5px;} .scroll::-webkit-scrollbar-track{background:transparent;}
.scroll::-webkit-scrollbar-thumb{background:rgba(228,221,205,.14);border-radius:0;}
input,select,textarea,button{font:inherit;color:inherit;}
button{background-color:transparent;-webkit-appearance:none;appearance:none;}
input[type="text"],select,textarea{
  width:100%;padding:10px 4px;background:transparent;border:0;
  border-bottom:1px solid var(--ln-1);border-radius:0;
  color:var(--tx-hi);outline:none;user-select:text;font-family:var(--f-disp);
  transition:border-color var(--dfast) var(--eo);}
input::placeholder,textarea::placeholder{color:var(--tx-faint);}
input:focus,select:focus,textarea:focus{border-bottom-color:rgba(179,74,61,.7);}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%238d8577' stroke-width='1.4' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 4px center;padding-right:28px;}
select option{background:var(--ink-750);color:var(--tx-hi);}
textarea{resize:none;line-height:1.55;}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
.row{display:flex;align-items:center;} .col{display:flex;flex-direction:column;}
.between{justify-content:space-between;} .wrap{flex-wrap:wrap;}
.gap-1{gap:4px}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.grow{flex:1;min-width:0;min-height:0;} .hidden{display:none!important;}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ── 按钮 · 墨刷底(设计稿笔刷擦字复用) ── */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 26px;min-height:46px;border:0;border-radius:0;
  background-color:transparent;-webkit-appearance:none;appearance:none;
  background-image:var(--brush1);background-size:100% 100%;background-repeat:no-repeat;
  color:var(--tx-hi);font-family:var(--f-disp);font-size:15px;font-weight:600;
  letter-spacing:.2em;text-indent:.2em;cursor:pointer;white-space:nowrap;
  text-shadow:0 1px 5px rgba(0,0,0,.9);
  transition:transform var(--dfast) var(--eo),opacity var(--dbase) var(--eo),color var(--dbase) var(--eo);}
.btn:nth-of-type(2n){background-image:var(--brush2);}
.btn:nth-of-type(3n){background-image:var(--brush3);}
.btn:hover{color:#fff;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.32;cursor:not-allowed;transform:none;}
.btn-primary{color:var(--champ-1);font-weight:700;letter-spacing:.24em;text-indent:.24em;}
.btn-danger,.btn-danger:nth-of-type(2n),.btn-danger:nth-of-type(3n){
  background-image:var(--brushRed);color:#e8b0a6;}
.btn-danger:hover{color:#ffd9d0;}
/* 幽灵:无底,只有字 */
.btn-ghost,.btn-ghost:nth-of-type(2n),.btn-ghost:nth-of-type(3n){
  background-image:none;color:var(--tx-mid);font-weight:400;
  letter-spacing:.1em;text-indent:.1em;min-height:40px;text-shadow:none;}
.btn-ghost:hover{color:var(--tx-hi);}
.btn-sm{min-height:34px;padding:7px 16px;font-size:12.5px;letter-spacing:.14em;text-indent:.14em;}
.btn-lg{min-height:54px;padding:14px 30px;font-size:16.5px;}
.btn-block{display:flex;width:100%;}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:38px;height:38px;border-radius:0;border:0;
  background:transparent;color:var(--tx-mid);cursor:pointer;font-size:16px;
  transition:all var(--dfast) var(--eo);}
.icon-btn:hover{color:var(--tx-hi);}
.icon-btn:active{transform:scale(.9);}
.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;}
.icon-btn img{width:22px;height:22px;object-fit:contain;opacity:.72;
  transition:opacity var(--dbase) var(--eo),transform var(--dbase) var(--eo);}
.icon-btn:hover img{opacity:1;}
.icon-btn:active img{transform:scale(.88);}
.icon-btn.rec{color:var(--blood-3);border-color:rgba(217,93,76,.6);
  box-shadow:0 0 14px rgba(217,93,76,.3);animation:recPulse 1.1s var(--eio) infinite;}
@keyframes recPulse{0%,100%{box-shadow:0 0 8px rgba(217,93,76,.2)}50%{box-shadow:0 0 18px rgba(217,93,76,.5)}}
/* 相位珠:以色代形 */
.ph-orb{width:13px;height:13px;border-radius:50%;flex:none;transition:all var(--dslow) var(--eo);}
.ph-orb.night{background:radial-gradient(circle at 35% 30%,#e6e1d4,#8d8577 60%,#3d3a33);box-shadow:0 0 8px rgba(230,225,212,.25);}
.ph-orb.day{background:radial-gradient(circle at 35% 30%,#f4efe4,#a49b8b 60%,#5f594e);box-shadow:0 0 8px rgba(244,239,228,.3);}
.ph-orb.dusk{background:radial-gradient(circle at 35% 30%,#f4b39d,#b85c40 60%,#5f2416);box-shadow:0 0 10px var(--blood-glow);}
.ph-orb.vote{background:transparent;border:1.5px solid #b34a3d;box-shadow:none;}
.ph-orb.deal,.ph-orb.end{background:transparent;border:1.5px solid var(--champ-3);box-shadow:none;}
/* 姓氏字章头像 */
.avatar.mono-av{font-family:var(--f-disp);color:var(--champ-2);font-weight:600;
  background:radial-gradient(circle at 50% 35%,#232435,#0d0e16 80%);
  border-color:rgba(217,189,130,.4);text-shadow:0 1px 6px rgba(0,0,0,.8);}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:rgba(240,235,224,.22);
  pointer-events:none;animation:rippleOut 560ms var(--eo) forwards;}
@keyframes rippleOut{to{transform:scale(2.6);opacity:0;}}

/* ── 面板:退为无形容器,靠留白与发丝线分节 ── */
.panel{position:relative;background:transparent;border:0;border-radius:0;}
.panel-pad{padding:16px 4px 18px;}
.panel .label{display:flex;align-items:center;gap:12px;}
.panel .label::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,rgba(228,221,205,.22),transparent 85%);}
.ornate::before,.ornate::after{display:none;}
.ornate::before{top:8px;left:8px;border-right:0;border-bottom:0;border-radius:4px 0 0 0;}
.ornate::after{bottom:8px;right:8px;border-left:0;border-top:0;border-radius:0 0 4px 0;}

/* ── 选择行:清单式,菱形选标 ── */
.choice{position:relative;display:flex;align-items:center;gap:16px;width:100%;
  padding:14px 8px;border:0;border-bottom:1px solid rgba(228,221,205,.07);
  background:transparent;cursor:pointer;text-align:left;
  transition:background var(--dbase) var(--eo);}
.choice:last-child{border-bottom:0;}
.choice:hover{background:rgba(217,189,130,.04);}
.choice:active{background:rgba(217,189,130,.08);}
.choice[aria-checked="true"]{
  background:linear-gradient(90deg,rgba(179,74,61,.09),transparent 72%);}
.choice[disabled]{opacity:.34;pointer-events:none;filter:grayscale(.6);}
.choice-mark{flex:none;width:13px;height:13px;border-radius:2px;
  border:1px solid rgba(228,221,205,.3);transform:rotate(45deg);
  display:block;transition:all var(--dbase) var(--esp);}
.choice-mark span{display:none;}
.choice[aria-checked="true"] .choice-mark{
  background:#b34a3d;border-color:#e0897a;
  box-shadow:0 0 10px rgba(179,74,61,.5);transform:rotate(45deg) scale(1.1);}
.choice-body{flex:1;min-width:0;display:flex;flex-direction:column;}
.choice-title{display:block;font-family:var(--f-disp);font-size:16.5px;font-weight:600;
  letter-spacing:.14em;color:var(--champ-2);transition:all var(--dbase) var(--eo);}
.choice[aria-checked="true"] .choice-title{color:var(--champ-1);
  text-shadow:0 1px 16px rgba(195,160,94,.45);}
.choice-sub{display:block;font-size:11.5px;color:var(--tx-low);margin-top:3px;letter-spacing:.02em;}
.choice-tail{flex:none;font-size:12px;color:var(--champ-4);font-family:var(--f-mono);}
.choice[aria-checked="true"] .choice-tail{color:var(--champ-2);}
.choice-danger::before{background:var(--blood-4);}
.choice-danger[aria-checked="true"]{border-color:var(--blood-4);
  background:linear-gradient(160deg,rgba(217,93,76,.2),rgba(217,93,76,.05));
  box-shadow:var(--in-top),0 0 0 1px rgba(217,93,76,.24),0 8px 26px -10px var(--blood-glow);}
.choice-danger[aria-checked="true"] .choice-mark{background:var(--blood-4);border-color:var(--blood-3);
  box-shadow:0 0 14px var(--blood-glow);color:#fff;}

/* ── chips / 状态点 ── */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;
  border-radius:0;border:0;background:transparent;
  font-size:11px;letter-spacing:.08em;color:var(--tx-mid);white-space:nowrap;}
.chip-gold{color:var(--champ-1);}
.chip-blood{color:#e0897a;}
.chip-moon{color:#b9b2a3;}
.chip-jade{color:#9db8a8;}
.chip-dead{color:var(--dead);}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;flex:none;}
.dot-live{color:#7c9c8a;} .dot-ready{color:#b34a3d;} .dot-idle{color:var(--tx-faint);box-shadow:none;}

/* ── 开关 / 步进 ── */
.switch{position:relative;flex:none;width:44px;height:24px;border-radius:999px;border:0;
  background:rgba(0,0,0,.5);cursor:pointer;transition:all var(--dbase) var(--eo);padding:0;}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;
  border-radius:50%;background:var(--tx-low);transition:all var(--dbase) var(--esp);}
.switch[aria-checked="true"]{background:linear-gradient(120deg,#5e1d15,#8a2f24);border-color:rgba(179,74,61,.55);}
.switch[aria-checked="true"]::after{left:23px;background:#f4efe4;box-shadow:0 0 10px rgba(179,74,61,.5);}
.stepper{display:inline-flex;align-items:center;border:0;background:transparent;flex:none;}
.stepper button{width:32px;height:32px;border:0;background:transparent;color:var(--champ-3);
  font-size:16px;cursor:pointer;transition:background var(--dfast);}
.stepper button:hover:not(:disabled){background:var(--sur-2);}
.stepper button:disabled{color:var(--tx-faint);cursor:not-allowed;}
.stepper .val{min-width:34px;text-align:center;font-family:var(--f-mono);font-size:15px;}

/* ── 音量滑杆:细鎏金线 + 圆珠拇指,贴墨色文游风(替代原生 range 的粗红轨) ── */
input[type="range"].vol{
  -webkit-appearance:none;appearance:none;display:block;
  width:100%;height:30px;margin:4px 0 0;padding:0;background:transparent;outline:none;cursor:pointer;}
input[type="range"].vol::-webkit-slider-runnable-track{
  height:3px;border-radius:999px;
  background:linear-gradient(90deg,var(--gold-5) 0%,var(--gold-3) var(--vp,100%),var(--ln-1) var(--vp,100%));
  box-shadow:inset 0 1px 1px rgba(0,0,0,.5);}
input[type="range"].vol::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:50%;margin-top:-6px;
  background:radial-gradient(circle at 35% 30%,#fff8ea 0%,var(--gold-2) 55%,var(--gold-4) 100%);
  border:1px solid rgba(0,0,0,.5);
  box-shadow:0 0 0 3px rgba(228,221,205,.07),0 2px 6px rgba(0,0,0,.55);
  transition:box-shadow var(--dfast) var(--eo);}
input[type="range"].vol:active::-webkit-slider-thumb{
  box-shadow:0 0 0 6px rgba(228,221,205,.12),0 2px 6px rgba(0,0,0,.55);}
input[type="range"].vol::-moz-range-track{
  height:3px;border-radius:999px;background:var(--ln-1);}
input[type="range"].vol::-moz-range-progress{
  height:3px;border-radius:999px;background:linear-gradient(90deg,var(--gold-5),var(--gold-3));}
input[type="range"].vol::-moz-range-thumb{
  width:15px;height:15px;border-radius:50%;
  background:var(--gold-2);border:1px solid rgba(0,0,0,.5);
  box-shadow:0 0 0 3px rgba(228,221,205,.07),0 2px 6px rgba(0,0,0,.55);}

/* ── 计时 ── */
.timer-bar{position:relative;height:3px;border-radius:999px;background:var(--sunk);overflow:hidden;}
.timer-bar>i{display:block;height:100%;border-radius:inherit;
  background:rgba(228,221,205,.45);transition:width 1s linear;}
.timer-bar.urgent>i{background:#b34a3d;}

/* ── 声波 ── */
.wave{display:inline-flex;align-items:flex-end;gap:2px;height:14px;}
.wave i{width:2.5px;border-radius:999px;background:currentColor;animation:waveBeat 900ms var(--eio) infinite;}
.wave i:nth-child(1){height:40%;animation-delay:0ms;}
.wave i:nth-child(2){height:85%;animation-delay:120ms;}
.wave i:nth-child(3){height:60%;animation-delay:240ms;}
.wave i:nth-child(4){height:100%;animation-delay:90ms;}
.wave i:nth-child(5){height:50%;animation-delay:300ms;}
@keyframes waveBeat{0%,100%{transform:scaleY(.35);opacity:.5}50%{transform:scaleY(1);opacity:1}}

/* ── toast ── */
#toasts{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);transform:translateX(-50%);
  z-index:95;display:flex;flex-direction:column;gap:8px;pointer-events:none;
  width:min(440px,calc(100vw - 32px));}
.toast{padding:10px 18px;border-radius:0;border:0;background:rgba(9,9,12,.95);
  box-shadow:var(--sh-lg);font-size:12.5px;text-align:center;font-family:var(--f-disp);
  letter-spacing:.06em;animation:toastIn var(--dbase) var(--esp);}
.toast.out{animation:toastOut var(--dbase) var(--eo) forwards;}
.toast-err{color:var(--blood-3);}
.toast-ok{color:var(--jade-3);}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.94);}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px) scale(.96);}}

/* ── 弹层 / 抽屉 ── */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(3,3,6,.78);
  display:grid;place-items:center;padding:20px;animation:fadeIn var(--dbase) var(--eo);}
.scrim.closing{animation:fadeOut var(--dbase) var(--eo) forwards;}
@keyframes fadeIn{from{opacity:0;}} @keyframes fadeOut{to{opacity:0;}}
.modal{position:relative;width:min(460px,100%);max-height:min(84vh,720px);
  display:flex;flex-direction:column;border:0;border-radius:0;background:transparent;
  overflow:visible;animation:modalIn var(--dslow) var(--esp);
  filter:drop-shadow(0 22px 46px rgba(0,0,0,.85));}
.modal::before{content:"";position:absolute;inset:-10px -10px;z-index:-1;pointer-events:none;
  background-image:var(--paper,linear-gradient(170deg,#15151b,#0b0b0f));
  background-size:100% 100%;background-repeat:no-repeat;}
@keyframes modalIn{from{opacity:0;transform:translateY(26px) scale(.94);}}
.modal-head{padding:24px 22px 12px;text-align:center;flex:none;}
.modal-body{padding:0 22px 14px;overflow-y:auto;}
.modal-foot{padding:10px 22px calc(18px + var(--safe-b));display:flex;gap:14px;flex:none;}
.modal-foot .btn{flex:1;}
.sheet-wrap{position:fixed;inset:0;z-index:70;background:rgba(3,3,6,.6);animation:fadeIn var(--dbase) var(--eo);}
.sheet-wrap.closing{animation:fadeOut var(--dbase) var(--eo) forwards;}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:82vh;display:flex;flex-direction:column;
  border:0;border-radius:0;background:transparent;
  animation:sheetUp var(--dslow) var(--esp);padding-bottom:var(--safe-b);
  filter:drop-shadow(0 -14px 40px rgba(0,0,0,.9));}
.sheet::before{content:"";position:absolute;inset:-20px 0 0;z-index:-1;pointer-events:none;
  background-image:var(--sheetpaper,none);
  background-size:100% auto;background-position:top center;background-repeat:no-repeat;
  background-color:transparent;}
.sheet{background:linear-gradient(180deg,transparent 0 84px,#1a1a1a 84px);}
.sheet-wrap.closing .sheet{animation:sheetDown var(--dbase) var(--eio) forwards;}
@keyframes sheetUp{from{transform:translateY(100%);}} @keyframes sheetDown{to{transform:translateY(100%);}}
.sheet-grip{width:34px;height:2px;background:rgba(228,221,205,.24);margin:12px auto 2px;flex:none;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;
  padding:10px 22px 12px;flex:none;}
.sheet-body{padding:16px 20px 24px;overflow-y:auto;}
.tabs{display:flex;gap:14px;padding:0 0 8px;border:0;border-bottom:1px solid var(--ln-0);background:transparent;}
.tabs button{flex:none;padding:2px 0;border:0;background:transparent;font-family:var(--f-disp);
  color:var(--tx-low);font-size:13px;letter-spacing:.1em;cursor:pointer;white-space:nowrap;
  transition:all var(--dbase) var(--eo);}
.tabs button[aria-selected="true"]{color:var(--champ-1);box-shadow:inset 0 -2px 0 #8a2f24;}
.empty{padding:40px 20px;text-align:center;color:var(--tx-faint);font-size:12.5px;letter-spacing:.1em;}
.empty .glyph{font-size:30px;opacity:.35;display:block;margin-bottom:12px;}

.field{margin-bottom:16px;}
.field>label{display:block;font-size:12.5px;color:var(--tx-mid);margin-bottom:6px;letter-spacing:.05em;}
.field .hint{font-size:11px;color:var(--tx-faint);margin-top:5px;line-height:1.5;}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px 0;border-bottom:1px solid var(--ln-0);}
.setting-row:last-child{border-bottom:0;}
.sr-title{font-size:14px;} .sr-sub{font-size:11px;color:var(--tx-faint);margin-top:2px;}

/* ═══ 视图框架 ═══ */
.view{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px);
  opacity:0;pointer-events:none;transform:translateY(14px) scale(.99);
  transition:opacity var(--dslow) var(--eo),transform var(--dslow) var(--eo);}
.view.on{opacity:1;pointer-events:auto;transform:none;}
.view-inner{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0;}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex:none;}

.topbar .spacer{width:38px;flex:none;}

/* ═══ 首页 · 按设计稿绝对定位(比例实测自原稿) ═══ */
#v-home{padding:0;}
.home2{position:relative;max-width:none;width:100%;height:100%;}
/* 主视觉:模板匹配实测 0.536W @ cx 49.94% cy 36.74% */
.h2-logo{position:absolute;left:49.94%;top:36.80%;width:52.7%;
  transform:translate(-50%,-50%);
  filter:drop-shadow(0 3px 20px rgba(0,0,0,.85));}
/* 墨刷按钮:0.484W @ cx 51.85%,cy 55.05 / 62.58 / 69.99% */
.inkbtn{position:absolute;left:51.85%;width:48.4%;border:0;background:transparent;padding:0;
  cursor:pointer;transform:translate(-50%,-50%);

.inkbtn:hover{transform:translate(-50%,-50%) scale(1.04);filter:brightness(1.15);}
.inkbtn:active{transform:translate(-50%,-50%) scale(.96);}
/* 底部题词:0.556W @ cx 51.27% cy 87.26% */

.pf-edit{flex:none;width:22px;height:22px;border:0;background:transparent;padding:0;

.pf-edit:hover{transform:scale(1.1);}

.h2-corner{display:flex;flex-direction:column;gap:26px;flex:none;}
.sealbtn{width:34px;height:34px;border:0;background:transparent;padding:0;cursor:pointer;
  transition:transform var(--dbase) var(--esp);}
.sealbtn img{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 8px rgba(0,0,0,.6));}
.sealbtn:hover{transform:scale(1.08);}

/* 头像挑选 */
.av-pick{display:flex;gap:14px;justify-content:center;margin:6px 0 2px;}

.av-pick button[aria-checked="true"]{border-color:#b34a3d;

/* (旧首页样式保留供回退) */
.home-inner-legacy{justify-content:flex-end;gap:0;max-width:420px;padding-bottom:6vh;}
.home-brand{text-align:center;margin-bottom:4.5vh;}
.home-brand h1{

  background:linear-gradient(180deg,#f6ecd4 8%,#e5cf9e 55%,#b8954f 100%);

.brand-sub i::after{content:"";position:absolute;top:-1.5px;width:4px;height:4px;transform:rotate(45deg);background:rgba(217,189,130,.7);}

.home-list{display:flex;flex-direction:column;padding:0 30px;}

#v-home .view-inner{}

.home-title .moon{font-size:56px;display:block;margin-bottom:18px;filter:drop-shadow(0 0 24px var(--moon-glow));animation:moonFloat 7s var(--eio) infinite;}
@keyframes moonFloat{0%,100%{transform:translateY(0);opacity:.92}50%{transform:translateY(-7px);opacity:1}}
.home-title h1{font-size:44px;letter-spacing:.3em;text-indent:.3em;font-weight:700;

.home-menu .btn{justify-content:flex-start;padding-left:24px;}
.home-menu .btn .glyph{font-size:19px;width:26px;text-align:center;}
.home-menu .btn small{margin-left:auto;color:inherit;opacity:.55;font-size:11px;letter-spacing:.1em;}
.home-foot{text-align:center;margin-top:26px;color:var(--tx-faint);font-size:11px;letter-spacing:.18em;}

/* ═══ 大厅 ═══ */
.code-card{text-align:center;padding:18px 20px 20px;}
.code-card .code{font-family:var(--f-disp);font-size:40px;font-weight:700;letter-spacing:16px;text-indent:16px;
  color:var(--champ-1);text-shadow:0 2px 14px rgba(0,0,0,.9);line-height:1.2;}
.roster{display:flex;flex-direction:column;}
.roster-item{display:flex;align-items:center;gap:13px;padding:10px 2px;

.roster-item .avatar{width:38px;height:38px;}
.roster-item:last-child{border-bottom:0;}
.avatar{position:relative;flex:none;display:grid;place-items:center;width:42px;height:42px;

.avatar .no{position:absolute;bottom:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;

/* ═══ 板子卡片网格 ═══ */
.board-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px;margin-top:14px;}
.bcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:6px 2px 8px;border:0;background:transparent;cursor:pointer;
  transition:transform var(--dbase) var(--eo);}
.bcard:active{transform:scale(.95);}
.bcard .seal-img{width:60px;height:60px;display:block;
  filter:grayscale(1) brightness(.62) drop-shadow(0 3px 8px rgba(0,0,0,.7));
  transition:filter var(--dbase) var(--eo),transform var(--dbase) var(--esp);}
.bcard .bn{font-family:var(--f-disp);font-size:13.5px;letter-spacing:.1em;color:var(--tx-low);

.bcard .bc{font-size:10px;color:var(--tx-faint);letter-spacing:.06em;}

  padding-top:12px;border-top:1px solid var(--ln-0);}

.ccard{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;

/* ═══ 牌局 ═══ */
#v-game{padding:calc(var(--safe-t) + 10px) 10px calc(var(--safe-b) + 10px);}

   top:safe-top+8、right:12、约 68px 宽。顶栏右侧必须给它让位,

  border-radius:0;border:0;background:transparent;

.seat .tag{position:absolute;top:-7px;left:50%;transform:translateX(-50%);
  font-size:9px;letter-spacing:.08em;padding:1px 8px;border-radius:999px;
  background:var(--ink-800);border:1px solid var(--ln-1);color:var(--tx-low);white-space:nowrap;}
.seat.speaking{border-color:var(--gold-4);
  background:linear-gradient(165deg,rgba(212,166,86,.18),rgba(212,166,86,.03));
  box-shadow:var(--in-top),0 0 0 1px rgba(212,166,86,.25),0 10px 30px -8px var(--gold-glow);
  transform:translateY(-3px);}

  border-radius:50%;background:rgba(7,7,10,.55);color:var(--blood-3);font-size:16px;}

.seat .wavebox{position:absolute;top:4px;right:5px;color:var(--gold-3);display:none;}
.seat.speaking .wavebox{display:inline-flex;}
.seat.selectable{cursor:pointer;}
.seat.selectable:hover{transform:translateY(-3px);border-color:var(--ln-2);}
.seat.selected{border-color:var(--blood-4)!important;
  box-shadow:var(--in-top),0 0 0 1px rgba(217,93,76,.3),0 10px 26px -8px var(--blood-glow)!important;}

/* ═══ 牌局 · 两翼座位 + 中央发言河 ═══ */
.gm-body{flex:1;min-height:0;display:flex;gap:6px;margin-top:6px;}
.rail{flex:none;width:66px;display:flex;flex-direction:column;align-items:center;
  gap:10px;padding:6px 0 10px;overflow-y:auto;}
.rs{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;
  gap:3px;width:64px;cursor:default;transition:transform var(--dbase) var(--eo);}
.rs .avatar{width:52px;height:52px;font-size:22px;
  border:1px solid rgba(228,221,205,.16);
  box-shadow:0 4px 14px -4px rgba(0,0,0,.7);
  transition:all var(--dbase) var(--eo);}
.rs .no{position:absolute;top:-3px;left:1px;min-width:18px;height:18px;padding:0 4px;
  border-radius:999px;background:#8a2f24;
  color:#f4efe4;font-family:var(--f-disp);font-size:11px;font-weight:700;
  line-height:18px;text-align:center;z-index:2;
  box-shadow:0 2px 6px rgba(0,0,0,.5);}
.rs .nm{max-width:64px;font-size:10.5px;color:var(--tx-mid);text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3;
  text-shadow:0 1px 4px rgba(0,0,0,.9);}
.rs .kindtag{font-size:8.5px;color:var(--tx-faint);letter-spacing:.06em;line-height:1;
  text-shadow:0 1px 3px rgba(0,0,0,.9);}
.rs .wavebox{position:absolute;top:38px;right:-2px;color:#e0897a;display:none;z-index:2;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.8));}
.rs.speaking .wavebox{display:inline-flex;}
.rs.speaking .avatar{border-color:rgba(244,239,228,.6);
  box-shadow:0 0 0 2px rgba(179,74,61,.35),0 0 22px rgba(179,74,61,.4);}
.rs.speaking{transform:scale(1.05);}
.rs.me .avatar{border-color:rgba(140,170,220,.65);}
.rs.dead{opacity:.55;}
.rs.dead .avatar{filter:grayscale(1) brightness(.7);}
.rs.dead .avatar::after{content:"";position:absolute;inset:0;border-radius:50%;background:rgba(7,7,10,.4);}
.rs.selectable{cursor:pointer;}
.rs.selectable:hover{transform:scale(1.06);}
.rs.selectable .avatar{border-color:rgba(233,213,168,.55);}
.rs.selected .avatar{border-color:#e0897a!important;
  box-shadow:0 0 0 2px rgba(179,74,61,.45),0 0 22px rgba(179,74,61,.5)!important;}
.rs .seal{font-size:10px;border-width:2px;padding:1px 4px;top:42%;}
.rs .votechip{position:absolute;bottom:26px;right:-4px;font-size:9px;z-index:2;
  padding:1px 5px;border-radius:2px;background:#8a2f24;border:0;color:#f4efe4;}
.gm-center{flex:1;min-width:0;display:flex;flex-direction:column;}
.now-strip{display:flex;align-items:center;gap:7px;flex:none;
  margin:0 2px 8px;padding:5px 4px;border:0;border-bottom:1px solid var(--ln-0);background:transparent;}
.now-strip .who{font-family:var(--f-disp);font-size:12.5px;color:var(--champ-1);white-space:nowrap;}
.now-strip .sub{font-size:11px;color:var(--tx-low);flex:1;min-width:0;}
/* 旧舞台样式保留 */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:8px;}
.stage-card{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 16px;}
.stage-now{display:flex;align-items:center;gap:10px;flex:none;padding-bottom:10px;border-bottom:1px solid var(--ln-0);}
.stage-now .who{font-family:var(--f-disp);font-size:15px;letter-spacing:.06em;color:var(--gold-2);}
.stage-now .sub{font-size:11px;color:var(--tx-low);margin-top:1px;}
.stage-log{flex:1;min-height:0;overflow-y:auto;padding:4px 2px 10px;display:flex;flex-direction:column;gap:8px;}
.line{display:flex;flex-direction:column;gap:5px;animation:lineIn var(--dslow) var(--eo);}
.line .hd{display:flex;align-items:center;gap:8px;}
@keyframes lineIn{from{opacity:0;transform:translateY(8px);}}
.line .avatar{flex:none;width:30px;height:30px;font-size:14px;aspect-ratio:1;overflow:hidden;}
.line .bd{width:100%;min-width:0;}
.line .who{font-size:11px;color:var(--champ-3);letter-spacing:.06em;
  text-shadow:0 1px 4px rgba(0,0,0,.9);}
.line .tx{display:block;width:100%;font-size:12.5px;line-height:1.75;color:var(--tx-hi);
  user-select:text;padding:9px 13px;border-radius:2px;border:0;background:rgba(9,9,12,.8);}
.line.me .tx{background:rgba(46,22,19,.72);}
.line.sys{align-items:center;}
.line.sys .tx{font-size:11px;color:var(--tx-mid);text-align:center;
  padding:4px 14px;border-radius:0;background:transparent;border:0;
  letter-spacing:.08em;}
.line.night .tx{color:#b9b2a3;}
.line.blood .tx{color:#e0897a;}
.line.gold .tx{color:var(--champ-1);}
.line.me .who{color:var(--moon-3);}

/* 底部操作区:自己的头像与首行(输入/横幅)同行,按钮行独占整排 */
.gm-dock{flex:none;display:flex;flex-direction:column;gap:8px;min-width:0;margin-top:10px;}
.dock-top{display:flex;align-items:flex-end;gap:10px;min-width:0;}
.dock-top #selfSeat{flex:none;padding-bottom:0;}
.dock-top .grow{min-width:0;}
.dock-top .rs{width:46px;gap:0;}
.dock-top .rs.speaking{transform:none;}
.dock-top .rs .avatar{width:46px;height:46px;font-size:19px;}
.dock-top .rs .wavebox{top:32px;}
.dock-top .rs .no{top:-4px;left:-4px;}
.dock-actions{display:flex;gap:8px;}
.dock-actions .btn{flex:1;}
/* 底栏控件:统一 46px 高 / 6px 直角 / 同一套描金边 */
.say-row{display:flex;gap:8px;align-items:flex-end;}
.say-row textarea{flex:1;height:46px;min-height:46px;max-height:110px;border-radius:0;
  padding:11px 8px;line-height:22px;overflow-y:hidden;background:rgba(9,9,12,.7);
  border:0;border-bottom:1px solid var(--ln-1);}
.say-row textarea:focus{border-bottom-color:rgba(179,74,61,.7);}
.say-row .btn{flex:none;height:46px;min-height:46px;padding-top:0;padding-bottom:0;}
.say-row .icon-btn{width:46px;height:46px;border-radius:0;background:transparent;border:0;}

/* 行动横幅 */
.act-banner{display:flex;align-items:center;gap:10px;padding:11px 12px;min-height:46px;
  border:0;border-left:2px solid #8a2f24;background:rgba(9,9,12,.72);
  font-size:13px;color:var(--tx-hi);font-family:var(--f-disp);letter-spacing:.04em;
  animation:modalIn var(--dslow) var(--esp);}
.act-banner.night{border-left-color:rgba(228,221,205,.4);color:var(--tx-hi);}
.act-banner .glyph{font-size:17px;}

/* 角色揭示卡 */
.role-flip{perspective:1100px;width:216px;height:300px;margin:6px auto 2px;}
.role-card{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform 900ms var(--esp);}
.role-flip.flipped .role-card{transform:rotateY(180deg);}
.role-face{position:absolute;inset:0;border-radius:3px;border:0;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;box-shadow:var(--sh-lg);overflow:hidden;}
.role-back{background:#0a0a0d;}
.role-back .moon{font-size:52px;filter:drop-shadow(0 0 20px var(--moon-glow));}
.role-back .tip{font-size:11px;color:var(--tx-low);letter-spacing:.3em;text-indent:.3em;}
.role-front{transform:rotateY(180deg);background:#0a0a0d;padding:0;}
.role-front .glyph{font-size:58px;filter:drop-shadow(0 4px 18px rgba(0,0,0,.6));}
.role-front h3{font-size:24px;letter-spacing:.32em;text-indent:.32em;margin-top:2px;}
.role-front .camp{font-size:11px;letter-spacing:.2em;}
.role-front .desc{font-size:12px;color:var(--tx-mid);text-align:center;line-height:1.7;margin-top:6px;}
.role-front.wolf{}
.role-front.wolf h3{color:#e0897a;}
.role-front.good h3{color:var(--champ-1);}

/* 投票公示表 */
.tally{display:flex;flex-direction:column;gap:6px;}
.tally-row{display:flex;align-items:center;gap:10px;font-size:13px;
  padding:9px 2px;border:0;border-bottom:1px solid var(--ln-0);background:transparent;}
.tally-row .n{font-family:var(--f-disp);color:#e0897a;flex:none;}
.tally-row .voters{color:var(--tx-low);font-size:11px;flex:1;text-align:right;}

/* 结算 */
.result-hero{text-align:center;padding:10px 0 4px;}
.result-hero .glyph{font-size:64px;display:block;margin-bottom:12px;}
.result-hero h2{font-size:34px;letter-spacing:.24em;text-indent:.24em;}
.result-hero.wolfwin h2{color:#e0897a;text-shadow:0 2px 18px rgba(0,0,0,.9);}
.result-hero.goodwin h2{color:var(--champ-1);text-shadow:0 2px 18px rgba(0,0,0,.9);}
.reveal-list{display:flex;flex-direction:column;gap:6px;margin-top:14px;}
.reveal-row{display:flex;align-items:center;gap:10px;padding:9px 2px;
  border:0;border-bottom:1px solid var(--ln-0);background:transparent;font-size:13px;}
.reveal-row .r{margin-left:auto;font-family:var(--f-disp);letter-spacing:.1em;}

/* 狼人频道 */
.wolf-chat{border-color:rgba(217,93,76,.3)!important;}
.wolf-chat .sheet-head h3{color:var(--blood-3);}

/* 日志抽屉分组 */
.log-day{margin-bottom:14px;}
.log-day .label{margin-bottom:8px;display:block;}

/* ═══ 美术资产层 ═══ */
#artScene{position:fixed;inset:0;z-index:0;pointer-events:none;}
#artScene .ly{position:absolute;inset:0;background-size:cover;background-position:center top;
  opacity:0;transition:opacity 1100ms var(--eio);}
/* 首页:与设计稿同样满幅拉伸(不裁边) */
#artScene .ly.fit{background-size:100% 100%;background-repeat:no-repeat;background-color:#040405;}
#artScene .ly.on{opacity:1;}
#artScene::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(6,6,8,.5) 0%,rgba(6,6,8,.62) 34%,rgba(6,6,8,.76) 70%,rgba(6,6,8,.9) 100%);}
body[data-scene="void"] #artScene::after{
  background:linear-gradient(180deg,rgba(7,7,10,.12) 0%,rgba(7,7,10,.34) 40%,rgba(7,7,10,.9) 72%,rgba(7,7,10,.98) 100%);}
/* 首页:让底部烛火透出来,只压极浅一层 */
body[data-home="1"] #artScene::after{
  background:linear-gradient(180deg,rgba(7,7,10,.06) 0%,rgba(7,7,10,.12) 55%,rgba(7,7,10,.28) 100%);}
.avatar>img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;aspect-ratio:1;}
.avatar.art{background:#0d0e13;}
.role-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.role-front .veil{position:absolute;left:0;right:0;bottom:0;height:52%;
  background:linear-gradient(180deg,transparent,rgba(4,4,6,.7) 44%,rgba(4,4,6,.97));}
.role-front .rf-body{position:relative;z-index:1;margin-top:auto;width:100%;
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 14px 16px;}
.role-back-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
/* 月相转场幕布 */
#curtain{position:fixed;inset:0;z-index:75;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;background:rgba(4,4,8,0);pointer-events:none;}
#curtain.show{display:flex;animation:curtainBg 2000ms var(--eio) forwards;}
#curtain .c-orb{width:104px;height:104px;border-radius:50%;position:relative;overflow:hidden;
  background-image:var(--orbDay,none);background-size:100% 100%;
  filter:drop-shadow(0 0 34px rgba(244,239,228,.18));
  animation:orbIn 2000ms var(--esp) forwards;}
#curtain.night-c .c-orb{background-image:var(--orbNight,none);
  filter:drop-shadow(0 0 34px rgba(239,234,222,.16));}
#curtain.dusk-c .c-orb{background-image:var(--orbDusk,none);
  filter:drop-shadow(0 0 34px rgba(179,74,61,.3));}
#curtain .c-orb::after{content:"";position:absolute;inset:-6%;border-radius:50%;
  background:#05060b;transform:translateX(-104%);animation:eclipse 2000ms var(--eio) forwards;}
#curtain .c-text{font-family:var(--f-disp);font-size:24px;letter-spacing:.5em;text-indent:.5em;
  color:#e4ddcd;text-shadow:0 2px 18px rgba(0,0,0,.9);opacity:0;
  animation:cTextIn 2000ms var(--eo) forwards;}
#curtain.night-c .c-text{color:#e4ddcd;}
#curtain.dusk-c .c-text{color:#e0897a;}
@keyframes curtainBg{0%{background:rgba(4,4,8,0)}18%{background:rgba(4,4,8,.9)}78%{background:rgba(4,4,8,.9)}100%{background:rgba(4,4,8,0)}}
@keyframes orbIn{0%{transform:scale(.4);opacity:0}22%{transform:scale(1);opacity:1}82%{opacity:1}100%{transform:scale(1.06);opacity:0}}
@keyframes eclipse{0%,30%{transform:translateX(-104%)}62%{transform:translateX(0)}100%{transform:translateX(104%)}}
@keyframes cTextIn{0%,14%{opacity:0;transform:translateY(10px)}32%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
/* 印章 */
.seal{position:absolute;top:50%;left:50%;z-index:5;
  font-family:var(--f-disp);font-weight:700;color:var(--blood-4);
  border:3px solid var(--blood-4);border-radius:8px;padding:2px 6px;
  font-size:15px;letter-spacing:.14em;text-indent:.14em;white-space:nowrap;
  background:rgba(10,6,7,.55);text-shadow:0 0 12px var(--blood-glow);
  box-shadow:0 0 14px rgba(217,93,76,.25),inset 0 0 10px rgba(217,93,76,.14);
  transform:translate(-50%,-50%) rotate(-14deg) scale(2.6);opacity:0;
  animation:sealIn 480ms var(--esp) 60ms forwards;pointer-events:none;}
.seal.gold{color:var(--champ-1);border-color:var(--champ-3);background:rgba(10,10,12,.6);
  text-shadow:none;box-shadow:none;}
@keyframes sealIn{to{transform:translate(-50%,-50%) rotate(-14deg) scale(1);opacity:1;}}
.seat .seal{font-size:12px;border-width:2px;}
/* 首页主视觉 */
#v-home.hasart .home-title .moon{display:none;}
/* 说话中遮罩顶部提示条 */
.turn-strip{position:absolute;left:50%;top:calc(var(--safe-t) + 8px);transform:translateX(-50%);
  z-index:40;display:none;align-items:center;gap:8px;padding:7px 18px;border-radius:999px;
  border:0;background:rgba(9,9,12,.94);
  font-size:12.5px;color:var(--gold-2);box-shadow:var(--sh-lg);white-space:nowrap;}
</style>
</head>
<body data-scene="void" data-home="1">
<div id="atmos"></div>
<div id="artScene"><div class="ly" id="artLyA"></div><div class="ly" id="artLyB"></div></div>
<div id="orb"></div>
<div id="curtain"><div class="c-orb"></div><div class="c-text"></div></div>
<div id="toasts"></div>

<div id="app">

  <!-- ═══ 首页 · 议事厅设计稿还原 ═══ -->
  <section class="view on" id="v-home">
    <div class="view-inner home2">
      <div class="h2-top">
        <div class="h2-profile">
          <img class="pf-av" id="pfAvatar" alt="" draggable="false" />

          </div>

        </div>
      </div>

      <button class="inkbtn b1" id="btnSolo" aria-label="单机开局"><img data-art="ink-solo" alt="" /></button>
      <button class="inkbtn b2" id="btnCreate" aria-label="创建房间"><img data-art="ink-create" alt="" /></button>

      <img class="h2-epi" data-art="epigraph" alt="" draggable="false" />
    </div>
  </section>

  <!-- ═══ 单机设置 ═══ -->
  <section class="view" id="v-solo">
    <div class="view-inner">
      <div class="topbar">
        <button class="icon-btn" data-back aria-label="返回"><img data-art="ic-back" alt="" /></button>
        <h2>单 机 开 局</h2><span class="spacer"></span>
      </div>
      <div class="scroll grow col gap-3" style="padding:2px">
        <div class="panel panel-pad ornate">
          <span class="label">板 子</span>
          <div id="soloBoards" class="col gap-2" style="margin-top:10px"></div>
        </div>

          </div>

    </div>
  </section>

  <!-- ═══ 加入房间 ═══ -->
  <section class="view" id="v-join">
    <div class="view-inner" style="justify-content:center;max-width:400px">
      <div class="topbar">
        <button class="icon-btn" data-back aria-label="返回"><img data-art="ic-back" alt="" /></button>
        <h2>加 入 房 间</h2><span class="spacer"></span>
      </div>
      <div class="panel panel-pad ornate col gap-4">
        <div class="field" style="margin:0">
          <label>朋友给你的 4 位邀请码</label>
          <input type="text" id="joinCode" maxlength="4" autocapitalize="characters" autocomplete="off"
            placeholder="····" style="font-family:var(--f-mono);font-size:34px;text-align:center;letter-spacing:18px;text-indent:18px;padding:14px 8px;background:transparent;border:0;border-bottom:1px solid rgba(228,221,205,.3);border-radius:0;color:var(--champ-1)" />
        </div>
        <button class="btn btn-primary btn-block btn-lg" id="btnJoin">推 门 而 入</button>
      </div>
    </div>
  </section>

  <!-- ═══ 房间大厅 ═══ -->
  <section class="view" id="v-lobby">
    <div class="view-inner">
      <div class="topbar">
        <button class="icon-btn" id="btnLeaveLobby" aria-label="返回"><img data-art="ic-back" alt="" /></button>
        <h2>候 场 大 厅</h2>
        <button class="icon-btn" id="btnLobbyVoice"><img data-art="ico-voice" alt="" /></button>
      </div>
      <div class="scroll grow col gap-3" style="padding:2px">
        <div class="panel code-card ornate" id="codeCard">
          <span class="label">邀 请 码</span>
          <div class="code" id="roomCodeText">····</div>
          <p class="t-xs dim" style="margin-top:4px">把这串码念给朋友，TA 从「加入房间」进来</p>
          <button class="btn btn-sm btn-ghost" id="btnCopyCode" style="margin-top:10px">复制邀请码</button>
        </div>
        <div class="panel panel-pad" id="lobbyBoardPanel">
          <div class="row between">
            <span class="label">板 子</span>
            <span class="t-xs dim" id="lobbySeatCount"></span>
          </div>
          <div id="lobbyBoards" class="col gap-2" style="margin-top:10px"></div>
        </div>
        <div class="panel panel-pad hidden" id="lobbyTalkPanel">
          <div class="setting-row">
            <div><div class="sr-title">发言限时</div><div class="sr-sub">每位玩家的白天发言时长,开局生效</div></div>
            <div class="stepper" data-stepper="talkLobby"><button data-d="-1">−</button><span class="val"></span><button data-d="1">＋</button></div>
          </div>
        </div>
        <div class="panel panel-pad">
          <div class="row between">
            <span class="label">入 席 名 单</span>
            <span class="chip" id="lobbyFillHint"><span class="dot dot-idle"></span>空位由人偶补齐</span>
          </div>
          <div class="roster" id="lobbyRoster" style="margin-top:10px"></div>
        </div>
        <div class="panel panel-pad">
          <div class="row between">
            <span class="label">我 带 的 角 色</span>
            <span class="t-xs dim">每人限携一位</span>
          </div>
          <div id="lobbyMyChar" class="col gap-2" style="margin-top:10px"></div>

/* ── 基础工具 ── */
function $(id){ return document.getElementById(id); }
function el(tag, cls, text){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function esc(s){ return String(s == null ? "" : s); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function shuffle(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
/* 兜底台词专用:不连着重复上一句,否则两个人偶挨着说同一句很出戏 */
var _lastCanned = "";
function pickLine(arr){
  if (!arr || !arr.length) return "";
  var t = pick(arr);
  for (var i = 0; i < 4 && t === _lastCanned && arr.length > 1; i++) t = pick(arr);
  _lastCanned = t;
  return t;
}

/* 点击涟漪(全局代理,丝滑微动效) */
document.addEventListener("pointerdown", function (e) {
  var host = e.target.closest(".btn, .choice, .icon-btn, .seat.selectable");
  if (!host) return;
  var r = host.getBoundingClientRect();
  var d = Math.max(r.width, r.height) * 1.1;
  var rip = el("span", "ripple");
  rip.style.width = rip.style.height = d + "px";
  rip.style.left = (e.clientX - r.left - d / 2) + "px";
  rip.style.top = (e.clientY - r.top - d / 2) + "px";
  host.appendChild(rip);
  setTimeout(function(){ rip.remove(); }, 600);
}, { passive: true });

/* toast */
function toast(msg, kind){
  var box = $("toasts");
  var t = el("div", "toast" + (kind === "err" ? " toast-err" : kind === "ok" ? " toast-ok" : ""), msg);
  box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(function(){ t.classList.add("out"); setTimeout(function(){ t.remove(); }, 260); }, 2600);
}

  curView = id;
  document.body.dataset.home = id === "v-home" ? "1" : "0";

    scrim.classList.add("closing");
    setTimeout(function(){ scrim.remove(); }, 250);
  }
  build(modal, close);
  if (!opts.locked) scrim.addEventListener("click", function (e) { if (e.target === scrim) close(); });
  document.body.appendChild(scrim);
  return close;
}
function openSheet(build, opts){

/* ═══ 语音:开麦(TTS)与听写(STT) ═══ */
var Voice = {
  profiles: [],
  queue: [], playing: false, session: 0,
  refresh: function(){
    return api.voice.readProfiles({}).then(function (r) {
      Voice.profiles = (r && r.profiles) || [];
      return Voice.profiles;
    }).catch(function(){ Voice.profiles = []; return []; });
  },
  /* 说话:角色席可带 characterId 用其绑定声线;人偶/旁白用默认声线 */
  say: function(text, opts){
    if (!settings.micOn || !text) return;
    opts = opts || {};
    if (opts.narr && !settings.narrOn) return;
    /* 角色发言优先:积压的旁白直接丢。旁白只是氛围,而且文字早已上屏,
       让它堵在前面会把发言的语音拖后几十秒,开局能冷场半分钟 */
    if (!opts.narr) {
      Voice.queue = Voice.queue.filter(function (it) { return !(it.opts && it.opts.narr); });
    }
    /* 队列挤爆时丢最旧的,但要补回执,否则引擎会干等到封顶 */
    if (Voice.queue.length > 4) {
      var dropped = Voice.queue.shift();
      if (dropped && dropped.opts && dropped.opts.done) { try { dropped.opts.done(); } catch (e) {} }
    }
    Voice.queue.push({ text: String(text).slice(0, 400), opts: opts });
    Voice.pump();
  },
  pump: function(){
    if (Voice.playing || !Voice.queue.length) return;
    var item = Voice.queue.shift();
    Voice.playing = true;
    var mySession = Voice.session;
    var payload = { text: item.text };
    if (item.opts.characterId) payload.characterId = item.opts.characterId;
    else {
      if (settings.voiceConfigId) payload.configId = settings.voiceConfigId;
      if (settings.voiceId) payload.voiceId = settings.voiceId;
    }
    /* tts/play 都不吃 timeoutMs,宿主一挂起队列就永远不再消费、每句卡满封顶。
       分段超时兜底:
       - 合成 30s:超时按失败走既有回执路径;abandoned 标志让「迟到成功」的合成也作废,
         否则 34s 才合成完的音频会照样广播 + 开播,和已经在播的下一句重叠;
       - 播放 60s(与引擎 hold 封顶对齐):挂起时只解开本地队列,不打断可能仍在响的音频。
       播放不能和合成共用 30s——长发言正常播放本身就可能超 30s,一刀切会误切。 */
    var abandoned = false;
    var ttsTimed = new Promise(function (_res, rej) {
      setTimeout(function(){ abandoned = true; rej(new Error("语音合成超时")); }, 30000);
    });
    ttsTimed.catch(function(){});   /* 合成先胜出时,迟到的超时 reject 不算未处理异常 */
    var work = Promise.race([api.voice.tts(payload), ttsTimed]).then(function (r) {
      if (mySession !== Voice.session || abandoned) return;
      if (!r || !r.dataUrl) throw new Error("语音合成没有返回音频");
      /* 合成一次,顺手广播给房间里其他人——不让每台设备各合成一遍 */
      if (item.opts.cast) castAudio(item.opts.cast, r.dataUrl, "char");
      var playTimed = new Promise(function (res) { setTimeout(res, 60000); });
      return Promise.race([
        api.voice.play({ dataUrl: r.dataUrl, channel: "ww-speech", volume: voiceVolume() }),
        playTimed
      ]);
    });
    work.catch(function (e) {
      /* 试听等显式触发的合成失败要告知;游戏内的朗读失败只提示一次,不刷屏 */
      var msg = (e && e.message) ? e.message : "语音合成失败";
      if (item.opts.notify) toast("开麦失败:" + msg, "err");
      else if (!Voice.warned) { Voice.warned = true; toast("语音朗读失败(已静音继续):" + msg, "err"); }
    }).then(function(){
      /* 念完(或失败)回执:引擎靠它决定何时切下一位,而不是拍脑袋估时长 */
      if (item.opts.done) { try { item.opts.done(); } catch (e2) {} }
      /* 只有本 session 仍有效才复位 playing 并续泵:否则 hush 后旧链条会误清标志、与新播放重叠 */
      if (mySession === Voice.session) { Voice.playing = false; Voice.pump(); }
    });
  },
  hush: function(){
    Voice.session++;
    /* 被打断的也要回执,不然引擎会干等到封顶 */
    Voice.queue.forEach(function (it) { if (it.opts && it.opts.done) { try { it.opts.done(); } catch (e) {} } });
    Voice.queue = [];
    Voice.playing = false;
    api.voice.stopPlayback({ channel: "ww-speech" }).catch(function(){});
  },
  listen: function(){
    return api.voice.stt({ lang: "zh-CN", timeoutMs: 15000 });
  }
};

var SFX_LONG = { gong: 1, chime: 1, dusk: 1, win: 1, lose: 1 };

var SFX = {
  ctx: null, master: null, cache: {}, why: "未播放过", via: "-", _busyUntil: 0,
  SR: 22050,

  /* ── 离线合成:把一条 spec 渲染成 16bit PCM WAV dataURL ── */
  render: function(name){
    if (SFX.cache[name]) return SFX.cache[name];
    var spec = SFX_SPEC[name];
    if (!spec) return "";
    var sr = SFX.SR, total = 0;
    spec.forEach(function (p) { total = Math.max(total, (p.delay || 0) + p.d); });
    var n = Math.ceil((total + 0.05) * sr);
    var buf = new Float32Array(n);
    spec.forEach(function (p) {
      var off = Math.floor((p.delay || 0) * sr);
      var len = Math.floor(p.d * sr);
      var vol = p.vol || 0.2;
      if (p.k === "noise") {
        /* 一阶 IIR 代替 biquad,够用 */
        var a = Math.exp(-2 * Math.PI * (p.freq || 900) / sr), prev = 0;
        for (var i = 0; i < len && off + i < n; i++) {
          var w = Math.random() * 2 - 1;
          prev = a * prev + (1 - a) * w;
          var v = p.hp ? (w - prev) : prev;
          buf[off + i] += v * vol * (1 - i / len);
        }
        return;
      }
      var atk = Math.max(1, Math.floor(0.008 * sr));
      var phase = 0;
      for (var j = 0; j < len && off + j < n; j++) {
        var t = j / sr;
        var freq = p.slide ? p.f * Math.pow(p.slide / p.f, t / p.d) : p.f;
        phase += 2 * Math.PI * freq / sr;
        var s;
        if (p.type === "triangle") s = 2 / Math.PI * Math.asin(Math.sin(phase));
        else if (p.type === "sawtooth") s = 2 * (phase / (2 * Math.PI) % 1) - 1;

    dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true);

    if (!SFX_LONG[name] && t < SFX._busyUntil) return;   /* 别掐断钟声 */
    if (SFX_LONG[name]) SFX._busyUntil = t + 900;

      var url;
      try { url = SFX.render(name); } catch (e) { SFX.why = "合成失败:" + (e && e.message || e); return; }

  webaudio: function(name){

    g.gain.linearRampToValueAtTime(p.vol || 0.22, t0 + 0.008);

  flip:  function(){ SFX.emit("flip"); },
  gong:  function(){ SFX.emit("gong"); },
  chime: function(){ SFX.emit("chime"); },
  dusk:  function(){ SFX.emit("dusk"); },
  stamp: function(){ SFX.emit("stamp"); },
  turn:  function(){ SFX.emit("turn"); },
  win:   function(){ SFX.emit("win"); },
  lose:  function(){ SFX.emit("lose"); }

/* 只为「回落用的 WebAudio」解锁(预览模式/宿主代播失败时才会走到)。
   注意:绝不能在这个 iframe 里插 <audio> —— 宿主注释写明会把 iOS 锁屏
   媒体卡片绑到 about:srcdoc,点一下就把 PWA 导航到空白页。 */
function sfxUnlock(){
  var ctx = SFX.ac();
  if (!ctx) return;
  var finish = function(){
    if (ctx.state !== "running") return;
    SFX.why = "正常";
    ["touchstart", "touchend", "click", "pointerup"].forEach(function (ev) {
      document.removeEventListener(ev, sfxUnlock, true);
    });
  };
  try {
    var b = ctx.createBuffer(1, 1, 22050);
    var s = ctx.createBufferSource();
    s.buffer = b; s.connect(ctx.destination); s.start(0);
  } catch (e) {}
  if (ctx.state !== "running") ctx.resume().then(finish).catch(function (e) {
    SFX.why = "resume 被拒:" + (e && e.message || e);
  });
  else finish();
}
/* touchstart 也挂上:iOS 上它比 pointerup/touchend 更早拿到手势 */
["touchstart", "touchend", "click", "pointerup"].forEach(function (ev) {
  document.addEventListener(ev, sfxUnlock, true);
});
/* 按标签匹配,别按类名——类名会随改版失效,button 不会 */
var CLICKY = "button, .rs.selectable";
document.addEventListener("pointerdown", function (e) {
  if (e.target.closest(CLICKY)) SFX.click();
}, { passive: true });
/* pointerdown 在 iOS 上可能早于解锁,click 层兜底补音(SFX.click 自带去重) */
document.addEventListener("click", function (e) {
  if (!SFX.ctx || SFX.ctx.state !== "running") return;
  if (e.target.closest(CLICKY)) SFX.click();
}, true);

/* 角色席走 api.ai.generate,宿主端该接口不吃 timeoutMs 参数——一旦宿主挂起
   promise 永不落定,下游 speakSafe/voteSafe/wolfPickSafe 的兜底 .catch 永不触发。
   这里统一包一层超时,超时即 reject,让既有兜底(启发式/兜底台词)照常接管。 */
function genTimeout(payload, ms){
  var p = api.ai.generate(payload);
  return new Promise(function (resolve, reject) {
    var done = false;
    var t = setTimeout(function(){ if (!done) { done = true; reject(new Error("ai.generate 超时")); } }, ms || 40000);
    Promise.resolve(p).then(function (r) { if (!done) { done = true; clearTimeout(t); resolve(r); } },
                            function (e) { if (!done) { done = true; clearTimeout(t); reject(e); } });
  });
}
var Brain = {
  /* 公共上下文摘要(取自本端可见日志) */
  /* 只取真发言,主持词不占坑(「女巫请闭眼」这种一夜能吃掉七八条)。
     署名从 G.map 现查——日志条目里本来就没有 name/no。 */
  digest: function(G, seat, lines){
    /* 按板子大小给窗口:一天要说满全场,12 人局光一轮就 12 条。
       取 4 轮的量,下限 40 上限 72——够回看三四天,又不至于把 prompt 撑爆 */
    var win = lines || clamp((G.seats.length || 9) * 4, 40, 72);
    var says = G.log.filter(function (l) { return l.k === "say"; }).slice(-win);
    var txt = says.map(function (l) {
      var s = G.map[l.seatId];
      var who = s ? s.name + "(" + s.no + "号)" : "某位";
      var tag = l.kind === "lastwords" ? "[遗言]" : l.kind === "pk" ? "[PK台]" : "";
      return "第" + (l.day || 1) + "天 " + who + tag + ":" + l.text;
    }).join("\n");

  /* 跨天战况:死了谁、投了谁——不受发言窗口挤压,第 5 天也记得第 1 天 */
  recap: function(G){

      if (h.t === "peace") return "第" + h.day + "天天亮:平安夜";
      if (h.t === "shot") return "第" + h.day + "天:" + h.from + " 开枪带走 " + h.name;
      if (h.t === "vote") {
        /* 逐票列出来,谁投了谁一目了然 */
        var tally = h.pairs.map(function (p2) {
          return p2.to ? p2.from + "→" + p2.to : p2.from + "→弃票";
        }).join("、");

      }
