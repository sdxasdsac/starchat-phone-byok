  /* 私有情报摘要 */
  /* 座位名单:谁在桌上、谁已出局。
     不标「真人/人偶/角色」——那是元信息,写进去很出戏,对推理也没帮助。
     我自己的席位用「这个角色认识的那个我」的人设名,而不是 APP 里的昵称。 */
  roster: function(G, seat){
    if (!G.seats.length) return "";
    var list = G.seats.map(function (s) { return seatLabel(s, seat); });
    return "本局座位:" + list.join("、") + "。";
  },
  intel: function(G, seat){
    var bits = [];
    var role = G.myRoles[seat.id];
    var rst = Brain.roster(G, seat);
    if (rst) bits.push(rst);
    /* 兜底:万一底牌没到手(例如接管时序错开),别让整席崩掉 */
    bits.push("你的座位:" + seat.no + "号。你的身份:" + ((ROLES[role] && ROLES[role].name) || "未知") + "。");
    if (role === "wolf" && G.wolfSeats.length) {
      bits.push("狼队友:" + G.wolfSeats.filter(function (id) { return id !== seat.id; })
        .map(function (id) { return G.seatName(id); }).join("、") + "。白天务必伪装成好人。");
    }
    if (role === "seer" && G.checks[seat.id] && G.checks[seat.id].length) {
      bits.push("你的查验:" + G.checks[seat.id].map(function (c) {
        return G.seatName(c.t) + (c.wolf ? "=狼" : "=好人");
      }).join(";") + "。可以选择公开报出来带队。");
    }
    if (role === "witch" && G.witchNotes[seat.id]) bits.push(G.witchNotes[seat.id]);
    return bits.join("\n");
  },
  /* 发言 */
  speak: function(G, seat, kind){
    var role = G.myRoles[seat.id] || "villager";
    var task = kind === "lastwords" ? "你刚刚出局,现在留遗言。可以指认你怀疑的人、把信息托付给好人,也可以亮出自己的底牌。" +
                 "「前情」里有完整票型,谁投了你一目了然,可以据此点名,但别把票型编错。"
             : kind === "pk" ? "你正处在平票 PK 台上,为自己辩护拉票。"
             : "现在轮到你白天发言,推理局势、表达怀疑或自证。";
    var guide = role === "wolf" ? "你是狼人但要装作好人,可以搅浑水、轻踩他人或假装分析。绝不能承认自己是狼。"
              : role === "seer" ? "你可以选择跳预言家公布查验结果带节奏,也可以再藏一轮。"
              : "认真根据发言找狼,表达你的怀疑对象和理由。";
    var common = "这是文字狼人杀游戏。" + task + guide +
      "\n要求:只输出发言本身,口语化,不超过90个字,不用引号,不描写动作,不要自称AI。";
    if (seat.kind === "npc") {
      var npc = NPCS.find(function (n) { return n.id === seat.npcId; }) || NPCS[0];
      /* 人偶要像手机上开黑的普通网友,不是话本人物 */
      var real = "\n另外:你是个用手机玩狼人杀 App 的普通网友,在聊天框里打字。" +
        "写得像真人随口说的话——短、直接、可以有口头禅和省略。" +
        "严禁古风、文言、书面腔和玄学修辞(不准出现「诸位」「在下」「夜观天象」「天机」「妖孽」这类词),不要扮演什么江湖人物。" +
        "可以用狼人杀黑话(金水/查杀/悍跳/对跳/倒钩/划水/抗推/警徽流/起跳/过),但要配得上你的水平——新手就别用。" +
        "尽量控制在40字上下,别长篇大论。";
      return api.ai.chat({
        messages: [
          { role: "system", content: "你叫「" + npc.name + "」(游戏昵称)," + npc.persona + "。说话风格:" + npc.style +
              "。你正在手机上跟网友打一局狼人杀。" },
          { role: "user", content: Brain.intel(G, seat) + "\n\n" + Brain.recap(G) + "\n\n最近发言:\n" + Brain.digest(G, seat) + "\n\n" + common + real }
        ],
        temperature: 0.9, timeoutMs: 45000
      }).then(function (r) { return String((r && r.text) || "").trim(); });
    }
    /* 角色席:走 ai.generate,让角色以自己的人设说话 */
    return genTimeout({
      characterId: seat.characterId,
      instruction: "你正在参加一场狼人杀文字游戏(游戏而已,放开演)。\n" + Brain.intel(G, seat) +
        "\n\n" + Brain.recap(G) + "\n\n最近发言:\n" + Brain.digest(G, seat) + "\n\n" + common,
      historyLimit: 1
    }, 45000).then(function (r) { return String((r && r.text) || "").trim(); });
  },
  speakSafe: function(G, seat, kind){
    /* try 包住:桥缺失时 api.ai.chat/generate 会同步抛,光靠 .catch 接不住,
       异常会穿透到 evs 批处理循环,连累同批后续事件全部丢失。 */
    var call;
    try { call = Brain.speak(G, seat, kind); } catch (e) { call = Promise.reject(e); }
    return Promise.resolve(call).then(function (t) {
      t = (t || "").replace(/^["'“”]+|["'“”]+$/g, "").trim();
      if (!t) throw new Error("empty");
      /* 超长时在句读处收梢,绝不留半句 */
      if (t.length > 280) {
        var head = t.slice(0, 280);
        var cut = Math.max(
          head.lastIndexOf("。"), head.lastIndexOf("!"), head.lastIndexOf("!"),
          head.lastIndexOf("?"), head.lastIndexOf("?"), head.lastIndexOf("…"),
          head.lastIndexOf(";"), head.lastIndexOf(";")
        );
        t = cut > 40 ? head.slice(0, cut + 1) : head + "……";
      }
      return t;
    }).catch(function(){
      var pool = kind === "lastwords" ? CANNED.lastwords : kind === "pk" ? CANNED.pk : CANNED.speech;
      return pickLine(pool);
    });
  },
  /* ── 狼队密谈:今夜同伴说过的话 ── */
  wolfDigest: function(G){
    var lines = G.wolfLog.filter(function (l) { return l.night === G.night; });
    if (!lines.length) return "(同伴还没开口)";
    return lines.map(function (l) { return G.seatName(l.seatId) + ":" + l.text; }).join("\n");
  },
  /* 密谈发言:真读局面和同伴的话,不再是模板 */
  wolfTalk: function(G, seat){
    var mates = G.wolfSeats.filter(function (i) { return i !== seat.id; })
      .map(function (i) { return G.seatName(i); }).join("、") || "无";
    var prey = G.seats.filter(function (s) { return s.alive && G.wolfSeats.indexOf(s.id) < 0; })
      .map(function (s) { return G.seatName(s); }).join("、");
    var body = Brain.intel(G, seat) + "\n\n" + Brain.recap(G) +
      "\n\n白天的发言:\n" + Brain.digest(G, seat) +
      "\n\n今夜狼队密谈:\n" + Brain.wolfDigest(G) +
      "\n\n你的狼队友:" + mates + "。可以刀的好人:" + prey +
      "\n现在是狼人内部商议(好人听不见)。" +
      (Brain.wolfDigest(G) === "(同伴还没开口)"
        ? "你是第一个开口的,提出你想刀谁并给个简短理由。"
        : "同伴已经开口了(见上面的密谈记录)。**不要重复他的话、也别换个说法把同一个提议再说一遍**——" +
          "要么直接表态跟他的刀口(一句「跟」加个理由就行),要么提出不同的人选并说明为什么。") +
      "\n要求:只输出这一句话,口语化,30字以内,像在微信群里商量,不要古风腔,不要自称AI。";
    var call = seat.kind === "npc"
      ? api.ai.chat({
          messages: [
            { role: "system", content: "你叫「" + (seat.name || "玩家") + "」,是这局的狼人,正在和同伴私聊商量今晚刀谁。" },
            { role: "user", content: body }
          ], temperature: 0.85, timeoutMs: 30000
        }).then(function (r) { return (r && r.text) || ""; })
      : genTimeout({ characterId: seat.characterId, instruction: body, historyLimit: 1 }, 40000)
          .then(function (r) { return (r && r.text) || ""; });
    return call.then(function (t) {
      t = String(t).replace(/^["'“”]+|["'“”]+$/g, "").trim();
      if (!t) throw new Error("empty");
      return t.length > 60 ? t.slice(0, 60) : t;
    });
  },
  wolfTalkSafe: function(G, seat){
    var p;
    try { p = Brain.wolfTalk(G, seat); } catch (e) { p = Promise.reject(e); }
    return Promise.resolve(p).catch(function(){
      var t = Brain.decide(G, seat, { stage: "wolfKill", options: G.seats.filter(function (s) { return s.alive; }).map(function (s) { return s.id; }) });
      return pickLine(CANNED.wolf).replace(/\{t\}/g, t ? G.seatName(t) : "谁都行");
    });
  },
  /* 落刀:商议结束后才决定,读得到同伴(含真人)在密谈里说的每一句 */
  wolfPick: function(G, seat, req){
    var cands = (req.options || []).filter(function (id) {
      var s = G.map[id];
      return s && s.alive && G.wolfSeats.indexOf(id) < 0;
    });
    if (!cands.length) return Promise.resolve(null);
    var list = cands.map(function (id) { return G.seatName(id); }).join("、");
    var body = Brain.intel(G, seat) + "\n\n" + Brain.recap(G) +
      "\n\n白天的发言:\n" + Brain.digest(G, seat) +
      "\n\n今夜狼队商议记录:\n" + Brain.wolfDigest(G) +
      "\n\n商议结束,现在落刀。可以刀的人:" + list +
      "\n优先跟上同伴商定的人选(齐刀才不会空刀);同伴意见不一致时,自己挑那个对好人最有威胁的" +
      "(会带节奏的、可能是神职的)。" +
      "\n只输出一个座位号数字,不要任何解释、标点或多余文字。";
    var call = seat.kind === "npc"
      ? api.ai.chat({
          messages: [
            { role: "system", content: "你叫「" + (seat.name || "玩家") + "」,是狼人。现在要决定今晚刀谁,只回一个数字。" },
            { role: "user", content: body }
          ], temperature: 0.5, timeoutMs: 35000
        }).then(function (r) { return (r && r.text) || ""; })
      : genTimeout({ characterId: seat.characterId, instruction: body, historyLimit: 1 }, 40000)
          .then(function (r) { return (r && r.text) || ""; });
    return call.then(function (txt) {
      var m = String(txt).match(/\d+/);
      if (!m) throw new Error("no number");
      var tgt = G.seats.find(function (s) { return s.no === parseInt(m[0], 10); });
      if (!tgt || cands.indexOf(tgt.id) < 0) throw new Error("out of range");
      return tgt.id;
    });
  },
  wolfPickSafe: function(G, seat, req){
    var p;
    try { p = Brain.wolfPick(G, seat, req); } catch (e) { p = Promise.reject(e); }
    return Promise.resolve(p).catch(function(){ return Brain.decide(G, seat, req); });
  },

  /* ── 投票:全场发言结束后才发生,必须真读讨论,所以单独走一次 LLM ── */
  vote: function(G, seat, req){
    var role = G.myRoles[seat.id] || "villager";
    var cands = (req.options || []).filter(function (id) {
      var s = G.map[id]; return s && s.alive && id !== seat.id;
    });
    if (!cands.length) return Promise.resolve(null);
    var list = cands.map(function (id) { return G.seatName(id); }).join("、");
    var stance = role === "wolf"
      ? "你是狼人。绝不能投自己的狼队友(" + (G.wolfSeats.filter(function (i) { return i !== seat.id; })
          .map(function (i) { return G.seatName(i); }).join("、") || "无") + "),要把票推到好人身上,最好是那个带节奏的。"
      : role === "seer"
      ? "你是预言家。手上的查杀优先投出去;没有查杀就投发言最像狼的。"
      : "你是好人。根据这一天的发言判断谁最像狼——看谁的逻辑前后矛盾、谁在划水、谁的站边可疑。";
    var ask = (req.stage === "pkvote" ? "现在是 PK 台重投,只能在这几位里选:" : "全场发言已经结束,现在投票放逐一人。可投的人:")
      + list +
      "\n" + stance +
      "\n只输出一个座位号数字(比如 3),不要任何解释、标点或多余文字。实在选不出来就输出 0 表示弃票。";
    var body = Brain.intel(G, seat) + "\n\n" + Brain.recap(G) + "\n\n本局发言:\n" + Brain.digest(G, seat) + "\n\n" + ask;
    var call = seat.kind === "npc"
      ? api.ai.chat({
          messages: [
            { role: "system", content: "你叫「" + (seat.name || "玩家") + "」,正在手机上玩狼人杀。现在轮到你投票,只回一个数字。" },
            { role: "user", content: body }
          ], temperature: 0.6, timeoutMs: 40000
        }).then(function (r) { return (r && r.text) || ""; })
      : genTimeout({ characterId: seat.characterId, instruction: body, historyLimit: 1 }, 40000)
          .then(function (r) { return (r && r.text) || ""; });
    return call.then(function (txt) {
      var m = String(txt).match(/\d+/);
      if (!m) throw new Error("no number");
      var no = parseInt(m[0], 10);
      if (no === 0) return null;                       /* 弃票 */
      var tgt = G.seats.find(function (s) { return s.no === no; });
      if (!tgt || cands.indexOf(tgt.id) < 0) throw new Error("out of range");
      /* 提示词里已经写了不准投队友,但模型不一定听——代码层再兜一道 */
      if (role === "wolf" && G.wolfSeats.indexOf(tgt.id) >= 0) throw new Error("voted teammate");
      return tgt.id;
    });
  },
  /* 兜底:LLM 失败/超时就用启发式,但也不再瞎投——按这一天被点名的热度来 */
  voteSafe: function(G, seat, req){
    /* try 包住:桥缺失时 api.ai.chat 会同步抛,光靠 .catch 接不住 */
    var p;
    try { p = Brain.vote(G, seat, req); } catch (e) { p = Promise.reject(e); }
    return Promise.resolve(p).catch(function(){
      return Brain.voteFallback(G, seat, req);
    });
  },
  voteFallback: function(G, seat, req){
    var role = G.myRoles[seat.id];
    var cand = (req.options || []).filter(function (id) {
      var s = G.map[id]; return s && s.alive && id !== seat.id;
    });
    if (!cand.length) return null;
    if (role === "wolf") cand = cand.filter(function (id) { return G.wolfSeats.indexOf(id) < 0; }) || cand;
    if (!cand.length) return null;
    if (role === "seer") {
      var kills = (G.checks[seat.id] || []).filter(function (c) { return c.wolf && cand.indexOf(c.t) >= 0; });
      if (kills.length) return kills[kills.length - 1].t;
    }
    /* 数一数今天谁被点名最多 */
    var heat = {};
    G.log.filter(function (l) { return l.k === "say" && (l.day || 1) === G.day; }).forEach(function (l) {
      var re = /(\d+)\s*号/g, m;
      while ((m = re.exec(l.text))) {
        var s = G.seats.find(function (x) { return x.no === parseInt(m[1], 10); });
        if (s && cand.indexOf(s.id) >= 0 && s.id !== l.seatId) heat[s.id] = (heat[s.id] || 0) + 1;
      }
    });
    var best = null, bn = 0;
    Object.keys(heat).forEach(function (id) { if (heat[id] > bn) { bn = heat[id]; best = id; } });
    return best || pick(cand);
  },
  /* 决策(启发式,不烧 token):返回目标座位 id 或 null */
  decide: function(G, seat, req){
    var role = G.myRoles[seat.id];
    var alive = req.options || [];
    if (!alive.length) return null;
    function others(){ return alive.filter(function (id) { return id !== seat.id; }); }
    switch (req.stage || req.kind) {
      case "wolfKill": {
        var prey = alive.filter(function (id) { return G.wolfSeats.indexOf(id) < 0; });
        if (!prey.length) return null;
        /* 各狼独立计算同一确定性目标 → 天然齐刀 */
        prey.sort();
        return prey[(G.night * 7 + 3) % prey.length];
      }
      case "seerCheck": {
        var mine = (G.checks[seat.id] || []).map(function (c) { return c.t; });
        var un = others().filter(function (id) { return mine.indexOf(id) < 0; });
        return un.length ? pick(un) : pick(others());
      }
      case "guardProtect": {
        var opts = alive.filter(function (id) { return id !== req.last; });
        return opts.length ? pick(opts) : null;
      }
      case "witch": {
        if (req.victim && req.canSave && (G.night === 1 || Math.random() < 0.45)) return { save: true };
        if (req.canPoison && G.night >= 2 && Math.random() < 0.2) {
          var t = others(); return t.length ? { poison: pick(t) } : { pass: true };
        }
        return { pass: true };
      }
      case "vote": case "pkvote": {
        var cand = alive.filter(function (id) { return id !== seat.id; });
        if (!cand.length) return null;
        if (role === "wolf") {
          var good = cand.filter(function (id) { return G.wolfSeats.indexOf(id) < 0; });
          if (good.length) { good.sort(); return good[(G.day * 5 + 1) % good.length]; }
        }
        if (role === "seer") {
          var kills = (G.checks[seat.id] || []).filter(function (c) { return c.wolf && cand.indexOf(c.t) >= 0; });
          if (kills.length) return kills[kills.length - 1].t;
        }
        if (Math.random() < 0.12) return null; /* 偶尔弃票,更像人 */
        return pick(cand);
      }
      case "hunterShoot": {
        if (Math.random() < 0.25) return null;
        var t2 = others(); return t2.length ? pick(t2) : null;
      }
    }
    return null;
  }
};

/* ═══════════════════════════════════════════════════════════
   游戏引擎(仅房主/单机端运行) —— 事件源权威
   ═══════════════════════════════════════════════════════════ */
function Engine(cfg, io){
  var E = this;
  E.cfg = cfg;
  E.seats = cfg.seats.map(function (s) { return Object.assign({ alive: true, role: null }, s); });
  E.day = 0; E.night = 0;
  E.phase = "lobby";
  E.potion = { save: true, poison: true };
  E.guardLast = null;
  E.witchSeat = null;
  E.token = 0;          /* 阶段令牌:旧计时器作废 */
  E.pend = null;        /* 当前等待的行动 */
  E.dead = false;

  function seatsAlive(){ return E.seats.filter(function (s) { return s.alive; }); }
  function byId(id){ return E.seats.find(function (s) { return s.id === id; }); }
  function roleSeats(role, aliveOnly){
    return E.seats.filter(function (s) { return s.role === role && (!aliveOnly || s.alive); });
  }
  function wolves(aliveOnly){ return roleSeats("wolf", aliveOnly); }
  function owners(seatList){
    var set = {};
    seatList.forEach(function (s) { set[s.ownerUid] = 1; });
    return Object.keys(set);
  }
  function pub(e, data){ io.emit({ e: e, data: data }); }
  function to(uids, e, data){ io.emit({ e: e, to: Array.isArray(uids) ? uids : [uids], data: data }); }
  /* 发行动请求,并记下来:主人中途掉线时要把同一份请求补发给接手的人 */
  E.lastReq = {};
  E.checks = {};   /* 预言家查验存档:掉线换人时要补发给接手的人 */
  function sendReq(seat, req){
    /* 打上阶段令牌:客户端回传行动时带上它,引擎据此丢弃「上一轮」迟到的响应
       (例如角色席 LLM 慢半拍,回来时已经进了下一环节),避免污染当前环节。 */
    req.round = E.token;
    E.lastReq[seat.id] = req;
    to(seat.ownerUid, "req", req);
  }
  function narrate(text, tone){ pub("narrate", { text: text, tone: tone || "sys" }); }
  function later(ms, fn){
    var tk = E.token;
    return setTimeout(function(){ if (!E.dead && tk === E.token) fn(); }, ms);
  }
  function bump(){ E.token++; if (E.pend && E.pend.timer) clearTimeout(E.pend.timer); E.pend = null; }
  function readMs(text){ return clamp(3500 + String(text || "").length * 150, 4500, 22000); }

  /* ── 开局 ── */
  E.start = function(){
    var deck = [];
    Object.keys(cfg.roles).forEach(function (r) {
      for (var i = 0; i < cfg.roles[r]; i++) deck.push(r);
    });
    deck = shuffle(deck);
    E.seats.forEach(function (s, i) { s.role = deck[i]; });
    E.phase = "start";
    pub("start", {
      board: cfg.boardName,
      talkSec: cfg.talkSec,
      seats: E.seats.map(function (s) {
        return { id: s.id, no: s.no, name: s.name, kind: s.kind, avatar: s.avatar, ownerUid: s.ownerUid, characterId: s.characterId || null, npcId: s.npcId || null };
      })
    });
    /* 私发身份 */
    E.seats.forEach(function (s) { to(s.ownerUid, "role", { seatId: s.id, role: s.role }); });
    var ws = wolves(false);
    to(owners(ws), "wolves", { seatIds: ws.map(function (s) { return s.id; }) });
    narrate("牌已洗好,身份已分发。请各位确认底牌……");
    later(HOSTED ? 5200 : 2200, nightStart);
  };

  /* ── 夜晚 ── */
  function nightStart(){
    bump();
    E.night++;
    E.phase = "night";
    E.nightState = { kill: null, saved: false, poisonTarget: null, guardTarget: null, wolfVotes: {} };
    pub("phase", { p: "night", day: E.day, n: E.night });
    narrate("第 " + E.night + " 夜 —— 天黑请闭眼。", "night");
    later(1800, function(){ runNightStage(0); });
  }

  function runNightStage(idx){
    bump();
    if (idx >= NIGHT_ORDER.length) return resolveNight();
    var role = NIGHT_ORDER[idx];
    var actors = roleSeats(role, true);
    if (!actors.length || !cfg.roles[role]) {
      /* 无此角色/已死:念口令但短暂停顿,不暴露信息 */
      if (cfg.roles[role]) fakeStage(role, function(){ runNightStage(idx + 1); });
      else runNightStage(idx + 1);
      return;
    }
    var lines = { guard: "守卫请睁眼,你要守护谁?", wolf: "狼人请睁眼,今晚猎杀谁?", seer: "预言家请睁眼,你要查验谁?", witch: "女巫请睁眼。" };
    narrate(lines[role], "night");
    /* 狼人要商议 + 各自跑一次 LLM 落刀,40 秒不够 */
    var deadline = now() + (role === "wolf" ? 95000 : 30000);
    E.pend = { kind: role, waits: {}, deadline: deadline, timer: null };
    actors.forEach(function (s) { E.pend.waits[s.id] = false; });
    var aliveIds = seatsAlive().map(function (s) { return s.id; });
    actors.forEach(function (s) {
      var req = { seatId: s.id, stage: null, options: aliveIds, deadline: deadline };
      if (role === "guard") { req.stage = "guardProtect"; req.last = E.guardLast; }
      if (role === "wolf")  { req.stage = "wolfKill"; }
      if (role === "seer")  { req.stage = "seerCheck"; }
      if (role === "witch") {
        req.stage = "witch";
        req.victim = E.nightState.kill;
        /* 女巫仅首夜可自救:自己被刀且非首夜时不给解药选项(与引擎校验一致) */
        var selfBlocked = E.nightState.kill === s.id && E.night > 1;
        req.canSave = E.potion.save && !!req.victim && !selfBlocked;
        req.canPoison = E.potion.poison;
      }
      sendReq(s, req);
    });
    var tk = E.token;
    E.pend.timer = setTimeout(function(){
      if (E.dead || tk !== E.token) return;
      finishNightStage(role, idx);
    }, deadline - now() + 400);
    E.pend.onAllDone = function(){ finishNightStage(role, idx); };
    E.pend.stageIdx = idx;
  }

  function fakeStage(role, next){
    var lines = { guard: "守卫请睁眼……守卫请闭眼。", wolf: "", seer: "预言家请睁眼……预言家请闭眼。", witch: "女巫请睁眼……女巫请闭眼。" };
    if (lines[role]) narrate(lines[role], "night");
    later(2600 + Math.random() * 2600, next);
  }

  function resolveWolfTarget(){
    var v = E.nightState.wolfVotes, tally = {};
    Object.keys(v).forEach(function (k) { if (v[k]) tally[v[k]] = (tally[v[k]] || 0) + 1; });
    var best = null, max = 0, tie = [];
    Object.keys(tally).forEach(function (t) {
      if (tally[t] > max) { max = tally[t]; tie = [t]; }
      else if (tally[t] === max) tie.push(t);
    });
    if (tie.length) best = pick(tie);
    return best;
  }

  function finishNightStage(role, idx){
    if (!E.pend || E.pend.kind !== role) return;
    var closes = { guard: "守卫请闭眼。", wolf: "狼人请闭眼。", seer: "预言家请闭眼。", witch: "女巫请闭眼。" };
    if (role === "wolf") E.nightState.kill = resolveWolfTarget();
    narrate(closes[role], "night");
    bump();
    later(1400, function(){ runNightStage(idx + 1); });
  }

  /* ── 夜晚结算 → 天亮 ── */
  function resolveNight(){
    bump();
    var ns = E.nightState;
    var deaths = [];
    var victim = ns.kill ? byId(ns.kill) : null;
    if (victim && victim.alive) {
      var guarded = ns.guardTarget === victim.id;
      var saved = ns.saved;
      /* 同守同救→死;单独守/救→活 */
      if ((guarded && saved) || (!guarded && !saved)) deaths.push({ seat: victim, cause: "wolf" });
    }
    if (ns.poisonTarget) {
      var p = byId(ns.poisonTarget);
      if (p && p.alive && !deaths.some(function (d) { return d.seat === p; })) deaths.push({ seat: p, cause: "poison" });
    }
    deaths.forEach(function (d) { d.seat.alive = false; });
    E.day++;
    E.phase = "day";
    pub("phase", { p: "day", day: E.day, n: E.night });
    pub("deaths", { list: deaths.map(function (d) { return { seatId: d.seat.id }; }), day: E.day });
    if (deaths.length === 0) narrate("第 " + E.day + " 天 —— 天亮了,昨夜是平安夜。");
    else narrate("第 " + E.day + " 天 —— 天亮了。昨夜倒下的是:" +
      deaths.map(function (d) { return d.seat.no + "号 " + d.seat.name; }).join("、") + "。", "blood");
    /* 猎人若在夜死名单里(中毒枪哑除外),必须先给开枪机会再判胜负:
       否则狼刀掉最后一个神/凑成屠边时会「吞枪」直接判狼胜。与白天放逐路径一致。 */
    var nightHunter = deaths.some(function (d) { return d.seat.role === "hunter" && d.cause === "wolf"; });
    if (!nightHunter) {
      var w = checkWin();
      if (w) return later(2000, function(){ gameOver(w); });
    }
    var steps = [];
    /* 首夜死者有遗言 */
    if (E.day === 1) deaths.forEach(function (d) {
      steps.push(function (done) { speechTurn(d.seat, "lastwords", 45, done); });
    });
    /* 猎人夜死翻牌(中毒枪哑) */
    deaths.forEach(function (d) {
      if (d.seat.role === "hunter" && d.cause === "wolf") {
        steps.push(function (done) { hunterFlow(d.seat, done); });
      }
    });
    /* 开枪后再判胜负:枪响可能逆转局面 */
    steps.push(function(){
      var w2 = checkWin();
      if (w2) return later(2000, function(){ gameOver(w2); });
      daySpeeches(deaths);
    });
    chain(steps);
  }

  function chain(steps){
    var i = 0;
    (function next(){
      if (E.dead) return;
      if (i >= steps.length) return;
      var fn = steps[i++];
      fn(function(){ later(600, next); });
    })();
  }

  /* ── 白天发言 ── */
  function daySpeeches(deaths){
    bump();
    var alive = seatsAlive();
    if (!alive.length) return;
    var startIdx = 0;
    if (deaths && deaths.length) {
      var deadNo = deaths[0].seat.no;
      startIdx = alive.findIndex(function (s) { return s.no > deadNo; });
      if (startIdx < 0) startIdx = 0;
    } else startIdx = Math.floor(Math.random() * alive.length);
    var order = alive.slice(startIdx).concat(alive.slice(0, startIdx));
    narrate("进入发言环节,从 " + order[0].no + " 号开始,依次向下。");
    var steps = order.map(function (s) {
      return function (done) {
        if (!s.alive) return done();
        speechTurn(s, "speech", cfg.talkSec, done);
      };
    });
    steps.push(function(){ votePhase(false); });
    chain(steps);
  }

  function speechTurn(seat, kind, sec, done){
    bump();
    var deadline = now() + sec * 1000;
    E.pend = { kind: "speech", seat: seat, speechKind: kind, deadline: deadline, done: done, spoke: false, timer: null };
    pub("turn", { seatId: seat.id, kind: kind, deadline: deadline });
    sendReq(seat, { seatId: seat.id, stage: "speech", speechKind: kind, deadline: deadline });
    var tk = E.token;
    E.pend.timer = setTimeout(function(){
      if (E.dead || tk !== E.token) return;
      endSpeech(seat);
    }, sec * 1000 + 500);
  }
  function endSpeech(seat){
    if (!E.pend || E.pend.kind !== "speech" || E.pend.seat !== seat) return;
    var done = E.pend.done;
    pub("turn", { seatId: null });
    bump();
    done();
  }

  /* ── 投票 ── */
  function votePhase(isPk, pkIds){
    bump();
    E.phase = "vote";
    var voters = seatsAlive().filter(function (s) { return !isPk || pkIds.indexOf(s.id) < 0; });
    var cands = isPk ? pkIds : seatsAlive().map(function (s) { return s.id; });
    if (isPk && !voters.length) { narrate("无人可投,平安日。"); return later(1600, nightStart); }
    /* AI 席投票要真跑一次 LLM(读完整天发言),35 秒不够,留足 */
    var deadline = now() + 75000;
    pub("phase", { p: "vote", day: E.day, pk: !!isPk });
    narrate(isPk ? "请就 PK 台上的玩家重新投票。" : "进入投票环节,请亮票。");
    pub("vote.begin", { options: cands, deadline: deadline, pk: !!isPk });
    E.pend = { kind: "vote", waits: {}, votes: {}, isPk: !!isPk, pkIds: pkIds || null, deadline: deadline, timer: null };
    voters.forEach(function (s) { E.pend.waits[s.id] = false; });
    voters.forEach(function (s) {
      sendReq(s, { seatId: s.id, stage: isPk ? "pkvote" : "vote",
        options: cands.filter(function (id) { return id !== s.id; }), deadline: deadline });
    });
    var tk = E.token;
    E.pend.timer = setTimeout(function(){
      if (E.dead || tk !== E.token) return;
      tallyVotes();
    }, deadline - now() + 400);
    E.pend.onAllDone = tallyVotes;
  }

  function tallyVotes(){
    if (!E.pend || E.pend.kind !== "vote") return;
    var votes = E.pend.votes, isPk = E.pend.isPk, pkIds = E.pend.pkIds;
    bump();
    var tally = {}, pairs = [];
    Object.keys(votes).forEach(function (from) {
      var t = votes[from];
      pairs.push({ from: from, to: t || null });
      if (t) tally[t] = (tally[t] || 0) + 1;
    });
    var max = 0, top = [];
    Object.keys(tally).forEach(function (t) {
      if (tally[t] > max) { max = tally[t]; top = [t]; }
      else if (tally[t] === max) top.push(t);
    });
    pub("vote.result", { pairs: pairs, tally: tally, exiled: top.length === 1 ? top[0] : null, tie: top.length > 1 ? top : null, pk: isPk });
    if (!top.length) {
      narrate("全体弃票,今日无人被放逐。");
      return later(2400, nightStart);
    }
    if (top.length > 1) {
      if (isPk) {
        narrate("再度平票,今日刀下留人,平安日。");
        return later(2400, nightStart);
      }
      narrate("出现平票!" + top.map(function (id) { return byId(id).no + "号"; }).join("、") + " 进入 PK 发言。");
      var steps = top.map(function (id) {
        return function (done) { var s = byId(id); if (!s.alive) return done(); speechTurn(s, "pk", Math.min(cfg.talkSec, 45), done); };
      });
      steps.push(function(){ votePhase(true, top); });
      return later(1600, function(){ chain(steps); });
    }
    var exiled = byId(top[0]);
    exiled.alive = false;
    E.phase = "dusk";
    pub("phase", { p: "dusk", day: E.day });
    pub("deaths", { list: [{ seatId: exiled.id }], vote: true });
    narrate(exiled.no + "号 " + exiled.name + " 被众人放逐出局。", "blood");
    var steps2 = [
      function (done) { speechTurn(exiled, "lastwords", 45, done); }
    ];
    if (exiled.role === "hunter") steps2.push(function (done) { hunterFlow(exiled, done); });
    steps2.push(function(){
      var w = checkWin();
      if (w) return gameOver(w);
      later(1800, nightStart);
    });
    later(1800, function(){ chain(steps2); });
  }

  /* ── 猎人 ── */
  function hunterFlow(seat, done){
    bump();
    narrate(seat.no + "号亮出底牌 —— 猎人!是否开枪?", "gold");
    var deadline = now() + 25000;
    var opts = seatsAlive().map(function (s) { return s.id; });
    if (!opts.length) return done();
    E.pend = { kind: "shoot", seat: seat, done: done, deadline: deadline, timer: null };
    pub("turn", { seatId: seat.id, kind: "shoot", deadline: deadline });
    sendReq(seat, { seatId: seat.id, stage: "hunterShoot", options: opts, deadline: deadline });
    var tk = E.token;
    E.pend.timer = setTimeout(function(){
      if (E.dead || tk !== E.token) return;
      resolveShoot(seat, null);
    }, 25400);
  }
  function resolveShoot(seat, targetId){
    if (!E.pend || E.pend.kind !== "shoot" || E.pend.seat !== seat) return;
    var done = E.pend.done;
    bump();
    pub("turn", { seatId: null });
    if (!targetId) { narrate("猎人收枪入鞘,没有开火。"); return later(1200, done); }
    var t = byId(targetId);
    if (!t || !t.alive) return later(600, done);
    t.alive = false;
    /* 先发 shot 再发 deaths:客户端处理 deaths 时要读 G.shotFrom 记战报,
       顺序反了连环枪会把第二枪记在上一位猎人名下。 */
    pub("shot", { from: seat.id, target: t.id });
    pub("deaths", { list: [{ seatId: t.id }], shot: true });
    narrate("枪响 —— " + t.no + "号 " + t.name + " 被猎人带走。", "blood");
    var w = checkWin();
    if (w) return later(1800, function(){ gameOver(w); });
    /* 猎人枪走的猎人也可继续开枪(连环) */
    if (t.role === "hunter") return later(1400, function(){ hunterFlow(t, done); });
    later(1400, done);
  }

  /* ── 胜负 ── */
  function checkWin(){
    var w = wolves(true).length;
    var goods = seatsAlive().filter(function (s) { return s.role !== "wolf"; });
    if (w === 0) return "good";
    if (w >= goods.length) return "wolf";
    if (cfg.sideKill) {
      var gods = goods.filter(function (s) { return ROLES[s.role].god; });
      var folks = goods.filter(function (s) { return s.role === "villager"; });
      var hasGods = Object.keys(cfg.roles).some(function (r) { return ROLES[r].god && cfg.roles[r] > 0; });
      if (hasGods && gods.length === 0) return "wolf";
      if (cfg.roles.villager > 0 && folks.length === 0) return "wolf";
    }
    return null;
  }
  function gameOver(winner){
    bump();
    E.phase = "end";
    pub("phase", { p: "end" });
    pub("end", {
      winner: winner,
      reveal: E.seats.map(function (s) { return { seatId: s.id, role: s.role, alive: s.alive }; })
    });
    E.dead = true;
  }

  /* ── 接收玩家/驱动端行动 ── */
  E.act = function(fromUid, m){
    if (E.dead) return;
    /* hostskip 由房主对任意 AI 席(含远端玩家携带的角色席)发起,不能被下面的
       「席位归属」检查挡在外面——否则房主永远跳不动客人的角色席。 */
    if (m.kind === "hostskip") {
      if (fromUid !== cfg.hostUid) return;
      var ps = E.pend;
      /* 校验 seatId:点击与送达之间引擎可能已切到下一位发言者,别误跳无辜的下一位 */
      if (ps && ps.kind === "speech" && ps.seat && ps.seat.kind !== "human"
          && (!m.seatId || ps.seat.id === m.seatId)) endSpeech(ps.seat);
      return;
    }
    var seat = m.seatId ? byId(m.seatId) : null;
    if (!seat || seat.ownerUid !== fromUid) return;
    /* 迟到响应过滤:带令牌的行动若不属于当前环节,直接丢弃 */
    if (["say", "vote", "night", "shoot"].indexOf(m.kind) >= 0 && m.round != null && m.round !== E.token) return;
    var p = E.pend;
    switch (m.kind) {
      case "say": {
        if (!p || p.kind !== "speech" || p.seat !== seat || !seat.alive && p.speechKind !== "lastwords") return;
        var text = String(m.text || "").slice(0, 600).trim();
        if (!text) return;
        p.spoke = true;
        pub("say", { seatId: seat.id, text: text, kind: p.speechKind });
        /* AI 席位说完后自动收梢:先按字数估个时长,
           若该席的主人回报「我要念出来」,这个估时会被作废,改等念完的回执 */
        if (seat.kind !== "human") {
          var tk = E.token, s0 = seat;
          p.readTimer = setTimeout(function(){
            if (!E.dead && tk === E.token) endSpeech(s0);
          }, readMs(text));
        }
        return;
      }
      /* 播放端说「这句我在念,等我」 */
      case "hold": {
        if (!p || p.kind !== "speech" || p.seat !== seat || p.held) return;
        p.held = true;
        if (p.readTimer) { clearTimeout(p.readTimer); p.readTimer = null; }
        /* 关键:也要停掉发言主计时器(talkSec 死线),否则音频还在念、主计时器一到就切人,
           README 承诺的「音频真正播完再切」形同虚设。下面的 60s 封顶已足够防卡死。 */
        if (p.timer) { clearTimeout(p.timer); p.timer = null; }
        var tkH = E.token, sH = seat;
        /* 封顶保险:念不完/掉线也不能把整局卡死 */
        p.readTimer = setTimeout(function(){
          if (!E.dead && tkH === E.token) endSpeech(sH);
        }, 60000);
        return;
      }
      /* 播放端说「念完了」 */
      case "spoken": {
        if (!p || p.kind !== "speech" || p.seat !== seat || !p.held) return;
        if (p.readTimer) { clearTimeout(p.readTimer); p.readTimer = null; }
        var tkS = E.token, sS = seat;
        p.readTimer = setTimeout(function(){
          if (!E.dead && tkS === E.token) endSpeech(sS);
        }, 600);   /* 留半秒喘息,别一停就切 */
        return;
      }
      case "pass": {
        if (p && p.kind === "speech" && p.seat === seat) endSpeech(seat);
        return;
      }
      case "wolfsay": {
        if (seat.role !== "wolf" || !seat.alive || E.phase !== "night") return;
        var wtext = String(m.text || "").slice(0, 300).trim();
        if (!wtext) return;
        to(owners(wolves(false)), "wolfsay", { seatId: seat.id, text: wtext });
        return;
      }
      case "night": {
        /* 必须确认当前确实处在对应夜晚阶段:否则一条迟到的夜行动(设备挂起后回前台)
           会落进投票阶段的 waits,把该席标记成「已投票」却没记票,静默吞掉真正的选票。 */
        if (!p || ["guard", "wolf", "seer", "witch"].indexOf(p.kind) < 0) return;
        if (!p.waits || !(seat.id in p.waits) || p.waits[seat.id]) return;
        var ch = m.choice || {};
        if (p.kind === "guard") {
          var g = ch.target && byId(ch.target);
          if (g && g.alive && g.id !== E.guardLast) { E.nightState.guardTarget = g.id; E.guardLast = g.id; }
          else if (!ch.target) { E.guardLast = null; }
        } else if (p.kind === "wolf") {
          var kt = ch.target && byId(ch.target);
          /* 引擎级硬校验:绝不刀到自己或狼队友(权威端兜底,不信任客户端 UI 的过滤)。 */
          var isTeammate = kt && wolves(false).some(function (w) { return w.id === kt.id; });
          E.nightState.wolfVotes[seat.id] = (kt && kt.alive && !isTeammate) ? kt.id : null;
          to(owners(wolves(false)), "wolfmark", { seatId: seat.id, target: (kt && kt.alive && !isTeammate) ? kt.id : null });
        } else if (p.kind === "seer") {
          var ct = ch.target && byId(ch.target);
          if (ct && ct.alive) {
            E.checks[seat.id] = E.checks[seat.id] || [];
            E.checks[seat.id].push({ t: ct.id, wolf: ct.role === "wolf" });
            to(seat.ownerUid, "seer.result", { seatId: seat.id, target: ct.id, wolf: ct.role === "wolf" });
          }
        } else if (p.kind === "witch") {
          /* 女巫仅首夜可自救:第 2 夜起被刀无法用解药救自己(常规规则) */
          var selfSaveBlocked = E.nightState.kill === seat.id && E.night > 1;
          if (ch.save && E.potion.save && E.nightState.kill && !selfSaveBlocked) {
            E.nightState.saved = true; E.potion.save = false;
          } else if (ch.poison && E.potion.poison) {
            var pt = byId(ch.poison);
            if (pt && pt.alive) { E.nightState.poisonTarget = pt.id; E.potion.poison = false; }
          }
        }
        p.waits[seat.id] = true;
        if (Object.keys(p.waits).every(function (k) { return p.waits[k]; })) {
          var minWait = HOSTED ? 2200 : 300; /* 稍作停顿,防止秒切暴露人数信息 */
          var tk2 = E.token, cb = p.onAllDone;
          setTimeout(function(){ if (!E.dead && tk2 === E.token && E.pend === p) cb(); }, minWait);
        }
        return;
      }
      case "vote": {
        if (!p || p.kind !== "vote" || !(seat.id in p.waits) || p.waits[seat.id]) return;
        var vt = m.target ? byId(m.target) : null;
        var valid = vt && vt.alive && vt.id !== seat.id &&
          (!p.isPk || p.pkIds.indexOf(vt.id) >= 0);
        p.votes[seat.id] = valid ? vt.id : null;
        p.waits[seat.id] = true;
        pub("vote.mark", { seatId: seat.id });
        if (Object.keys(p.waits).every(function (k) { return p.waits[k]; })) {
          var tk3 = E.token, cb2 = p.onAllDone;
          setTimeout(function(){ if (!E.dead && tk3 === E.token && E.pend === p) cb2(); }, 800);
        }
        return;
      }
      case "shoot": {
        if (!p || p.kind !== "shoot" || p.seat !== seat) return;
        resolveShoot(seat, m.target || null);
        return;
      }
    }
  };

  /* 掉线接管:人类席转为人偶托管 */
  E.dropOwner = function(uid){
    if (E.dead) return;
    E.seats.forEach(function (s) {
      if (s.ownerUid !== uid) return;
      var was = s.kind;
      /* 记住原主与原形态:掉线的人回来时凭这个认领席位(而不是被当外人踢走) */
      s.origOwnerUid = uid;
      s.origKind = was;
      s.origCharacterId = s.characterId || null;
      s.ownerUid = cfg.hostUid;
      /* 真人席和角色席都要转成人偶:角色的人设在原主人设备上,
         房主这边 ai.generate 拿不到那个 characterId,只能当人偶打 */
      if (was === "human" || was === "char") {
        s.kind = "npc";
        s.npcId = pick(NPCS).id;
        s.characterId = null;
        if (s.alive) {
          narrate(s.no + "号 " + s.name + (was === "char" ? " 的主人离席,由人偶接手。" : " 离席,由人偶暂代其位。"));
        }
      }
      /* ownerUid 必须一起广播:不然各端还认为是原主人的席位,
         新主人收到行动请求也会因为「不是我的席位」直接跳过,每轮拖满超时 */
      pub("takeover", { seatId: s.id, npcId: s.npcId, ownerUid: s.ownerUid, kind: s.kind });
      /* 底牌是私发的,新主人手上根本没有这一席的身份。
         不补发的话 Brain.intel 里 ROLES[undefined].name 会直接抛异常,席位彻底卡死。 */
      to(s.ownerUid, "role", { seatId: s.id, role: s.role });
      if (s.role === "wolf") {
        var ws = wolves(false);
        to(s.ownerUid, "wolves", { seatIds: ws.map(function (w) { return w.id; }) });
      }
      (E.checks[s.id] || []).forEach(function (c) {
        to(s.ownerUid, "seer.result", { seatId: s.id, target: c.t, wolf: c.wolf });
      });
      /* 只在这一席「确实还欠当前环节一个动作」时才补发请求:
         否则会把已经说完/已经投过的席位再驱动一遍(接管人偶重复发言),
         或把上一环节的陈旧请求补发出去白跑一次 LLM。 */
      var pending = E.lastReq && E.lastReq[s.id];
      var stillOwes = E.pend && pending && pending.round === E.token && (
        (E.pend.kind === "speech" && E.pend.seat === s && !E.pend.spoke) ||
        (E.pend.kind === "shoot" && E.pend.seat === s) ||
        (E.pend.waits && (s.id in E.pend.waits) && !E.pend.waits[s.id])
      );
      if (stillOwes && !E.dead) to(s.ownerUid, "req", pending);
    });
  };

  E.hasDroppedOwner = function(uid){
    return E.seats.some(function (s) { return s.origOwnerUid === uid; });
  };
  /* 掉线玩家重连回桌:席位从人偶手里还给原主(角色席连人设一起还——
     人设在原主设备上,只有 TA 自己能继续驱动)。私发身份也补一份。 */
  E.reclaimOwner = function(uid){
    if (E.dead) return false;
    var got = false;
    E.seats.forEach(function (s) {
      if (s.origOwnerUid !== uid) return;
      got = true;
      s.ownerUid = uid;
      s.kind = s.origKind || "human";
      s.characterId = s.origCharacterId || null;
      s.npcId = null;
      s.origOwnerUid = null; s.origKind = null; s.origCharacterId = null;
      if (s.alive) narrate(s.no + "号 " + s.name + " 的主人回到桌上,重新接手席位。");
      pub("takeover", { seatId: s.id, npcId: null, ownerUid: uid, kind: s.kind, characterId: s.characterId });
      to(uid, "role", { seatId: s.id, role: s.role });
      if (s.role === "wolf") {
        var ws2 = wolves(false);
        to(uid, "wolves", { seatIds: ws2.map(function (w) { return w.id; }) });
      }
      (E.checks[s.id] || []).forEach(function (c) {
        to(uid, "seer.result", { seatId: s.id, target: c.t, wolf: c.wolf });
      });
    });
    return got;
  };

  E.destroy = function(){ E.dead = true; bump(); };
}

function RelayNet(opts, onReady, onFail){
  var PEER_GRACE = 20000, HOST_GRACE = 30000;
  var N = { uid: opts.uid, selfName: opts.name, isHost: !!opts.isHost, code: opts.code,
            local: false, relay: true, hostUid: opts.isHost ? opts.uid : null, playersList: [] };
  var cb = null, ws = null, closedByUs = false, joined = false, refN = 0, joinRef = null;
  var topic = "realtime:moonhowl-x:" + opts.code;
  var raw = {};            /* presence 原始集合 uid → meta */
  var graced = {};         /* 宽限后的玩家表 uid → meta */
  var pendingLeave = {};   /* uid → timer */
  var banned = {};         /* 房主本地封禁表 */
  var hostLossTimer = null, hb = null, ready = false, reconnectT = null, backoff = 1000;
  var iamTimer = null;
  var IAM_EVERY = 10000, IAM_STALE = 25000;

  /* 成员表双通道:服务器 presence 是辅助,广播 iam 自报家门是主干——
     实测 presence 扩散有惰性批处理(几秒甚至更久),广播则始终秒达。 */
  function upsertRaw(uid, meta){
    raw[uid] = { name: meta.name, isHost: !!meta.isHost, joinedAt: Number(meta.joinedAt) || 0, _seen: Date.now() };
  }
  function sendIam(resync){
    wsSend(frame("broadcast", { type: "broadcast", event: "msg",
      payload: { from: N.uid, name: N.selfName, sys: "iam",
                 meta: { name: N.selfName, isHost: N.isHost, joinedAt: opts.joinedAt, resync: !!resync } } }));
  }
  function sweepStale(){
    var now = Date.now(), changed = false;
    Object.keys(raw).forEach(function (uid) {
      if (uid === N.uid) return;
      if (now - (raw[uid]._seen || 0) > IAM_STALE) { delete raw[uid]; changed = true; }
    });
    if (changed) applyPresence();
  }
  var resolved = false, failT = null, everJoined = false;

  function resolveOk(){
    if (resolved) return;
    resolved = true; ready = true;
    if (failT) { clearTimeout(failT); failT = null; }
    if (onReady) onReady(N);
  }
  function resolveFail(msg){
    if (resolved) return;
    resolved = true;
    if (failT) { clearTimeout(failT); failT = null; }
    closedByUs = true;
    cleanup();
    if (onFail) onFail(new Error(msg));
  }

  N.onMessage = function (fn) { cb = fn; };
  N.players = function(){ return N.playersList; };
  N.deliver = function (fromUid, payload) { if (cb) cb(fromUid, payload); };

  function frame(event, payload){
    refN += 1;
    var f = { topic: topic, event: event, payload: payload, ref: String(refN) };
    if (event === "phx_join") { joinRef = f.ref; }
    if (joinRef) f.join_ref = joinRef;
    return f;
  }
  function wsSend(obj){
    if (ws && ws.readyState === 1) { try { ws.send(JSON.stringify(obj)); return true; } catch (e) {} }
    return false;
  }

  var sendChain = Promise.resolve();
  N.send = function (payload) {
    if (cb) setTimeout(function(){ cb(N.uid, payload); }, 0);
    sendChain = sendChain.then(function(){
      var pack = function(){
        return wsSend(frame("broadcast", { type: "broadcast", event: "msg",
          payload: { from: N.uid, name: N.selfName, body: payload } }));
      };
      if (pack()) return;
      /* 没发出去(瞬断):退避 400ms 重试一次,和 RoomNet 同一套纪律 */
      return new Promise(function (res) { setTimeout(res, 400); }).then(function(){ pack(); });
    }).catch(function (e) { console.warn("relay.send", e); });
  };

  N.kick = function (uid) {
    if (!N.isHost) return Promise.reject(new Error("只有房主可以移出玩家"));
    banned[uid] = true;
    wsSend(frame("broadcast", { type: "broadcast", event: "msg",
      payload: { from: N.uid, name: N.selfName, sys: "kick", target: uid } }));
    return Promise.resolve();
  };

  N.close = function(){
    closedByUs = true;
    if (N.isHost) {
      wsSend(frame("broadcast", { type: "broadcast", event: "msg",
        payload: { from: N.uid, name: N.selfName, sys: "closed" } }));
    }
    cleanup();
  };

  function cleanup(){
    if (iamTimer) { clearInterval(iamTimer); iamTimer = null; }
    if (hb) { clearInterval(hb); hb = null; }
    if (reconnectT) { clearTimeout(reconnectT); reconnectT = null; }
    if (hostLossTimer) { clearTimeout(hostLossTimer); hostLossTimer = null; }
    Object.keys(pendingLeave).forEach(function (k) { clearTimeout(pendingLeave[k]); });
    pendingLeave = {};
    document.removeEventListener("visibilitychange", onVis);
    if (ws) { try { ws.onclose = null; ws.close(); } catch (e) {} ws = null; }
  }

  function finish(reason){
    if (closedByUs) return;
    closedByUs = true;
    cleanup();
    roomClosedLocal(reason);
  }

  function syncPlayers(){
    N.playersList = Object.keys(graced).map(function (uid) {
      var m = graced[uid];
      return { userId: uid, name: m.name || "玩家", isHost: !!m.isHost,
               joinedAt: Number(m.joinedAt) || 0 };
    }).sort(function (a, b) { return a.joinedAt - b.joinedAt; });
    if (!N.isHost) {
      var h = N.playersList.find(function (p) { return p.isHost; });
      if (h) { N.hostUid = h.userId; resolveOk(); }
      watchHost();
    }
    if (net === N && isHost()) hostPlayersChanged(N.playersList);
  }

  function watchHost(){
    var present = N.hostUid && graced[N.hostUid];
    if (present) { if (hostLossTimer) { clearTimeout(hostLossTimer); hostLossTimer = null; } return; }
    if (hostLossTimer || closedByUs || !ready) return;
    hostLossTimer = setTimeout(function(){
      hostLossTimer = null;
      if (!(N.hostUid && graced[N.hostUid])) finish("host_left");
    }, HOST_GRACE);
  }

  function applyPresence(){
    /* raw → graced:新到的立即进;消失的进 20s 宽限(iOS 锁屏重连的常态) */
    var changed = false;
    Object.keys(raw).forEach(function (uid) {
      if (pendingLeave[uid]) { clearTimeout(pendingLeave[uid]); delete pendingLeave[uid]; }
      if (!graced[uid]) changed = true;
      graced[uid] = raw[uid];
      if (N.isHost && banned[uid] && uid !== N.uid) {
        wsSend(frame("broadcast", { type: "broadcast", event: "msg",
          payload: { from: N.uid, name: N.selfName, sys: "kick", target: uid } }));
      }
    });
    Object.keys(graced).forEach(function (uid) {
      if (raw[uid] || pendingLeave[uid]) return;
      pendingLeave[uid] = setTimeout(function(){
        delete pendingLeave[uid];
        if (raw[uid] || closedByUs) return;
        delete graced[uid];
        syncPlayers();
      }, PEER_GRACE);
    });
    if (changed) syncPlayers();
  }

  function onFrame(f){
    if (f.topic !== topic) return;
    if (f.event === "phx_reply" && f.ref === joinRef) {
      if (f.payload && f.payload.status === "ok") {
        var isRejoin = everJoined;
        everJoined = true;
        joined = true;
        wsSend(frame("presence", { type: "presence", event: "track",
          payload: { name: N.selfName, isHost: N.isHost, joinedAt: opts.joinedAt } }));
        upsertRaw(N.uid, { name: N.selfName, isHost: N.isHost, joinedAt: opts.joinedAt });
        applyPresence();
        if (N.isHost) resolveOk();
        /* 重连后点名:带 resync 标记,收到的人都会应答一次 iam;
           8 秒后还没应答的成员视为真离线,进离开宽限 */
        sendIam(isRejoin);
        if (isRejoin) setTimeout(function(){
          if (closedByUs) return;
          var cut = Date.now() - 8000, changed = false;
          Object.keys(raw).forEach(function (uid) {
            if (uid === N.uid) return;
            if ((raw[uid]._seen || 0) < cut) { delete raw[uid]; changed = true; }
          });
          if (changed) applyPresence();
        }, 8000);
        if (!iamTimer) iamTimer = setInterval(function(){ sendIam(); sweepStale(); }, IAM_EVERY);
        /* 客人:从此刻起等房主现身(实测存量在场者以 presence_diff 稍后补发) */
        if (!N.isHost && !resolved && !failT) {
          failT = setTimeout(function(){ resolveFail("没找到这间房(邀请码不对,或房主不在线)"); }, 6000);
        }
      } else { resolveFail("驿站拒绝了连接"); }
      return;
    }
    if (f.event === "presence_state") {
      var inState = {};
      Object.keys(f.payload || {}).forEach(function (uid) {
        var metas = (f.payload[uid] || {}).metas || [];
        if (metas.length) { upsertRaw(uid, metas[metas.length - 1]); inState[uid] = true; }
      });
      /* 全量快照(通常是自己刚重连):不在快照里、iam 心跳也停了一阵的成员,
         立即进离开宽限——否则要等 25s 失联清扫,人偶接管会迟到很久。
         iam 仍新鲜的保留(presence 抖动漏报的容错)。 */
      Object.keys(raw).forEach(function (uid) {
        if (uid === N.uid || inState[uid]) return;
        if (Date.now() - (raw[uid]._seen || 0) > IAM_EVERY + 2000) delete raw[uid];
      });
      applyPresence();
      if (N.isHost) resolveOk();
      return;
    }
    if (f.event === "presence_diff") {
      var joins = (f.payload || {}).joins || {}, leaves = (f.payload || {}).leaves || {};
      Object.keys(joins).forEach(function (uid) {
        var metas = joins[uid].metas || [];
        if (metas.length) upsertRaw(uid, metas[metas.length - 1]);
      });
      Object.keys(leaves).forEach(function (uid) {
        /* 服务器的离线信号立即进宽限——若是 presence 抖动误报,
           对方 10 秒内的下一次 iam 心跳会在宽限内把人救回来 */
        if (uid !== N.uid) delete raw[uid];
      });
      applyPresence();
      return;
    }
    if (f.event === "broadcast" && f.payload && f.payload.event === "msg") {
      var m = f.payload.payload || {};
      if (!m.from || m.from === N.uid) return;
      if (m.sys === "iam") {
        var newFace = !raw[m.from];
        upsertRaw(m.from, m.meta || {});
        applyPresence();
        /* 新面孔或点名(resync)都要应答,让对方的成员表立刻齐 */
        if (newFace || (m.meta && m.meta.resync)) setTimeout(function(){ sendIam(false); }, 200 + Math.floor(Math.random() * 400));
        return;
      }
      if (m.sys === "kick") {
        if (m.from === N.hostUid && m.target === N.uid) finish("kicked");
        return;
      }
      if (m.sys === "closed") {
        if (m.from === N.hostUid) finish("host_closed");
        return;
      }
      if (cb) cb(String(m.from), m.body);
    }
  }

  function connect(){
    var wsUrl = RELAY.url.replace(/^http/, "ws").replace(/\/+$/, "") +
      "/realtime/v1/websocket?apikey=" + encodeURIComponent(RELAY.anonKey) + "&vsn=1.0.0";
    ws = new WebSocket(wsUrl);
    ws.onopen = function(){
      backoff = 1000;
      joinRef = null;
      wsSend(frame("phx_join", {
        config: { broadcast: { self: false, ack: false }, presence: { key: N.uid, enabled: true } },
        access_token: RELAY.anonKey
      }));
      if (!hb) hb = setInterval(function(){
        refN += 1;
        wsSend({ topic: "phoenix", event: "heartbeat", payload: {}, ref: String(refN) });
      }, 25000);
    };
    ws.onmessage = function (ev) {
      var f = null;
      try { f = JSON.parse(ev.data); } catch (e) { return; }
      if (f) onFrame(f);
    };
    ws.onclose = function(){
      if (closedByUs) return;
      if (!resolved && !joined) { resolveFail("连不上联机驿站,请稍后再试"); return; }
      /* 瞬断:退避重连,presence 同 key 回来会自动顶掉旧影子 */
      joined = false;
      if (reconnectT) return;
      reconnectT = setTimeout(function(){ reconnectT = null; connect(); }, backoff);
      backoff = Math.min(backoff * 2, 10000);
    };
  }
  function onVis(){
    if (document.visibilityState !== "visible" || closedByUs) return;
    if (!ws || ws.readyState > 1) {
      if (reconnectT) { clearTimeout(reconnectT); reconnectT = null; }
      connect();
    }
  }
  document.addEventListener("visibilitychange", onVis);
  connect();
  return N;
}

function relayCode(){
  var chars = "23456789ABCDEFGHJKMNPQRSTUVWXYZ", code = "";
  for (var i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

function RoomNet(info){
  var N = { uid: info.selfUserId, selfName: info.selfName || settings.nickname || "我",
            isHost: !!info.isHost, code: info.code, local: false };
  /* 房主身份以服务端返回的 hostUserId 为准(权威),不靠「第一个发消息的人」推断,
     免得被伪造的 evs/lobby 抢注房主。 */
  N.hostUid = info.isHost ? info.selfUserId : (info.hostUserId || (function(){
    var h = (info.players || []).find(function (p) { return p.isHost; });
    return h ? h.userId : null;
  })());
  var cb = null;
  N.playersList = info.players || [];
  N.onMessage = function (fn) { cb = fn; };
  var sendChain = Promise.resolve();
  N.send = function (payload) {
    /* 广播不回显自己 → 本地同步回环一份 */
    if (cb) setTimeout(function(){ cb(N.uid, payload); }, 0);
    /* 失败(瞬断/限流)退避 300ms 重试一次:丢一条 evs 就可能整局失步
       (看不到底牌/失去密谈入口)。send 只在「根本没发出去」时才 reject,重试不产生重复。
       用 promise 链把所有广播串行化:后一条必须等前一条(含它的重试)落定才发出,
       否则「批 1 失败重发、批 2 先到」会乱序——开局的 start 批迟到会触发 resetG 清掉
       刚收到的底牌。串行化还顺带给限流一个天然的背压。 */
    sendChain = sendChain.then(function(){
      return api.room.send(payload).catch(function(){
        return new Promise(function (res) { setTimeout(res, 300); }).then(function(){
          return api.room.send(payload);
        });
      });
    }).catch(function (e) { console.warn("room.send", e); });
  };
  N.deliver = function (fromUid, payload) { if (cb) cb(fromUid, payload); };
  N.close = function(){ api.room.leave().catch(function(){}); };
  N.players = function(){ return N.playersList; };
  return N;
}

/* ═══════════════════════════════════════════════════════════

function resetG(){

  G.day = 0; G.night = 0; G.phase = ""; G.log = []; G.speaking = null; G.deadline = 0;

    var canCast = settings.castOn && net && !net.local && api.voice && api.voice.record;
    mic.title = canCast ? "说话:转成文字,并把你的原声播给同桌" : "语音转文字";
    mic.addEventListener("click", function(){

      }
      mic.classList.add("rec");
      var jobs = [
        /* 识别:文字要进发言流,AI 和角色靠它读懂你说了什么 */
        Voice.listen().then(function (r) {

        }).catch(function (e) { toast(e.message || "语音识别不可用", "err"); })
      ];
      if (canCast) {

          if (r && r.dataUrl) castAudio(data.seatId, r.dataUrl, "human");
        }).catch(function (e) {
          toast("原声广播失败(文字照常):" + (e && e.message || e), "err");

    if (data.wolf) acts.appendChild(wolfChatBtn());

  } else if (mode === "witch") {

      ? ("昨夜 " + G.seatName(data.victim) + " 遇袭。" + (data.canSave ? "可用解药相救。" : "解药已用尽。"))

        G.witchNotes[data.seatId] = "你已用掉解药(救了" + G.seatName(data.victim) + ")。";
        renderDock("idle"); setNow("女巫已行动", "静待天明");
      });

    if (data.canPoison) {
      var po = el("button", "btn btn-danger", "用 毒 药");
      po.addEventListener("click", function(){

      idleRow.appendChild(bnode);
    }

function sendAct(m){

function voiceVolume(){
  var v = Number(settings.voiceVol);
  return clamp(isNaN(v) ? 1 : v, 0, 1);
}
/* 音效音量:人声正在响的时候压到两成半。
   宿主的 ambience 和 voice 是两个独立 <audio>,会同时出声——
   钟声(196Hz、2.2 秒)压在人声上,听感就是发闷发糊。 */
function sfxVolume(){
  var v = Number(settings.sfxVol);
  v = clamp(isNaN(v) ? 0.85 : v, 0, 1);
  return Voice.playing ? v * 0.25 : v;
}

/* ═══ 语音广播:一份音频,全房间听同一声 ═══
   合成只在发言方做一次(省 token、声线也统一),音频切片经 room.send 送出。
   room.send 上限 16000 字符/条、25 条/秒(online-room-client.ts:41-43),
   所以按 12000 切片并错开发送,给游戏消息留出配额。 */
var AUD_CHUNK = 12000;
var AUD_MAX_CHARS = 900000;   /* 约 650KB 音频;再大就不值得占带宽了 */
var AUD_MAX_PARTS = 60;
var audRecv = {};             /* clipId → 收片缓冲 */

function castAudio(seatId, dataUrl, kind){
  if (!settings.castOn) return;
  if (!net || net.local) return;                 /* 单机自己听就行,不用广播 */
  if (!dataUrl || dataUrl.length > AUD_MAX_CHARS) return;
  var total = Math.ceil(dataUrl.length / AUD_CHUNK);
  if (total > AUD_MAX_PARTS) return;
  var id = uid6();
  for (var i = 0; i < total; i++) {
    (function (idx) {
      /* 错开 70ms:每秒最多 25 条,别一次打满把游戏消息挤掉 */
      setTimeout(function(){
        if (!net || net.local) return;
        net.send({ t: "aud", w: 1, id: id, i: idx, n: total,
                   seatId: seatId, kind: kind || "char",
                   d: dataUrl.slice(idx * AUD_CHUNK, (idx + 1) * AUD_CHUNK) });
      }, idx * 70);
    })(i);
  }
}

function onAudioChunk(m){
  if (!settings.castOn) return;                  /* 关了就当没收到 */
  if (!m.id || !m.n || m.i == null || typeof m.d !== "string") return;
  if (m.n > AUD_MAX_PARTS) return;
  var rec = audRecv[m.id];
  if (!rec) {
    rec = audRecv[m.id] = { parts: new Array(m.n), got: 0, n: m.n,
                            seatId: m.seatId, kind: m.kind, ts: now() };
    /* 顺手清掉超时没收齐的残片,别让内存一直涨 */
    Object.keys(audRecv).forEach(function (k) {
      if (now() - audRecv[k].ts > 45000) delete audRecv[k];
    });
  }
  if (rec.parts[m.i] == null) { rec.parts[m.i] = m.d; rec.got++; }
  if (rec.got < rec.n) return;
  delete audRecv[m.id];
  var url = rec.parts.join("");
  var who = G.map[rec.seatId];
  /* 别人的声音走 voice 声道,和本机音效的 ambience 声道分开,不会互相掐断 */
  api.voice.play({ dataUrl: url, channel: "ww-speech", volume: voiceVolume() }).catch(function(){});
  if (who) flashSpeaking(rec.seatId);
}

      renderDock("idle");
      $("stageLog").innerHTML = "";
      break;
    }
    case "role": {
      G.myRoles[d.seatId] = d.role;
      var seat = G.map[d.seatId];
      if (seat && seat.kind === "human" && seat.ownerUid === myUid()) revealRoleModal(d.seatId, d.role);
      break;
    }
    case "wolves": {
      G.wolfSeats = d.seatIds || [];
      break;
    }
    case "phase": {
      G.phase = d.p;
      if (d.day != null) G.day = d.day;
      if (d.n != null) G.night = d.n;
      armDeadline(0);
      G.voteMarks = {};
      /* 阶段切换:清掉未提交行动残留的座位可选高亮,并复位操作坞,免得残留光圈可点却提交不了 */
      if (G.selecting) { G.selecting = null; renderSeats(); if (G.dockMode !== "idle") renderDock("idle"); }
      if (d.p === "night") {
        setScene("night");
        setPhasePill("night", "第 " + d.n + " 夜");
        setNow("夜幕低垂", "诸位闭眼,各凭本事");
        showCurtain("night", "第 " + numHan(d.n) + " 夜");
        SFX.gong();
        G.wolfMarks = {};
      } else if (d.p === "day") {
        setScene("day");
        setPhasePill("day", "第 " + d.day + " 天");
        setNow("天亮了", "昨夜之事,即将揭晓");
        showCurtain("day", "第 " + numHan(d.day) + " 天");
        SFX.chime();
        closeWolfSheet();
      } else if (d.p === "vote") {
        setScene("dusk");
        setPhasePill("vote", d.pk ? "PK 加投" : "放逐投票");
        setNow("亮票时刻", "手指所向,即是审判");
        SFX.dusk();
      } else if (d.p === "dusk") {
        setScene("dusk");
        setPhasePill("dusk", "放逐");
      } else if (d.p === "end") {
        setPhasePill("end", "终局");
      }
      G.speaking = null;
      renderSeats();
      renderDock("idle");
      break;
    }
    case "narrate": {
      stageLine({ k: "sys", text: d.text, tone: d.tone, day: G.day, night: G.night });
      Voice.say(d.text, { narr: true });
      break;
    }
    case "turn": {
      G.speaking = d.seatId || null;
      if (d.seatId) {
        armDeadline(d.deadline);
        var s = G.map[d.seatId];
        var kindTxt = d.kind === "lastwords" ? "留下遗言" : d.kind === "pk" ? "PK 发言" : d.kind === "shoot" ? "猎人抉择" : "正在发言";
        setNow(s ? s.no + "号 · " + s.name : "?", kindTxt, true, s);
        SFX.turn();
      } else {
        armDeadline(0);
        setNow("——", "等待下一位", false);
        if (G.dockMode === "speech") renderDock("idle");
      }
      renderSeats();
      /* 仅当处于空闲坞时重绘,以便房主出现/收起「跳过」按钮 */
      if (!G.dockMode || G.dockMode === "idle") renderDock("idle");
      break;
    }
    case "say": {
      stageLine({ k: "say", seatId: d.seatId, text: d.text, kind: d.kind, day: G.day, night: G.night });
      var sp = G.map[d.seatId];
      /* 只给"带上桌的角色"配音;内置人偶不出声 */
      if (sp && sp.kind === "char" && sp.ownerUid === myUid() && settings.micOn && d.text) {
        /* 先告诉引擎「这句我要念,别急着切人」,念完再回执。
           不这么做的话引擎只按字数估时长,话没播完就轮到下一位了 */
        sendAct({ kind: "hold", seatId: d.seatId });
        var opts = sp.characterId ? { characterId: sp.characterId } : {};
        opts.done = function(){ sendAct({ kind: "spoken", seatId: d.seatId }); };
        opts.cast = d.seatId;
        Voice.say(d.text, opts);
      }
      break;
    }
    case "wolfsay": {
      var wl = { k: "wolf", seatId: d.seatId, text: d.text, day: G.day, night: G.night };
      /* 给 AI 用的副本:本机驱动的狼人偶要读得到彼此的商议,这份永远不渲染 */
      G.wolfLog.push(wl);
      /* 单机时全场共用一个 uid,引擎的 to() 挡不住,给人看的部分按「我是不是狼」再挡一道 */
      if (!iAmWolf()) break;
      G.log.push(wl);
      appendWolfLine(wl);
      if (!wolfSheetClose) toast(G.seatName(d.seatId) + " 有密语,点开狼人密谈查看");
      break;
    }
    case "wolfmark": {
      if (!iAmWolf()) break;
      G.wolfMarks[d.seatId] = d.target;
      renderWolfMarks();
      break;
    }
    case "seer.result": {
      if (!G.checks[d.seatId]) G.checks[d.seatId] = [];
      G.checks[d.seatId].push({ t: d.target, wolf: d.wolf });
      var seatS = G.map[d.seatId];
      if (seatS && seatS.kind === "human" && seatS.ownerUid === myUid()) {
        openModal(function (modal, close) {
          var head = el("div", "modal-head");
          head.appendChild(el("h3", "serif", "水 落 石 出"));
          modal.appendChild(head);
          var body = el("div", "modal-body center");
          var g = el("div", "serif", d.wolf ? "狼" : "善");
          g.style.cssText = "display:inline-block;font-size:44px;font-weight:700;line-height:1;padding:16px 18px;margin:6px auto 2px;" +
            "border:3px solid " + (d.wolf ? "var(--blood-4)" : "var(--jade-4)") + ";border-radius:10px;" +
            "color:" + (d.wolf ? "var(--blood-3)" : "var(--jade-3)") + ";transform:rotate(-8deg);" +
            "text-shadow:0 0 18px " + (d.wolf ? "var(--blood-glow)" : "rgba(79,176,131,.4)") + ";";
          body.appendChild(g);
          var p = el("p", "serif", G.seatName(d.target) + (d.wolf ? " —— 查杀!是狼。" : " —— 金水,是好人。"));
          p.style.cssText = "font-size:18px;letter-spacing:.08em;margin-top:8px;color:" + (d.wolf ? "var(--blood-3)" : "var(--jade-3)");
          body.appendChild(p);
          modal.appendChild(body);
          var foot = el("div", "modal-foot");
          var ok = el("button", "btn btn-primary", "记下了");
          ok.addEventListener("click", close);
          foot.appendChild(ok);
          modal.appendChild(foot);
        });
      }
      break;
    }
    case "deaths": {
      /* 记进跨天战况,供 Brain.recap 用 */
      var dnames = (d.list || []).map(function (x) { return G.seatName(x.seatId); });
      if (dnames.length) {
        if (d.vote) { /* 放逐已在 vote.result 里记过(那边还带票型),这里不重复 */ }
        else if (d.shot) G.history.push({ t: "shot", day: G.day, name: dnames[0], from: G.shotFrom || "猎人" });
        else G.history.push({ t: "nightDeath", day: d.day || G.day, names: dnames });
      } else if (!d.vote && !d.shot) {
        G.history.push({ t: "peace", day: d.day || G.day });
      }
      (d.list || []).forEach(function (x) {
        var s = G.map[x.seatId];
        if (s) s.alive = false;
      });
      renderSeats();
      /* 座位盖「出局」印 */
      (d.list || []).forEach(function (x, i) {
        setTimeout(function(){
          var seatEl = document.querySelector('[data-seat="' + x.seatId + '"]');
          stampSeal(seatEl, d.vote ? "放逐" : d.shot ? "饮弹" : "出局");
        }, 350 + i * 420);
      });
      break;
    }
    case "vote.begin": {
      armDeadline(d.deadline);
      break;
    }
    case "vote.mark": {
      G.voteMarks[d.seatId] = true;
      renderSeats();
      break;
    }
    case "vote.result": {
      /* 完整票型入档:狼人杀里「昨天谁投了谁」是最硬的证据,
         不能只记被放逐那个人的票,后面几天都要能翻出来看 */
      G.history.push({
        t: "vote", day: G.day, pk: !!d.pk,
        pairs: (d.pairs || []).map(function (p2) {
          return { from: G.seatName(p2.from), to: p2.to ? G.seatName(p2.to) : null };
        }),
        exiled: d.exiled ? G.seatName(d.exiled) : null,
        tie: d.tie ? d.tie.map(function (i) { return G.seatName(i); }) : null
      });
      showVoteResult(d);
      break;
    }
    case "shot": { G.shotFrom = G.seatName(d.from); break; }
    case "takeover": {
      var ts = G.map[d.seatId];
      if (ts) {
        ts.kind = d.kind || "npc";
        ts.npcId = d.npcId;
        ts.characterId = d.characterId || null;
        /* 归属也要跟着走,否则新主人收到请求时会判成「不是我的席位」而跳过 */
        if (d.ownerUid) ts.ownerUid = d.ownerUid;
      }
      renderSeats();
      break;
    }
    case "end": {
      G.ended = true;
      armDeadline(0);
      d.reveal.forEach(function (r) {
        var s = G.map[r.seatId];
        if (s) s.role = r.role;
      });
      setScene(d.winner === "wolf" ? "dusk" : "day");
      showEndModal(d);
      break;
    }
    case "req": {
      handleReq(d);
      break;
    }
  }
}

/* ── 行动请求:人类席出 UI,AI 席自动驱动 ── */
function handleReq(d){
  var seat = G.map[d.seatId];
  if (!seat || seat.ownerUid !== myUid()) return;
  if (seat.kind === "human") return humanReq(seat, d);
  aiReq(seat, d);
}
function humanReq(seat, d){
  var aliveOpts = (d.options || []).filter(function (id) { var s = G.map[id]; return s && s.alive; });
  /* 夜间行动(守卫/狼/预言家/女巫)之前没有 turn 事件来驱动计时条,这里统一按 deadline 起表 */
  if (d.deadline) armDeadline(d.deadline);
  switch (d.stage) {
    case "speech":
      renderDock("speech", { seatId: seat.id, kind: d.speechKind });
      break;
    case "guardProtect":
      renderDock("target", {
        seatId: seat.id, night: true,
        options: aliveOpts.filter(function (id) { return id !== d.last; }),
        banner: "守卫行动:选择今夜要守护的人" + (d.last ? "(不可连守 " + G.seatName(d.last) + ")" : ""),
        confirmText: "守护", allowSkip: true, skipText: "空守",
        submit: function (sel) { sendAct({ kind: "night", seatId: seat.id, round: d.round, choice: { target: sel } }); setNow("守卫已行动", "静待天明"); }
      });
      break;
    case "wolfKill":
      renderDock("target", {
        seatId: seat.id, night: true, danger: true, wolf: true,
        /* 不给自己和狼队友当刀口:引擎也有硬校验,这里先在 UI 挡住,免得误触 */
        options: aliveOpts.filter(function (id) { return id !== seat.id && G.wolfSeats.indexOf(id) < 0; }),
        banner: "狼人行动:与同伴齐刀一人(可开密谈)",
        confirmText: "落刀", allowSkip: true, skipText: "空刀",
        submit: function (sel) { sendAct({ kind: "night", seatId: seat.id, round: d.round, choice: { target: sel } }); setNow("狼已行动", "静待天明"); }
      });
      break;
    case "seerCheck":
      renderDock("target", {
        seatId: seat.id, night: true,
        options: aliveOpts.filter(function (id) { return id !== seat.id; }),
        banner: "预言家行动:查验一人的真实身份",
        confirmText: "查验", allowSkip: false,
        submit: function (sel) { sendAct({ kind: "night", seatId: seat.id, round: d.round, choice: { target: sel } }); setNow("预言家已行动", "静待天明"); }
      });
      break;
    case "witch":
      renderDock("witch", { seatId: seat.id, round: d.round, victim: d.victim, canSave: d.canSave, canPoison: d.canPoison, options: aliveOpts });
      break;
    case "vote": case "pkvote":
      renderDock("target", {
        seatId: seat.id,
        options: aliveOpts,
        banner: d.stage === "pkvote" ? "PK 加投:票出你认为的狼" : "放逐投票:选出今日之刃指向谁",
        confirmText: "投票", allowSkip: true, skipText: "弃票",
        submit: function (sel) { sendAct({ kind: "vote", seatId: seat.id, round: d.round, target: sel }); setNow("已亮票", "等待其余诸位"); }
      });
      break;
    case "hunterShoot":
      renderDock("target", {
        seatId: seat.id, danger: true,
        options: aliveOpts.filter(function (id) { return id !== seat.id; }),
        banner: "猎人时刻:开枪带走一人,或收枪入鞘",
        confirmText: "开枪", allowSkip: true, skipText: "收枪",
        submit: function (sel) { sendAct({ kind: "shoot", seatId: seat.id, round: d.round, target: sel }); }
      });
      break;
  }
}
/* 等到今夜已有 n 位狼开过口(或等够 capMs)。真人狼可能一直不说话,所以要封顶。 */
function waitWolfSpoken(n, capMs){
  if (n <= 0) return Promise.resolve();
  return new Promise(function (res) {
    var t0 = now();
    (function tick(){
      var spoke = {};
      G.wolfLog.forEach(function (l) { if (l.night === G.night) spoke[l.seatId] = 1; });
      if (Object.keys(spoke).length >= n || now() - t0 > capMs) return res();
      setTimeout(tick, 400);
    })();
  });
}

function aiReq(seat, d){
  /* 投票本身就要跑一次 LLM,别再叠随机等待,免得撞上截止 */
  var delay = (d.stage === "vote" || d.stage === "pkvote") ? 200 + Math.random() * 600
                                                           : 900 + Math.random() * 2200;
  if (d.stage === "speech") {
    var rnd = d.round;
    Brain.speakSafe(G, seat, d.speechKind).then(function (text) {
      sendAct({ kind: "say", seatId: seat.id, round: rnd, text: text });
    });
    return;
  }
  /* 狼人:先商议、等同伴说完,再落刀。
     桌上有真人狼时把商议窗口拉长,别让 AI 几秒就锁死刀口。 */
  if (d.stage === "wolfKill") {
    var humanWolf = G.seats.some(function (s) {
      return s.kind === "human" && s.alive && G.wolfSeats.indexOf(s.id) >= 0;
    });
    var mates = G.wolfSeats.filter(function (i) {
      var s = G.map[i]; return s && s.alive;
    });
    var idx = Math.max(0, mates.indexOf(seat.id));
    /* 真轮流:等前面的同伴「说出来」再开口。
       只按时间错开是不够的——LLM 要跑好几秒,后一个发起调用时前一个还没广播,
       两边看到的密谈记录都是空的,于是给出雷同答案。 */
    waitWolfSpoken(idx, 7000 + idx * 6000).then(function(){
      return Brain.wolfTalkSafe(G, seat);
    }).then(function (line) {
      sendAct({ kind: "wolfsay", seatId: seat.id, text: line });
    });
    /* 商议窗口:有真人狼给 24 秒,纯 AI 局 11 秒够了 */
    var window0 = humanWolf ? 24000 : 11000;
    setTimeout(function(){
      Brain.wolfPickSafe(G, seat, d).then(function (t) {
        sendAct({ kind: "night", seatId: seat.id, round: d.round, choice: { target: t } });
      });
    }, window0 + idx * 900 + Math.random() * 1200);
    return;
  }
  setTimeout(function(){
    if (d.stage === "witch") {
      var c = Brain.decide(G, seat, d) || { pass: true };
      var choice = c.save ? { save: true } : c.poison ? { poison: c.poison } : {};
      if (c.save) G.witchNotes[seat.id] = "你已用掉解药。";
      if (c.poison) G.witchNotes[seat.id] = "你已用掉毒药。";
      sendAct({ kind: "night", seatId: seat.id, round: d.round, choice: choice });
    } else if (d.stage === "vote" || d.stage === "pkvote") {
      /* 投票要真读完这一天的发言,所以是异步的一次 LLM 调用 */
      Brain.voteSafe(G, seat, d).then(function (t) {
        sendAct({ kind: "vote", seatId: seat.id, round: d.round, target: t });
      });
    } else if (d.stage === "hunterShoot") {
      sendAct({ kind: "shoot", seatId: seat.id, round: d.round, target: Brain.decide(G, seat, d) });
    } else {
      sendAct({ kind: "night", seatId: seat.id, round: d.round, choice: { target: Brain.decide(G, seat, d) } });
    }
  }, delay);
}

/* ═══════════════════════════════════════════════════════════

function showVoteResult(d){
  openModal(function (modal, close) {
    var head = el("div", "modal-head");
    head.appendChild(el("h3", "serif", d.pk ? "PK 唱 票" : "唱 票"));
    modal.appendChild(head);
    var body = el("div", "modal-body");
    var tally = el("div", "tally");
    var keys = Object.keys(d.tally || {}).sort(function (a, b) { return d.tally[b] - d.tally[a]; });
    keys.forEach(function (t) {
      var row = el("div", "tally-row");
      row.style.position = "relative";
      row.appendChild(el("span", "n", d.tally[t] + " 票"));
      row.appendChild(el("span", null, G.seatName(t)));
      var voters = (d.pairs || []).filter(function (p) { return p.to === t; })
        .map(function (p) { var s = G.map[p.from]; return s ? s.no + "号" : "?"; }).join("、");
      row.appendChild(el("span", "voters", "来自 " + voters));
      if (d.exiled === t) setTimeout(function(){
        var s = stampSeal(row, "放 逐");
        if (s) { s.style.left = "72%"; }
      }, 500);
      tally.appendChild(row);
    });
    var abst = (d.pairs || []).filter(function (p) { return !p.to; });
    if (abst.length) {
      var row2 = el("div", "tally-row");
      row2.appendChild(el("span", "n", "弃票"));
      row2.appendChild(el("span", "voters", abst.map(function (p) { var s = G.map[p.from]; return s ? s.no + "号" : "?"; }).join("、")));
      tally.appendChild(row2);
    }
    if (!keys.length && !abst.length) tally.appendChild(el("div", "empty", "无人投票"));
    body.appendChild(tally);
    if (d.tie) {
      var tieP = el("p", "t-sm center", "平票:" + d.tie.map(function (id) { return G.seatName(id); }).join(" 与 "));
      tieP.style.cssText = "margin-top:12px;color:var(--blood-3)";
      body.appendChild(tieP);
    }
    modal.appendChild(body);
    var foot = el("div", "modal-foot");
    var ok = el("button", "btn", "知道了");
    ok.addEventListener("click", close);
    foot.appendChild(ok);
    modal.appendChild(foot);
    setTimeout(close, 6500);
  });
}

function showEndModal(d){
  openModal(function (modal, close) {
    var body = el("div", "modal-body scroll");
    /* 不放横幅图:生硬的矩形图会压出撕纸弹窗的边缘,胜负氛围交给标题与音效 */
    var iWon = (function(){
      /* 单机时引擎把全场底牌都发到本机,只能数「自己的席位」,否则场上必有狼 → 恒判狼胜 */
      var mine = Object.keys(G.myRoles).filter(function (k) {

/* 音量条:宿主的 voice.play 支持 volume,以前一直没传,所以只能是满音量 */
function settingVolRow(body, title, key, dflt, hint){
  var box = el("div", "field");
  box.style.marginTop = "12px";
  var lab = el("label", null, title);
  var val = el("span", "t-xs dim");
  val.style.cssText = "float:right;font-family:var(--f-mono)";
  var cur = Number(settings[key]);
  if (isNaN(cur)) cur = dflt;
  val.textContent = Math.round(cur * 100) + "%";
  lab.appendChild(val);
  box.appendChild(lab);
  var sl = el("input", "vol");
  sl.type = "range"; sl.min = "0"; sl.max = "100"; sl.step = "5";
  sl.value = String(Math.round(cur * 100));
  /* webkit 的 range 无法原生区分「已填充/未填充」两段,靠 --vp 变量喂给轨道渐变 */
  function paintFill(){ sl.style.setProperty("--vp", sl.value + "%"); }
  paintFill();
  sl.addEventListener("input", function(){
    settings[key] = Number(sl.value) / 100;
    val.textContent = sl.value + "%";
    paintFill();
    saveSettings();
  });
  box.appendChild(sl);
  if (hint) box.appendChild(el("p", "hint", hint));
  body.appendChild(box);
}

/* ═══════════════════════════════════════════════════════════
   组局:板子选择 / 角色携带 / 单机与联机大厅

var HUMAN_AV = ["🦉","🐈","🦊","🐇","🦌","🐢","🦜","🐿️"];
var CHAR_AV  = ["🌸","🗡️","📖","🪶","🎐","🌙","⚜️","🫧"];
function hashPick(pool, key){
  var h = 0; key = String(key);
  for (var i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
  return pool[h % pool.length];
}
var charCache = null;
var CHAR_AVATAR = {};   /* characterId → 角色自带头像 */
function loadCharacters(){
  if (charCache) return Promise.resolve(charCache);
  return api.characters.list().then(function (list) {
    charCache = list || [];
    charCache.forEach(function (c) {
      if (c && c.id && c.avatar) CHAR_AVATAR[c.id] = c.avatar;
    });
    return charCache;
  }).catch(function(){ charCache = []; return charCache; });
}
/* 角色头像:自带优先,否则用初始头像兜底 */

/* ── 座位编成 ── */
function makeSeats(humans, charEntries, roles, hostUid){
  var size = boardSize(roles);
  var pool = [];
  humans.forEach(function (u) {
    pool.push({ kind: "human", name: u.name || "旅人", ownerUid: u.uid, avatar: hashPick(HUMAN_AV, u.uid) });
  });
  charEntries.forEach(function (c) {
    pool.push({ kind: "char", name: c.name, ownerUid: c.ownerUid, characterId: c.characterId, avatar: hashPick(CHAR_AV, c.characterId) });
  });
  var need = size - pool.length;
  if (need < 0) return null;
  /* 人偶只有 NPCS.length 位;板子较大而真人/角色少时(如单人开十二人板)会不够补,
     此时循环复用人设并给重复者的名字加序号后缀,保证座位数 = 板子容量,
     否则牌堆多出的身份牌会被静默丢弃。npcId 允许重复:它只用来查画像与人设,座位标识是 s.id。 */
  var bag = shuffle(NPCS);
  for (var fi = 0; fi < need; fi++) {
    var base = bag[fi % bag.length];
    var dupRound = Math.floor(fi / bag.length);
    pool.push({
      kind: "npc",
      name: dupRound > 0 ? base.name + "·" + (dupRound + 1) : base.name,
      ownerUid: hostUid,
      npcId: base.id,
      avatar: base.avatar
    });
  }
  pool = shuffle(pool);
  return pool.map(function (p, i) {
    p.no = i + 1;
    p.id = "s" + (i + 1);
    return p;
  });
}

/* 引擎事件缓冲广播 + 公共事件史(供掉线重连者回放整局) */
var evBuf = [], evTimer = null, evHistory = [], evHistoryFull = false, replayTimers = [];
var EV_HISTORY_CAP = 1500;
function clearEngineEmit(){
  evBuf = [];
  if (evTimer) { clearTimeout(evTimer); evTimer = null; }
  evHistory = []; evHistoryFull = false;
  replayTimers.forEach(clearTimeout); replayTimers = [];
}
/* 把整局公共事件定速私发给重连者(每批 12 条、间隔 150ms,远低于限速),
   放完再执行 done(通常是把席位还给 TA)。事件史溢出时放弃回放(极端长局)。 */
function replayGameTo(uid, done){
  if (evHistoryFull) { if (done) done(); return; }
  var snapshot = evHistory.slice();
  var i = 0;
  function pump(){
    if (!net || !engine || engine.dead) return;
    var batch = snapshot.slice(i, i + 12).map(function (item) {
      return { e: item.e, to: [uid], data: item.data };
    });
    i += 12;
    if (batch.length) net.send({ w: 1, t: "evs", list: batch });
    if (i < snapshot.length) replayTimers.push(setTimeout(pump, 150));
    else if (done) done();
  }
  pump();
}
function engineEmit(evt){
  if (!evt.to) {
    if (evHistory.length >= EV_HISTORY_CAP) evHistoryFull = true;
    else evHistory.push({ e: evt.e, data: evt.data });
  }
  evBuf.push({ e: evt.e, to: evt.to || null, data: evt.data });
  if (!evTimer) evTimer = setTimeout(function(){
    evTimer = null;
    var list = evBuf; evBuf = [];
    /* net 可能已在散场/回大厅时置空,避免 net.send 抛 TypeError */
    while (list.length) { if (net) net.send({ w: 1, t: "evs", list: list.splice(0, 12) }); else list.length = 0; }
  }, 50);
}
function startEngineWith(cfg){
  if (engine) engine.destroy();
  clearEngineEmit();   /* 丢掉上一局残留的事件,别晚于新局/大厅广播到达 */
  engine = new Engine(cfg, { emit: engineEmit });
  if (lobby) lobby.inGame = true;
  engine.start();
}
